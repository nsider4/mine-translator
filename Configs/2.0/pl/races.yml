enable-races: true

creative-enabled: true
#Przydatne linki do dodawania DANYCH:
#
#https://hub.spigotmc.org/javadocs/spigot/org/bukkit/entity/EntityType.html
#https://helpch.at/docs/1.8/index.html?org/bukkit/entity/EntityType.html
#https://hub.spigotmc.org/javadocs/bukkit/org/bukkit/Material.html
#https://helpch.at/docs/1.8/org/bukkit/Material.html

#Nazwy mogą być nowoczesne lub stare (MOOSHROOM lub MUSHROOM_COW, COD lub RAW_FISH): są dopasowywane do wersji
#twojego serwera. Nazwy, które nie istnieją w twojej wersji (np. blok z 1.21 na 1.8), są pomijane, z informacją w konsoli.
#
#Każdy wyścig przyjmuje też (opcjonalnie):
#  points: 1     #punkty dla zwycięzcy (domyślnie 1)
#  weight: 1     #jak często rotacja go wybiera względem innych gier (domyślnie 1, 0 = nigdy)
#
#Admini mogą uruchomić wyścig z własnymi wartościami: /chatgames <race> <material/mob> [amount]
#Bez ilości używana jest jedna z wymienionych poniżej dla tego materiału/stworzenia. Zwycięzca dostaje nagrody
#dokładnie dla tego materiału i ilości, albo żadne, jeśli ich tu nie ma (punkty i tak są przyznawane).

hunt:
  enable: true

  timeToComplete_seconds: 180
  #__Zostaw 2 następne puste, aby je wyłączyć__
  titleMessage: '&bPOLOWANIE'
  subtitleMessage: '&aZabij %amount% %value%!'

  #Czy liczyć stworzenia przywołane przez spawnery lub jaja spawnujące.
  count-spawner-mobs: true
  #Czy moby z MythicMobs liczą się też jako mob, na którym są oparte (zombie z MythicMobs jako ZOMBIE).
  count-mythic-mobs: true

