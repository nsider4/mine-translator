#MOŻLIWE AKCJE:
#
#[playercmd] - Wykonuje komendę jako zwycięzca
#[consolecmd] - Wykonuje komendę z konsoli
#[playermsg] - Wysyła wiadomość do zwycięzcy
#[broadcast] - Wysyła wiadomość do wszystkich graczy we włączonych światach
#[player_as_op] - Wykonuje komendę jako op za gracza
#
#DODAJ SZANSE DO NAGRÓD W TEN SPOSÓB:
#
#PRZYKŁAD:
#  - '10.0%~ [consolecmd] give %player% iron_block 5'
#DZIAŁA TYLKO, JEŚLI FORMAT JEST TAKI SAM JAK W PRZYKŁADZIE, Z <chance>% NA POCZĄTKU, PO KTÓRYM JEST ~ I SPACJA. ZAWSZE PIERWSZE W KOMENDZIE
#
#KOMENDY BEZ % TO NAGRODY DAWANE W 100%.

#SPRAWDZANIE UPRAWNIEŃ:
#
#UMIEŚĆ NA KOŃCU LINII KOMENDY.
#Przykład:
#  - '[consolecmd] give %player% iron_block 5 has:test.permission'

#1 jest dla PIERWSZEGO zwycięzcy; JEŚLI DODASZ WIĘCEJ ZWYCIĘZCÓW W config.yml I CHCESZ INNYCH NAGRÓD, DODAJ ICH MIEJSCE (2:, itd.)
unscramble:
  rewards:
    1:
      reward_1:
        minimum-players: 2 #Online players-based condition, reward can only be chosen if there are 2 or more players online
        chance: 50
        data:
          - '10.0%~ [consolecmd] give %player% diamond_block 3 has:test.permission'
          - '[consolecmd] give %player% iron_block 5'
      reward_2:
        data:
          - '[consolecmd] give %player% iron_block 2'

