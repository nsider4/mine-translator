#
#UŻYWANY JEST INNY FORMAT! CZYTAJ UWAŻNIE

races:
  rewards:
    #TO SĄ NAGRODY, KTÓRE WPISUJESZ W 'races.yml'
    reward_1:
      chance: 50
      data:
        - '60.0%~ [consolecmd] give %player% diamond_block 5'
    #USUNIĘCIE WARTOŚCI 'chance' SPRAWI, ŻE NAGRODA/KOMENDA BĘDZIE ZAWSZE WYKONYWANA
    reward_2:
      data:
        - '[consolecmd] give %player% iron_block 5'
        - '[playermsg] &aWygrałeś!'
    reward_3:
      chance: 50
      data:
        - '[consolecmd] give %player% diamond_block 3'