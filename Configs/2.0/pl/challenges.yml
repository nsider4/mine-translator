#WYZWANIA DZIENNE I TYGODNIOWE
#
#Każdy dostaje te same wyzwania. Postęp liczy się podczas gry; ukończone
#wyzwanie pokazuje "Gotowe do odebrania" w /chatgames challenges, a /chatgames claim je wypłaca.
#Nieodebrane nagrody przepadają, gdy wyzwania się odnawiają.
#
#TYPY WYZWAŃ (amount to ile potrzeba):
#  WIN_GAMES    wygrywaj gry czatu lub wyścigi, na dowolnym miejscu
#  WIN_GAME     wygraj jedną grę lub wyścig, ustawione przez 'game' (np. game: unscramble)
#  WIN_RACES    wygrywaj wyścigi
#  PLAY_GLOBAL  zaliczaj gry globalne na czas
#  WIN_GLOBAL   kończ gry globalne na nagradzanym miejscu
#  FAST_WIN     wygrywaj gry czatu w 'seconds' lub mniej (wyścigi się nie liczą)
#  EARN_POINTS  zdobywaj punkty w grach
#  PLAY_EVENT   bierz udział w wydarzeniach gier
#
#Każde wyzwanie ma:
#  name / description: pokazywane na czacie i w menu. %amount%, %game% i %seconds% są uzupełniane.
#  icon: element w menu (nazwa materiału)
#  rewards: linie jak w rewards.yml (szanse z '<chance>%~ ', uprawnienia z 'has:<permission>').
#           %player% i %challenge% (nazwa) są uzupełniane.
#
#Identyfikatory (win_3, fast_1...) są zapisywane z postępem graczy: używaj tylko a-z, 0-9, - i _,
#a zmiana któregoś zaczyna postęp tego wyzwania od nowa.

#Strefa czasowa, w której zaczynają się dni, dla wyzwań i serii, np. Europe/Warsaw lub America/New_York.
#Puste używa strefy serwera.
timezone: ''

daily:
  enabled: true
  #fixed: każde wyzwanie poniżej jest aktywne każdego dnia.
  #random: codziennie losowanych jest 'amount' (te same dla wszystkich).
  mode: random
  amount: 3
