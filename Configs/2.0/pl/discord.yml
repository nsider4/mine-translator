#Publikuje na Discordzie wyniki gier, wyścigów, gier globalnych, wydarzeń i nie tylko.
#
#Wiadomości idą przez webhook kanału (nic do instalowania), przez bota
#pluginu DiscordSRV, albo przez oba. Przetestuj każdą wiadomość: /chatgames discord test <message>.
enabled: true

#__KANAŁY__
#Dokąd trafiają wiadomości. Nazwij je dowolnie; każde powiadomienie poniżej podaje swoje kanały.
#  webhook: URL webhooka kanału. W Discordzie: Edytuj kanał > Integracje > Webhooki >
#           Nowy webhook > Kopiuj URL webhooka. Trzymaj go w tajemnicy: każdy, kto go ma, może tam pisać.
#  discordsrv: publikuje zamiast tego przez twojego bota DiscordSRV (wymaga DiscordSRV). Nazwa kanału z
#              sekcji Channels w config.yml DiscordSRV (np. global) albo ID kanału.
#  username / avatar: nazwa i obrazek postów webhooka (bot zachowuje swoje).
channels:
  main:
    webhook: ''
    discordsrv: ''
    username: 'Chat Games'
    avatar: 'https://www.spigotmc.org/data/resource_icons/107/107781.jpg?1676494289'

#__OGÓLNE__
#Pokazywane w stopkach jako %server%
server-name: 'Minecraft Server'
#Obrazek dla %winner_head% / %player_head%. %name% i %uuid% są uzupełniane.
player-head-url: 'https://mc-heads.net/avatar/%name%/128'
#ID ról, które wiadomości mogą pingować (wpisz <@&ID> w tekście). Nic innego nigdy nie pinguje: ani
#@everyone, ani nic w nicku czy odpowiedzi gracza.
#Aby zdobyć ID, włącz Tryb dewelopera w Discordzie (Ustawienia > Zaawansowane), potem kliknij rolę prawym przyciskiem.
allowed-role-pings: []
#Z DiscordSRV %winner_mention% / %player_mention% pokazują połączone konto Discorda gracza
#(w przeciwnym razie jego nick). true także go pinguje.
ping-linked-players: false
#Gry i wyścigi, które nigdy nie są publikowane
ignored-games: []

#Kolory (%game_color%) i emoji (%game_emoji%) dla każdej gry. Kolory: '#RRGGBB' lub nazwa.
#Emoji: nazwy jak :trophy: (lista jest na końcu tego pliku) albo emoji serwera jako <:name:ID>.
#Nie wklejaj znaków emoji do tego pliku: serwery 1.8 nie odczytają pliku, który je zawiera.
styles:
  default: {color: '#5865F2', emoji: ':video_game:'}
  unscramble: {color: '#F1C40F', emoji: ':abc:'}
  unreverse: {color: '#E67E22', emoji: ':repeat:'}
  reaction: {color: '#E74C3C', emoji: ':zap:'}
  random: {color: '#9B59B6', emoji: ':game_die:'}
  fillout: {color: '#3498DB', emoji: ':pencil2:'}
  variable: {color: '#1ABC9C', emoji: ':heavy_plus_sign:'}
  clickable: {color: '#2ECC71', emoji: ':point_up:'}
  hoverable: {color: '#16A085', emoji: ':eyes:'}
  math: {color: '#E91E63', emoji: ':heavy_division_sign:'}
  sequence: {color: '#00BCD4', emoji: ':1234:'}
  memorize: {color: '#8E44AD', emoji: ':brain:'}
  guess_the_number: {color: '#FF9800', emoji: ':question:'}
  trivia: {color: '#3F51B5', emoji: ':books:'}
  word_association: {color: '#009688', emoji: ':link:'}
  count: {color: '#607D8B', emoji: ':1234:'}
  hunt: {color: '#C0392B', emoji: ':crossed_swords:'}
  mine: {color: '#7F8C8D', emoji: ':pick:'}
  place: {color: '#A0522D', emoji: ':bricks:'}
  fish: {color: '#2980B9', emoji: ':fishing_pole_and_fish:'}
  eat: {color: '#D35400', emoji: ':poultry_leg:'}
  craft: {color: '#8D6E63', emoji: ':hammer_and_pick:'}
  furnace: {color: '#E25822', emoji: ':fire:'}
  tame: {color: '#C69C6D', emoji: ':bone:'}
  shear: {color: '#ECF0F1', emoji: ':scissors:'}

#Jak zapisywane są listy: zwycięzcy, pomocnicy, klasyfikacje i rankingi.
#%medal% to medal miejsc 1-3, a other-places dotyczy pozostałych.
lists:
  medals: [':first_place:', ':second_place:', ':third_place:']
  other-places: '`%place%.`'
  winner: '%medal% **%player%** `%time%s`'
  contributor: '%medal% **%player%** `%amount%`'
  standing: '%medal% **%player%** `%points% pkt.`'
  leaderboard: '%medal% **%player%** `%value%`'
  #Pokazywane zamiast pustej listy
  empty: '-# Jeszcze nikt'

#__WIADOMOŚCI__
#Każda wiadomość ma 'content' (zwykły tekst nad embedem) i/lub 'embed':
#  color, author (name, icon, url), title, url, description, thumbnail, image,
#  fields (name, value, inline), footer (text, icon), timestamp (true pokazuje czas wysłania).
#Tekst może być jedną linią lub listą linii. Linia, która miała tylko puste placeholdery,
#jest pomijana, tak samo jak puste pole. Działają też placeholdery PlaceholderAPI niewymagające gracza.
#Formatowanie Discorda działa w opisach i wartościach pól: '### ' zaczyna nagłówek, '-# ' mały szary
#tekst, '> ' cytat, **pogrubienie**, `kod`.
#<t:%ends_unix%:R> pokazuje "za 20 sekund" w czasie każdego czytelnika i odlicza.
#W każdej wiadomości: %server%, a w grach %game% %game_key% %game_emoji% %game_color%.

#Gry na czacie. %question% %time_limit% %ends_unix% %winners_needed% %points%
games:
  enabled: true
  channels: [main]
  #true: publikuje przy starcie gry, potem zmienia ten post w wynik. false: publikuje tylko wynik.
  live: true
  #Memorize nigdy nie pokazuje tu swojej listy: gracze mogliby ją przeczytać na Discordzie.
  hidden-question: 'Zajrzyj na czat gry!'
  start:
    embed:
      color: '%game_color%'
      author: '%game_emoji%  %game%'
      title: 'Nowa runda'
      description:
        - '### %question%'
        - '-# Odpowiedz na czacie gry, aby wygrać.'
      fields:
        - name: ':stopwatch: Koniec'
          value: '<t:%ends_unix%:R>'
          inline: true
        - name: ':sparkles: Nagroda'
          value: '`%points% pkt.`'
          inline: true
        - name: ':busts_in_silhouette: Zwycięzcy'
          value: '`%winners_needed%`'
          inline: true
      footer: '%server%'
  #%winner% %winner_head% %winner_mention% %time% %answer% %points% %winner_count%
  #%winners% (wszyscy zwycięzcy, jeden na linię) %other_winners% (wszyscy oprócz pierwszego)
  win:
    embed:
      color: '%game_color%'
      author: '%game_emoji%  %game%'
      title: ':trophy:  %winner% zgadł(a)!'
      thumbnail: '%winner_head%'
      description:
        - '-# Odpowiedź to'
        - '### %answer%'
      fields:
        - name: ':stopwatch: Czas'
          value: '`%time%s`'
          inline: true
        - name: ':sparkles: Punkty'
          value: '`+%points%`'
          inline: true
        - name: ':medal: Odpowiedzieli też'
          value: '%other_winners%'
          inline: false
      footer: '%server%'
      timestamp: true
  #%answer% %question% %time_limit%
  expired:
    enabled: true
    embed:
      color: '#4E5058'
      author: '%game_emoji%  %game%'
      title: ':hourglass:  Koniec czasu'
      description:
        - '-# Nikt nie zgadł. Odpowiedź to'
        - '### %answer%'
      footer: '%server%'
      timestamp: true
  #Gdy ktoś z ekipy zatrzyma grę (zmienia tylko post na żywo)
  stopped:
    embed:
      color: '#4E5058'
      author: '%game_emoji%  %game%'
      title: ':no_entry:  Runda zatrzymana'
      description:
        - '-# Członek administracji zakończył tę rundę wcześniej.'
      footer: '%server%'
      timestamp: true

#Wyścigi. %target% %amount% %time_limit% %ends_unix% %points%
races:
  enabled: true
  channels: [main]
  live: true
  start:
    embed:
      color: '%game_color%'
      author: '%game_emoji%  Wyścig: %game%'
      title: 'Wyścig rozpoczęty'
      description:
        - '### %amount%x %target%'
        - '-# Wygrywa ten, kto skończy pierwszy.'
      fields:
        - name: ':stopwatch: Koniec'
          value: '<t:%ends_unix%:R>'
          inline: true
        - name: ':sparkles: Nagroda'
          value: '`%points% pkt.`'
          inline: true
      footer: '%server%'
  #%winner% %winner_head% %winner_mention% %time% %points%
  win:
    embed:
      color: '%game_color%'
      author: '%game_emoji%  Wyścig: %game%'
      title: ':checkered_flag:  %winner% wygrywa wyścig!'
      thumbnail: '%winner_head%'
      description:
        - '### %amount%x %target%'
      fields:
        - name: ':stopwatch: Czas'
          value: '`%time%s`'
          inline: true
        - name: ':sparkles: Punkty'
          value: '`+%points%`'
          inline: true
      footer: '%server%'
      timestamp: true
  expired:
    enabled: true
    embed:
      color: '#4E5058'
      author: '%game_emoji%  Wyścig: %game%'
      title: ':hourglass:  Koniec czasu'
      description:
        - '### %amount%x %target%'
        - '-# Nikt nie skończył na czas.'
      footer: '%server%'
      timestamp: true
  stopped:
    embed:
      color: '#4E5058'
      author: '%game_emoji%  Wyścig: %game%'
      title: ':no_entry:  Wyścig zatrzymany'
      description:
        - '-# Członek administracji zakończył ten wyścig wcześniej.'
      footer: '%server%'
      timestamp: true

#Gry globalne, w których cały serwer dąży do jednego celu.
#%goal% (np. "500 Stone") %progress% %goal_amount% %percent% %bar% %contributors% %time_limit% %ends_unix%
global:
  enabled: true
  channels: [main]
  #true: post pokazuje pasek postępu i jest aktualizowany w trakcie gry
  live: true
  #Jak często najwyżej aktualizowany jest post na żywo (tylko gdy postęp się zmienił)
  update-seconds: 15
  bar: {length: 16, full: '█', empty: '░'}
  progress:
    embed:
      color: '%game_color%'
      author: ':globe_with_meridians:  Globalne: %game%'
      title: 'Cały serwer gra razem'
      description:
        - '### %goal%'
        - '`%bar%` **%percent%%**'
        - '-# %progress% / %goal_amount%'
      fields:
        - name: ':busts_in_silhouette: Pomagają'
          value: '`%contributors%`'
          inline: true
        - name: ':stopwatch: Koniec'
          value: '<t:%ends_unix%:R>'
          inline: true
      footer: '%server%'
  #%top_contributors% (najwięksi pomocnicy, jeden na linię)
  completed:
    embed:
      color: '#57F287'
      author: ':globe_with_meridians:  Globalne: %game%'
      title: ':tada:  Cel osiągnięty!'
      description:
        - '### %goal%'
        - '`%bar%` **%percent%%**'
      fields:
        - name: ':medal: Najwięcej pomogli'
          value: '%top_contributors%'
          inline: true
        - name: ':busts_in_silhouette: Pomogło'
          value: '`%contributors%`'
          inline: true
      footer: '%server%'
      timestamp: true
  failed:
    embed:
      color: '#ED4245'
      author: ':globe_with_meridians:  Globalne: %game%'
      title: ':x:  Cel nieosiągnięty'
      description:
        - '### %goal%'
        - '`%bar%` **%percent%%**'
        - '-# %progress% / %goal_amount%'
      fields:
        - name: ':medal: Najwięcej pomogli'
          value: '%top_contributors%'
          inline: true
      footer: '%server%'
      timestamp: true
  #Ilu pomocników wymienia %top_contributors%
  top-size: 5

#Wydarzenia (events.yml). %event%
events:
  enabled: true
  channels: [main]
  #%games% (ile ma gier)
  start:
    embed:
      color: '#FEE75C'
      author: ':calendar:  Wydarzenie z grami'
      title: '%event% się zaczęło!'
      description:
        - '-# Wygrywaj kolejne gry, aby zdobywać punkty wydarzenia.'
      fields:
        - name: ':video_game: Gry'
          value: '`%games%`'
          inline: true
      footer: '%server%'
      timestamp: true
  #%standings% %players% (ilu zdobyło punkty) %winner% %winner_head% %winner_mention%
  end:
    embed:
      color: '#FEE75C'
      author: ':calendar:  Wydarzenie z grami'
      title: ':trophy:  Wyniki: %event%'
      thumbnail: '%winner_head%'
      description:
        - '%standings%'
      fields:
        - name: ':crown: Zwycięzca'
          value: '%winner_mention%'
          inline: true
        - name: ':busts_in_silhouette: Gracze'
          value: '`%players%`'
          inline: true
      footer: '%server%'
      timestamp: true
  #Ile miejsc wymienia %standings%
  standings-size: 10

#Seria gracza osiąga liczbę dni z rzędu (streaks.yml). %player% %player_head% %player_mention% %streak% %days%
streaks:
  enabled: false
  channels: [main]
  #Publikowane są tylko te liczby dni
  days: [7, 14, 30, 60, 100, 365]
  message:
    embed:
      color: '#E67E22'
      author: {name: '%player%', icon: '%player_head%'}
      title: ':fire:  %days% dni z rzędu!'
      description:
        - '-# %streak%'
      footer: '%server%'
      timestamp: true

#Gracz kończy wyzwanie dzienne lub tygodniowe. %player% %player_head% %player_mention% %challenge% %period%
challenges:
  enabled: false
  channels: [main]
  #Co pokazuje %period%
  periods:
    daily: 'dzienne'
    weekly: 'tygodniowe'
  message:
    embed:
      color: '#57F287'
      author: {name: '%player%', icon: '%player_head%'}
      title: ':white_check_mark:  Wyzwanie ukończone'
      description:
        - '### %challenge%'
        - '-# Wyzwanie %period%'
      footer: '%server%'
      timestamp: true

#Ranking, publikowany o stałych godzinach i przez /chatgames discord leaderboard.
#%leaderboard% %total_points% (wszyscy gracze razem)
leaderboard:
  enabled: false
  channels: [main]
  #Czas serwera, 24-godzinny, np. ['12:00', '20:00']
  times: ['20:00']
  #points albo fastest (najszybsze odpowiedzi ze wszystkich gier)
  type: points
  size: 10
  message:
    embed:
      color: '#5865F2'
      author: ':bar_chart:  Ranking'
      title: 'Najlepsi gracze'
      description:
        - '%leaderboard%'
        - ''
        - '-# Łącznie wygrano %total_points% pkt.'
      footer: '%server%'
      timestamp: true

