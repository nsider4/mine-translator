#Ustawienia, które przyjmuje każda gra (jeśli którejś brakuje, obowiązuje pokazana wartość domyślna):
#  enable: true/false
#  weight: 1             Jak chętnie rotacja wybiera tę grę względem innych (0 = nigdy).
#                        Ta sama gra nigdy nie jest grana dwa razy z rzędu.
#  winners: 1            Ilu graczy może wygrać każdą rundę.
#  points: 1             Punkty za wygraną (/chatgames top).
#  case-sensitive: false Kto ma wszystko dobrze poza wielkością liter, dostaje wiadomość 'wrong_case'.
#  timeToGuess_seconds: 20
#  min-answer-ms: 400    Szybsze dobre odpowiedzi są ignorowane i logowane: nikt nie czyta i nie pisze
#                        tak szybko, boty tak. 0 wyłącza sprawdzanie.
#  hints:                Podpowiedzi w trakcie rundy, z 'hint_message' w messages.yml.
#    enable: false
#    after-percent: 50   Pierwsza podpowiedź pojawia się po tym procencie czasu; reszta jest rozłożona na pozostały czas.
#    max: 1              Do 3.
#  countdown:            Pozostały czas, na pasku akcji. Działa na każdej wersji (od 1.8 do 26.x).
#    enable: false
#    last-seconds: 10    Tylko w ostatnich N sekundach; 0 pokazuje go przez całą rundę.
#  titleMessage / subtitleMessage: zostaw oba puste, aby nie wysyłać tytułu.
unscramble:
  enable: true
  winners: 1
  weight: 1
  points: 1
  hints:
    enable: true
    after-percent: 50
    max: 1
  countdown:
    enable: true
    last-seconds: 10

  case-sensitive: true
  #Czas w sekundach, jaki gracze mają na zgadnięcie, rozwiązanie, napisanie itd.
  timeToGuess_seconds: 20
  #__Zostaw 2 następne puste, aby je wyłączyć__
  titleMessage: '&b%selection%'
  subtitleMessage: '&aRozszyfruj'

