#W tej grze tworzony jest ciąg o podanej długości z losowych znaków
random:
  enable: true
  winners: 1
  weight: 1
  points: 1
  countdown:
    enable: true
    last-seconds: 10

  case-sensitive: true
  #Czas w sekundach, jaki gracze mają na zgadnięcie, rozwiązanie, napisanie itd.
  timeToGuess_seconds: 20
  #Długość losowego ciągu w tej grze. Format zakresu <min>-<max>. Dla jednej długości użyj tej samej liczby po obu stronach
  lengthRange: 6-8
  #Dostępne typy: ALPHA (litery), ALPHANUMERIC (litery i cyfry), NUMERIC (cyfry), SYMBOLIC (symbole),
  #LOWERCASE_ALPHA (tylko małe litery), UPPERCASE_ALPHA (tylko wielkie litery), HEXADECIMAL (znaki szesnastkowe: 0123456789ABCDEF)
  #CUSTOM (używa tego, co jest w 'custom_characters')
  character_type: ALPHANUMERIC
  #Ta linia jest używana tylko, gdy typ to "CUSTOM"
  custom_characters: 'abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789'

  #__Zostaw 2 następne puste, aby je wyłączyć__
  titleMessage: '&b%selection%'
  subtitleMessage: '&aNapisz'

math:
  enable: true
  winners: 1
  weight: 1
  points: 1
  hints:
    enable: true
    after-percent: 50
    max: 1
  countdown:
    enable: true
    last-seconds: 10

  #Nie zmieniaj tego
  case-sensitive: false
  #Czas w sekundach, jaki gracze mają na zgadnięcie, rozwiązanie, napisanie itd.
  timeToGuess_seconds: 20
  #Zakresy losowych liczb dla każdego poziomu trudności:
  #1 - (1-9)
  #2 - (1-99)
  #3 - (1-999)
  #4 - (1-9999)
  #5 - (1-99999)
  difficulty: 2
  #Ile operatorów ma każde pytanie: 1 -> "12 + 7", 2 -> "12 + 7 x 3"
  operations: 1
  #solve: obliczyć wynik ("12 + 7 x 3").  missing-value: znaleźć ukrytą liczbę ("12 + ? x 3 = 33").
  #Każda runda wybiera jeden z wymienionych trybów.
  modes:
    - solve
    - missing-value
  #Używane operatory; dostępne są cztery wymienione, usuń te, których nie chcesz. Zawsze zostaw co najmniej 1
  #Dzielenia zawsze dają liczby całkowite.
  operators:
    - '+'
    - '-'
    - 'x'
    - '/'

  #__Zostaw 2 następne puste, aby je wyłączyć__
  titleMessage: '&b%selection%'
  subtitleMessage: '&aRozwiąż'

variable:
  enable: true
