  titleMessage: '&bROZWIĄŻ'
  subtitleMessage: '&aDla &7`&b%symbol%&7`'

  #Zakres losowej liczby wyniku
  result-min: 20
  result-max: 100

  toGet: '✗'
  #Inne symbole, które możesz dodać: ✪❃✿✠❂♫♪❦♡♤♢✦☾☽✹
  data:
    - '✯;10'
    - '♛;15'
    - '❅;20'
    - '♫;25'

sequence:
  enable: true
  winners: 1
  weight: 1
  points: 1
  hints:
    enable: true
    after-percent: 50
    max: 1
  countdown:
    enable: true
    last-seconds: 10

  #Nie zmieniaj tego
  case-sensitive: false

  #Czas w sekundach, jaki gracze mają na zgadnięcie, rozwiązanie, napisanie itd.
  timeToGuess_seconds: 25

  #Gracze widzą ciąg liczb i wpisują następną, np. "3, 6, 12, 24, ?" -> 48
  #Wzory: dodawanie (3, 7, 11), mnożenie (2, 6, 18), kwadraty (4, 9, 16), naprzemienne (5, 9, 7, 11), fibonacci (2, 3, 5, 8)
  patterns:
    - add
    - multiply
    - squares
    - alternating
    - fibonacci
  #1-3. Wyższa trudność pozwala na trudniejsze wzory (kwadraty i naprzemienne od 2, fibonacci przy 3) i większe liczby.
  difficulty: 2
  #Ile liczb jest pokazywanych przed '?' (4-8)
  shown-terms: 5

  #__Zostaw 2 następne puste, aby je wyłączyć__
  titleMessage: '&b%selection%'
  subtitleMessage: '&aDokończ ciąg'

