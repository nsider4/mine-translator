  clickable: 'Klikanie'
  fillout: 'Uzupełnij'
  hoverable: 'Najechanie'
  random: 'Losowa'
  math: 'Matematyka'
  variable: 'Zmienna'
  sequence: 'Ciąg'
  memorize: 'Zapamiętaj'
  word_association: 'Skojarzenia'
  trivia: 'Quiz'
  count: 'Liczenie'
  hunt: 'Polowanie'
  mine: 'Kopanie'
  place: 'Stawianie'
  fish: 'Wędkowanie'
  eat: 'Jedzenie'
  craft: 'Wytwarzanie'
  furnace: 'Pieczenie'
game-icons:
