#MENU
#
#Każde menu w 'menus:' ma 'title', rozmiar w 'rows' (1-6) i swoje 'items'. Możesz zmienić,
#co robi każdy przycisk, dodać przyciski albo stworzyć całe nowe menu (otwórz je przez /chatgames menu <id>,
#albo umieść każde we własnym pliku w folderze menus/, o nazwie <id>.yml).
#
#Każdy element:
#  slot: gdzie się znajduje, od 0 (lewy górny) do rows*9-1. 'slots: [0, 1, '9-17']' powtarza go.
#  material: dowolna nazwa przedmiotu od 1.8 do 26.x: nowoczesne lub stare nazwy (lime_dye / INK_SACK:10 / 351:10),
#            albo 'head:<nick gracza, tekstura lub URL textures.minecraft.net>'
#  name / lore: działają kody kolorów (&a, oraz &#RRGGBB na 1.16+) i placeholdery PlaceholderAPI.
#  amount, glow: true, enchantments: ['SHARPNESS:1'], flags: [HIDE_ATTRIBUTES], head: '%player%',
#  custom-model-data: 1001 (1.14+), item-model: 'namespace:key' (1.21.2+), color: '#FF0000' (skóra)
#  actions: co robi kliknięcie, po kolei. Także left-actions, right-actions, shift-left-actions,
#           shift-right-actions, middle-actions i drop-actions (każde wraca do actions).
#  view-requirements: element pojawia się tylko, gdy każda linia się zgadza
#  click-requirements: jeśli linia się nie zgadza, zamiast actions wykonują się 'deny-actions'
#  state + when-off: gdy stan to false, klucze z when-off zastępują klucze elementu
#                    (nie 'off': YAML czyta samo off jako false)
#Usuń element, aby go ukryć. 'filler' wypełnia każdy pusty slot; usuń go, aby nie było wypełnienia.
#
#Akcje:
#  [command] <command>        ty wykonujesz komendę        [console] <command>   wykonuje ją konsola
#  [message] <text>           wiadomość do ciebie          [broadcast] <text>    do wszystkich
#  [sound] <sound> [volume] [pitch]   dowolna nazwa dźwięku od 1.8 do 26.x
#  [open] <menu> [values]     otwiera inne menu            [switch] <menu> [values]  to samo, ale [back] je pomija
#  [back] [menu]              poprzednie menu (albo podane, albo zamyka)
#  [refresh]  [close]  [next-page]  [previous-page]  [wait] <ticks>
#  [chatgames:no-permission]  wysyła wiadomość o braku uprawnień
#  Te specyficzne dla menu są opisane nad menu, które je mają.
#
#Wymagania, jedno na linię (każda linia musi się zgadzać; zacznij linię od !, aby ją odwrócić):
#  permission <node>     porównanie jak '%chatgames_points% >= 100' (==, !=, >=, <=, >, <)
#  albo wartość, która jest true / on / yes / liczbą inną niż 0
#
#Menu, które coś wymieniają (wyzwania, gry, wydarzenia...), układają to po kolei w 'list-slots',
#rysowane 'templates' menu. Gdy elementów jest więcej niż slotów, elementy z akcjami
#[next-page] / [previous-page] przewijają strony; znikają, gdy nie ma strony, na którą można przejść.
#Linia lore, która jest tylko placeholderem listy, jak '%game_wins%', staje się wieloma liniami.
#Każde menu ma też %player%, %page%, %pages% i %entries% (ile elementów ma lista).

#Nazwy i ikony gier, w każdym menu i w wiadomościach, które wymieniają grę (%game%).
#Gra, której tu brakuje, dostaje nazwę swojego klucza.
