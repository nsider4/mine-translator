      description: '&7채팅 게임 %amount%번 이기기'
      icon: GOLD_INGOT
      rewards:
        - '[consolecmd] give %player% gold_ingot 8'
    unscramble_2:
      type: WIN_GAME
      game: unscramble
      amount: 2
      name: '&b단어 마법사'
      description: '&7%game% 게임 %amount%번 이기기'
      icon: BOOK
      rewards:
        - '[consolecmd] give %player% iron_ingot 8'
    math_2:
      type: WIN_GAME
      game: math
      amount: 2
      name: '&b인간 계산기'
      description: '&7%game% 게임 %amount%번 이기기'
