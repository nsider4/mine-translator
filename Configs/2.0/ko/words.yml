trivia:
  data:
    1:
      question: 'Minecraft는 몇 년에 출시됐을까요?'
      answers:
        - '2011'
        - '2009'
    2:
      question: 'Minecraft를 만든 사람은 누구일까요?'
      answers:
        - 'Notch'
    3:
      question: 'Minecraft의 다른 에디션은? Java 에디션과 _______ 에디션?'
      answers:
        - '기반암'
    4:
      question: 'Minecraft의 다른 에디션은? 베드락 에디션과 ____ 에디션?'
      answers:
        - 'Java'
    5:
      question: '네더 차원문으로 어느 차원에 갈 수 있을까요?'
      answers:
        - '네더'
    6:
      question: '블록이 무한하고 하늘을 날 수 있는 게임 모드는?'
      answers:
        - '크리에이티브'
    7:
      question: '자원을 모으고 배고픔을 관리하며 살아남는 게임 모드는?'
      answers:
        - '서바이벌'
    8:
      question: '블록을 통과하며 세상을 구경만 하는 게임 모드는?'
      answers:
        - '관전자'
    9:
      question: '모험 지도를 위한, 블록을 마음대로 부술 수 없는 게임 모드는?'
      answers:
        - '모험'
    10:
      question: '위더 스켈레톤 머리 3개로 소환하는 몹은?'
      answers:
        - '위더'
    11:
      question: '모래를 제련하면 어떤 블록이 나올까요?'
      answers:
