#글로벌 게임
#
#글로벌 게임에서는 서버 전체가 한 팀으로 플레이합니다. 정답마다(글로벌
#레이스에서는 캔 블록, 처치한 몹마다...; 숫자 세기에서는 센 숫자마다) 하나의 공유
#점수에 더해집니다. 아무도 가장 빠를 필요는 없습니다. 점수가 제시간에 목표에 닿으면
#기여한 모두가 보상을 받습니다. 시간이 먼저 다 되면 게임은 실패합니다.
#
#  채팅 게임은 문제가 계속 이어집니다. 각 플레이어는 문제마다 한 번만 답할 수 있고,
#  'answers-per-question'개의 정답이나 'question-seconds'가 지나면 다음 문제가 나옵니다.
#  정답은 항상 숨겨지므로 따라 쓸 수 없습니다.
#  레이스는 모두의 진행도를 합칩니다. 예: 서버 전체가 돌 500개 캐기.
#  숫자 세기(글로벌 전용): 채팅에서 함께 숫자를 셉니다. 메시지 하나에 숫자 하나.
#
#글로벌 게임은 일반 게임이 끝난 뒤 확률로, 타이머로,
#/chatgames global <game> [values]로, 또는 이벤트의 한 단계(events.yml)로 시작됩니다.
#진행도는 보스 바(1.9+)나 액션 바(1.8)에 표시됩니다.

triggers:
  #일반 게임이나 레이스가 끝난 뒤 글로벌 게임이 시작될 확률(%, 0 = 없음).
  chance-after-game: 10
  #일반 게임이 끝나고 글로벌 게임이 시작되기까지의 초.
  delay-seconds: 5
  #타이머로 시작되는 글로벌 게임 사이의 분(0 = 끔).
  interval-minutes: 0
  #글로벌 게임이 저절로 시작되는 데 필요한 온라인 플레이어 수(명령어는 이를 무시합니다).
  minimum-players: 2

progress-bar:
  enabled: true
  #보스 바 색: BLUE, GREEN, PINK, PURPLE, RED, WHITE 또는 YELLOW.
  color: YELLOW
  #SOLID, SEGMENTED_6, SEGMENTED_10, SEGMENTED_12 또는 SEGMENTED_20.
  style: SEGMENTED_10
  #서버가 도달하면 채팅에 알리는 목표의 퍼센트.
  announce-at: [25, 50, 75]

#아래 게임이 직접 정하지 않은 값에는 모두 이것을 씁니다.
#  goal: 서버에 필요한 정답 수(레이스는 아이템/몹 수)
#  duration-seconds: 서버에 주어지는 시간
#  min-contribution: 보상을 받기 위한 최소 기여
#  points: 목표 달성 시 보상받는 각 플레이어가 받는 포인트
#  points-per-contribution: 플레이어의 기여마다 주는 추가 포인트
#  answers-per-question: 채팅 게임 전용, 한 문제에 답할 수 있는 플레이어 수
#  question-seconds: 채팅 게임 전용, 한 문제가 떠 있는 최대 시간
defaults:
  goal: 10
  duration-seconds: 120
  min-contribution: 1
  points: 1
  points-per-contribution: 0
  answers-per-question: 3
  question-seconds: 15

#rewards.yml 형식의 보상(chance, minimum-players, '<chance>%~ ', 'has:<permission>'
#모두 작동). %player%는 플레이어, %contribution%은 그 기여입니다.
#게임 자체의 'rewards' 섹션이 그 게임에서는 이것을 대신합니다.
rewards:
  #목표 달성 시 min-contribution 이상 기여한 모두.
  completed:
    reward_1:
      data:
        - '[consolecmd] give %player% iron_ingot 3'
  #시간이 다 됐을 때의 같은 플레이어. 비우면: 위로 상품 없음.
  failed: {}
  #목표 달성 시 가장 많이 기여한 사람에게 순위별로 주는 추가 보상.
  top-contributors:
    1:
      reward_1:
        data:
          - '[consolecmd] give %player% diamond 1'
    2:
      reward_1:
        data:
          - '[consolecmd] give %player% gold_ingot 3'
    3:
      reward_1:
        data:
          - '[consolecmd] give %player% gold_ingot 1'

#모든 메시지의 플레이스홀더: %game% %goal%(숫자) %goal_text%(예: "500 돌")
#%progress% %percent% %time%(남은 초) %duration%
messages:
  start:
    - ''
    - '&6&l» 글로벌 %game%! &f서버 전체가 함께 플레이합니다.'
    - '&f  &e%time%s &f안에 &e정답 %goal%개&f를 모으세요. 도운 모두가 보상을 받습니다!'
    - '&7  문제마다 %answers%명이 답할 수 있으니 다른 사람을 기다리지 마세요.'
    - ''
  race_start:
    - ''
    - '&6&l» 글로벌 레이스! &f서버 전체가 함께 플레이합니다.'
    - '&f  &e%time%s &f안에 함께 &e%goal% %value%&f를 모으세요. 도운 모두가 보상을 받습니다!'
    - ''
  count_start:
    - ''
    - '&6&l» 글로벌 숫자 세기! &f함께 &e%start%&f부터 &e%target%&f까지 &e%step%&f씩 세세요!'
    - '&7  메시지 하나에 숫자 하나, 순서대로. 아무도 두 번 연속 셀 수 없습니다. %time%s 안에 끝내세요.'
    - ''
  #각 문제 위에. %question%은 문제 번호입니다.
  question:
    - '&6&l» 글로벌 &7문제 #%question% &8| &e%progress%&7/&e%goal%'
  #문제 시간이 다 됐을 때. %answer%는 그 정답입니다. 비우면 조용히 넘어갑니다.
  question_over: '&8» &7정답은 &f%answer%&7였습니다.'
  #답이 인정된 플레이어에게. %contribution%은 지금까지의 합계입니다.
  answered: '&8[%prefix%&8] &a정답! &7서버의 &f%progress%/%goal% &7중 &f%contribution%&7을(를) 보탰습니다.'
  #%reached%는 방금 도달한 퍼센트입니다.
  milestone: '&6&l» &e%reached%% &f달성! &7(%progress%/%goal%, %time%s 남음)'
  #인정된 숫자. 플레이어의 메시지 대신 표시됩니다. %player% %number%
  counted: '&e%player% &8» &f%number%'
  #실수. %player% %number% %next%(기대한 숫자) %start% %reason% %mistakes% %max_mistakes%
  count_broken:
    - '&c%player%님이 %number%을(를) 말했습니다: %reason%'
    - '&f숫자 세기를 &e%start%&f부터 다시 시작합니다.'
  #게임을 끝내는 실수(on-mistake: fail, 또는 max-mistakes 도달).
  count_broken_final:
    - '&c%player%님이 %number%을(를) 말했습니다: %reason%'
  count_reasons:
    ahead: '너무 앞서 나감(다음 숫자는 %next%)'
    behind: '이미 센 숫자임(다음 숫자는 %next%)'
    repeated: '방금 말한 숫자임'
    twice: '아무도 숫자 두 개를 연속으로 셀 수 없음'
  #%count%명이 보상을 받았고, %contributors%명이 참여했으며, %seconds% 걸렸습니다.
  #%top_<n>%와 %top_<n>_amount%: 가장 많이 기여한 세 명.
  completed:
    - ''
    - '&6&l» 목표 달성! &f서버가 &e%seconds%s &f만에 &e%goal_text%&f를 해냈습니다.'
    - '&f  상위: &e%top_1% &7(%top_1_amount%)  &e%top_2% &7(%top_2_amount%)  &e%top_3% &7(%top_3_amount%)'
    - '&f  &e%count%&f명이 보상을 받습니다.'
    - ''
  failed:
    - ''
    - '&6&l» 글로벌 게임 종료! &f서버는 &e%progress%/%goal% &7(%percent%%)&f까지 갔습니다. 다음엔 꼭!'
    - ''
  #목표 달성 시 보상받는 각 플레이어에게. %points%는 얻은 포인트입니다.
  rewarded: '&8[%prefix%&8] &a당신은 &f%contribution% &a기여해서 &f%points% &a포인트를 얻었습니다!'
  #min-contribution보다 적게 기여한 플레이어에게. %min%은 그 최솟값입니다.
  too_little: '&8[%prefix%&8] &7기여한 양은 %contribution%입니다. 보상에는 최소 %min%이(가) 필요했습니다.'
  #보스 바(1.8에서는 액션 바).
  bar: '&6글로벌 %game% &8| &f%progress%/%goal% &8| &e%time%s'

#%goal_text%를 만들 때 쓰는 단어.
words:
  answers: '개의 정답'
  to: '~'

#글로벌로 할 수 있는 게임. 기억하기와 숫자 맞히기는 안 됩니다.
#각각 enabled와 'defaults'의 아무 값, 그리고 자기 'rewards'를 정할 수 있습니다.
games:
  reaction:
    enabled: true
    goal: 10
    duration-seconds: 90
    question-seconds: 10
  unscramble:
    enabled: true
    goal: 10
    duration-seconds: 150
  math:
    enabled: true
    goal: 15
    duration-seconds: 150
  sequence:
    enabled: true
    goal: 8
    duration-seconds: 150
  trivia:
    enabled: true
    goal: 8
    duration-seconds: 180
    question-seconds: 20
  word_association:
    enabled: true
    goal: 8
    duration-seconds: 150
  fillout:
    enabled: true
    goal: 10
    duration-seconds: 150
  unreverse:
    enabled: false
  random:
    enabled: false
  variable:
    enabled: false
  hoverable:
    enabled: false
  clickable:
    enabled: false
  #함께 숫자 세기. 목표는 고른 모드에 있는 숫자의 개수입니다.
  count:
    enabled: true
    duration-seconds: 120
    #아무도 숫자 두 개를 연속으로 말할 수 없습니다.
    no-double-count: true
    #reset: 실수하면 처음부터 다시 셉니다. fail: 실수하면 게임이 끝납니다.
    on-mistake: reset
    #reset일 때: 그래도 게임을 끝내는 실수 횟수(0 = 제한 없음).
    max-mistakes: 5
    #무작위로 하나를 고릅니다. /chatgames global count <mode>로 고를 수 있습니다.
    #'step'은 숫자마다 올라가는 양입니다(방향은 start와 target을 따릅니다).
    modes:
      up:
        start: 1
        target: 20
        step: 1
      down:
        start: 15
        target: 1
        step: 1
      evens:
        start: 2
        target: 30
        step: 2
      fives:
        start: 5
        target: 75
        step: 5
  #글로벌 레이스: 서버 전체가 목표를 향해 모읍니다. 대상은 races.yml에서 가져옵니다.
  #/chatgames global mine STONE 500은 둘 다 정합니다.
  mine:
    enabled: true
    goal: 200
    duration-seconds: 240
  hunt:
    enabled: true
    goal: 40
    duration-seconds: 240
  place:
    enabled: false
    goal: 200
    duration-seconds: 240
  fish:
    enabled: false
    goal: 20
    duration-seconds: 300
  eat:
    enabled: false
    goal: 30
    duration-seconds: 240
  craft:
    enabled: false
    goal: 100
    duration-seconds: 240
  furnace:
    enabled: false
    goal: 64
    duration-seconds: 300
  tame:
    enabled: false
    goal: 15
    duration-seconds: 300
  shear:
    enabled: false
    goal: 40
    duration-seconds: 240
