  data:
    #이 값들은 올바른 Minecraft 몹 ID여야 합니다(파일 맨 위의 유용한 링크 참고)
    #MythicMobs가 있으면 mythic:<mob type>은 그 몹 중 하나입니다(예시는 이 목록 끝에 있습니다)
    ZOMBIE:
      3:
        #추가한 모든 보상의 확률 합은 100%를 넘을 수 없습니다
        rewards:
          - reward_2
      5:
        rewards:
          - reward_1

