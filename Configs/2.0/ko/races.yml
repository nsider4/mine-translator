enable-races: true

creative-enabled: true
#데이터를 추가할 때 유용한 링크:
#
#https://hub.spigotmc.org/javadocs/spigot/org/bukkit/entity/EntityType.html
#https://helpch.at/docs/1.8/index.html?org/bukkit/entity/EntityType.html
#https://hub.spigotmc.org/javadocs/bukkit/org/bukkit/Material.html
#https://helpch.at/docs/1.8/org/bukkit/Material.html

#이름은 새 이름이나 옛 이름 모두 됩니다(MOOSHROOM 또는 MUSHROOM_COW, COD 또는 RAW_FISH). 서버의
#버전에 맞춰 찾아집니다. 그 버전에 없는 이름(예: 1.8에서 1.21 블록)은 건너뛰고 콘솔에 알립니다.
#
#각 레이스는 다음도 받습니다(선택):
#  points: 1     #승자가 받는 포인트(기본값 1)
#  weight: 1     #다른 게임과 비교해 로테이션이 고르는 빈도(기본값 1, 0 = 고르지 않음)
#
#관리자는 직접 정한 값으로 레이스를 시작할 수 있습니다: /chatgames <race> <material/mob> [amount]
#개수를 정하지 않으면 아래에서 그 재료/몹에 적힌 개수를 씁니다. 승자는 정확히
#그 재료와 개수에 적힌 보상을 받고, 여기에 없으면 보상이 없습니다(포인트는 받습니다).

hunt:
  enable: true

  timeToComplete_seconds: 180
  #__다음 2개를 비우면 꺼집니다__
  titleMessage: '&b사냥'
  subtitleMessage: '&a%value% %amount%마리를 처치하세요!'

  #스포너 블록이나 생성 알로 나온 몹도 셀지 여부.
  count-spawner-mobs: true
  #MythicMobs 몹을 바탕이 된 몹으로도 셀지 여부(MythicMobs 좀비를 ZOMBIE로).
