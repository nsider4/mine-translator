#############################
######    채팅 게임    ######
#############################
#모든 게임이 받는 설정(없는 항목은 표시된 기본값을 씁니다):
#  enable: true/false
#  weight: 1             다른 게임과 비교해 로테이션이 이 게임을 고를 확률(0 = 고르지 않음).
#                        같은 게임은 두 번 연속으로 진행되지 않습니다.
#  winners: 1            한 라운드에 이길 수 있는 플레이어 수.
#  points: 1             1승당 포인트(/chatgames top).
#  case-sensitive: false 대소문자만 틀린 플레이어는 'wrong_case' 메시지를 받습니다.
#  timeToGuess_seconds: 20
#  min-answer-ms: 400    이보다 빠른 정답은 무시되고 기록됩니다. 사람은 그렇게 빨리 읽고
#                        입력할 수 없고, 채팅 봇만 가능합니다. 0이면 이 검사를 끕니다.
#  hints:                라운드 중에 힌트가 나옵니다. messages.yml의 'hint_message'를 씁니다.
#    enable: false
#    after-percent: 50   시간이 이만큼 지나면 첫 힌트가 나오고, 나머지는 남은 시간에 나뉘어 나옵니다.
#    max: 1              최대 3.
#  countdown:            남은 시간을 액션 바에 표시합니다. 모든 버전에서 작동합니다(1.8부터 26.x).
#    enable: false
#    last-seconds: 10    마지막 N초 동안만 표시합니다. 0이면 라운드 내내 표시합니다.
#  titleMessage / subtitleMessage: 둘 다 비우면 제목을 보내지 않습니다.
unscramble:
  enable: true
  winners: 1
  weight: 1
  points: 1
  hints:
    enable: true
    after-percent: 50
    max: 1
  countdown:
    enable: true
    last-seconds: 10

  case-sensitive: true
  #플레이어가 맞히고, 풀고, 입력하는 등에 주어지는 시간(초).
  timeToGuess_seconds: 20
  #__다음 2개를 비우면 꺼집니다__
  titleMessage: '&b%selection%'
  subtitleMessage: '&a단어 맞추기'

