#여기부터는 승자가 1명뿐인 레이스의 보상입니다
#
#다른 형식을 씁니다! 잘 읽어 보세요

races:
  rewards:
    #이것들은 'races.yml'에 넣는 보상입니다
    reward_1:
      chance: 50
      data:
        - '60.0%~ [consolecmd] give %player% diamond_block 5'
    #'chance' 값을 지우면 그 보상/명령어는 항상 실행됩니다
    reward_2:
      data:
        - '[consolecmd] give %player% iron_block 5'
        - '[playermsg] &a승리!'
    reward_3:
      chance: 50
      data:
        - '[consolecmd] give %player% diamond_block 3'