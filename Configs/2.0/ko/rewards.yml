#가능한 동작:
#
#[playercmd] - 승자로서 명령어 실행
#[consolecmd] - 콘솔에서 명령어 실행
#[playermsg] - 승자에게 메시지 보내기
#[broadcast] - 켜진 월드의 모든 플레이어에게 메시지 알리기
#[player_as_op] - 플레이어에게 OP 권한으로 명령어 실행
#
#보상에 확률을 붙이는 방법:
#
#예시:
#  - '10.0%~ [consolecmd] give %player% iron_block 5'
#예시와 같은 형식일 때만 작동합니다. 맨 앞에 <chance>%, 이어서 ~와 공백 하나. 항상 명령어 맨 앞에 씁니다
#
#%가 없는 명령어는 100% 주어지는 보상입니다.

#권한 확인:
#
#명령어 줄 끝에 씁니다.
#예시:
#  - '[consolecmd] give %player% iron_block 5 has:test.permission'

#1은 첫 번째 승자입니다. config.yml에서 승자를 늘리고 다른 보상을 주려면 그 순위(2: 등)를 추가하세요
unscramble:
  rewards:
    1:
      reward_1:
        minimum-players: 2 #온라인 플레이어 수 조건. 온라인이 2명 이상일 때만 이 보상이 뽑힙니다
        chance: 50
        data:
          - '10.0%~ [consolecmd] give %player% diamond_block 3 has:test.permission'
          - '[consolecmd] give %player% iron_block 5'
      reward_2:
        data:
          - '[consolecmd] give %player% iron_block 2'

