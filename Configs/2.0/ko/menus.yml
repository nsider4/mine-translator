  #비공개 라운드: %game% %key% %icon% %question% %answer% %time% %min_ms% %case_sensitive%
  #%winners% %points% %hints% %generated%; 목록 %placeholders%와 %answers%.
  #[chatgames:debug-answer] <correct|wrong|wrong-case> [ms]는 모의 답을 보냅니다(ms 후).
  #[chatgames:debug-timeout]은 제한 시간까지 기다리고, [chatgames:debug-reroll]은 새 라운드를 만듭니다.
  #[chatgames:debug-end]는 세션을 끝냅니다.
  debug-session:
    title: '&4디버그: %game%'
    rows: 5
    open-requirements: ['permission chatgames.debug']
    open-deny-actions: ['[chatgames:no-permission]']
    filler:
      material: gray_stained_glass_pane
      name: ' '
    #대기 시간마다 "X ms 후 정답" 버튼 하나가 'delays' 목록 칸에 놓입니다
    delays: [100, 500, 1000, 5000]
    lists:
      delays: ['29-32']
    items:
      question:
        slot: 11
        material: '%icon%'
        name: '&e&l문제'
        lore:
          - '&f%question%'
          - ''
          - '%placeholders%'
