      amount: 2
      name: '&bČaroděj slov'
      description: '&7Vyhraj %amount% her %game%'
      icon: BOOK
      rewards:
        - '[consolecmd] give %player% iron_ingot 8'
    math_2:
      type: WIN_GAME
      game: math
      amount: 2
      name: '&bLidská kalkulačka'
      description: '&7Vyhraj %amount% her %game%'
      icon: PAPER
