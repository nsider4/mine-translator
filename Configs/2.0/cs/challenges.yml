#DENNÍ A TÝDENNÍ ÚKOLY
#
#Všichni dostanou stejné úkoly. Postup se počítá, jak hráči hrají; splněný
#úkol ukazuje „Lze vyzvednout“ v /chatgames challenges a /chatgames claim ho vyplatí.
#Nevyzvednuté odměny propadnou, když se úkoly resetují.
#
#TYPY ÚKOLŮ (amount je, kolik je potřeba):
#  WIN_GAMES    vyhrávat chatové hry nebo závody, na jakémkoli místě
#  WIN_GAME     vyhrávat jednu hru nebo závod, nastavený v 'game' (např. game: unscramble)
#  WIN_RACES    vyhrávat závody
#  PLAY_GLOBAL  včas vyřešit globální hry
#  WIN_GLOBAL   dokončit globální hry na místě s odměnou
#  FAST_WIN     vyhrávat chatové hry za 'seconds' nebo méně (závody se nepočítají)
#  EARN_POINTS  získávat body ze her
#  PLAY_EVENT   účastnit se herních událostí
#
#Každý úkol má:
#  name / description: zobrazí se v chatu a v menu. %amount%, %game% a %seconds% se doplní.
#  icon: položka v menu (název materiálu)
#  rewards: řádky jako v rewards.yml (šance s '<chance>%~ ', oprávnění s 'has:<permission>').
#           %player% a %challenge% (název) se doplní.
#
#ID (win_3, fast_1...) se ukládají s postupem hráčů: používejte jen a-z, 0-9, - a _,
#a změna ID začne postup toho úkolu znovu.

#Časové pásmo, ve kterém začínají dny, pro úkoly a série, např. Europe/Prague nebo America/New_York.
#Prázdné použije pásmo serveru.
timezone: ''

daily:
  enabled: true
  #fixed: každý úkol níže je aktivní každý den.
  #random: každý den se vylosuje 'amount' z nich (stejné pro všechny).
  mode: random
  amount: 3
  challenges:
    win_3:
      type: WIN_GAMES
      amount: 3
      name: '&eRozcvička'
      description: '&7Vyhraj %amount% chatových her'
      icon: GOLD_NUGGET
      rewards:
