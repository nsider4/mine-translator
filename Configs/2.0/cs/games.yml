#Tato hra vytvoří řetězec zadané délky z náhodných znaků
random:
  enable: true
  winners: 1
  weight: 1
  points: 1
  countdown:
    enable: true
    last-seconds: 10

  case-sensitive: true
  #Čas v sekundách, který mají hráči na uhodnutí, vyřešení, napsání atd.
  timeToGuess_seconds: 20
  #Délka náhodného řetězce pro tuto hru. Formát rozsahu <lower>-<higher>. Pro jednu délku dejte stejné číslo na obě strany
  lengthRange: 6-8
  #Dostupné typy: ALPHA (písmena), ALPHANUMERIC (písmena a číslice), NUMERIC (číslice), SYMBOLIC (symboly),
  #LOWERCASE_ALPHA (vše malými písmeny), UPPERCASE_ALPHA (vše velkými písmeny), HEXADECIMAL (šestnáctkové znaky: 0123456789ABCDEF)
  #CUSTOM (použije to, co je v 'custom_characters')
  character_type: ALPHANUMERIC
  #Tento řetězec se použije, jen pokud je type "CUSTOM"
  custom_characters: 'abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789'

  #__Nechte další 2 prázdné, abyste je vypnuli__
  titleMessage: '&b%selection%'
  subtitleMessage: '&aNapiš'

math:
  enable: true
  winners: 1
  weight: 1
  points: 1
  hints:
    enable: true
    after-percent: 50
    max: 1
  countdown:
    enable: true
    last-seconds: 10

  #Toto neměňte
  case-sensitive: false
  #Čas v sekundách, který mají hráči na uhodnutí, vyřešení, napsání atd.
  timeToGuess_seconds: 20
  #Rozsahy náhodných čísel podle obtížnosti:
  #1 - (1-9)
  #2 - (1-99)
  #3 - (1-999)
  #4 - (1-9999)
  #5 - (1-99999)
  difficulty: 2
  #Kolik operátorů má každá otázka: 1 -> "12 + 7", 2 -> "12 + 7 x 3"
  operations: 1
  #solve: vypočítat výsledek ("12 + 7 x 3").  missing-value: najít skryté číslo ("12 + ? x 3 = 33").
  #Každé kolo vybere jeden z uvedených režimů.
  modes:
    - solve
    - missing-value
  #Operátory k použití; čtyři uvedené jsou všechny dostupné, nepotřebné můžete odebrat. Vždy nechte aspoň 1
  #Dělení vždy dá celé číslo.
  operators:
    - '+'
    - '-'
    - 'x'
    - '/'

  #__Nechte další 2 prázdné, abyste je vypnuli__
  titleMessage: '&b%selection%'
  subtitleMessage: '&aVypočítej'

variable:
  enable: true
