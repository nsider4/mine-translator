######    CHATOVÉ HRY    ######
#############################
#Nastavení, která přijímá každá hra (co chybí, použije zobrazenou výchozí hodnotu):
#  enable: true/false
#  weight: 1             Jak pravděpodobně rotace vybere tuto hru oproti ostatním (0 = nikdy).
#                        Stejná hra nikdy nejde dvakrát po sobě.
#  winners: 1            Kolik hráčů může vyhrát každé kolo.
#  points: 1             Body za výhru (/chatgames top).
#  case-sensitive: false Hráči, kteří se spletli jen ve velikosti písmen, dostanou zprávu 'wrong_case'.
#  timeToGuess_seconds: 20
#  min-answer-ms: 400    Správné odpovědi rychlejší než toto se ignorují a zaznamenají: nikdo nečte a nepíše
#                        tak rychle, chatboti ano. 0 kontrolu vypne.
#  hints:                Nápovědy se objevují během kola, přes 'hint_message' v messages.yml.
#    enable: false
#    after-percent: 50   První nápověda se objeví, když uplyne tolik času; ostatní se rozloží na zbytek.
#    max: 1              Až 3.
#  countdown:            Zbývající čas na liště akcí. Funguje na všech verzích (1.8 až 26.x).
#    enable: false
#    last-seconds: 10    Jen během posledních N sekund; 0 ho zobrazuje celé kolo.
#  titleMessage / subtitleMessage: nechte obě prázdné, aby se titulek neodeslal.
unscramble:
  enable: true
  winners: 1
  weight: 1
  points: 1
  hints:
    enable: true
    after-percent: 50
    max: 1
  countdown:
    enable: true
    last-seconds: 10

  case-sensitive: true
  #Čas v sekundách, který mají hráči na uhodnutí, vyřešení, napsání atd.
