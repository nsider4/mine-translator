  subtitleMessage: '&aNajdi &7`&b%symbol%&7`'

  #Rozsah náhodného výsledného čísla
  result-min: 20
  result-max: 100

  toGet: '✗'
  #Další symboly, které můžete přidat: ✪❃✿✠❂♫♪❦♡♤♢✦☾☽✹
  data:
    - '✯;10'
    - '♛;15'
    - '❅;20'
    - '♫;25'

sequence:
  enable: true
  winners: 1
  weight: 1
  points: 1
  hints:
    enable: true
    after-percent: 50
    max: 1
  countdown:
    enable: true
    last-seconds: 10

  #Toto neměňte
  case-sensitive: false

  #Čas v sekundách, který mají hráči na uhodnutí, vyřešení, napsání atd.
  timeToGuess_seconds: 25

  #Hráči vidí řadu čísel a napíšou další, např. "3, 6, 12, 24, ?" -> 48
  #Vzory: sčítání (3, 7, 11), násobení (2, 6, 18), čtverce (4, 9, 16), střídání (5, 9, 7, 11), Fibonacci (2, 3, 5, 8)
  patterns:
    - add
    - multiply
    - squares
    - alternating
    - fibonacci
  #1-3. Vyšší obtížnost dává těžší vzory (čtverce a střídání od 2, Fibonacci na 3) a větší čísla.
  difficulty: 2
  #Kolik čísel se zobrazí před '?' (4-8)
  shown-terms: 5

  #__Nechte další 2 prázdné, abyste je vypnuli__
  titleMessage: '&b%selection%'
  subtitleMessage: '&aDoplň řadu'

