#MOŽNÉ AKCE:
#
#[playercmd] - Spustí příkaz jako vítěz
#[consolecmd] - Spustí příkaz z konzole
#[playermsg] - Pošle zprávu vítězi
#[broadcast] - Pošle zprávu všem hráčům v zapnutých světech
#[player_as_op] - Spustí příkaz za hráče s právy operátora
#
#PŘIDEJTE ODMĚNÁM ŠANCE TAKTO:
#
#PŘÍKLAD:
#  - '10.0%~ [consolecmd] give %player% iron_block 5'
#FUNGUJE JEN TEHDY, KDYŽ JE FORMÁT STEJNÝ JAKO V PŘÍKLADU: <chance>% NA ZAČÁTKU, PAK ~ A MEZERA. VŽDY JAKO PRVNÍ V PŘÍKAZU
#
#PŘÍKAZY BEZ % BUDOU ODMĚNY UDĚLENÉ NA 100 %.

#KONTROLA OPRÁVNĚNÍ:
#
#DEJTE NA KONEC ŘÁDKU PŘÍKAZU.
#Příklad:
#  - '[consolecmd] give %player% iron_block 5 has:test.permission'

#1 je pro PRVNÍHO vítěze; POKUD PŘIDÁTE V config.yml VÍC VÍTĚZŮ A CHCETE JINÉ ODMĚNY, PŘIDEJTE JEJICH MÍSTO (2: atd.)
unscramble:
  rewards:
    1:
      reward_1:
        minimum-players: 2 #Podmínka podle hráčů online: odměnu lze vybrat jen tehdy, když jsou online 2 nebo více hráčů
        chance: 50
        data:
          - '10.0%~ [consolecmd] give %player% diamond_block 3 has:test.permission'
          - '[consolecmd] give %player% iron_block 5'
      reward_2:
        data:
          - '[consolecmd] give %player% iron_block 2'

