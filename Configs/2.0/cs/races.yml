enable-races: true

creative-enabled: true
#Užitečné odkazy pro přidání DAT:
#
#https://hub.spigotmc.org/javadocs/spigot/org/bukkit/entity/EntityType.html
#https://helpch.at/docs/1.8/index.html?org/bukkit/entity/EntityType.html
#https://hub.spigotmc.org/javadocs/bukkit/org/bukkit/Material.html
#https://helpch.at/docs/1.8/org/bukkit/Material.html

#Názvy mohou být nové i staré (MOOSHROOM nebo MUSHROOM_COW, COD nebo RAW_FISH): přiřadí se k verzi vašeho
#serveru. Názvy, které ve vaší verzi neexistují (např. blok z 1.21 na 1.8), se přeskočí s poznámkou v konzoli.
#
#Každý závod také přijímá (volitelně):
#  points: 1     #body, které vítěz získá (výchozí 1)
#  weight: 1     #jak často ho rotace vybere oproti jiným hrám (výchozí 1, 0 = nikdy)
#
#Admini mohou spustit závod s vlastními hodnotami: /chatgames <race> <material/mob> [amount]
#Bez množství se použije jedno z uvedených níže pro ten materiál/moba. Vítěz dostane odměny uvedené
#přesně pro ten materiál a množství, nebo žádné, pokud tu nejsou (body se dají i tak).

hunt:
  enable: true

  timeToComplete_seconds: 180
  #__Nechte další 2 prázdné, abyste je vypnuli__
  titleMessage: '&bLOV'
  subtitleMessage: '&aZabij %amount% %value%!'

  #Zda počítat moby, které se objevily ze spawnerů nebo spawn vajec.
  count-spawner-mobs: true
