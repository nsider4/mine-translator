  #__Laat de volgende 2 leeg om ze uit te schakelen__
  titleMessage: '&bLOS OP'
  subtitleMessage: '&aVoor &7`&b%symbol%&7`'

  #Het bereik van het willekeurige uitkomstgetal
  result-min: 20
  result-max: 100

  toGet: '✗'
  #Andere symbolen die je kunt toevoegen: ✪❃✿✠❂♫♪❦♡♤♢✦☾☽✹
  data:
    - '✯;10'
    - '♛;15'
    - '❅;20'
    - '♫;25'

sequence:
  enable: true
  winners: 1
  weight: 1
  points: 1
  hints:
    enable: true
    after-percent: 50
    max: 1
  countdown:
    enable: true
    last-seconds: 10

  #Verander dit niet
  case-sensitive: false

  #De tijd in seconden die spelers hebben om te raden, op te lossen, te schrijven, enz.
  timeToGuess_seconds: 25

  #Spelers zien een getallenreeks en typen het volgende getal, bv. "3, 6, 12, 24, ?" -> 48
  #Patronen: optellen (3, 7, 11), vermenigvuldigen (2, 6, 18), kwadraten (4, 9, 16), afwisselend (5, 9, 7, 11), fibonacci (2, 3, 5, 8)
  patterns:
    - add
    - multiply
    - squares
    - alternating
    - fibonacci
  #1-3. Hogere moeilijkheid staat moeilijkere patronen toe (kwadraten en afwisselend vanaf 2, fibonacci bij 3) en grotere getallen.
  difficulty: 2
  #Hoeveel getallen er voor het '?' worden getoond (4-8)
  shown-terms: 5

  #__Laat de volgende 2 leeg om ze uit te schakelen__
  titleMessage: '&b%selection%'
  subtitleMessage: '&aMaak de reeks af'

