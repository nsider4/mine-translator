#In dit spel wordt een reeks van de opgegeven lengte gemaakt met willekeurige tekens
random:
  enable: true
  winners: 1
  weight: 1
  points: 1
  countdown:
    enable: true
    last-seconds: 10

  case-sensitive: true
  #De tijd in seconden die spelers hebben om te raden, op te lossen, te schrijven, enz.
  timeToGuess_seconds: 20
  #De lengte van de willekeurige reeks van dit spel. Bereikformaat <min>-<max>. Voor één lengte gebruik je aan beide kanten hetzelfde getal
  lengthRange: 6-8
  #Beschikbare types: ALPHA (letters), ALPHANUMERIC (letters en cijfers), NUMERIC (cijfers), SYMBOLIC (symbolen),
  #LOWERCASE_ALPHA (alleen kleine letters), UPPERCASE_ALPHA (alleen hoofdletters), HEXADECIMAL (hexadecimale tekens: 0123456789ABCDEF)
  #CUSTOM (gebruikt wat er in 'custom_characters' staat)
  character_type: ALPHANUMERIC
  #Deze regel wordt alleen gebruikt als het type "CUSTOM" is
  custom_characters: 'abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789'

  #__Laat de volgende 2 leeg om ze uit te schakelen__
  titleMessage: '&b%selection%'
  subtitleMessage: '&aSchrijf het'

math:
  enable: true
  winners: 1
  weight: 1
  points: 1
  hints:
    enable: true
    after-percent: 50
    max: 1
  countdown:
    enable: true
    last-seconds: 10

  #Verander dit niet
  case-sensitive: false
  #De tijd in seconden die spelers hebben om te raden, op te lossen, te schrijven, enz.
  timeToGuess_seconds: 20
  #Bereiken van willekeurige getallen per moeilijkheid:
  #1 - (1-9)
  #2 - (1-99)
  #3 - (1-999)
  #4 - (1-9999)
  #5 - (1-99999)
  difficulty: 2
  #Hoeveel operatoren elke vraag heeft: 1 -> "12 + 7", 2 -> "12 + 7 x 3"
  operations: 1
  #solve: de uitkomst berekenen ("12 + 7 x 3").  missing-value: het verborgen getal vinden ("12 + ? x 3 = 33").
  #Elke ronde kiest een van de vermelde modi.
  modes:
    - solve
    - missing-value
  #Te gebruiken operatoren; de vier vermelde zijn beschikbaar, haal weg wat je niet wilt. Laat er altijd minstens 1 staan
  #Delingen komen altijd uit op hele getallen.
  operators:
    - '+'
    - '-'
    - 'x'
    - '/'

  #__Laat de volgende 2 leeg om ze uit te schakelen__
  titleMessage: '&b%selection%'
  subtitleMessage: '&aLos het op'

variable:
  enable: true
  winners: 1
  weight: 1
  points: 1
  countdown:
    enable: true
    last-seconds: 10

  #Verander dit niet
  case-sensitive: false
