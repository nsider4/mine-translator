#############################
######    CHATGAMES    ######
#############################
#Instellingen die elk spel accepteert (ontbreekt er een, dan geldt de getoonde standaard):
#  enable: true/false
#  weight: 1             Hoe waarschijnlijk de rotatie dit spel kiest ten opzichte van de andere (0 = nooit).
#                        Hetzelfde spel wordt nooit twee keer achter elkaar gespeeld.
#  winners: 1            Hoeveel spelers elke ronde kunnen winnen.
#  points: 1             Punten per overwinning (/chatgames top).
#  case-sensitive: false Wie alles goed heeft behalve de hoofdletters, krijgt het bericht 'wrong_case'.
#  timeToGuess_seconds: 20
#  min-answer-ms: 400    Goede antwoorden die sneller zijn, worden genegeerd en gelogd: niemand leest en typt
#                        zo snel, bots wel. 0 zet de controle uit.
#  hints:                Hints tijdens de ronde, met 'hint_message' uit messages.yml.
#    enable: false
#    after-percent: 50   De eerste hint verschijnt als dit percentage van de tijd voorbij is; de rest wordt over de resterende tijd verdeeld.
#    max: 1              Tot 3.
#  countdown:            Resterende tijd, in de actiebalk. Werkt op elke versie (1.8 tot 26.x).
#    enable: false
#    last-seconds: 10    Alleen in de laatste N seconden; 0 toont het de hele ronde.
#  titleMessage / subtitleMessage: laat beide leeg om geen titel te sturen.
unscramble:
  enable: true
  winners: 1
  weight: 1
  points: 1
  hints:
    enable: true
    after-percent: 50
    max: 1
  countdown:
    enable: true
    last-seconds: 10

  case-sensitive: true
  #De tijd in seconden die spelers hebben om te raden, op te lossen, te schrijven, enz.
  timeToGuess_seconds: 20
  #__Laat de volgende 2 leeg om ze uit te schakelen__
  titleMessage: '&b%selection%'
  subtitleMessage: '&aOntwar het'

