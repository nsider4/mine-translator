enable-races: true

creative-enabled: true
#Nuttige links om GEGEVENS toe te voegen:
#
#https://hub.spigotmc.org/javadocs/spigot/org/bukkit/entity/EntityType.html
#https://helpch.at/docs/1.8/index.html?org/bukkit/entity/EntityType.html
#https://hub.spigotmc.org/javadocs/bukkit/org/bukkit/Material.html
#https://helpch.at/docs/1.8/org/bukkit/Material.html

#Namen mogen modern of oud zijn (MOOSHROOM of MUSHROOM_COW, COD of RAW_FISH): ze worden afgestemd op de
#versie van je server. Namen die op je versie niet bestaan (bv. een blok uit 1.21 op 1.8) worden overgeslagen, met een melding in de console.
#
#Elke race accepteert ook (optioneel):
#  points: 1     #punten voor de winnaar (standaard 1)
#  weight: 1     #hoe vaak de rotatie hem kiest ten opzichte van andere spellen (standaard 1, 0 = nooit)
#
#Admins kunnen een race starten met eigen waarden: /chatgames <race> <material/mob> [amount]
#Zonder aantal wordt er een gebruikt die hieronder voor dat materiaal/wezen staat. De winnaar krijgt de beloningen
#voor precies dat materiaal en aantal, of geen als ze hier niet staan (punten worden wel gegeven).

hunt:
  enable: true

  timeToComplete_seconds: 180
  #__Laat de volgende 2 leeg om ze uit te schakelen__
  titleMessage: '&bJACHT'
  subtitleMessage: '&aDood %amount% %value%!'

  #Of wezens meetellen die door spawnerblokken of spawn-eieren zijn opgeroepen.
  count-spawner-mobs: true
