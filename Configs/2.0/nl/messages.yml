help_command:
  - '&8&m-------------------------------------------------'
  - '&e&l-ChatGames-'
  - '&6'
  - '&6&lCOMMANDO''S:'
  - '&6'
  - '&e/chatgames menu [menu] &8- &7Opent het menu: profiel, uitdagingen, reeksen, ranglijsten (of elk menu uit menus.yml).'
  - '&e/chatgames profile [player] &8- &7Toont je statistieken (of die van een andere speler).'
  - '&e/chatgames top &8- &7Toont de 10 spelers met de meeste punten.'
  - '&e/chatgames fastest [game] &8- &7Toont de snelste winnaars, in totaal of voor één spel.'
  - '&e/chatgames points [player] &8- &7Toont je punten (of die van een andere speler).'
  - '&e/chatgames challenges &8- &7Toont je dagelijkse en wekelijkse uitdagingen.'
  - '&e/chatgames streaks &8- &7Toont je reeksen.'
  - '&e/chatgames claim &8- &7Haalt voltooide uitdagingen en reeksbeloningen op.'
  - '&e/chatgames event [list|top <event>] &8- &7Toont de spel-events, of wie in een event het meest scoorde.'
  - '&e/chatgames toggle [player] &8- &7Zet chatspellen voor jou aan of uit.'
  - '&e/chatgames togglesound [player] &8- &7Zet chatspelgeluiden aan of uit.'
  - '&6'
  - '&6&lADMIN:'
  - '&e/chatgames admin &8- &7Opent het adminmenu.'
  - '&e/chatgames debug &8- &7Opent het debugmenu: test elk spel privé, zonder beloningen.'
  - '&e/chatgames (game) [values] &8- &7Start dat spel nu, eventueel met je eigen woord/waarden.'
  - '&e/chatgames any &8- &7Start het spel dat de rotatie als volgende zou kiezen.'
  - '&e/chatgames global <game> [values] &8- &7Start een globaal spel: de hele server speelt samen.'
  - '&e/chatgames event start <event> | stop &8- &7Start of stopt een spel-event.'
  - '&e/chatgames stop &8- &7Beëindigt het lopende spel zonder winnaar.'
  - '&e/chatgames toggleAll &8- &7Zet de automatische spelrotatie aan of uit.'
  - '&e/chatgames preset <list|load|save> [name] &8- &7Beheert spelpresets.'
  - '&e/chatgames +points|-points|setpoints <player> <amount> &8- &7Wijzigt de punten van een speler.'
  - '&e/chatgames remove <player> &8- &7Verwijdert de gegevens van een speler.'
  - '&e/chatgames challenges reset <player> &8- &7Wist de uitdagingsvoortgang van een speler.'
  - '&e/chatgames streak set <player> <challenge|daily|global> <days> &8- &7Stelt de reeks van een speler in.'
  - '&e/chatgames logs [amount] &8- &7Toont de laatste spellogs.'
  - '&e/chatgames discord <test <message|all>|leaderboard> &8- &7Stuurt een testbericht of het klassement naar Discord.'
  - '&e/chatgames reload &8- &7Herlaadt de configuratiebestanden.'
  - '&6'
  - '&6&lSPELTYPES:'
  - '&7unscramble, unreverse, reaction, random, fillout, variable, clickable, math, sequence, memorize, guess_the_number, trivia, word_association, hoverable, hunt, mine, place, fish, craft, eat, furnace, tame, shear'
  - '&8&m-------------------------------------------------'

