#VANAF HIER ZIJN HET BELONINGEN VOOR RACES, DIE MAAR 1 WINNAAR HEBBEN
#
#ER WORDT EEN ANDER FORMAAT GEBRUIKT! LEES GOED

races:
  rewards:
    #DIT ZIJN DE BELONINGEN DIE JE IN 'races.yml' ZET
    reward_1:
      chance: 50
      data:
        - '60.0%~ [consolecmd] give %player% diamond_block 5'
    #DE WAARDE 'chance' WEGHALEN LAAT DE BELONING/HET COMMANDO ALTIJD GEBEUREN
    reward_2:
      data:
        - '[consolecmd] give %player% iron_block 5'
        - '[playermsg] &aJe hebt gewonnen!'
    reward_3:
      chance: 50
      data:
        - '[consolecmd] give %player% diamond_block 3'