#MOGELIJKE ACTIES:
#
#[playercmd] - Voert het commando uit als de winnaar
#[consolecmd] - Voert het commando uit vanuit de console
#[playermsg] - Stuurt een bericht naar de winnaar
#[broadcast] - Stuurt een bericht naar alle spelers in ingeschakelde werelden
#[player_as_op] - Voert een commando uit als op voor de speler
#
#VOEG ZO KANSEN TOE AAN BELONINGEN:
#
#VOORBEELD:
#  - '10.0%~ [consolecmd] give %player% iron_block 5'
#WERKT ALLEEN ALS HET FORMAAT GELIJK IS AAN HET VOORBEELD, MET DE <chance>% AAN HET BEGIN GEVOLGD DOOR EEN ~ EN EEN SPATIE. ALTIJD ALS EERSTE IN HET COMMANDO
#
#COMMANDO'S ZONDER % ZIJN BELONINGEN DIE 100% WORDEN GEGEVEN.

#PERMISSIECONTROLE:
#
#ZET HET AAN HET EINDE VAN DE COMMANDOREGEL.
#Voorbeeld:
#  - '[consolecmd] give %player% iron_block 5 has:test.permission'

#De 1 is voor de EERSTE winnaar; ALS JE MEER WINNAARS TOEVOEGT IN config.yml EN ANDERE BELONINGEN WILT, VOEG DAN HUN PLEK TOE (2:, enz.)
unscramble:
  rewards:
    1:
      reward_1:
        minimum-players: 2 #Online players-based condition, reward can only be chosen if there are 2 or more players online
        chance: 50
        data:
          - '10.0%~ [consolecmd] give %player% diamond_block 3 has:test.permission'
          - '[consolecmd] give %player% iron_block 5'
      reward_2:
        data:
          - '[consolecmd] give %player% iron_block 2'

