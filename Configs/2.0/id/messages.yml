#Berlaku untuk semua game. Sebuah game bisa menggantinya dengan 'hint_message' / 'countdown_actionbar' sendiri di bagiannya di bawah.
hint_message: '&8[%prefix%&8] &ePetunjuk: &f%hint%'
countdown_actionbar: '&7Sisa &e%seconds%d'

waiting_for_other_winners: '&8[%prefix%&8] &aBenar! &fMenunggu pemenang lain...'
wrong_case: '&8[%prefix%&8] &cHampir... Periksa huruf besar/kecil!'
