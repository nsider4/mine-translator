  timeToGuess_seconds: 20

  #__Kosongkan 2 baris berikut untuk mematikannya__
  titleMessage: '&bPECAHKAN'
  subtitleMessage: '&aCari &7`&b%symbol%&7`'

  #Rentang angka hasil acak
  result-min: 20
  result-max: 100

  toGet: '✗'
  #Berikut simbol lain yang bisa kamu tambahkan: ✪❃✿✠❂♫♪❦♡♤♢✦☾☽✹
  data:
    - '✯;10'
    - '♛;15'
    - '❅;20'
    - '♫;25'

sequence:
  enable: true
  winners: 1
  weight: 1
  points: 1
  hints:
    enable: true
    after-percent: 50
    max: 1
  countdown:
    enable: true
    last-seconds: 10

  #Jangan ubah ini
  case-sensitive: false

  #Waktu dalam detik yang dimiliki pemain untuk menebak, memecahkan, mengetik, dll.
  timeToGuess_seconds: 25

  #Pemain melihat deret angka dan mengetik angka berikutnya, mis. "3, 6, 12, 24, ?" -> 48
  #Pola: penjumlahan (3, 7, 11), perkalian (2, 6, 18), kuadrat (4, 9, 16), selang-seling (5, 9, 7, 11), Fibonacci (2, 3, 5, 8)
  patterns:
    - add
    - multiply
    - squares
    - alternating
    - fibonacci
  #1-3. Tingkat lebih tinggi memberi pola lebih sulit (kuadrat dan selang-seling dari 2, Fibonacci di 3) dan angka lebih besar.
  difficulty: 2
  #Berapa angka ditampilkan sebelum '?' (4-8)
  shown-terms: 5

  #__Kosongkan 2 baris berikut untuk mematikannya__
  titleMessage: '&b%selection%'
  subtitleMessage: '&aLanjutkan Deret'

