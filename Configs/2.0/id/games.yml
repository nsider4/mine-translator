#Game ini membuat string dengan panjang tertentu dari karakter acak
random:
  enable: true
  winners: 1
  weight: 1
  points: 1
  countdown:
    enable: true
    last-seconds: 10

  case-sensitive: true
  #Waktu dalam detik yang dimiliki pemain untuk menebak, memecahkan, mengetik, dll.
  timeToGuess_seconds: 20
  #Panjang string acak untuk game ini. Format rentang <lower>-<higher>. Untuk satu panjang, tulis angka yang sama di kedua sisi
  lengthRange: 6-8
  #Jenis yang tersedia: ALPHA (huruf), ALPHANUMERIC (huruf dan angka), NUMERIC (angka), SYMBOLIC (simbol),
  #LOWERCASE_ALPHA (semua huruf kecil), UPPERCASE_ALPHA (semua huruf besar), HEXADECIMAL (karakter heksadesimal: 0123456789ABCDEF)
  #CUSTOM (memakai isi 'custom_characters')
  character_type: ALPHANUMERIC
  #String ini hanya dipakai jika type adalah "CUSTOM"
  custom_characters: 'abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789'

  #__Kosongkan 2 baris berikut untuk mematikannya__
  titleMessage: '&b%selection%'
  subtitleMessage: '&aKetik'

math:
  enable: true
  winners: 1
  weight: 1
  points: 1
  hints:
    enable: true
    after-percent: 50
    max: 1
  countdown:
    enable: true
    last-seconds: 10

  #Jangan ubah ini
  case-sensitive: false
  #Waktu dalam detik yang dimiliki pemain untuk menebak, memecahkan, mengetik, dll.
  timeToGuess_seconds: 20
  #Rentang angka acak menurut tingkat kesulitan:
  #1 - (1-9)
  #2 - (1-99)
  #3 - (1-999)
  #4 - (1-9999)
  #5 - (1-99999)
  difficulty: 2
  #Berapa operator di setiap soal: 1 -> "12 + 7", 2 -> "12 + 7 x 3"
  operations: 1
  #solve: hitung hasilnya ("12 + 7 x 3").  missing-value: cari angka tersembunyi ("12 + ? x 3 = 33").
  #Setiap ronde memilih salah satu mode yang tercantum.
  modes:
    - solve
    - missing-value
  #Operator yang dipakai; empat yang tercantum adalah semua yang tersedia, hapus yang tidak diinginkan. Selalu sisakan minimal 1
  #Pembagian selalu menghasilkan bilangan bulat.
  operators:
    - '+'
    - '-'
    - 'x'
    - '/'

  #__Kosongkan 2 baris berikut untuk mematikannya__
  titleMessage: '&b%selection%'
  subtitleMessage: '&aHitung'

variable:
  enable: true
  winners: 1
  weight: 1
  points: 1
  countdown:
    enable: true
    last-seconds: 10

  #Jangan ubah ini
  case-sensitive: false
