#############################
######    GAME CHAT    ######
#############################
#Pengaturan yang diterima setiap game (yang tidak ada memakai nilai bawaan yang ditampilkan):
#  enable: true/false
#  weight: 1             Seberapa mungkin rotasi memilih game ini dibanding yang lain (0 = tidak pernah).
#                        Game yang sama tidak pernah berjalan dua kali berturut-turut.
#  winners: 1            Berapa pemain yang bisa menang setiap ronde.
#  points: 1             Poin per kemenangan (/chatgames top).
#  case-sensitive: false Pemain yang hanya salah huruf besar/kecil mendapat pesan 'wrong_case'.
#  timeToGuess_seconds: 20
#  min-answer-ms: 400    Jawaban benar yang lebih cepat dari ini diabaikan dan dicatat: tidak ada yang membaca dan mengetik
#                        secepat itu, bot chat bisa. 0 mematikan pemeriksaan.
#  hints:                Petunjuk muncul selama ronde, melalui 'hint_message' di messages.yml.
#    enable: false
#    after-percent: 50   Petunjuk pertama muncul setelah waktu sebanyak ini berlalu; sisanya tersebar di sisa waktu.
#    max: 1              Hingga 3.
#  countdown:            Sisa waktu di action bar. Bekerja di semua versi (1.8 sampai 26.x).
#    enable: false
#    last-seconds: 10    Hanya selama N detik terakhir; 0 menampilkannya sepanjang ronde.
#  titleMessage / subtitleMessage: kosongkan keduanya agar tidak mengirim judul.
unscramble:
  enable: true
  winners: 1
  weight: 1
  points: 1
  hints:
    enable: true
    after-percent: 50
    max: 1
  countdown:
    enable: true
    last-seconds: 10

  case-sensitive: true
  #Waktu dalam detik yang dimiliki pemain untuk menebak, memecahkan, mengetik, dll.
