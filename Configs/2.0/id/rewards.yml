#MULAI DARI SINI, HADIAH UNTUK BALAPAN YANG HANYA PUNYA 1 PEMENANG
#
#FORMAT YANG BERBEDA DIPAKAI! BACA DENGAN TELITI

races:
  rewards:
    #INI ADALAH HADIAH YANG KAMU TARUH DI 'races.yml'
    reward_1:
      chance: 50
      data:
        - '60.0%~ [consolecmd] give %player% diamond_block 5'
    #MENGHAPUS NILAI 'chance' AKAN MEMBUAT HADIAH/PERINTAH SELALU TERJADI
    reward_2:
      data:
        - '[consolecmd] give %player% iron_block 5'
        - '[playermsg] &aKamu menang!'
    reward_3:
      chance: 50
      data:
        - '[consolecmd] give %player% diamond_block 3'