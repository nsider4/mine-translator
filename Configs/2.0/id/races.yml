enable-races: true

creative-enabled: true
#Tautan berguna untuk menambah DATA:
#
#https://hub.spigotmc.org/javadocs/spigot/org/bukkit/entity/EntityType.html
#https://helpch.at/docs/1.8/index.html?org/bukkit/entity/EntityType.html
#https://hub.spigotmc.org/javadocs/bukkit/org/bukkit/Material.html
#https://helpch.at/docs/1.8/org/bukkit/Material.html

#Nama bisa baru atau lama (MOOSHROOM atau MUSHROOM_COW, COD atau RAW_FISH): dicocokkan dengan versi
#servermu. Nama yang tidak ada di versimu (mis. blok 1.21 di 1.8) dilewati, dengan catatan di konsol.
#
#Setiap balapan juga menerima (opsional):
#  points: 1     #poin yang didapat pemenang (bawaan 1)
#  weight: 1     #seberapa sering rotasi memilihnya dibanding game lain (bawaan 1, 0 = tidak pernah)
#
#Admin bisa memulai balapan dengan nilai sendiri: /chatgames <race> <material/mob> [amount]
#Tanpa jumlah, salah satu yang tercantum di bawah untuk material/mob itu dipakai. Pemenang mendapat hadiah yang tercantum
#untuk material dan jumlah itu persis, atau tidak ada jika tidak tercantum di sini (poin tetap diberikan).

hunt:
  enable: true

  timeToComplete_seconds: 180
  #__Kosongkan 2 baris berikut untuk mematikannya__
  titleMessage: '&bBERBURU'
  subtitleMessage: '&aBunuh %amount% %value%!'

  #Apakah mob yang muncul dari blok spawner atau telur spawn dihitung.
  count-spawner-mobs: true
