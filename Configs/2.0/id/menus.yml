#MENU
#
#Setiap menu di bawah 'menus:' punya 'title', ukuran dalam 'rows' (1-6), dan 'items'-nya. Kamu bisa mengubah
#fungsi tombol apa pun, menambah tombol, atau menu baru (buka dengan /chatgames menu <id>,
#atau taruh masing-masing di file sendiri di folder menus/, bernama <id>.yml).
#
#Setiap item:
#  slot: posisinya, dari 0 (kiri atas) sampai rows*9-1. 'slots: [0, 1, '9-17']' mengulanginya.
#  material: nama item apa pun dari 1.8 sampai 26.x: nama baru atau lama (lime_dye / INK_SACK:10 / 351:10),
#            atau 'head:<nama pemain, tekstur, atau URL textures.minecraft.net>'
#  name / lore: kode warna (&a, dan &#RRGGBB di 1.16+) serta placeholder PlaceholderAPI bisa dipakai.
#  amount, glow: true, enchantments: ['SHARPNESS:1'], flags: [HIDE_ATTRIBUTES], head: '%player%',
#  custom-model-data: 1001 (1.14+), item-model: 'namespace:key' (1.21.2+), color: '#FF0000' (kulit)
#  actions: apa yang dilakukan klik, berurutan. Juga left-actions, right-actions, shift-left-actions,
#           shift-right-actions, middle-actions, dan drop-actions (masing-masing kembali ke actions jika kosong).
#  view-requirements: item hanya tampil jika setiap baris terpenuhi
#  click-requirements: jika satu baris gagal, 'deny-actions' dijalankan sebagai ganti actions
#  state + when-off: jika state bernilai false, kunci when-off menggantikan kunci item itu sendiri
#                    (bukan 'off': YAML membaca off tanpa tanda kutip sebagai false)
#Hapus item untuk menyembunyikannya. 'filler' mengisi setiap slot kosong; hapus jika tidak perlu.
#
#Aksi:
#  [command] <command>        kamu menjalankan perintah    [console] <command>   konsol menjalankannya
#  [message] <text>           pesan untukmu                [broadcast] <text>    untuk semua orang
#  [sound] <sound> [volume] [pitch]   nama suara apa pun dari 1.8 sampai 26.x
#  [open] <menu> [values]     membuka menu lain            [switch] <menu> [values]  sama, tapi [back] melewatinya
#  [back] [menu]              menu sebelumnya (atau menu yang disebut, atau menutup)
#  [refresh]  [close]  [next-page]  [previous-page]  [wait] <ticks>
#  [chatgames:no-permission]  mengirim pesan tidak punya izin
#  Aksi khusus menu dijelaskan di atas menu yang memilikinya.
#
#Syarat, satu per baris (setiap baris harus terpenuhi; awali baris dengan ! untuk membaliknya):
#  permission <node>     perbandingan seperti '%chatgames_points% >= 100' (==, !=, >=, <=, >, <)
#  atau nilai true / on / yes / angka selain 0
#
#Menu yang berisi daftar (tantangan, game, acara...) menaruhnya di 'list-slots' secara berurutan,
#digambar dengan 'templates' menu. Jika entri lebih banyak dari slot, item dengan aksi
#[next-page] / [previous-page] membalik halaman; item itu tersembunyi jika tidak ada halaman lain.
#Baris lore yang hanya berisi placeholder daftar, seperti '%game_wins%', menjadi beberapa baris.
#Setiap menu juga punya %player%, %page%, %pages%, dan %entries% (jumlah entri dalam daftar).

#Nama dan ikon game, di setiap menu dan di pesan yang menyebut game (%game%).
#Game yang tidak tercantum di sini dinamai dari kuncinya.
game-names:
  unscramble: 'Susun Ulang'
  unreverse: 'Balik Kata'
  reaction: 'Reaksi'
  guess_the_number: 'Tebak Angka'
  clickable: 'Klik'
  fillout: 'Isi Kata'
  hoverable: 'Hover'
  random: 'Acak'
  math: 'Matematika'
  variable: 'Variabel'
  sequence: 'Deret'
  memorize: 'Ingat'
  word_association: 'Asosiasi Kata'
  trivia: 'Kuis'
  count: 'Hitung'
  hunt: 'Berburu'
  mine: 'Menambang'
  place: 'Membangun'
  fish: 'Memancing'
  eat: 'Makan'
  craft: 'Membuat'
  furnace: 'Memasak'
  tame: 'Menjinakkan'
  shear: 'Mencukur'
