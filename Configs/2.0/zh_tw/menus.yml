  #/chatgames debug：所有聊天遊戲（%game% %key% %icon%）。[chatgames:debug] <game> 開始一個
  #私人回合並開啟 debug-session。
  debug:
    title: '&4除錯：選擇一個遊戲'
    rows: 4
    open-requirements: ['permission chatgames.debug']
    open-deny-actions: ['[chatgames:no-permission]']
    filler:
      material: gray_stained_glass_pane
      name: ' '
    list-slots: ['10-16', '19-25']
    items:
      previous:
        slot: 30
        material: arrow
        name: '&7上一頁'
        actions: ['[previous-page]']
      next:
        slot: 32
        material: arrow
        name: '&7下一頁 &8(%page%/%pages%)'
        actions: ['[next-page]']
      back:
        slot: 27
        material: arrow
        name: '&7返回'
        actions: ['[back] admin']
      close:
        slot: 35
        material: barrier
        name: '&c關閉'
        actions: ['[close]']
    templates:
      game:
        material: '%icon%'
        name: '&c%game%'
        lore:
          - '&7生成一個私人回合。'
          - '&7沒有獎勵，不儲存任何東西。'
        actions: ['[chatgames:debug] %key%']

  #私人回合：%game% %key% %icon% %question% %answer% %time% %min_ms% %case_sensitive%
  #%winners% %points% %hints% %generated%；列表 %placeholders% 和 %answers%。
  #[chatgames:debug-answer] <correct|wrong|wrong-case> [ms] 傳送一個模擬答案（在 ms 之後）；
  #[chatgames:debug-timeout] 等待時間限制結束；[chatgames:debug-reroll] 生成新回合；
  #[chatgames:debug-end] 結束會話。
  debug-session:
    title: '&4除錯：%game%'
    rows: 5
    open-requirements: ['permission chatgames.debug']
    open-deny-actions: ['[chatgames:no-permission]']
    filler:
      material: gray_stained_glass_pane
      name: ' '
    #每個延遲一個“在 X 毫秒後正確作答”按鈕，放在 'delays' 列表格子中
    delays: [100, 500, 1000, 5000]
    lists:
      delays: ['29-32']
    items:
      question:
        slot: 11
        material: '%icon%'
        name: '&e&l題目'
        lore:
          - '&f%question%'
          - ''
          - '%placeholders%'
      answer:
        slot: 13
        material: emerald
        name: '&a&l可接受的答案'
        lore:
          - '%answers%'
      settings:
        slot: 15
        material: repeater
        name: '&f&l設定'
        lore:
          - '&7時間限制：&f%time%s'
          - '&7最短作答時間：&f%min_ms% 毫秒'
          - '&7區分大小寫：%case_sensitive%'
          - '&7贏家數：&f%winners%  &7點數：&f%points%'
          - '&7準備的提示：&f%hints%'
          - '&7生成用時：&f%generated% 毫秒'
      correct-now:
        slot: 28
        material: lime_wool
        name: '&a立即正確作答'
        lore:
          - '&7比任何人都快：展示'
          - '&7反宏檢查的效果。'
        actions: ['[chatgames:debug-answer] correct']
      wrong:
        slot: 33
        material: red_wool
        name: '&c錯誤作答'
        actions: ['[chatgames:debug-answer] wrong']
      wrong-case:
        slot: 34
        material: orange_wool
        name: '&6用錯誤的大小寫作答'
        actions: ['[chatgames:debug-answer] wrong-case']
      timeout:
        slot: 39
        material: clock
        name: '&e讓它超時'
        lore:
          - '&7等待時間限制結束，然後報告。'
        actions: ['[chatgames:debug-timeout]']
      reroll:
        slot: 41
        material: ender_pearl
        name: '&d新回合'
        actions: ['[chatgames:debug-reroll]']
      back:
        slot: 36
        material: arrow
        name: '&7返回'
        actions: ['[chatgames:debug-end]', '[back] debug']
      close:
        slot: 44
        material: barrier
        name: '&c關閉'
        actions: ['[close]']
    templates:
      correct-after:
        material: yellow_wool
        name: '&e在 %ms% 毫秒後正確作答'
        actions: ['[chatgames:debug-answer] correct %ms%']
