        lore:
          - '&7%steps% 局遊戲'
          - ''
          - '&e點選檢視誰得分最多'
        actions: ['[close]', '[command] chatgames event top %id%']

  #/chatgames admin。%current_game% %next_game% %rotation_state% %event% %preset%，
  #%rotation_on% 和 %games_on%（true 或 false）。每個按鈕執行對應的命令，
  #命令會像手動輸入一樣檢查自己的許可權。
  admin:
    title: '&4&lChatGames 管理'
    rows: 5
    open-requirements: ['permission chatgames.admin']
    open-deny-actions: ['[chatgames:no-permission]']
    filler:
      material: gray_stained_glass_pane
      name: ' '
    formats:
      none: '&7無'
    items:
      status:
        slot: 4
        material: repeater
        name: '&f&l狀態'
        lore:
          - '&7進行中：&f%current_game%'
          - '&7下一局遊戲：&f%next_game%'
          - '&7輪換：%rotation_state%'
          - '&7活動：&f%event%'
          - '&7預設：&f%preset%'
      start-game:
        slot: 19
        material: diamond_sword
        name: '&a&l開始遊戲'
        lore:
          - '&7任意遊戲或競賽，立即開始。'
        actions: ['[open] admin-start']
      global:
        slot: 20
        material: beacon
        name: '&3&l開始全服遊戲'
        lore:
          - '&7所有及時完成的人都能獲勝。'
        actions: ['[open] admin-global']
      events:
        slot: 21
        material: nether_star
        name: '&6&l活動'
        lore:
          - '&7開始或停止遊戲活動。'
        actions: ['[open] admin-events']
      presets:
        slot: 23
        material: chest
        name: '&d&l預設'
        lore:
          - '&7載入一組啟用的遊戲。'
        actions: ['[open] admin-presets']
      logs:
        slot: 24
        material: oak_sign
        name: '&f&l日誌'
        lore:
          - '&7在聊天中顯示最近的遊戲。'
        actions: ['[open] admin-logs']
      stop:
        slot: 25
        material: red_wool
        name: '&c&l停止遊戲'
        lore:
          - '&7結束正在進行的遊戲，沒有贏家。'
        actions: ['[command] chatgames stop', '[wait] 2', '[refresh]']
      toggle:
        slot: 29
        material: lime_dye
        name: '&f你的聊天遊戲：&a開啟'
        lore:
          - '&7點選為你關閉它們。'
        state: '%games_on%'
        actions: ['[command] chatgames toggle', '[refresh]']
        when-off:
          material: gray_dye
          name: '&f你的聊天遊戲：&c關閉'
          lore:
            - '&7點選為你開啟它們。'
      toggle-all:
        slot: 30
        material: lime_dye
        name: '&f遊戲輪換：&a開啟'
        lore:
          - '&7點選為所有人停止自動遊戲。'
        state: '%rotation_on%'
        #toggleAll 在全域性執行緒上完成，在 Folia 上會晚一個 tick
        actions: ['[command] chatgames toggleAll', '[wait] 2', '[refresh]']
        when-off:
          material: gray_dye
          name: '&f遊戲輪換：&c關閉'
          lore:
            - '&7點選重新開始自動遊戲。'
      reload:
        slot: 32
        material: hopper
        name: '&e&l重新載入'
        lore:
          - '&7重新載入所有配置檔案。'
        actions: ['[close]', '[command] chatgames reload']
      debug:
        slot: 33
        material: command_block
        name: '&c&l除錯'
        lore:
          - '&7私下測試任意遊戲。'
        view-requirements: ['permission chatgames.debug']
        actions: ['[open] debug']
      back:
        slot: 36
        material: arrow
        name: '&7返回'
        actions: ['[back] main']
      close:
        slot: 44
        material: barrier
        name: '&c關閉'
        actions: ['[close]']

  #每個遊戲和競賽：%game% %key%（與命令中相同） %icon%
  admin-start:
    title: '&8開始遊戲'
    rows: 6
    open-requirements: ['permission chatgames.admin']
    open-deny-actions: ['[chatgames:no-permission]']
    filler:
      material: gray_stained_glass_pane
      name: ' '
    list-slots: ['10-16', '19-25', '28-34']
    items:
      previous:
        slot: 48
        material: arrow
        name: '&7上一頁'
        actions: ['[previous-page]']
      next:
        slot: 50
        material: arrow
        name: '&7下一頁 &8(%page%/%pages%)'
        actions: ['[next-page]']
      back:
        slot: 45
        material: arrow
        name: '&7返回'
        actions: ['[back] admin']
      close:
        slot: 53
        material: barrier
        name: '&c關閉'
        actions: ['[close]']
    templates:
      game:
        material: '%icon%'
        name: '&a%game%'
        lore:
          - '&7聊天遊戲'
          - '&e點選開始'
        actions: ['[close]', '[command] chatgames %key%']
      race:
        material: '%icon%'
        name: '&6%game%'
        lore:
          - '&7競賽'
          - '&e點選開始'
        actions: ['[close]', '[command] chatgames %key%']

  #global_games.yml 中啟用的遊戲：%game% %key% %icon% %goal% %duration% %points%。
  #正在進行的那局：%global_running% %global_game% %global_goal%（例如 "500 石頭"）
  #%global_progress% %global_goal_amount% %global_percent% %global_contributors% %global_time_left%
  admin-global:
    title: '&8全服遊戲'
    rows: 5
    update-interval: 20
    open-requirements: ['permission chatgames.admin']
    open-deny-actions: ['[chatgames:no-permission]']
    filler:
      material: gray_stained_glass_pane
      name: ' '
    list-slots: ['19-25', '28-34']
    items:
      status:
        slot: 4
        material: beacon
        name: '&3&l進行中：&f%global_game%'
        lore:
          - '&7目標：&f%global_goal%'
          - '&7進度：&e%global_progress%&7/&e%global_goal_amount% &8(%global_percent%%)'
          - '&7參與的玩家：&f%global_contributors%'
          - '&7剩餘時間：&f%global_time_left%s'
          - ''
          - '&c點選停止（沒有獎勵）'
        view-requirements: ['%global_running%']
        actions: ['[command] chatgames stop', '[wait] 2', '[refresh]']
      idle:
        slot: 4
        material: gray_dye
        name: '&7沒有正在進行的全服遊戲'
        lore:
          - '&7在下面選一個開始。'
        view-requirements: ['!%global_running%']
      none:
        slot: 22
        material: barrier
        name: '&7沒有啟用任何全服遊戲'
        view-requirements: ['%entries% == 0']
      previous:
        slot: 39
        material: arrow
        name: '&7上一頁'
        actions: ['[previous-page]']
      next:
        slot: 41
        material: arrow
        name: '&7下一頁 &8(%page%/%pages%)'
        actions: ['[next-page]']
      back:
        slot: 36
        material: arrow
        name: '&7返回'
        actions: ['[back] admin']
      close:
        slot: 44
        material: barrier
        name: '&c關閉'
        actions: ['[close]']
    templates:
      game:
        material: '%icon%'
        name: '&3全服%game%'
        lore:
          - '&7目標：&f%goal% 個正確答案'
          - '&7時間：&f%duration%s'
          - '&7點數：&f%points%'
          - ''
          - '&e點選開始'
        actions: ['[close]', '[command] chatgames global %key%']
      race:
        material: '%icon%'
        name: '&3全服%game%競賽'
        lore:
          - '&7目標：一起完成 &f%goal%'
          - '&7時間：&f%duration%s'
          - '&7點數：&f%points%'
          - ''
          - '&e點選開始'
        actions: ['[close]', '[command] chatgames global %key%']
      count:
        material: '%icon%'
        name: '&3全服%game%'
        lore:
          - '&7在聊天中一起計數'
          - '&7時間：&f%duration%s'
          - '&7點數：&f%points%'
          - ''
          - '&e點選開始'
        actions: ['[close]', '[command] chatgames global %key%']

  #events.yml 中的活動：%event% %id% %steps%，正在進行的活動還有 %step%（當前進行的遊戲）
  admin-events:
    title: '&8活動'
    rows: 4
    open-requirements: ['permission chatgames.admin']
    open-deny-actions: ['[chatgames:no-permission]']
    filler:
      material: gray_stained_glass_pane
      name: ' '
    list-slots: ['10-16', '19-25']
    items:
      none:
        slot: 13
        material: barrier
        name: '&7events.yml 中沒有設定任何活動'
        view-requirements: ['%entries% == 0']
      previous:
        slot: 30
        material: arrow
        name: '&7上一頁'
        actions: ['[previous-page]']
      next:
        slot: 32
        material: arrow
        name: '&7下一頁 &8(%page%/%pages%)'
        actions: ['[next-page]']
      back:
        slot: 27
        material: arrow
        name: '&7返回'
        actions: ['[back] admin']
      close:
        slot: 35
        material: barrier
        name: '&c關閉'
        actions: ['[close]']
    templates:
      event:
        material: nether_star
        name: '%event%'
        lore:
          - '&7%steps% 局遊戲'
          - ''
          - '&e點選開始'
        actions: ['[command] chatgames event start %id%', '[wait] 2', '[refresh]']
      running:
        material: nether_star
        glow: true
        name: '%event% &a（進行中）'
        lore:
          - '&7第 %step% 局，共 %steps% 局'
          - ''
          - '&c點選停止'
        actions: ['[command] chatgames event stop', '[wait] 2', '[refresh]']

  #預設以及 'none'（games.yml 中的啟用開關）：%preset% %games%
  admin-presets:
    title: '&8預設'
    rows: 4
    open-requirements: ['permission chatgames.admin']
    open-deny-actions: ['[chatgames:no-permission]']
    filler:
      material: gray_stained_glass_pane
      name: ' '
    list-slots: ['10-16', '19-25']
    items:
      previous:
        slot: 30
        material: arrow
        name: '&7上一頁'
        actions: ['[previous-page]']
      next:
        slot: 32
        material: arrow
        name: '&7下一頁 &8(%page%/%pages%)'
        actions: ['[next-page]']
      back:
        slot: 27
        material: arrow
        name: '&7返回'
        actions: ['[back] admin']
      close:
        slot: 35
        material: barrier
        name: '&c關閉'
        actions: ['[close]']
    templates:
      preset:
        material: chest
        name: '&d%preset%'
        lore:
          - '&7遊戲：&f%games%'
          - ''
          - '&e點選載入'
        actions: ['[command] chatgames preset load %preset%', '[wait] 2', '[refresh]']
      active:
        material: ender_chest
        glow: true
        name: '&d%preset% &a（使用中）'
        lore:
          - '&7遊戲：&f%games%'

  #完全在這裡構建：可以隨意新增或修改數量
  admin-logs:
    title: '&8日誌'
    rows: 3
    open-requirements: ['permission chatgames.admin']
    open-deny-actions: ['[chatgames:no-permission]']
    filler:
      material: gray_stained_glass_pane
      name: ' '
    items:
      last-10:
        slot: 11
        material: paper
        name: '&f最近 &e10 &f局遊戲'
        lore: ['&e點選在聊天中顯示']
        actions: ['[close]', '[command] chatgames logs 10']
      last-25:
        slot: 12
        material: paper
        name: '&f最近 &e25 &f局遊戲'
        lore: ['&e點選在聊天中顯示']
        actions: ['[close]', '[command] chatgames logs 25']
      last-50:
        slot: 14
        material: paper
        name: '&f最近 &e50 &f局遊戲'
        lore: ['&e點選在聊天中顯示']
        actions: ['[close]', '[command] chatgames logs 50']
      last-100:
        slot: 15
        material: paper
        name: '&f最近 &e100 &f局遊戲'
        lore: ['&e點選在聊天中顯示']
