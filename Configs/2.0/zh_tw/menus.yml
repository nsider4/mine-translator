      next:
        slot: 32
        material: arrow
        name: '&7下一頁 &8(%page%/%pages%)'
        actions: ['[next-page]']
      back:
        slot: 27
        material: arrow
        name: '&7返回'
        actions: ['[back] leaderboards']
      close:
        slot: 35
        material: barrier
        name: '&c關閉'
        actions: ['[close]']
    templates:
      event:
        material: nether_star
