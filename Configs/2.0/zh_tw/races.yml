enable-races: true

creative-enabled: true
#新增資料時有用的連結：
#
#https://hub.spigotmc.org/javadocs/spigot/org/bukkit/entity/EntityType.html
#https://helpch.at/docs/1.8/index.html?org/bukkit/entity/EntityType.html
#https://hub.spigotmc.org/javadocs/bukkit/org/bukkit/Material.html
#https://helpch.at/docs/1.8/org/bukkit/Material.html

#名稱可以是新名或舊名（MOOSHROOM 或 MUSHROOM_COW，COD 或 RAW_FISH）：它們會匹配你伺服器的
#版本。你的版本中不存在的名稱（例如 1.8 上的 1.21 方塊）會被跳過，並在控制檯提示。
#
#每個競賽還可以設定（可選）：
#  points: 1     #贏家獲得的點數（預設 1）
#  weight: 1     #與其他遊戲相比，輪換選中它的頻率（預設 1，0 = 從不）
#
#管理員可以用自己的值開始競賽：/chatgames <race> <material/mob> [amount]
#沒有指定數量時，使用下面為該材料/生物列出的數量。贏家會獲得為
#這個材料和數量列出的獎勵，如果這裡沒有列出則沒有獎勵（點數照常發放）。

hunt:
  enable: true

  timeToComplete_seconds: 180
  #__將以下 2 項留空即可禁用__
  titleMessage: '&b狩獵'
  subtitleMessage: '&a擊殺 %amount% 個 %value%！'

  #是否計算由生怪磚或生怪蛋生成的生物。
  count-spawner-mobs: true
  #MythicMobs 生物是否也算作它們所基於的生物（MythicMobs 殭屍算作 ZOMBIE）。
  count-mythic-mobs: true

  data:
    #這些值必須是有效的 Minecraft 生物 ID（見檔案開頭的有用連結）
    #安裝 MythicMobs 後，mythic:<mob type> 表示它的一個生物（示例在這個列表的末尾）
    ZOMBIE:
      3:
        #你新增的所有獎勵的機率之和不能超過 100%
        rewards:
          - reward_2
      5:
        rewards:
          - reward_1

    CREEPER:
      3:
        rewards:
          - reward_2
      5:
        rewards:
          - reward_1
    SKELETON:
      3:
        rewards:
          - reward_2
      5:
        rewards:
          - reward_1
    SPIDER:
