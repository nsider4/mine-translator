#從這裡開始是競賽的獎勵，競賽只有 1 名贏家
#
#使用的是不同的格式！請仔細閱讀

races:
  rewards:
    #這些是你在 'races.yml' 中填寫的獎勵
    reward_1:
      chance: 50
      data:
        - '60.0%~ [consolecmd] give %player% diamond_block 5'
    #刪除 'chance' 值會讓獎勵/命令總是執行
    reward_2:
      data:
        - '[consolecmd] give %player% iron_block 5'
        - '[playermsg] &a你贏了！'
    reward_3:
      chance: 50
      data:
        - '[consolecmd] give %player% diamond_block 3'