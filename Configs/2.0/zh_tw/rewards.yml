#可用操作：
#
#[playercmd] - 以贏家身份執行命令
#[consolecmd] - 從控制檯執行命令
#[playermsg] - 給贏家傳送訊息
#[broadcast] - 向已啟用世界中的所有玩家廣播訊息
#[player_as_op] - 以 OP 身份為玩家執行命令
#
#按以下方式為獎勵新增機率：
#
#示例：
#  - '10.0%~ [consolecmd] give %player% iron_block 5'
#只有格式與示例相同時才有效：<chance>% 寫在開頭，後面跟一個 ~ 和一個空格。總是放在命令的最前面
#
#沒有 % 的命令是 100% 發放的獎勵。

#許可權檢查：
#
#寫在命令列的末尾。
#示例：
#  - '[consolecmd] give %player% iron_block 5 has:test.permission'

#1 表示第一名贏家，如果你在 config.yml 中增加了贏家數並想要不同的獎勵，請新增他們的名次（2: 等）
unscramble:
  rewards:
    1:
      reward_1:
        minimum-players: 2 #基於線上玩家數的條件，只有線上玩家達到 2 名或以上時才能選中此獎勵
        chance: 50
        data:
          - '10.0%~ [consolecmd] give %player% diamond_block 3 has:test.permission'
          - '[consolecmd] give %player% iron_block 5'
      reward_2:
        data:
          - '[consolecmd] give %player% iron_block 2'

