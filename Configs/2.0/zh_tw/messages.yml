help_command:
  - '&7&m-------------------------------------------------'
  - '&e&l-ChatGames-'
  - '&6'
  - '&6&l命令：'
  - '&6'
  - '&a/chatgames menu [menu] &f- &3開啟選單：個人資料、挑戰、連續記錄、排行榜（或 menus.yml 中的任意選單）。'
  - '&a/chatgames profile [player] &f- &3顯示你的（或其他玩家的）統計。'
  - '&a/chatgames top &f- &3顯示點數最多的前 10 名玩家。'
  - '&a/chatgames fastest [game] &f- &3顯示總體或某個遊戲的最快贏家。'
  - '&a/chatgames points [player] &f- &3顯示你的（或其他玩家的）點數。'
  - '&a/chatgames challenges &f- &3顯示你的每日和每週挑戰。'
  - '&a/chatgames streaks &f- &3顯示你的連續記錄。'
  - '&a/chatgames claim &f- &3領取已完成的挑戰和連續記錄獎勵。'
  - '&a/chatgames event [list|top <event>] &f- &3顯示遊戲活動，或某個活動中得分最多的玩家。'
  - '&a/chatgames toggle [player] &f- &3為你開啟或關閉聊天遊戲。'
  - '&a/chatgames togglesound [player] &f- &3開啟或關閉聊天遊戲聲音。'
  - '&6'
  - '&c&l管理員：'
  - '&a/chatgames admin &f- &3開啟管理選單。'
  - '&a/chatgames debug &f- &3開啟除錯選單：私下測試任意遊戲，沒有獎勵。'
  - '&a/chatgames (game) [values] &f- &3立即開始該遊戲，可以使用你自己的單詞/數值。'
  - '&a/chatgames any &f- &3開始輪換接下來會選的遊戲。'
  - '&a/chatgames global <game> [values] &f- &3開始一局全服遊戲：所有及時作答的人都能獲勝。'
  - '&a/chatgames event start <event> | stop &f- &3開始或停止遊戲活動。'
  - '&a/chatgames stop &f- &3結束正在進行的遊戲，沒有贏家。'
  - '&a/chatgames toggleAll &f- &3開啟或關閉自動遊戲輪換。'
  - '&a/chatgames preset <list|load|save> [name] &f- &3管理遊戲預設。'
  - '&a/chatgames +points|-points|setpoints <player> <amount> &f- &3修改玩家的點數。'
  - '&a/chatgames remove <player> &f- &3刪除玩家的資料。'
  - '&a/chatgames challenges reset <player> &f- &3清除玩家的挑戰進度。'
  - '&a/chatgames streak set <player> <challenge|daily|global> <days> &f- &3設定玩家的連續記錄。'
  - '&a/chatgames logs [amount] &f- &3顯示最近的遊戲日誌。'
  - '&a/chatgames discord <test <message|all>|leaderboard> &f- &3向 Discord 傳送測試訊息或排行榜。'
  - '&a/chatgames reload &f- &3重新載入配置檔案。'
  - '&6'
  - '&2&l遊戲型別：'
  - '&5unscramble, unreverse, reaction, random, fillout, variable, clickable, math, sequence, memorize, guess_the_number, trivia, word_association, hoverable, hunt, mine, place, fish, craft, eat, furnace, tame, shear'
  - '&7&m-------------------------------------------------'

