#############################
######    聊天遊戲    ######
#############################
#每個遊戲都支援的設定（缺少的項使用所示的預設值）：
#  enable: true/false
#  weight: 1             與其他遊戲相比，輪換選中此遊戲的可能性（0 = 從不）。
#                        同一個遊戲不會連續進行兩次。
#  winners: 1            每局可以有多少名玩家獲勝。
#  points: 1             每次獲勝的點數（/chatgames top）。
#  case-sensitive: false 只有大小寫不對的玩家會收到 'wrong_case' 訊息。
#  timeToGuess_seconds: 20
#  min-answer-ms: 400    比這更快的正確答案會被忽略並記錄：沒有人能讀得
#                        這麼快又打得這麼快，只有聊天機器人可以。設為 0 關閉此檢查。
#  hints:                回合進行中會出現提示，使用 messages.yml 中的 'hint_message'。
#    enable: false
#    after-percent: 50   時間過去這麼多時顯示第一個提示；其餘提示分佈在剩餘時間裡。
#    max: 1              最多 3 個。
#  countdown:            剩餘時間，顯示在動作列上。所有版本都可用（1.8 到 26.x）。
#    enable: false
#    last-seconds: 10    只在最後 N 秒顯示；0 表示整局都顯示。
#  titleMessage / subtitleMessage：兩者都留空則不傳送標題。
unscramble:
  enable: true
  winners: 1
  weight: 1
  points: 1
  hints:
    enable: true
    after-percent: 50
    max: 1
  countdown:
    enable: true
    last-seconds: 10

  case-sensitive: true
  #玩家猜測、解答、輸入等的時間，單位為秒。
  timeToGuess_seconds: 20
  #__將以下 2 項留空即可禁用__
  titleMessage: '&b%selection%'
  subtitleMessage: '&a還原單詞'

