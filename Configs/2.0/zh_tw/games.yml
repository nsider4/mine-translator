#在這個遊戲中，會生成指定長度的隨機字元
random:
  enable: true
  winners: 1
  weight: 1
  points: 1
  countdown:
    enable: true
    last-seconds: 10

  case-sensitive: true
  #玩家猜測、解答、輸入等的時間，單位為秒。
  timeToGuess_seconds: 20
  #此遊戲隨機生成的字串長度。範圍格式 <lower>-<higher>。如果只想要一個長度，兩邊填相同的數字
  lengthRange: 6-8
  #可用型別：ALPHA（字母）、ALPHANUMERIC（字母和數字）、NUMERIC（數字）、SYMBOLIC（符號）、
  #LOWERCASE_ALPHA（全部小寫字母）、UPPERCASE_ALPHA（全部大寫字母）、HEXADECIMAL（十六進位制字元：0123456789ABCDEF）
  #CUSTOM（使用 'custom_characters' 中的內容）
  character_type: ALPHANUMERIC
  #只有當 type 為 "CUSTOM" 時才會使用這一行
  custom_characters: 'abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789'

  #__將以下 2 項留空即可禁用__
  titleMessage: '&b%selection%'
  subtitleMessage: '&a輸入'

math:
  enable: true
  winners: 1
  weight: 1
  points: 1
  hints:
    enable: true
    after-percent: 50
    max: 1
  countdown:
    enable: true
    last-seconds: 10

  #不要修改此項
  case-sensitive: false
  #玩家猜測、解答、輸入等的時間，單位為秒。
  timeToGuess_seconds: 20
  #難度對應的隨機數範圍：
  #1 - (1-9)
  #2 - (1-99)
  #3 - (1-999)
  #4 - (1-9999)
  #5 - (1-99999)
  difficulty: 2
  #每道題有幾個運算子：1 -> "12 + 7"，2 -> "12 + 7 x 3"
  operations: 1
  #solve：算出結果（"12 + 7 x 3"）。  missing-value：找出被隱藏的數（"12 + ? x 3 = 33"）。
  #每局從列出的模式中選一個。
  modes:
    - solve
    - missing-value
  #要使用的運算子，列出的四個是全部可用的，不想全用可以刪掉一些。至少保留 1 個
  #除法結果總是整數。
  operators:
    - '+'
    - '-'
    - 'x'
    - '/'

  #__將以下 2 項留空即可禁用__
  titleMessage: '&b%selection%'
  subtitleMessage: '&a計算'

variable:
  enable: true
  winners: 1
  weight: 1
  points: 1
  countdown:
    enable: true
    last-seconds: 10

  #不要修改此項
  case-sensitive: false
  #玩家猜測、解答、輸入等的時間，單位為秒。
  timeToGuess_seconds: 20

  #__將以下 2 項留空即可禁用__
  titleMessage: '&b求解'
  subtitleMessage: '&a求 &7`&b%symbol%&7`'

  #隨機結果數的範圍
  result-min: 20
  result-max: 100

  toGet: '✗'
  #這裡還有一些可以新增的符號：✪❃✿✠❂♫♪❦♡♤♢✦☾☽✹
  data:
    - '✯;10'
    - '♛;15'
    - '❅;20'
    - '♫;25'

sequence:
  enable: true
  winners: 1
  weight: 1
  points: 1
  hints:
    enable: true
    after-percent: 50
    max: 1
  countdown:
    enable: true
    last-seconds: 10

  #不要修改此項
  case-sensitive: false

  #玩家猜測、解答、輸入等的時間，單位為秒。
  timeToGuess_seconds: 25

  #玩家看到一個數列，輸入下一個數，例如 "3, 6, 12, 24, ?" -> 48
  #規律：加法（3, 7, 11）、乘法（2, 6, 18）、平方（4, 9, 16）、交替（5, 9, 7, 11）、斐波那契（2, 3, 5, 8）
  patterns:
    - add
    - multiply
    - squares
    - alternating
    - fibonacci
  #1-3。難度越高，規律越難（平方和交替從 2 開始，斐波那契為 3），數字也越大。
  difficulty: 2
  #在 '?' 之前顯示幾個數（4-8）
  shown-terms: 5

  #__將以下 2 項留空即可禁用__
  titleMessage: '&b%selection%'
  subtitleMessage: '&a補全數列'

memorize:
  enable: true
  winners: 1
  weight: 1
  points: 1
  hints:
    enable: true
    after-percent: 50
    max: 1
  countdown:
    enable: true
    last-seconds: 10

  case-sensitive: false

  listLength: 3
  #每局從以下某個池中取物品（見 words.yml -> memorize.pools）：
  #shopping_list、words、colors、numbers、blocks、mobs，或你自己的列表
  pools:
    - shopping_list
    - words
    - colors
    - numbers
    - blocks
    - mobs
  #如果為 false，物品可以按任意順序輸入
  order-matters: true

  #玩家記憶、解答、輸入等的時間，單位為秒。
  timeToMemorize: 7

  #玩家猜測、解答、輸入等的時間，單位為秒。
  timeToGuess_seconds: 20
  #將以下 2 項留空即可禁用
  titleMessage: '&b記憶'
  subtitleMessage: '&a試著記住這個列表！'

#三條線索，一個隱藏的關聯（關聯詞在 words.yml 中）。
#difficulty：easy、medium、hard 或 mixed。困難回合先顯示一條線索，其他線索
#作為提示出現，所以困難回合請保持提示開啟（max 2 會顯示全部三條線索）。
word_association:
  enable: true
  winners: 1
  weight: 1
  points: 1
  difficulty: mixed
  hints:
    enable: true
    after-percent: 34
    max: 2
  countdown:
