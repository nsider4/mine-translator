#Impostazioni accettate da ogni gioco (se ne manca una si usa il valore mostrato):
#  enable: true/false
#  weight: 1             Quanto è probabile che la rotazione scelga questo gioco rispetto agli altri (0 = mai).
#                        Lo stesso gioco non viene mai giocato due volte di fila.
#  winners: 1            Quanti giocatori possono vincere ogni round.
#  points: 1             Punti per vittoria (/chatgames top).
#  case-sensitive: false Chi indovina tutto tranne le maiuscole riceve il messaggio 'wrong_case'.
#  timeToGuess_seconds: 20
#  min-answer-ms: 400    Le risposte giuste più veloci di così vengono ignorate e registrate: nessuno legge e scrive
#                        così in fretta, i bot sì. 0 disattiva il controllo.
#  hints:                Indizi che compaiono durante il round, con 'hint_message' di messages.yml.
#    enable: false
#    after-percent: 50   Il primo indizio compare dopo questa percentuale del tempo; gli altri si distribuiscono nel resto.
#    max: 1              Fino a 3.
#  countdown:            Tempo rimasto, nella barra delle azioni. Funziona su tutte le versioni (da 1.8 a 26.x).
#    enable: false
#    last-seconds: 10    Solo negli ultimi N secondi; 0 lo mostra per tutto il round.
#  titleMessage / subtitleMessage: lasciali entrambi vuoti per non inviare alcun titolo.
unscramble:
  enable: true
  winners: 1
  weight: 1
  points: 1
  hints:
    enable: true
    after-percent: 50
    max: 1
  countdown:
    enable: true
    last-seconds: 10

  case-sensitive: true
  #Il tempo in secondi che i giocatori hanno per indovinare, risolvere, scrivere, ecc.
  timeToGuess_seconds: 20
  #__Lascia vuoti i 2 seguenti per disattivarli__
  titleMessage: '&b%selection%'
  subtitleMessage: '&aRiordina'

