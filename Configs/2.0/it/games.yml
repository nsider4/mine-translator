#In questo gioco viene creata una stringa della lunghezza indicata con caratteri casuali
random:
  enable: true
  winners: 1
  weight: 1
  points: 1
  countdown:
    enable: true
    last-seconds: 10

  case-sensitive: true
  #Il tempo in secondi che i giocatori hanno per indovinare, risolvere, scrivere, ecc.
  timeToGuess_seconds: 20
  #La lunghezza della stringa casuale di questo gioco. Formato intervallo <min>-<max>. Per una sola lunghezza usa lo stesso numero da entrambi i lati
  lengthRange: 6-8
  #Tipi disponibili: ALPHA (lettere), ALPHANUMERIC (lettere e numeri), NUMERIC (numeri), SYMBOLIC (simboli),
  #LOWERCASE_ALPHA (tutto minuscolo), UPPERCASE_ALPHA (tutto maiuscolo), HEXADECIMAL (caratteri esadecimali: 0123456789ABCDEF)
  #CUSTOM (usa ciò che c'è in 'custom_characters')
  character_type: ALPHANUMERIC
  #Questa riga si usa solo se il tipo è "CUSTOM"
  custom_characters: 'abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789'

  #__Lascia vuoti i 2 seguenti per disattivarli__
  titleMessage: '&b%selection%'
  subtitleMessage: '&aScrivi'

math:
  enable: true
  winners: 1
  weight: 1
  points: 1
  hints:
    enable: true
    after-percent: 50
    max: 1
  countdown:
    enable: true
    last-seconds: 10

  #Non cambiare questo
  case-sensitive: false
  #Il tempo in secondi che i giocatori hanno per indovinare, risolvere, scrivere, ecc.
  timeToGuess_seconds: 20
  #Intervalli dei numeri casuali per difficoltà:
  #1 - (1-9)
  #2 - (1-99)
  #3 - (1-999)
  #4 - (1-9999)
  #5 - (1-99999)
  difficulty: 2
  #Quanti operatori ha ogni domanda: 1 -> "12 + 7", 2 -> "12 + 7 x 3"
  operations: 1
  #solve: calcolare il risultato ("12 + 7 x 3").  missing-value: trovare il numero nascosto ("12 + ? x 3 = 33").
  #Ogni round sceglie una delle modalità elencate.
  modes:
    - solve
    - missing-value
  #Operatori da usare; i quattro elencati sono quelli disponibili, togli quelli che non vuoi. Lasciane sempre almeno 1
  #Le divisioni danno sempre numeri interi.
  operators:
    - '+'
    - '-'
    - 'x'
    - '/'

  #__Lascia vuoti i 2 seguenti per disattivarli__
  titleMessage: '&b%selection%'
  subtitleMessage: '&aRisolvi'

variable:
  enable: true
  winners: 1
  weight: 1
  points: 1
  countdown:
    enable: true
    last-seconds: 10

  #Non cambiare questo
  case-sensitive: false
  #Il tempo in secondi che i giocatori hanno per indovinare, risolvere, scrivere, ecc.
  timeToGuess_seconds: 20

  #__Lascia vuoti i 2 seguenti per disattivarli__
  titleMessage: '&bRISOLVI'
  subtitleMessage: '&aPer &7`&b%symbol%&7`'

  #L'intervallo del numero risultato casuale
  result-min: 20
  result-max: 100

  toGet: '✗'
  #Altri simboli che puoi aggiungere: ✪❃✿✠❂♫♪❦♡♤♢✦☾☽✹
  data:
    - '✯;10'
    - '♛;15'
    - '❅;20'
    - '♫;25'

sequence:
  enable: true
  winners: 1
  weight: 1
  points: 1
  hints:
    enable: true
    after-percent: 50
    max: 1
  countdown:
    enable: true
    last-seconds: 10

  #Non cambiare questo
  case-sensitive: false

  #Il tempo in secondi che i giocatori hanno per indovinare, risolvere, scrivere, ecc.
  timeToGuess_seconds: 25

  #I giocatori vedono una sequenza di numeri e scrivono il successivo, es. "3, 6, 12, 24, ?" -> 48
  #Schemi: somma (3, 7, 11), moltiplicazione (2, 6, 18), quadrati (4, 9, 16), alternati (5, 9, 7, 11), fibonacci (2, 3, 5, 8)
  patterns:
    - add
    - multiply
    - squares
    - alternating
    - fibonacci
  #1-3. Una difficoltà più alta permette schemi più difficili (quadrati e alternati da 2, fibonacci a 3) e numeri più grandi.
  difficulty: 2
  #Quanti numeri vengono mostrati prima del '?' (4-8)
  shown-terms: 5

  #__Lascia vuoti i 2 seguenti per disattivarli__
  titleMessage: '&b%selection%'
  subtitleMessage: '&aCompleta la sequenza'

memorize:
  enable: true
  winners: 1
  weight: 1
  points: 1
  hints:
    enable: true
    after-percent: 50
    max: 1
  countdown:
    enable: true
    last-seconds: 10

  case-sensitive: false

  listLength: 3
  #Ogni round prende gli elementi da una di queste liste (vedi words.yml -> memorize.pools):
  #shopping_list, words, colors, numbers, blocks, mobs, o una lista tua
  pools:
    - shopping_list
    - words
    - colors
    - numbers
    - blocks
    - mobs
  #Se false, gli elementi si possono scrivere in qualsiasi ordine
  order-matters: true

  #Il tempo in secondi che i giocatori hanno per memorizzare, risolvere, scrivere, ecc.
  timeToMemorize: 7

  #Il tempo in secondi che i giocatori hanno per indovinare, risolvere, scrivere, ecc.
  timeToGuess_seconds: 20
  #Lascia vuoti i 2 seguenti per disattivarli
  titleMessage: '&bMemorizza'
  subtitleMessage: '&aProva a ricordare questa lista!'

