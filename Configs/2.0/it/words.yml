#Associazione di parole: tre indizi, un collegamento nascosto. La prima risposta è quella mostrata;
#anche le altre sono accettate. Quelle difficili mostrano un indizio alla volta (come suggerimenti).
word_association:
  data:
    nether_portal:
      difficulty: easy
      clues: ['Ossidiana', 'Acciarino', 'Viola']
      answers: ['Portale del Nether', 'portale']
