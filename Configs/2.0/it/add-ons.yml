#Le impostazioni di Discord sono in discord.yml.

#Il file dove verranno salvati i log
log-file: 'game_log.txt'

#Se true, registra tutti gli eventi in chat nella console; le due cose possono avvenire insieme
log-console: true

#Se true, registra tutti gli eventi in chat in un file; le due cose possono avvenire insieme
log-local: true