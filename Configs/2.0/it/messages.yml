help_command:
  - '&7&m-------------------------------------------------'
  - '&e&l-ChatGames-'
  - '&6'
  - '&6&lCOMANDI:'
  - '&6'
  - '&a/chatgames menu [menu] &f- &3Apre il menu: profilo, sfide, serie, classifiche (o qualsiasi menu di menus.yml).'
  - '&a/chatgames profile [player] &f- &3Mostra le tue statistiche (o quelle di un altro giocatore).'
  - '&a/chatgames top &f- &3Mostra i 10 giocatori con più punti.'
  - '&a/chatgames fastest [game] &f- &3Mostra i vincitori più veloci, in generale o per un gioco.'
  - '&a/chatgames points [player] &f- &3Mostra i tuoi punti (o quelli di un altro giocatore).'
  - '&a/chatgames challenges &f- &3Mostra le tue sfide giornaliere e settimanali.'
  - '&a/chatgames streaks &f- &3Mostra le tue serie.'
  - '&a/chatgames claim &f- &3Riscatta le sfide completate e le ricompense delle serie.'
  - '&a/chatgames event [list|top <event>] &f- &3Mostra gli eventi di giochi, o chi ha segnato di più in uno.'
  - '&a/chatgames toggle [player] &f- &3Attiva o disattiva i giochi in chat per te.'
  - '&a/chatgames togglesound [player] &f- &3Attiva o disattiva i suoni dei giochi.'
  - '&6'
  - '&c&lADMIN:'
  - '&a/chatgames admin &f- &3Apre il menu di amministrazione.'
  - '&a/chatgames debug &f- &3Apre il menu di debug: prova qualsiasi gioco in privato, senza ricompense.'
  - '&a/chatgames (game) [values] &f- &3Avvia subito quel gioco, eventualmente con la tua parola/i tuoi valori.'
  - '&a/chatgames any &f- &3Avvia il gioco che la rotazione sceglierebbe dopo.'
  - '&a/chatgames global <game> [values] &f- &3Avvia un gioco globale: vince chiunque risponda in tempo.'
  - '&a/chatgames event start <event> | stop &f- &3Avvia o ferma un evento di giochi.'
  - '&a/chatgames stop &f- &3Termina il gioco in corso senza vincitori.'
  - '&a/chatgames toggleAll &f- &3Attiva o disattiva la rotazione automatica dei giochi.'
  - '&a/chatgames preset <list|load|save> [name] &f- &3Gestisce i preset di giochi.'
  - '&a/chatgames +points|-points|setpoints <player> <amount> &f- &3Cambia i punti di un giocatore.'
  - '&a/chatgames remove <player> &f- &3Elimina i dati di un giocatore.'
  - '&a/chatgames challenges reset <player> &f- &3Azzera i progressi delle sfide di un giocatore.'
  - '&a/chatgames streak set <player> <challenge|daily|global> <days> &f- &3Imposta la serie di un giocatore.'
  - '&a/chatgames logs [amount] &f- &3Mostra gli ultimi log dei giochi.'
  - '&a/chatgames discord <test <message|all>|leaderboard> &f- &3Invia un messaggio di prova o la classifica su Discord.'
  - '&a/chatgames reload &f- &3Ricarica i file di configurazione.'
  - '&6'
  - '&2&lTIPI DI GIOCO:'
  - '&5unscramble, unreverse, reaction, random, fillout, variable, clickable, math, sequence, memorize, guess_the_number, trivia, word_association, hoverable, hunt, mine, place, fish, craft, eat, furnace, tame, shear'
  - '&7&m-------------------------------------------------'

