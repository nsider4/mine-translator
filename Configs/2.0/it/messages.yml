  hoverText: '&eClicca qui!'

  gameStartAnnouncement:
    - ''
    - '<center>&r✓ ✯ %prefix%&r ✯ ✓'
    - ''
    - '<center>&fHai &e%timeToGuess% secondi &fper &dcliccare&f il testo:'
    - ''
    - '<center>&b%clickableText%'
    - ''
  #USE %winner_
  correct_message:
    - ''
    - '<center>&r✓ ✯ %prefix% &r✯ ✓'
    - ''
    - '<center>&a%winner_1% &7è stato il più veloce a cliccare il testo (&c%time_1%s&7) e vince un premio!'
    - ''
  time_expired_message:
    - ''
    - '<center>&r✓ ✯ %prefix%&r ✯ ✓'
    - ''
    - '<center>&f%timeToGuess%s &cscaduti! &fIl gioco del clic è finito!'
    - ''

fillout:
  gameStartAnnouncement:
    - ''
    - '<center>&r✓ ✯ %prefix%&r ✯ ✓'
    - ''
    - '<center>&fHai &e%timeToGuess% secondi &fper &dcompletare&f la parola: `&b%selection%&f`'
    - ''
