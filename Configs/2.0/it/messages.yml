#GARE
#Per ora le gare non supportano più vincitori, perché non ne vedo il motivo: sono 'gare' o 'sfide tra giocatori' che deve vincere il primo.

#%value% è il materiale o la creatura, %amount% la quantità, %timeToComplete% il tempo limite in secondi.
#In correct_message: %winner%, %winner_displayname%, %time% (secondi) e %points% (i punti del vincitore).

