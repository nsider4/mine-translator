enable-races: true

creative-enabled: true
#Link utili per aggiungere DATI:
#
#https://hub.spigotmc.org/javadocs/spigot/org/bukkit/entity/EntityType.html
#https://helpch.at/docs/1.8/index.html?org/bukkit/entity/EntityType.html
#https://hub.spigotmc.org/javadocs/bukkit/org/bukkit/Material.html
#https://helpch.at/docs/1.8/org/bukkit/Material.html

#I nomi possono essere moderni o vecchi (MOOSHROOM o MUSHROOM_COW, COD o RAW_FISH): vengono adattati alla versione del tuo
#server. I nomi che non esistono nella tua versione (es. un blocco della 1.21 sulla 1.8) vengono saltati, con una nota in console.
#
#Ogni gara accetta anche (facoltativo):
#  points: 1     #punti che riceve il vincitore (predefinito 1)
#  weight: 1     #quanto spesso la rotazione la sceglie rispetto agli altri giochi (predefinito 1, 0 = mai)
#
#Gli admin possono avviare una gara con valori propri: /chatgames <race> <material/mob> [amount]
#Senza quantità, si usa una di quelle elencate sotto per quel materiale/quella creatura. Il vincitore riceve le ricompense elencate
#per esattamente quel materiale e quella quantità, o nessuna se non sono elencati qui (i punti vengono dati comunque).

hunt:
  enable: true

  timeToComplete_seconds: 180
  #__Lascia vuoti i 2 seguenti per disattivarli__
  titleMessage: '&bCACCIA'
  subtitleMessage: '&aUccidi %amount% %value%!'

  #Se contare le creature generate da generatori o uova generatrici.
