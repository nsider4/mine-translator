#DA QUI IN POI CI SONO LE RICOMPENSE DELLE GARE, CHE HANNO SOLO 1 VINCITORE
#
#SI USA UN FORMATO DIVERSO! LEGGI CON ATTENZIONE

races:
  rewards:
    #QUESTE SONO LE RICOMPENSE CHE METTI IN 'races.yml'
    reward_1:
      chance: 50
      data:
        - '60.0%~ [consolecmd] give %player% diamond_block 5'
    #TOGLIERE IL VALORE 'chance' FA SÌ CHE LA RICOMPENSA/IL COMANDO AVVENGA SEMPRE
    reward_2:
      data:
        - '[consolecmd] give %player% iron_block 5'
        - '[playermsg] &aHai vinto!'
    reward_3:
      chance: 50
      data:
        - '[consolecmd] give %player% diamond_block 3'