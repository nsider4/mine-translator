#AZIONI POSSIBILI:
#
#[playercmd] - Esegue il comando come il vincitore
#[consolecmd] - Esegue il comando dalla console
#[playermsg] - Invia un messaggio al vincitore
#[broadcast] - Invia un messaggio a tutti i giocatori nei mondi attivi
#[player_as_op] - Esegue un comando come op per il giocatore
#
#AGGIUNGI PROBABILITÀ ALLE RICOMPENSE COSÌ:
#
#ESEMPIO:
#  - '10.0%~ [consolecmd] give %player% iron_block 5'
#FUNZIONA SOLO SE IL FORMATO È UGUALE ALL'ESEMPIO, CON IL <chance>% ALL'INIZIO SEGUITO DA UN ~ E UNO SPAZIO. SEMPRE PER PRIMO NEL COMANDO
#
#I COMANDI SENZA NESSUN % SONO RICOMPENSE DATE AL 100%.

#CONTROLLO DEI PERMESSI:
#
#METTILO ALLA FINE DELLA RIGA DEL COMANDO.
#Esempio:
#  - '[consolecmd] give %player% iron_block 5 has:test.permission'

#L'1 è per il PRIMO vincitore; SE AGGIUNGI PIÙ VINCITORI IN config.yml E VUOI RICOMPENSE DIVERSE AGGIUNGI LA LORO POSIZIONE (2:, ecc.)
unscramble:
  rewards:
    1:
      reward_1:
        minimum-players: 2 #Condizione in base ai giocatori online: la ricompensa può uscire solo se ci sono 2 o più giocatori online
        chance: 50
        data:
          - '10.0%~ [consolecmd] give %player% diamond_block 3 has:test.permission'
          - '[consolecmd] give %player% iron_block 5'
      reward_2:
        data:
          - '[consolecmd] give %player% iron_block 2'

