enable-races: true

creative-enabled: true
#Nützliche Links zum Hinzufügen von DATEN:
#
#https://hub.spigotmc.org/javadocs/spigot/org/bukkit/entity/EntityType.html
#https://helpch.at/docs/1.8/index.html?org/bukkit/entity/EntityType.html
#https://hub.spigotmc.org/javadocs/bukkit/org/bukkit/Material.html
#https://helpch.at/docs/1.8/org/bukkit/Material.html

#Namen können modern oder alt sein (MOOSHROOM oder MUSHROOM_COW, COD oder RAW_FISH): Sie werden an die Version deines
#Servers angepasst. Namen, die es auf deiner Version nicht gibt (z. B. ein 1.21-Block auf 1.8), werden mit einem Konsolenhinweis übersprungen.
#
#Jedes Rennen akzeptiert außerdem (optional):
#  points: 1     #Punkte für den Gewinner (Standard 1)
#  weight: 1     #wie oft die Rotation es im Vergleich zu anderen Spielen wählt (Standard 1, 0 = nie)
#
#Admins können ein Rennen mit eigenen Werten starten: /chatgames <race> <material/mob> [amount]
#Ohne Anzahl wird eine der unten für dieses Material/diese Kreatur aufgeführten genutzt. Der Gewinner bekommt die Belohnungen,
#die für genau dieses Material und diese Anzahl aufgeführt sind, oder keine, wenn sie hier fehlen (Punkte gibt es trotzdem).

