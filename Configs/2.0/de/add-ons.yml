#Die Discord-Einstellungen sind in discord.yml.

#Die Datei, in der die Logs gespeichert werden
log-file: 'game_log.txt'

#Bei true werden alle Chat-Events in der Konsole protokolliert; beides kann gleichzeitig passieren
log-console: true

#Bei true werden alle Chat-Events in eine Datei protokolliert; beides kann gleichzeitig passieren
log-local: true