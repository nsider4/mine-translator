discord:
  #Wenn url leer ist, wird das ignoriert, da es keinen Webhook gibt
  webhook-url: ''
  message-content: 'Latest game results:'
  img-url: 'https://www.spigotmc.org/data/resource_icons/107/107781.jpg?1676494289'
  username: 'Chat Games'
  title: 'Chat Games Result'
  description: 'The winner is:'
  winner-field: '%winner% (%time%)'
  game-field: 'Game: %game%'


#Die Datei, in der die Logs gespeichert werden
log-file: 'game_log.txt'

#Bei true werden alle Chat-Events in der Konsole protokolliert; beides kann gleichzeitig passieren
log-console: true

#Bei true werden alle Chat-Events in eine Datei protokolliert; beides kann gleichzeitig passieren
log-local: true