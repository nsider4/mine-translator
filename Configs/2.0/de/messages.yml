help_command:
  - '&8&m-------------------------------------------------'
  - '&e&l-ChatGames-'
  - '&6'
  - '&6&lBEFEHLE:'
  - '&6'
  - '&e/chatgames menu [menu] &8- &7Öffnet das Menü: Profil, Aufgaben, Serien, Bestenlisten (oder jedes Menü aus menus.yml).'
  - '&e/chatgames profile [player] &8- &7Zeigt deine Statistiken (oder die eines anderen Spielers).'
  - '&e/chatgames top &8- &7Zeigt die 10 Spieler mit den meisten Punkten.'
  - '&e/chatgames fastest [game] &8- &7Zeigt die schnellsten Gewinner, insgesamt oder für ein Spiel.'
  - '&e/chatgames points [player] &8- &7Zeigt deine Punkte (oder die eines anderen Spielers).'
  - '&e/chatgames challenges &8- &7Zeigt deine täglichen und wöchentlichen Aufgaben.'
  - '&e/chatgames streaks &8- &7Zeigt deine Serien.'
  - '&e/chatgames claim &8- &7Holt erledigte Aufgaben und Serienbelohnungen ab.'
  - '&e/chatgames event [list|top <event>] &8- &7Zeigt die Spiel-Events, oder wer in einem am meisten gepunktet hat.'
  - '&e/chatgames toggle [player] &8- &7Schaltet Chatspiele für dich an oder aus.'
  - '&e/chatgames togglesound [player] &8- &7Schaltet Chatspiel-Töne an oder aus.'
  - '&6'
  - '&6&lADMIN:'
  - '&e/chatgames admin &8- &7Öffnet das Admin-Menü.'
  - '&e/chatgames debug &8- &7Öffnet das Debug-Menü: teste jedes Spiel privat, ohne Belohnungen.'
  - '&e/chatgames (game) [values] &8- &7Startet dieses Spiel sofort, optional mit eigenem Wort/eigenen Werten.'
  - '&e/chatgames any &8- &7Startet das Spiel, das die Rotation als Nächstes wählen würde.'
  - '&e/chatgames global <game> [values] &8- &7Startet ein globales Spiel: der ganze Server spielt zusammen.'
  - '&e/chatgames event start <event> | stop &8- &7Startet oder stoppt ein Spiel-Event.'
  - '&e/chatgames stop &8- &7Beendet das laufende Spiel ohne Gewinner.'
  - '&e/chatgames toggleAll &8- &7Schaltet die automatische Spielrotation an oder aus.'
  - '&e/chatgames preset <list|load|save> [name] &8- &7Verwaltet Spiel-Presets.'
  - '&e/chatgames +points|-points|setpoints <player> <amount> &8- &7Ändert die Punkte eines Spielers.'
  - '&e/chatgames remove <player> &8- &7Löscht die Daten eines Spielers.'
  - '&e/chatgames challenges reset <player> &8- &7Setzt den Aufgabenfortschritt eines Spielers zurück.'
  - '&e/chatgames streak set <player> <challenge|daily|global> <days> &8- &7Setzt die Serie eines Spielers.'
  - '&e/chatgames logs [amount] &8- &7Zeigt die letzten Spiel-Logs.'
  - '&e/chatgames discord <test <message|all>|leaderboard> &8- &7Sendet eine Testnachricht oder die Bestenliste an Discord.'
  - '&e/chatgames reload &8- &7Lädt die Konfigurationsdateien neu.'
  - '&6'
  - '&6&lSPIELTYPEN:'
  - '&7unscramble, unreverse, reaction, random, fillout, variable, clickable, math, sequence, memorize, guess_the_number, trivia, word_association, hoverable, hunt, mine, place, fish, craft, eat, furnace, tame, shear'
  - '&8&m-------------------------------------------------'

