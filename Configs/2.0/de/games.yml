#In diesem Spiel wird eine Zeichenkette der angegebenen Länge aus zufälligen Zeichen erzeugt
random:
  enable: true
  winners: 1
  weight: 1
  points: 1
  countdown:
    enable: true
    last-seconds: 10

  case-sensitive: true
  #Die Zeit in Sekunden, die Spieler zum Raten, Lösen, Schreiben usw. haben.
  timeToGuess_seconds: 20
  #Die Länge der zufälligen Zeichenkette dieses Spiels. Bereichsformat <min>-<max>. Für nur eine Länge auf beiden Seiten dieselbe Zahl
  lengthRange: 6-8
  #Verfügbare Typen: ALPHA (Buchstaben), ALPHANUMERIC (Buchstaben und Ziffern), NUMERIC (Ziffern), SYMBOLIC (Symbole),
  #LOWERCASE_ALPHA (nur Kleinbuchstaben), UPPERCASE_ALPHA (nur Großbuchstaben), HEXADECIMAL (Hexadezimalzeichen: 0123456789ABCDEF)
  #CUSTOM (nutzt, was in 'custom_characters' steht)
  character_type: ALPHANUMERIC
  #Diese Zeile wird nur genutzt, wenn der Typ "CUSTOM" ist
  custom_characters: 'abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789'

  #__Lass die folgenden 2 leer, um sie zu deaktivieren__
  titleMessage: '&b%selection%'
  subtitleMessage: '&aSchreib es'

math:
  enable: true
  winners: 1
  weight: 1
  points: 1
  hints:
    enable: true
    after-percent: 50
    max: 1
  countdown:
    enable: true
    last-seconds: 10

  #Ändere dies nicht
  case-sensitive: false
  #Die Zeit in Sekunden, die Spieler zum Raten, Lösen, Schreiben usw. haben.
  timeToGuess_seconds: 20
  #Zufallszahlenbereiche nach Schwierigkeit:
  #1 - (1-9)
  #2 - (1-99)
  #3 - (1-999)
  #4 - (1-9999)
  #5 - (1-99999)
  difficulty: 2
  #Wie viele Operatoren jede Aufgabe hat: 1 -> "12 + 7", 2 -> "12 + 7 x 3"
  operations: 1
  #solve: das Ergebnis ausrechnen ("12 + 7 x 3").  missing-value: die versteckte Zahl finden ("12 + ? x 3 = 33").
  #Jede Runde wählt einen der aufgeführten Modi.
  modes:
    - solve
    - missing-value
  #Zu nutzende Operatoren; die vier aufgeführten sind die verfügbaren, entferne die, die du nicht willst. Lass immer mindestens 1 stehen
  #Divisionen gehen immer glatt auf.
  operators:
    - '+'
    - '-'
    - 'x'
    - '/'

  #__Lass die folgenden 2 leer, um sie zu deaktivieren__
  titleMessage: '&b%selection%'
  subtitleMessage: '&aLöse es'

variable:
  enable: true
  winners: 1
  weight: 1
  points: 1
  countdown:
    enable: true
    last-seconds: 10

  #Ändere dies nicht
  case-sensitive: false
  #Die Zeit in Sekunden, die Spieler zum Raten, Lösen, Schreiben usw. haben.
  timeToGuess_seconds: 20

  #__Lass die folgenden 2 leer, um sie zu deaktivieren__
  titleMessage: '&bLÖSE'
  subtitleMessage: '&aNach &7`&b%symbol%&7`'

  #Der Bereich der zufälligen Ergebniszahl
  result-min: 20
  result-max: 100

  toGet: '✗'
  #Weitere Symbole, die du hinzufügen kannst: ✪❃✿✠❂♫♪❦♡♤♢✦☾☽✹
  data:
    - '✯;10'
    - '♛;15'
    - '❅;20'
    - '♫;25'

sequence:
  enable: true
  winners: 1
  weight: 1
  points: 1
  hints:
    enable: true
    after-percent: 50
    max: 1
  countdown:
    enable: true
    last-seconds: 10

  #Ändere dies nicht
  case-sensitive: false

  #Die Zeit in Sekunden, die Spieler zum Raten, Lösen, Schreiben usw. haben.
  timeToGuess_seconds: 25

  #Spieler sehen eine Zahlenfolge und tippen die nächste Zahl, z. B. "3, 6, 12, 24, ?" -> 48
  #Muster: addieren (3, 7, 11), multiplizieren (2, 6, 18), Quadrate (4, 9, 16), abwechselnd (5, 9, 7, 11), Fibonacci (2, 3, 5, 8)
  patterns:
    - add
    - multiply
    - squares
    - alternating
    - fibonacci
  #1-3. Höhere Schwierigkeit erlaubt schwierigere Muster (Quadrate und abwechselnd ab 2, Fibonacci bei 3) und größere Zahlen.
  difficulty: 2
  #Wie viele Zahlen vor dem '?' gezeigt werden (4-8)
  shown-terms: 5

  #__Lass die folgenden 2 leer, um sie zu deaktivieren__
  titleMessage: '&b%selection%'
  subtitleMessage: '&aErgänze die Folge'

memorize:
  enable: true
  winners: 1
  weight: 1
  points: 1
  hints:
    enable: true
    after-percent: 50
    max: 1
  countdown:
    enable: true
    last-seconds: 10

  case-sensitive: false

  listLength: 3
  #Jede Runde nimmt ihre Begriffe aus einer dieser Listen (siehe words.yml -> memorize.pools):
  #shopping_list, words, colors, numbers, blocks, mobs oder eine eigene Liste
  pools:
    - shopping_list
    - words
    - colors
    - numbers
    - blocks
    - mobs
  #Bei false können die Begriffe in beliebiger Reihenfolge getippt werden
  order-matters: true

  #Die Zeit in Sekunden, die Spieler zum Merken, Lösen, Schreiben usw. haben.
  timeToMemorize: 7

  #Die Zeit in Sekunden, die Spieler zum Raten, Lösen, Schreiben usw. haben.
  timeToGuess_seconds: 20
  #Lass die folgenden 2 leer, um sie zu deaktivieren
  titleMessage: '&bMerken'
  subtitleMessage: '&aVersuch dir diese Liste zu merken!'

#Drei Hinweise, eine versteckte Verbindung (die Assoziationen stehen in words.yml).
#difficulty: easy, medium, hard oder mixed. Schwere Runden zeigen einen Hinweis und enthüllen die anderen
