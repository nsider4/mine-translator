#############################
######    CHATGAMES    ######
#############################
#Einstellungen, die jedes Spiel kennt (fehlt eine, gilt der gezeigte Standard):
#  enable: true/false
#  weight: 1             Wie wahrscheinlich die Rotation dieses Spiel im Vergleich zu den anderen wählt (0 = nie).
#                        Dasselbe Spiel läuft nie zweimal hintereinander.
#  winners: 1            Wie viele Spieler jede Runde gewinnen können.
#  points: 1             Punkte pro Sieg (/chatgames top).
#  case-sensitive: false Wer bis auf die Groß-/Kleinschreibung richtig liegt, bekommt die Nachricht 'wrong_case'.
#  timeToGuess_seconds: 20
#  min-answer-ms: 400    Richtige Antworten, die schneller sind, werden ignoriert und protokolliert: Niemand liest und tippt
#                        so schnell, Bots schon. 0 schaltet die Prüfung ab.
#  hints:                Hinweise während der Runde, mit 'hint_message' aus messages.yml.
#    enable: false
#    after-percent: 50   Der erste Hinweis erscheint, wenn so viel Prozent der Zeit vorbei sind; die anderen verteilen sich auf den Rest.
#    max: 1              Bis zu 3.
#  countdown:            Restzeit in der Aktionsleiste. Funktioniert auf jeder Version (1.8 bis 26.x).
#    enable: false
#    last-seconds: 10    Nur in den letzten N Sekunden; 0 zeigt sie die ganze Runde.
#  titleMessage / subtitleMessage: lass beide leer, um keinen Titel zu senden.
unscramble:
  enable: true
  winners: 1
  weight: 1
  points: 1
  hints:
    enable: true
    after-percent: 50
    max: 1
  countdown:
    enable: true
    last-seconds: 10

  case-sensitive: true
  #Die Zeit in Sekunden, die Spieler zum Raten, Lösen, Schreiben usw. haben.
  timeToGuess_seconds: 20
  #__Lass die folgenden 2 leer, um sie zu deaktivieren__
  titleMessage: '&b%selection%'
  subtitleMessage: '&aEntwirre es'

