#Sendet Spielergebnisse, Rennen, globale Spiele, Events und mehr an Discord.
#
#Nachrichten gehen über einen Kanal-Webhook (nichts zu installieren), über den Bot des
#DiscordSRV-Plugins oder beides. Teste jede Nachricht mit /chatgames discord test <message>.
enabled: true

#__KANÄLE__
#Wohin Nachrichten gehen. Benenne sie, wie du willst; jede Benachrichtigung unten nennt ihre Kanäle.
#  webhook: die Webhook-URL eines Kanals. In Discord: Kanal bearbeiten > Integrationen > Webhooks >
#           Neuer Webhook > Webhook-URL kopieren. Halte sie geheim: Wer sie hat, kann dort posten.
#  discordsrv: postet stattdessen mit deinem DiscordSRV-Bot (braucht DiscordSRV). Ein Kanalname aus dem
#              Channels-Abschnitt der config.yml von DiscordSRV (z. B. global) oder eine Kanal-ID.
#  username / avatar: Name und Bild der Webhook-Posts (ein Bot behält seine eigenen).
channels:
  main:
    webhook: ''
    discordsrv: ''
    username: 'Chat Games'
    avatar: 'https://www.spigotmc.org/data/resource_icons/107/107781.jpg?1676494289'

#__ALLGEMEIN__
#In Fußzeilen als %server% angezeigt
server-name: 'Minecraft Server'
#Das Bild für %winner_head% / %player_head%. %name% und %uuid% werden eingesetzt.
player-head-url: 'https://mc-heads.net/avatar/%name%/128'
#Rollen-IDs, die Nachrichten pingen dürfen (schreibe <@&ID> in einen Text). Sonst pingt nie etwas: weder
#@everyone noch irgendetwas im Namen oder in der Antwort eines Spielers.
#Für eine ID schalte in Discord den Entwicklermodus ein (Einstellungen > Erweitert) und klicke die Rolle rechts an.
allowed-role-pings: []
#Mit DiscordSRV zeigen %winner_mention% / %player_mention% das verknüpfte Discord-Konto eines Spielers
#(sonst seinen Namen). true pingt ihn auch.
ping-linked-players: false
#Spiele und Rennen, die nie gepostet werden
ignored-games: []

#Farben (%game_color%) und Emoji (%game_emoji%) pro Spiel. Farben: '#RRGGBB' oder ein Name.
#Emoji: Namen wie :trophy: (die Liste steht am Ende dieser Datei) oder ein Server-Emoji als <:name:ID>.
#Füge keine Emoji-Zeichen in diese Datei ein: 1.8-Server können eine Datei damit nicht lesen.
styles:
  default: {color: '#5865F2', emoji: ':video_game:'}
  unscramble: {color: '#F1C40F', emoji: ':abc:'}
  unreverse: {color: '#E67E22', emoji: ':repeat:'}
  reaction: {color: '#E74C3C', emoji: ':zap:'}
  random: {color: '#9B59B6', emoji: ':game_die:'}
  fillout: {color: '#3498DB', emoji: ':pencil2:'}
  variable: {color: '#1ABC9C', emoji: ':heavy_plus_sign:'}
  clickable: {color: '#2ECC71', emoji: ':point_up:'}
  hoverable: {color: '#16A085', emoji: ':eyes:'}
  math: {color: '#E91E63', emoji: ':heavy_division_sign:'}
  sequence: {color: '#00BCD4', emoji: ':1234:'}
  memorize: {color: '#8E44AD', emoji: ':brain:'}
  guess_the_number: {color: '#FF9800', emoji: ':question:'}
  trivia: {color: '#3F51B5', emoji: ':books:'}
  word_association: {color: '#009688', emoji: ':link:'}
  count: {color: '#607D8B', emoji: ':1234:'}
  hunt: {color: '#C0392B', emoji: ':crossed_swords:'}
  mine: {color: '#7F8C8D', emoji: ':pick:'}
  place: {color: '#A0522D', emoji: ':bricks:'}
  fish: {color: '#2980B9', emoji: ':fishing_pole_and_fish:'}
  eat: {color: '#D35400', emoji: ':poultry_leg:'}
  craft: {color: '#8D6E63', emoji: ':hammer_and_pick:'}
  furnace: {color: '#E25822', emoji: ':fire:'}
  tame: {color: '#C69C6D', emoji: ':bone:'}
  shear: {color: '#ECF0F1', emoji: ':scissors:'}

#Wie Listen geschrieben werden: Gewinner, Helfer, Stände und Bestenlisten.
#%medal% ist die Medaille der Plätze 1-3, other-places gilt für den Rest.
lists:
  medals: [':first_place:', ':second_place:', ':third_place:']
  other-places: '`%place%.`'
  winner: '%medal% **%player%** `%time%s`'
  contributor: '%medal% **%player%** `%amount%`'
  standing: '%medal% **%player%** `%points% Pkt.`'
  leaderboard: '%medal% **%player%** `%value%`'
  #Wird statt einer leeren Liste angezeigt
  empty: '-# Noch niemand'

#__NACHRICHTEN__
#Jede Nachricht hat 'content' (normaler Text über dem Embed) und/oder ein 'embed':
#  color, author (name, icon, url), title, url, description, thumbnail, image,
#  fields (name, value, inline), footer (text, icon), timestamp (true zeigt die Sendezeit).
#Ein Text kann eine Zeile oder eine Liste von Zeilen sein. Eine Zeile, die nur leere Platzhalter hatte,
#fällt weg, ebenso ein leeres Feld. PlaceholderAPI-Platzhalter, die keinen Spieler brauchen, gehen auch.
#Discord-Formatierung funktioniert in Beschreibungen und Feldwerten: '### ' beginnt eine Überschrift, '-# ' kleinen grauen
#Text, '> ' ein Zitat, **fett**, `Code`.
#<t:%ends_unix%:R> zeigt "in 20 Sekunden" in der Zeit jedes Lesers und zählt herunter.
#In jeder Nachricht: %server%, und bei Spielen %game% %game_key% %game_emoji% %game_color%.

#Chatspiele. %question% %time_limit% %ends_unix% %winners_needed% %points%
games:
  enabled: true
  channels: [main]
  #true: beim Spielstart posten und den Post dann zum Ergebnis ändern. false: nur das Ergebnis posten.
  live: true
  #Memorize zeigt seine Liste hier nie: Spieler könnten sie in Discord lesen.
  hidden-question: 'Schau in den Spielchat!'
  start:
    embed:
      color: '%game_color%'
      author: '%game_emoji%  %game%'
      title: 'Neue Runde'
      description:
        - '### %question%'
        - '-# Antworte im Spielchat, um zu gewinnen.'
      fields:
        - name: ':stopwatch: Endet'
          value: '<t:%ends_unix%:R>'
          inline: true
        - name: ':sparkles: Belohnung'
          value: '`%points% Pkt.`'
          inline: true
        - name: ':busts_in_silhouette: Gewinner'
          value: '`%winners_needed%`'
          inline: true
      footer: '%server%'
  #%winner% %winner_head% %winner_mention% %time% %answer% %points% %winner_count%
  #%winners% (alle Gewinner, einer pro Zeile) %other_winners% (alle außer dem ersten)
  win:
    embed:
      color: '%game_color%'
      author: '%game_emoji%  %game%'
      title: ':trophy:  %winner% hat es!'
      thumbnail: '%winner_head%'
      description:
        - '-# Die Antwort war'
        - '### %answer%'
      fields:
        - name: ':stopwatch: Zeit'
          value: '`%time%s`'
          inline: true
        - name: ':sparkles: Punkte'
          value: '`+%points%`'
          inline: true
        - name: ':medal: Ebenfalls richtig'
          value: '%other_winners%'
          inline: false
      footer: '%server%'
      timestamp: true
  #%answer% %question% %time_limit%
  expired:
    enabled: true
    embed:
      color: '#4E5058'
      author: '%game_emoji%  %game%'
      title: ':hourglass:  Die Zeit ist um'
      description:
        - '-# Niemand hat es geschafft. Die Antwort war'
        - '### %answer%'
      footer: '%server%'
      timestamp: true
  #Wenn ein Teammitglied das Spiel stoppt (ändert nur einen Live-Post)
  stopped:
    embed:
      color: '#4E5058'
      author: '%game_emoji%  %game%'
      title: ':no_entry:  Runde gestoppt'
      description:
        - '-# Ein Teammitglied hat diese Runde vorzeitig beendet.'
      footer: '%server%'
      timestamp: true

#Rennen. %target% %amount% %time_limit% %ends_unix% %points%
races:
  enabled: true
  channels: [main]
  live: true
  start:
    embed:
      color: '%game_color%'
      author: '%game_emoji%  %game%-Rennen'
      title: 'Rennen gestartet'
      description:
        - '### %amount%x %target%'
        - '-# Wer zuerst fertig ist, gewinnt.'
      fields:
        - name: ':stopwatch: Endet'
          value: '<t:%ends_unix%:R>'
          inline: true
        - name: ':sparkles: Belohnung'
          value: '`%points% Pkt.`'
          inline: true
      footer: '%server%'
  #%winner% %winner_head% %winner_mention% %time% %points%
  win:
    embed:
      color: '%game_color%'
      author: '%game_emoji%  %game%-Rennen'
      title: ':checkered_flag:  %winner% hat das Rennen gewonnen!'
      thumbnail: '%winner_head%'
      description:
        - '### %amount%x %target%'
      fields:
        - name: ':stopwatch: Zeit'
          value: '`%time%s`'
          inline: true
        - name: ':sparkles: Punkte'
          value: '`+%points%`'
          inline: true
      footer: '%server%'
      timestamp: true
  expired:
    enabled: true
    embed:
      color: '#4E5058'
      author: '%game_emoji%  %game%-Rennen'
      title: ':hourglass:  Die Zeit ist um'
      description:
        - '### %amount%x %target%'
        - '-# Niemand ist rechtzeitig fertig geworden.'
      footer: '%server%'
      timestamp: true
  stopped:
    embed:
      color: '#4E5058'
      author: '%game_emoji%  %game%-Rennen'
      title: ':no_entry:  Rennen gestoppt'
      description:
        - '-# Ein Teammitglied hat dieses Rennen vorzeitig beendet.'
      footer: '%server%'
      timestamp: true

#Globale Spiele, bei denen der ganze Server auf ein Ziel hinarbeitet.
#%goal% (z. B. "500 Stone") %progress% %goal_amount% %percent% %bar% %contributors% %time_limit% %ends_unix%
global:
  enabled: true
  channels: [main]
  #true: der Post zeigt den Fortschrittsbalken und wird während des Spiels aktualisiert
  live: true
  #Wie oft der Live-Post höchstens aktualisiert wird (nur wenn sich der Fortschritt geändert hat)
  update-seconds: 15
  bar: {length: 16, full: '█', empty: '░'}
  progress:
    embed:
      color: '%game_color%'
      author: ':globe_with_meridians:  %game% (global)'
      title: 'Der ganze Server spielt zusammen'
      description:
        - '### %goal%'
        - '`%bar%` **%percent%%**'
        - '-# %progress% / %goal_amount%'
      fields:
        - name: ':busts_in_silhouette: Helfen mit'
          value: '`%contributors%`'
          inline: true
        - name: ':stopwatch: Endet'
          value: '<t:%ends_unix%:R>'
          inline: true
      footer: '%server%'
  #%top_contributors% (die größten Helfer, einer pro Zeile)
  completed:
    embed:
      color: '#57F287'
      author: ':globe_with_meridians:  %game% (global)'
      title: ':tada:  Ziel erreicht!'
      description:
        - '### %goal%'
        - '`%bar%` **%percent%%**'
      fields:
        - name: ':medal: Die größten Helfer'
          value: '%top_contributors%'
          inline: true
        - name: ':busts_in_silhouette: Geholfen'
          value: '`%contributors%`'
          inline: true
      footer: '%server%'
      timestamp: true
  failed:
    embed:
      color: '#ED4245'
      author: ':globe_with_meridians:  %game% (global)'
      title: ':x:  Ziel nicht erreicht'
      description:
        - '### %goal%'
        - '`%bar%` **%percent%%**'
        - '-# %progress% / %goal_amount%'
      fields:
        - name: ':medal: Die größten Helfer'
          value: '%top_contributors%'
          inline: true
      footer: '%server%'
      timestamp: true
  #Wie viele Helfer %top_contributors% auflistet
  top-size: 5

#Spiel-Events (events.yml). %event%
events:
  enabled: true
  channels: [main]
  #%games% (wie viele Spiele es hat)
  start:
    embed:
      color: '#FEE75C'
      author: ':calendar:  Spiel-Event'
      title: '%event% hat begonnen!'
      description:
        - '-# Gewinne die Spiele nacheinander, um Event-Punkte zu sammeln.'
      fields:
        - name: ':video_game: Spiele'
          value: '`%games%`'
          inline: true
      footer: '%server%'
      timestamp: true
  #%standings% %players% (wie viele gepunktet haben) %winner% %winner_head% %winner_mention%
  end:
    embed:
      color: '#FEE75C'
      author: ':calendar:  Spiel-Event'
      title: ':trophy:  Ergebnisse von %event%'
      thumbnail: '%winner_head%'
      description:
        - '%standings%'
      fields:
        - name: ':crown: Gewinner'
          value: '%winner_mention%'
          inline: true
        - name: ':busts_in_silhouette: Spieler'
          value: '`%players%`'
          inline: true
      footer: '%server%'
      timestamp: true
  #Wie viele Plätze %standings% auflistet
  standings-size: 10

#Die Serie eines Spielers erreicht eine Anzahl Tage am Stück (streaks.yml). %player% %player_head% %player_mention% %streak% %days%
streaks:
  enabled: false
  channels: [main]
  #Nur diese Tageszahlen werden gepostet
  days: [7, 14, 30, 60, 100, 365]
  message:
    embed:
      color: '#E67E22'
      author: {name: '%player%', icon: '%player_head%'}
      title: ':fire:  %days% Tage in Folge!'
      description:
        - '-# %streak%'
      footer: '%server%'
      timestamp: true

#Ein Spieler schließt eine tägliche oder wöchentliche Herausforderung ab. %player% %player_head% %player_mention% %challenge% %period%
challenges:
  enabled: false
  channels: [main]
  #Was %period% anzeigt
  periods:
    daily: 'Tägliche'
    weekly: 'Wöchentliche'
  message:
    embed:
      color: '#57F287'
      author: {name: '%player%', icon: '%player_head%'}
      title: ':white_check_mark:  Herausforderung geschafft'
      description:
        - '### %challenge%'
        - '-# %period% Herausforderung'
      footer: '%server%'
      timestamp: true

#Eine Bestenliste, gepostet zu festen Zeiten und mit /chatgames discord leaderboard.
#%leaderboard% %total_points% (alle Spieler zusammen)
leaderboard:
  enabled: false
  channels: [main]
  #Serverzeit, 24 Stunden, z. B. ['12:00', '20:00']
  times: ['20:00']
  #points oder fastest (die schnellsten Antworten aller Spiele)
  type: points
  size: 10
  message:
    embed:
      color: '#5865F2'
      author: ':bar_chart:  Bestenliste'
      title: 'Die besten Spieler'
      description:
        - '%leaderboard%'
        - ''
        - '-# Insgesamt %total_points% Punkte gewonnen'
      footer: '%server%'
      timestamp: true

