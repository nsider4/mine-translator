#MÖGLICHE AKTIONEN:
#
#[playercmd] - Führt den Befehl als der Gewinner aus
#[consolecmd] - Führt den Befehl über die Konsole aus
#[playermsg] - Sendet dem Gewinner eine Nachricht
#[broadcast] - Sendet eine Nachricht an alle Spieler in aktivierten Welten
#[player_as_op] - Führt einen Befehl als OP für den Spieler aus
#
#SO FÜGST DU BELOHNUNGEN CHANCEN HINZU:
#
#BEISPIEL:
#  - '10.0%~ [consolecmd] give %player% iron_block 5'
#FUNKTIONIERT NUR, WENN DAS FORMAT WIE IM BEISPIEL IST, MIT DEM <chance>% AM ANFANG, GEFOLGT VON EINEM ~ UND EINEM LEERZEICHEN. IMMER ZUERST IM BEFEHL
#
#BEFEHLE OHNE % SIND BELOHNUNGEN, DIE ZU 100% VERGEBEN WERDEN.

#BERECHTIGUNGSPRÜFUNG:
#
#AN DAS ENDE DER BEFEHLSZEILE SETZEN.
#Beispiel:
#  - '[consolecmd] give %player% iron_block 5 has:test.permission'

#Die 1 ist für den ERSTEN Gewinner; WENN DU IN config.yml MEHR GEWINNER HINZUFÜGST UND ANDERE BELOHNUNGEN WILLST, FÜGE IHREN PLATZ HINZU (2:, usw.)
unscramble:
  rewards:
    1:
      reward_1:
        minimum-players: 2 #Bedingung nach Spielern online: Die Belohnung kann nur gezogen werden, wenn 2 oder mehr Spieler online sind
        chance: 50
        data:
          - '10.0%~ [consolecmd] give %player% diamond_block 3 has:test.permission'
          - '[consolecmd] give %player% iron_block 5'
      reward_2:
        data:
          - '[consolecmd] give %player% iron_block 2'

