#AB HIER KOMMEN BELOHNUNGEN FÜR RENNEN, DIE NUR 1 GEWINNER HABEN
#
#EIN ANDERES FORMAT WIRD VERWENDET! LIES GENAU

races:
  rewards:
    #DAS SIND DIE BELOHNUNGEN, DIE DU IN 'races.yml' EINTRÄGST
    reward_1:
      chance: 50
      data:
        - '60.0%~ [consolecmd] give %player% diamond_block 5'
    #WENN DU DEN WERT 'chance' ENTFERNST, PASSIERT DIE BELOHNUNG/DER BEFEHL IMMER
    reward_2:
      data:
        - '[consolecmd] give %player% iron_block 5'
        - '[playermsg] &aDu hast gewonnen!'
    reward_3:
      chance: 50
      data:
        - '[consolecmd] give %player% diamond_block 3'