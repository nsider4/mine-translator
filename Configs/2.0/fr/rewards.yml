#À PARTIR D'ICI, CE SONT LES RÉCOMPENSES DES COURSES, QUI N'ONT QU'UN SEUL GAGNANT
#
#UN FORMAT DIFFÉRENT EST UTILISÉ ! LISEZ ATTENTIVEMENT

races:
  rewards:
    #CE SONT LES RÉCOMPENSES QUE VOUS METTEZ DANS 'races.yml'
    reward_1:
      chance: 50
      data:
        - '60.0%~ [consolecmd] give %player% diamond_block 5'
    #RETIRER LA VALEUR 'chance' FAIT QUE LA RÉCOMPENSE/COMMANDE A TOUJOURS LIEU
    reward_2:
      data:
        - '[consolecmd] give %player% iron_block 5'
        - '[playermsg] &aVous avez gagné !'
    reward_3:
      chance: 50
      data:
        - '[consolecmd] give %player% diamond_block 3'