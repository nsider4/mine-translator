#ACTIONS POSSIBLES :
#
#[playercmd] - Exécute la commande en tant que gagnant
#[consolecmd] - Exécute la commande depuis la console
#[playermsg] - Envoie un message au gagnant
#[broadcast] - Envoie un message à tous les joueurs des mondes activés
#[player_as_op] - Exécute une commande en tant qu'op pour le joueur
#
#AJOUTEZ DES CHANCES AUX RÉCOMPENSES COMME CECI :
#
#EXEMPLE :
#  - '10.0%~ [consolecmd] give %player% iron_block 5'
#NE FONCTIONNE QUE SI LE FORMAT EST LE MÊME QUE L'EXEMPLE, AVEC LE <chance>% AU DÉBUT SUIVI D'UN ~ ET D'UN ESPACE. TOUJOURS EN PREMIER DANS LA COMMANDE
#
#LES COMMANDES SANS AUCUN % SONT DES RÉCOMPENSES DONNÉES À 100%.

#VÉRIFICATION DES PERMISSIONS :
#
#À METTRE À LA FIN DE LA LIGNE DE COMMANDE.
#Exemple :
#  - '[consolecmd] give %player% iron_block 5 has:test.permission'

#Le 1 est pour le PREMIER gagnant ; SI VOUS AJOUTEZ PLUS DE GAGNANTS DANS config.yml ET VOULEZ DES RÉCOMPENSES DIFFÉRENTES, AJOUTEZ LEUR PLACE (2:, etc)
unscramble:
  rewards:
    1:
      reward_1:
        minimum-players: 2 #Condition selon les joueurs en ligne : la récompense ne peut sortir que s'il y a 2 joueurs en ligne ou plus
        chance: 50
        data:
          - '10.0%~ [consolecmd] give %player% diamond_block 3 has:test.permission'
          - '[consolecmd] give %player% iron_block 5'
      reward_2:
        data:
          - '[consolecmd] give %player% iron_block 2'

