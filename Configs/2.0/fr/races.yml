enable-races: true

creative-enabled: true
#Liens utiles pour ajouter des DONNÉES :
#
#https://hub.spigotmc.org/javadocs/spigot/org/bukkit/entity/EntityType.html
#https://helpch.at/docs/1.8/index.html?org/bukkit/entity/EntityType.html
#https://hub.spigotmc.org/javadocs/bukkit/org/bukkit/Material.html
#https://helpch.at/docs/1.8/org/bukkit/Material.html

#Les noms peuvent être modernes ou anciens (MOOSHROOM ou MUSHROOM_COW, COD ou RAW_FISH) : ils sont adaptés à la version de votre
#serveur. Les noms qui n'existent pas dans votre version (ex. un bloc 1.21 en 1.8) sont ignorés, avec une note dans la console.
#
#Chaque course accepte aussi (facultatif) :
#  points: 1     #points que reçoit le gagnant (1 par défaut)
#  weight: 1     #fréquence à laquelle la rotation la choisit par rapport aux autres jeux (1 par défaut, 0 = jamais)
#
#Les admins peuvent lancer une course avec leurs propres valeurs : /chatgames <race> <material/mob> [amount]
#Sans quantité, l'une de celles listées ci-dessous pour ce matériau/cette créature est utilisée. Le gagnant reçoit les récompenses listées
#pour exactement ce matériau et cette quantité, ou aucune s'ils ne sont pas listés ici (les points sont quand même donnés).

hunt:
  enable: true

  timeToComplete_seconds: 180
  #__Laissez les 2 suivants vides pour les désactiver__
  titleMessage: '&bCHASSE'
  subtitleMessage: '&aTuez %amount% %value% !'

  #S'il faut compter les créatures apparues par des générateurs ou des œufs d'apparition.
