#Dans ce jeu, une chaîne de la longueur indiquée est créée avec des caractères aléatoires
random:
  enable: true
  winners: 1
  weight: 1
  points: 1
  countdown:
    enable: true
    last-seconds: 10

  case-sensitive: true
  #Le temps en secondes dont disposent les joueurs pour deviner, résoudre, écrire, etc.
  timeToGuess_seconds: 20
  #La longueur de la chaîne aléatoire de ce jeu. Format de plage <min>-<max>. Pour une seule longueur, mettez le même nombre des deux côtés
  lengthRange: 6-8
  #Types disponibles : ALPHA (lettres), ALPHANUMERIC (lettres et chiffres), NUMERIC (chiffres), SYMBOLIC (symboles),
  #LOWERCASE_ALPHA (tout en minuscules), UPPERCASE_ALPHA (tout en majuscules), HEXADECIMAL (caractères hexadécimaux : 0123456789ABCDEF)
  #CUSTOM (utilise ce qui se trouve dans 'custom_characters')
  character_type: ALPHANUMERIC
  #Cette ligne n'est utilisée que si le type est "CUSTOM"
  custom_characters: 'abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789'

  #__Laissez les 2 suivants vides pour les désactiver__
  titleMessage: '&b%selection%'
  subtitleMessage: '&aÉcrivez'

math:
  enable: true
  winners: 1
  weight: 1
  points: 1
  hints:
    enable: true
    after-percent: 50
    max: 1
  countdown:
    enable: true
    last-seconds: 10

  #Ne changez pas ceci
  case-sensitive: false
  #Le temps en secondes dont disposent les joueurs pour deviner, résoudre, écrire, etc.
  timeToGuess_seconds: 20
  #Plages de nombres aléatoires par difficulté :
  #1 - (1-9)
  #2 - (1-99)
  #3 - (1-999)
  #4 - (1-9999)
  #5 - (1-99999)
  difficulty: 2
  #Combien d'opérateurs a chaque question : 1 -> "12 + 7", 2 -> "12 + 7 x 3"
  operations: 1
  #solve : calculer le résultat ("12 + 7 x 3").  missing-value : trouver le nombre caché ("12 + ? x 3 = 33").
  #Chaque manche choisit l'un des modes listés.
  modes:
    - solve
    - missing-value
  #Opérateurs à utiliser ; les quatre listés sont ceux disponibles, retirez ceux que vous ne voulez pas. Gardez-en toujours au moins 1
  #Les divisions tombent toujours juste.
  operators:
    - '+'
    - '-'
    - 'x'
    - '/'

  #__Laissez les 2 suivants vides pour les désactiver__
  titleMessage: '&b%selection%'
  subtitleMessage: '&aRésolvez'

variable:
  enable: true
  winners: 1
