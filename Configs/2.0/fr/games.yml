#############################
######    CHATGAMES    ######
#############################
#Paramètres acceptés par chaque jeu (s'il manque, la valeur indiquée est utilisée) :
#  enable: true/false
#  weight: 1             Probabilité que la rotation choisisse ce jeu par rapport aux autres (0 = jamais).
#                        Le même jeu n'est jamais joué deux fois de suite.
#  winners: 1            Combien de joueurs peuvent gagner chaque manche.
#  points: 1             Points par victoire (/chatgames top).
#  case-sensitive: false Les joueurs qui ont juste sauf les majuscules reçoivent le message 'wrong_case'.
#  timeToGuess_seconds: 20
#  min-answer-ms: 400    Les bonnes réponses plus rapides que ceci sont ignorées et enregistrées : personne ne lit et ne tape
#                        aussi vite, les bots si. 0 désactive la vérification.
#  hints:                Indices affichés pendant la manche, avec 'hint_message' de messages.yml.
#    enable: false
#    after-percent: 50   Le premier indice apparaît une fois ce pourcentage du temps écoulé ; les autres sont répartis sur le reste.
#    max: 1              Jusqu'à 3.
#  countdown:            Temps restant, dans la barre d'action. Fonctionne sur toutes les versions (1.8 à 26.x).
#    enable: false
#    last-seconds: 10    Seulement pendant les N dernières secondes ; 0 l'affiche toute la manche.
#  titleMessage / subtitleMessage : laissez les deux vides pour n'envoyer aucun titre.
unscramble:
  enable: true
  winners: 1
  weight: 1
  points: 1
  hints:
    enable: true
    after-percent: 50
    max: 1
  countdown:
    enable: true
    last-seconds: 10

  case-sensitive: true
  #Le temps en secondes dont disposent les joueurs pour deviner, résoudre, écrire, etc.
  timeToGuess_seconds: 20
  #__Laissez les 2 suivants vides pour les désactiver__
  titleMessage: '&b%selection%'
  subtitleMessage: '&aRemettez dans l''ordre'

