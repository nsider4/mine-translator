  subtitleMessage: '&aPour &7`&b%symbol%&7`'

  #La plage du nombre résultat aléatoire
  result-min: 20
  result-max: 100

  toGet: '✗'
  #D'autres symboles que vous pouvez ajouter : ✪❃✿✠❂♫♪❦♡♤♢✦☾☽✹
  data:
    - '✯;10'
    - '♛;15'
    - '❅;20'
    - '♫;25'

sequence:
  enable: true
  winners: 1
  weight: 1
  points: 1
  hints:
    enable: true
    after-percent: 50
    max: 1
  countdown:
    enable: true
    last-seconds: 10

  #Ne changez pas ceci
  case-sensitive: false

  #Le temps en secondes dont disposent les joueurs pour deviner, résoudre, écrire, etc.
  timeToGuess_seconds: 25

  #Les joueurs voient une suite de nombres et tapent le suivant, ex. "3, 6, 12, 24, ?" -> 48
  #Motifs : addition (3, 7, 11), multiplication (2, 6, 18), carrés (4, 9, 16), alternés (5, 9, 7, 11), fibonacci (2, 3, 5, 8)
  patterns:
    - add
    - multiply
    - squares
    - alternating
    - fibonacci
  #1-3. Une difficulté plus élevée permet des motifs plus durs (carrés et alternés dès 2, fibonacci à 3) et de plus grands nombres.
  difficulty: 2
  #Combien de nombres sont affichés avant le '?' (4-8)
  shown-terms: 5

  #__Laissez les 2 suivants vides pour les désactiver__
  titleMessage: '&b%selection%'
  subtitleMessage: '&aComplétez la suite'

memorize:
  enable: true
  winners: 1
  weight: 1
  points: 1
  hints:
    enable: true
    after-percent: 50
    max: 1
  countdown:
    enable: true
    last-seconds: 10

  case-sensitive: false

  listLength: 3
  #Chaque manche prend ses éléments dans l'une de ces listes (voir words.yml -> memorize.pools) :
  #shopping_list, words, colors, numbers, blocks, mobs, ou une liste à vous
  pools:
    - shopping_list
    - words
    - colors
    - numbers
    - blocks
    - mobs
  #Si false, les éléments peuvent être tapés dans n'importe quel ordre
  order-matters: true

  #Le temps en secondes dont disposent les joueurs pour mémoriser, résoudre, écrire, etc.
  timeToMemorize: 7

  #Le temps en secondes dont disposent les joueurs pour deviner, résoudre, écrire, etc.
  timeToGuess_seconds: 20
  #Laissez les 2 suivants vides pour les désactiver
  titleMessage: '&bMémorisez'
  subtitleMessage: '&aEssayez de retenir cette liste !'

