#Publie sur Discord les résultats des jeux, courses, jeux globaux, événements et plus.
#
#Les messages passent par le webhook d'un salon (rien à installer), par le bot du
#plugin DiscordSRV, ou les deux. Testez chaque message avec /chatgames discord test <message>.
enabled: true

#__SALONS__
#Où vont les messages. Nommez-les comme vous voulez ; chaque notification ci-dessous indique ses salons.
#  webhook : l'URL du webhook d'un salon. Dans Discord : Modifier le salon > Intégrations > Webhooks >
#           Nouveau webhook > Copier l'URL du webhook. Gardez-la secrète : quiconque l'a peut y publier.
#  discordsrv : publie avec votre bot DiscordSRV à la place (nécessite DiscordSRV). Un nom de salon de la
#              section Channels du config.yml de DiscordSRV (ex. global), ou un ID de salon.
#  username / avatar : le nom et l'image des messages du webhook (un bot garde les siens).
channels:
  main:
    webhook: ''
    discordsrv: ''
    username: 'Chat Games'
    avatar: 'https://www.spigotmc.org/data/resource_icons/107/107781.jpg?1676494289'

#__GÉNÉRAL__
#Affiché dans les pieds de page comme %server%
server-name: 'Minecraft Server'
#L'image de %winner_head% / %player_head%. %name% et %uuid% sont remplis.
player-head-url: 'https://mc-heads.net/avatar/%name%/128'
#IDs des rôles que les messages peuvent mentionner (écrivez <@&ID> dans un texte). Rien d'autre ne mentionne jamais : ni
#@everyone, ni quoi que ce soit dans le nom ou la réponse d'un joueur.
#Pour obtenir un ID, activez le mode développeur dans Discord (Paramètres > Avancés), puis faites un clic droit sur le rôle.
allowed-role-pings: []
#Avec DiscordSRV, %winner_mention% / %player_mention% affichent le compte Discord lié d'un joueur
#(sinon son nom). true le mentionne aussi.
ping-linked-players: false
#Jeux et courses jamais publiés
ignored-games: []

#Couleurs (%game_color%) et emoji (%game_emoji%) par jeu. Couleurs : '#RRGGBB' ou un nom.
#Emoji : des noms comme :trophy: (la liste est à la fin de ce fichier), ou un emoji du serveur comme <:name:ID>.
#Ne collez pas de caractères emoji dans ce fichier : les serveurs 1.8 ne peuvent pas lire un fichier qui en contient.
styles:
  default: {color: '#5865F2', emoji: ':video_game:'}
  unscramble: {color: '#F1C40F', emoji: ':abc:'}
  unreverse: {color: '#E67E22', emoji: ':repeat:'}
  reaction: {color: '#E74C3C', emoji: ':zap:'}
  random: {color: '#9B59B6', emoji: ':game_die:'}
  fillout: {color: '#3498DB', emoji: ':pencil2:'}
  variable: {color: '#1ABC9C', emoji: ':heavy_plus_sign:'}
  clickable: {color: '#2ECC71', emoji: ':point_up:'}
  hoverable: {color: '#16A085', emoji: ':eyes:'}
  math: {color: '#E91E63', emoji: ':heavy_division_sign:'}
  sequence: {color: '#00BCD4', emoji: ':1234:'}
  memorize: {color: '#8E44AD', emoji: ':brain:'}
  guess_the_number: {color: '#FF9800', emoji: ':question:'}
  trivia: {color: '#3F51B5', emoji: ':books:'}
  word_association: {color: '#009688', emoji: ':link:'}
  count: {color: '#607D8B', emoji: ':1234:'}
  hunt: {color: '#C0392B', emoji: ':crossed_swords:'}
  mine: {color: '#7F8C8D', emoji: ':pick:'}
  place: {color: '#A0522D', emoji: ':bricks:'}
  fish: {color: '#2980B9', emoji: ':fishing_pole_and_fish:'}
  eat: {color: '#D35400', emoji: ':poultry_leg:'}
  craft: {color: '#8D6E63', emoji: ':hammer_and_pick:'}
  furnace: {color: '#E25822', emoji: ':fire:'}
  tame: {color: '#C69C6D', emoji: ':bone:'}
  shear: {color: '#ECF0F1', emoji: ':scissors:'}

#Comment les listes sont écrites : gagnants, contributeurs, classements et tableaux.
#%medal% est la médaille des places 1 à 3, et other-places celle des autres.
lists:
  medals: [':first_place:', ':second_place:', ':third_place:']
  other-places: '`%place%.`'
  winner: '%medal% **%player%** `%time%s`'
  contributor: '%medal% **%player%** `%amount%`'
  standing: '%medal% **%player%** `%points% pts`'
  leaderboard: '%medal% **%player%** `%value%`'
  #Affiché à la place d'une liste vide
  empty: '-# Personne pour l''instant'

#__MESSAGES__
#Chaque message a un 'content' (texte simple au-dessus de l'embed) et/ou un 'embed' :
#  color, author (name, icon, url), title, url, description, thumbnail, image,
#  fields (name, value, inline), footer (text, icon), timestamp (true affiche l'heure d'envoi).
#Un texte peut être une ligne ou une liste de lignes. Une ligne qui n'avait que des placeholders vides
#est retirée, tout comme un champ vide. Les placeholders PlaceholderAPI sans joueur fonctionnent aussi.
#La mise en forme Discord marche dans les descriptions et les valeurs des champs : '### ' commence un titre, '-# ' un petit
#texte gris, '> ' une citation, **gras**, `code`.
#<t:%ends_unix%:R> affiche "dans 20 secondes" à l'heure de chaque lecteur, en décompte.
#Dans chaque message : %server%, et pour les jeux %game% %game_key% %game_emoji% %game_color%.

#Jeux de chat. %question% %time_limit% %ends_unix% %winners_needed% %points%
games:
  enabled: true
  channels: [main]
  #true : publie au début du jeu, puis transforme ce message en résultat. false : publie seulement le résultat.
  live: true
  #Memorize ne montre jamais sa liste ici : les joueurs pourraient la lire sur Discord.
  hidden-question: 'Regardez le chat du jeu !'
  start:
    embed:
      color: '%game_color%'
      author: '%game_emoji%  %game%'
      title: 'Nouvelle manche'
      description:
        - '### %question%'
        - '-# Répondez dans le chat du jeu pour gagner.'
      fields:
        - name: ':stopwatch: Fin'
          value: '<t:%ends_unix%:R>'
          inline: true
        - name: ':sparkles: Récompense'
          value: '`%points% pts`'
          inline: true
        - name: ':busts_in_silhouette: Gagnants'
          value: '`%winners_needed%`'
          inline: true
      footer: '%server%'
  #%winner% %winner_head% %winner_mention% %time% %answer% %points% %winner_count%
  #%winners% (tous les gagnants, un par ligne) %other_winners% (tous sauf le premier)
  win:
    embed:
      color: '%game_color%'
      author: '%game_emoji%  %game%'
      title: ':trophy:  %winner% a trouvé !'
      thumbnail: '%winner_head%'
      description:
        - '-# La réponse était'
        - '### %answer%'
      fields:
        - name: ':stopwatch: Temps'
          value: '`%time%s`'
          inline: true
        - name: ':sparkles: Points'
          value: '`+%points%`'
          inline: true
        - name: ':medal: Ont aussi trouvé'
          value: '%other_winners%'
          inline: false
      footer: '%server%'
      timestamp: true
  #%answer% %question% %time_limit%
  expired:
    enabled: true
    embed:
      color: '#4E5058'
      author: '%game_emoji%  %game%'
      title: ':hourglass:  Temps écoulé'
      description:
        - '-# Personne n''a trouvé. La réponse était'
        - '### %answer%'
      footer: '%server%'
      timestamp: true
  #Quand un membre du staff arrête le jeu (modifie seulement un message en direct)
  stopped:
    embed:
      color: '#4E5058'
      author: '%game_emoji%  %game%'
      title: ':no_entry:  Manche arrêtée'
      description:
        - '-# Un membre du staff a terminé cette manche plus tôt.'
      footer: '%server%'
      timestamp: true

#Courses. %target% %amount% %time_limit% %ends_unix% %points%
races:
  enabled: true
  channels: [main]
  live: true
  start:
    embed:
      color: '%game_color%'
      author: '%game_emoji%  Course : %game%'
      title: 'Course lancée'
      description:
        - '### %amount%x %target%'
        - '-# Le premier à finir gagne.'
      fields:
        - name: ':stopwatch: Fin'
          value: '<t:%ends_unix%:R>'
          inline: true
        - name: ':sparkles: Récompense'
          value: '`%points% pts`'
          inline: true
      footer: '%server%'
  #%winner% %winner_head% %winner_mention% %time% %points%
  win:
    embed:
      color: '%game_color%'
      author: '%game_emoji%  Course : %game%'
      title: ':checkered_flag:  %winner% a gagné la course !'
      thumbnail: '%winner_head%'
      description:
        - '### %amount%x %target%'
      fields:
        - name: ':stopwatch: Temps'
          value: '`%time%s`'
          inline: true
        - name: ':sparkles: Points'
          value: '`+%points%`'
          inline: true
      footer: '%server%'
      timestamp: true
  expired:
    enabled: true
    embed:
      color: '#4E5058'
      author: '%game_emoji%  Course : %game%'
      title: ':hourglass:  Temps écoulé'
      description:
        - '### %amount%x %target%'
        - '-# Personne n''a fini à temps.'
      footer: '%server%'
      timestamp: true
  stopped:
    embed:
      color: '#4E5058'
      author: '%game_emoji%  Course : %game%'
      title: ':no_entry:  Course arrêtée'
      description:
        - '-# Un membre du staff a terminé cette course plus tôt.'
      footer: '%server%'
      timestamp: true

#Jeux globaux, où tout le serveur travaille vers un même objectif.
#%goal% (ex. "500 Stone") %progress% %goal_amount% %percent% %bar% %contributors% %time_limit% %ends_unix%
global:
  enabled: true
  channels: [main]
  #true : le message montre la barre de progression et est mis à jour pendant le jeu
  live: true
  #À quelle fréquence maximale le message en direct est mis à jour (seulement si la progression a changé)
  update-seconds: 15
  bar: {length: 16, full: '█', empty: '░'}
  progress:
    embed:
      color: '%game_color%'
      author: ':globe_with_meridians:  %game% global'
      title: 'Tout le serveur joue ensemble'
      description:
        - '### %goal%'
        - '`%bar%` **%percent%%**'
        - '-# %progress% / %goal_amount%'
      fields:
        - name: ':busts_in_silhouette: Participants'
          value: '`%contributors%`'
          inline: true
        - name: ':stopwatch: Fin'
          value: '<t:%ends_unix%:R>'
          inline: true
      footer: '%server%'
  #%top_contributors% (les plus gros contributeurs, un par ligne)
  completed:
    embed:
      color: '#57F287'
      author: ':globe_with_meridians:  %game% global'
      title: ':tada:  Objectif atteint !'
      description:
        - '### %goal%'
        - '`%bar%` **%percent%%**'
      fields:
        - name: ':medal: Meilleurs participants'
          value: '%top_contributors%'
          inline: true
        - name: ':busts_in_silhouette: Ont aidé'
          value: '`%contributors%`'
          inline: true
      footer: '%server%'
      timestamp: true
  failed:
    embed:
      color: '#ED4245'
      author: ':globe_with_meridians:  %game% global'
      title: ':x:  Objectif non atteint'
      description:
        - '### %goal%'
        - '`%bar%` **%percent%%**'
        - '-# %progress% / %goal_amount%'
      fields:
        - name: ':medal: Meilleurs participants'
          value: '%top_contributors%'
          inline: true
      footer: '%server%'
      timestamp: true
  #Combien de contributeurs %top_contributors% liste
  top-size: 5

#Événements de jeux (events.yml). %event%
events:
  enabled: true
  channels: [main]
  #%games% (combien de jeux il contient)
  start:
    embed:
      color: '#FEE75C'
      author: ':calendar:  Événement de jeux'
      title: '%event% a commencé !'
      description:
        - '-# Gagnez les jeux à la suite pour obtenir des points d''événement.'
      fields:
        - name: ':video_game: Jeux'
          value: '`%games%`'
          inline: true
      footer: '%server%'
      timestamp: true
  #%standings% %players% (combien ont marqué) %winner% %winner_head% %winner_mention%
  end:
    embed:
      color: '#FEE75C'
      author: ':calendar:  Événement de jeux'
      title: ':trophy:  Résultats de %event%'
      thumbnail: '%winner_head%'
      description:
        - '%standings%'
      fields:
        - name: ':crown: Gagnant'
          value: '%winner_mention%'
          inline: true
        - name: ':busts_in_silhouette: Joueurs'
          value: '`%players%`'
          inline: true
      footer: '%server%'
      timestamp: true
  #Combien de places %standings% liste
  standings-size: 10

#La série d'un joueur atteint un nombre de jours d'affilée (streaks.yml). %player% %player_head% %player_mention% %streak% %days%
streaks:
  enabled: false
  channels: [main]
  #Seuls ces nombres de jours sont publiés
  days: [7, 14, 30, 60, 100, 365]
  message:
    embed:
      color: '#E67E22'
      author: {name: '%player%', icon: '%player_head%'}
      title: ':fire:  %days% jours d''affilée !'
      description:
        - '-# %streak%'
      footer: '%server%'
      timestamp: true

#Un joueur termine un défi quotidien ou hebdomadaire. %player% %player_head% %player_mention% %challenge% %period%
challenges:
  enabled: false
  channels: [main]
  #Ce qu'affiche %period%
  periods:
    daily: 'quotidien'
    weekly: 'hebdomadaire'
  message:
    embed:
      color: '#57F287'
      author: {name: '%player%', icon: '%player_head%'}
      title: ':white_check_mark:  Défi réussi'
      description:
        - '### %challenge%'
        - '-# Défi %period%'
      footer: '%server%'
      timestamp: true

#Un classement, publié à heures fixes et avec /chatgames discord leaderboard.
#%leaderboard% %total_points% (tous les joueurs ensemble)
leaderboard:
  enabled: false
  channels: [main]
  #Heure du serveur, sur 24 heures, ex. ['12:00', '20:00']
  times: ['20:00']
  #points, ou fastest (les réponses les plus rapides de tous les jeux)
  type: points
  size: 10
  message:
    embed:
      color: '#5865F2'
      author: ':bar_chart:  Classement'
      title: 'Meilleurs joueurs'
      description:
        - '%leaderboard%'
        - ''
        - '-# %total_points% points gagnés au total'
      footer: '%server%'
      timestamp: true

