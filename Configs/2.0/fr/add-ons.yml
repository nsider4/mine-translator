#Les réglages Discord sont dans discord.yml.

#Le fichier où les journaux seront enregistrés
log-file: 'game_log.txt'

#Si true, tous les événements de chat sont journalisés dans la console ; les deux peuvent se faire en même temps
log-console: true

#Si true, tous les événements de chat sont journalisés dans un fichier ; les deux peuvent se faire en même temps
log-local: true