help_command:
  - '&7&m-------------------------------------------------'
  - '&e&l-ChatGames-'
  - '&6'
  - '&6&lCOMMANDES :'
  - '&6'
  - '&a/chatgames menu [menu] &f- &3Ouvre le menu : profil, défis, séries, classements (ou tout menu de menus.yml).'
  - '&a/chatgames profile [player] &f- &3Affiche vos statistiques (ou celles d''un autre joueur).'
  - '&a/chatgames top &f- &3Affiche les 10 joueurs avec le plus de points.'
  - '&a/chatgames fastest [game] &f- &3Affiche les gagnants les plus rapides, au total ou pour un jeu.'
  - '&a/chatgames points [player] &f- &3Affiche vos points (ou ceux d''un autre joueur).'
  - '&a/chatgames challenges &f- &3Affiche vos défis quotidiens et hebdomadaires.'
  - '&a/chatgames streaks &f- &3Affiche vos séries.'
  - '&a/chatgames claim &f- &3Réclame les défis terminés et les récompenses de série.'
  - '&a/chatgames event [list|top <event>] &f- &3Affiche les événements de jeux, ou qui a le plus marqué dans l''un d''eux.'
  - '&a/chatgames toggle [player] &f- &3Active ou désactive les jeux de chat pour vous.'
  - '&a/chatgames togglesound [player] &f- &3Active ou désactive les sons des jeux.'
  - '&6'
  - '&c&lADMIN :'
  - '&a/chatgames admin &f- &3Ouvre le menu d''administration.'
  - '&a/chatgames debug &f- &3Ouvre le menu de débogage : testez n''importe quel jeu en privé, sans récompense.'
  - '&a/chatgames (game) [values] &f- &3Lance ce jeu maintenant, avec éventuellement votre propre mot/valeurs.'
  - '&a/chatgames any &f- &3Lance le jeu que la rotation choisirait ensuite.'
  - '&a/chatgames global <game> [values] &f- &3Lance un jeu global : tous ceux qui répondent à temps gagnent.'
  - '&a/chatgames event start <event> | stop &f- &3Lance ou arrête un événement de jeux.'
  - '&a/chatgames stop &f- &3Termine le jeu en cours sans gagnant.'
  - '&a/chatgames toggleAll &f- &3Active ou désactive la rotation automatique des jeux.'
  - '&a/chatgames preset <list|load|save> [name] &f- &3Gère les presets de jeux.'
  - '&a/chatgames +points|-points|setpoints <player> <amount> &f- &3Modifie les points d''un joueur.'
  - '&a/chatgames remove <player> &f- &3Supprime les données d''un joueur.'
  - '&a/chatgames challenges reset <player> &f- &3Efface la progression des défis d''un joueur.'
  - '&a/chatgames streak set <player> <challenge|daily|global> <days> &f- &3Définit la série d''un joueur.'
  - '&a/chatgames logs [amount] &f- &3Affiche les derniers journaux de jeux.'
  - '&a/chatgames reload &f- &3Recharge les fichiers de configuration.'
  - '&6'
  - '&2&lTYPES DE JEUX :'
  - '&5unscramble, unreverse, reaction, random, fillout, variable, clickable, math, sequence, memorize, guess_the_number, trivia, word_association, hoverable, hunt, mine, place, fish, craft, eat, furnace'
  - '&7&m-------------------------------------------------'

