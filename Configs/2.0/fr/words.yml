#Listes d'éléments du jeu Mémoire. games.yml -> memorize.pools choisit celles qui sont utilisées.
#'numbers' n'a pas besoin de liste. 'blocks' et 'mobs' sont des IDs Minecraft, affichés dans la langue de config.yml (lang).
#Tout autre nom est une simple liste : ajoutez-en une ici et mettez son nom dans games.yml pour l'utiliser.
