#Настройки Discord находятся в discord.yml.

#Файл, в который будут сохраняться логи
log-file: 'game_log.txt'

#Если true, все события чата будут записываться в консоль; оба варианта могут работать одновременно
log-console: true

#Если true, все события чата будут записываться в файл; оба варианта могут работать одновременно
log-local: true