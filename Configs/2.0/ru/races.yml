enable-races: true

creative-enabled: true
#Полезные ссылки для добавления ДАННЫХ:
#
#https://hub.spigotmc.org/javadocs/spigot/org/bukkit/entity/EntityType.html
#https://helpch.at/docs/1.8/index.html?org/bukkit/entity/EntityType.html
#https://hub.spigotmc.org/javadocs/bukkit/org/bukkit/Material.html
#https://helpch.at/docs/1.8/org/bukkit/Material.html

#Имена могут быть новыми или старыми (MOOSHROOM или MUSHROOM_COW, COD или RAW_FISH): они подбираются под версию
#вашего сервера. Имена, которых нет в вашей версии (напр. блок из 1.21 на 1.8), пропускаются, с заметкой в консоли.
#
#Каждая гонка также принимает (необязательно):
#  points: 1     #очки победителя (по умолчанию 1)
#  weight: 1     #как часто ротация выбирает её по сравнению с другими играми (по умолчанию 1, 0 = никогда)
#
#Админы могут запустить гонку со своими значениями: /chatgames <race> <material/mob> [amount]
#Без количества используется одно из указанных ниже для этого материала/существа. Победитель получает награды
#именно для этого материала и количества, или никаких, если их здесь нет (очки всё равно даются).

