help_command:
  - '&8&m-------------------------------------------------'
  - '&e&l-ChatGames-'
  - '&6'
  - '&6&lКОМАНДЫ:'
  - '&6'
  - '&e/chatgames menu [menu] &8- &7Открывает меню: профиль, испытания, серии, рейтинги (или любое меню из menus.yml).'
  - '&e/chatgames profile [player] &8- &7Показывает твою статистику (или другого игрока).'
  - '&e/chatgames top &8- &7Показывает 10 игроков с наибольшим числом очков.'
  - '&e/chatgames fastest [game] &8- &7Показывает самых быстрых победителей, всего или в одной игре.'
  - '&e/chatgames points [player] &8- &7Показывает твои очки (или другого игрока).'
  - '&e/chatgames challenges &8- &7Показывает твои ежедневные и еженедельные испытания.'
  - '&e/chatgames streaks &8- &7Показывает твои серии.'
  - '&e/chatgames claim &8- &7Забирает выполненные испытания и награды за серии.'
  - '&e/chatgames event [list|top <event>] &8- &7Показывает игровые события или кто набрал больше всех в событии.'
  - '&e/chatgames toggle [player] &8- &7Включает или выключает игры в чате для тебя.'
  - '&e/chatgames togglesound [player] &8- &7Включает или выключает звуки игр в чате.'
  - '&6'
  - '&6&lАДМИН:'
  - '&e/chatgames admin &8- &7Открывает меню администратора.'
  - '&e/chatgames debug &8- &7Открывает меню отладки: тестируй любую игру приватно, без наград.'
  - '&e/chatgames (game) [values] &8- &7Запускает эту игру сейчас, по желанию со своим словом/значениями.'
  - '&e/chatgames any &8- &7Запускает игру, которую ротация выбрала бы следующей.'
  - '&e/chatgames global <game> [values] &8- &7Запускает глобальную игру: весь сервер играет вместе.'
  - '&e/chatgames event start <event> | stop &8- &7Запускает или останавливает игровое событие.'
  - '&e/chatgames stop &8- &7Завершает текущую игру без победителя.'
  - '&e/chatgames toggleAll &8- &7Включает или выключает автоматическую ротацию игр.'
  - '&e/chatgames preset <list|load|save> [name] &8- &7Управляет пресетами игр.'
  - '&e/chatgames +points|-points|setpoints <player> <amount> &8- &7Меняет очки игрока.'
  - '&e/chatgames remove <player> &8- &7Удаляет данные игрока.'
  - '&e/chatgames challenges reset <player> &8- &7Очищает прогресс испытаний игрока.'
  - '&e/chatgames streak set <player> <challenge|daily|global> <days> &8- &7Устанавливает серию игрока.'
  - '&e/chatgames logs [amount] &8- &7Показывает последние логи игр.'
  - '&e/chatgames discord <test <message|all>|leaderboard> &8- &7Отправляет тестовое сообщение или таблицу лидеров в Discord.'
  - '&e/chatgames reload &8- &7Перезагружает файлы конфигурации.'
  - '&6'
  - '&6&lТИПЫ ИГР:'
  - '&7unscramble, unreverse, reaction, random, fillout, variable, clickable, math, sequence, memorize, guess_the_number, trivia, word_association, hoverable, hunt, mine, place, fish, craft, eat, furnace, tame, shear'
  - '&8&m-------------------------------------------------'

