#############################
#Общие для всех игр. Игра может заменить их своими 'hint_message' / 'countdown_actionbar' в своём разделе ниже.
hint_message: '&8[%prefix%&8] &eПодсказка: &f%hint%'
countdown_actionbar: '&7осталось &e%seconds%с'

waiting_for_other_winners: '&8[%prefix%&8] &aВерно! &fЖдём других победителей...'
wrong_case: '&8[%prefix%&8] &cПочти... Проверь заглавные буквы!'
  #МОЖНО ИСПОЛЬЗОВАТЬ "%display_name%" ВМЕСТО %player% В correct_message ВО ВСЕХ ИГРАХ.
  #
  #МОЖНО ТАКЖЕ ИСПОЛЬЗОВАТЬ %points_<position>%, ЧТОБЫ ПОКАЗАТЬ ОЧКИ ПОБЕДИВШЕГО ИГРОКА.
  #
  #Чтобы показать 1-го, 2-го, 3-го победителя и т. д., используйте %winner_<position>%, а для времени каждого %time_<position>%

  ##ПРИМЕР С 2 ПОБЕДИТЕЛЯМИ:
  #
  #correct_message:
  #- ''
  #- '<center>&r✓ ✯ %prefix% &r✯ ✓'
  #- ''
