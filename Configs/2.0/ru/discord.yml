#Публикует в Discord результаты игр, гонок, глобальных игр, событий и многое другое.
#
#Сообщения отправляются через вебхук канала (ничего устанавливать не нужно), через бота
#плагина DiscordSRV или обоими способами. Проверьте каждое сообщение: /chatgames discord test <message>.
enabled: true

#__КАНАЛЫ__
#Куда идут сообщения. Называйте их как угодно; у каждого уведомления ниже указаны его каналы.
#  webhook: URL вебхука канала. В Discord: Настроить канал > Интеграция > Вебхуки >
#           Новый вебхук > Копировать URL вебхука. Держите его в секрете: любой, у кого он есть, может туда писать.
#  discordsrv: публикует через вашего бота DiscordSRV (нужен DiscordSRV). Имя канала из
#              раздела Channels в config.yml DiscordSRV (например, global) или ID канала.
#  username / avatar: имя и картинка постов вебхука (бот оставляет свои).
channels:
  main:
    webhook: ''
    discordsrv: ''
    username: 'Chat Games'
    avatar: 'https://www.spigotmc.org/data/resource_icons/107/107781.jpg?1676494289'

#__ОБЩЕЕ__
#Показывается в подвалах как %server%
server-name: 'Minecraft Server'
#Картинка для %winner_head% / %player_head%. Подставляются %name% и %uuid%.
player-head-url: 'https://mc-heads.net/avatar/%name%/128'
#ID ролей, которые сообщения могут упоминать (пишите <@&ID> в тексте). Больше ничего никогда не упоминается: ни
#@everyone, ни что-либо в нике или ответе игрока.
#Чтобы получить ID, включите режим разработчика в Discord (Настройки > Расширенные) и нажмите правой кнопкой на роль.
allowed-role-pings: []
#С DiscordSRV %winner_mention% / %player_mention% показывают привязанный аккаунт Discord игрока
#(иначе его ник). true также упоминает его.
ping-linked-players: false
#Игры и гонки, которые никогда не публикуются
ignored-games: []

#Цвета (%game_color%) и эмодзи (%game_emoji%) для каждой игры. Цвета: '#RRGGBB' или название.
#Эмодзи: названия вроде :trophy: (список в конце этого файла) или эмодзи сервера как <:name:ID>.
#Не вставляйте символы эмодзи в этот файл: серверы 1.8 не могут прочитать файл с ними.
styles:
  default: {color: '#5865F2', emoji: ':video_game:'}
  unscramble: {color: '#F1C40F', emoji: ':abc:'}
  unreverse: {color: '#E67E22', emoji: ':repeat:'}
  reaction: {color: '#E74C3C', emoji: ':zap:'}
  random: {color: '#9B59B6', emoji: ':game_die:'}
  fillout: {color: '#3498DB', emoji: ':pencil2:'}
  variable: {color: '#1ABC9C', emoji: ':heavy_plus_sign:'}
  clickable: {color: '#2ECC71', emoji: ':point_up:'}
  hoverable: {color: '#16A085', emoji: ':eyes:'}
  math: {color: '#E91E63', emoji: ':heavy_division_sign:'}
  sequence: {color: '#00BCD4', emoji: ':1234:'}
  memorize: {color: '#8E44AD', emoji: ':brain:'}
  guess_the_number: {color: '#FF9800', emoji: ':question:'}
  trivia: {color: '#3F51B5', emoji: ':books:'}
  word_association: {color: '#009688', emoji: ':link:'}
  count: {color: '#607D8B', emoji: ':1234:'}
  hunt: {color: '#C0392B', emoji: ':crossed_swords:'}
  mine: {color: '#7F8C8D', emoji: ':pick:'}
  place: {color: '#A0522D', emoji: ':bricks:'}
  fish: {color: '#2980B9', emoji: ':fishing_pole_and_fish:'}
  eat: {color: '#D35400', emoji: ':poultry_leg:'}
  craft: {color: '#8D6E63', emoji: ':hammer_and_pick:'}
  furnace: {color: '#E25822', emoji: ':fire:'}
  tame: {color: '#C69C6D', emoji: ':bone:'}
  shear: {color: '#ECF0F1', emoji: ':scissors:'}

#Как записываются списки: победители, участники, результаты и таблицы лидеров.
#%medal% — медаль мест 1-3, а other-places — для остальных.
lists:
  medals: [':first_place:', ':second_place:', ':third_place:']
  other-places: '`%place%.`'
  winner: '%medal% **%player%** `%time%s`'
  contributor: '%medal% **%player%** `%amount%`'
  standing: '%medal% **%player%** `%points% очк.`'
  leaderboard: '%medal% **%player%** `%value%`'
  #Показывается вместо пустого списка
  empty: '-# Пока никого'

#__СООБЩЕНИЯ__
#У каждого сообщения есть 'content' (обычный текст над embed) и/или 'embed':
#  color, author (name, icon, url), title, url, description, thumbnail, image,
#  fields (name, value, inline), footer (text, icon), timestamp (true показывает время отправки).
#Текст может быть одной строкой или списком строк. Строка, в которой были только пустые плейсхолдеры,
#убирается, как и пустое поле. Плейсхолдеры PlaceholderAPI, которым не нужен игрок, тоже работают.
#Форматирование Discord работает в описаниях и значениях полей: '### ' начинает заголовок, '-# ' мелкий серый
#текст, '> ' цитату, **жирный**, `код`.
#<t:%ends_unix%:R> показывает "через 20 секунд" во времени каждого читателя с обратным отсчётом.
#В каждом сообщении: %server%, а в играх %game% %game_key% %game_emoji% %game_color%.

#Игры в чате. %question% %time_limit% %ends_unix% %winners_needed% %points%
games:
  enabled: true
  channels: [main]
  #true: публикует пост при старте игры, затем превращает его в результат. false: публикует только результат.
  live: true
  #Memorize никогда не показывает здесь свой список: игроки могли бы прочитать его в Discord.
  hidden-question: 'Смотрите в игровой чат!'
  start:
    embed:
      color: '%game_color%'
      author: '%game_emoji%  %game%'
      title: 'Новый раунд'
      description:
        - '### %question%'
        - '-# Ответьте в игровом чате, чтобы победить.'
      fields:
        - name: ':stopwatch: Конец'
          value: '<t:%ends_unix%:R>'
          inline: true
        - name: ':sparkles: Награда'
          value: '`%points% очк.`'
          inline: true
        - name: ':busts_in_silhouette: Победителей'
          value: '`%winners_needed%`'
          inline: true
      footer: '%server%'
  #%winner% %winner_head% %winner_mention% %time% %answer% %points% %winner_count%
  #%winners% (все победители, по одному в строке) %other_winners% (все, кроме первого)
  win:
    embed:
      color: '%game_color%'
      author: '%game_emoji%  %game%'
      title: ':trophy:  %winner% угадал(а)!'
      thumbnail: '%winner_head%'
      description:
        - '-# Ответ был'
        - '### %answer%'
      fields:
        - name: ':stopwatch: Время'
          value: '`%time%s`'
          inline: true
        - name: ':sparkles: Очки'
          value: '`+%points%`'
          inline: true
        - name: ':medal: Также ответили'
          value: '%other_winners%'
          inline: false
      footer: '%server%'
      timestamp: true
  #%answer% %question% %time_limit%
  expired:
    enabled: true
    embed:
      color: '#4E5058'
      author: '%game_emoji%  %game%'
      title: ':hourglass:  Время вышло'
      description:
        - '-# Никто не угадал. Ответ был'
        - '### %answer%'
      footer: '%server%'
      timestamp: true
  #Когда кто-то из персонала останавливает игру (только меняет живой пост)
  stopped:
    embed:
      color: '#4E5058'
      author: '%game_emoji%  %game%'
      title: ':no_entry:  Раунд остановлен'
      description:
        - '-# Сотрудник сервера завершил этот раунд досрочно.'
      footer: '%server%'
      timestamp: true

#Гонки. %target% %amount% %time_limit% %ends_unix% %points%
races:
  enabled: true
  channels: [main]
  live: true
  start:
    embed:
      color: '%game_color%'
      author: '%game_emoji%  Гонка: %game%'
      title: 'Гонка началась'
      description:
        - '### %amount%x %target%'
        - '-# Побеждает тот, кто закончит первым.'
      fields:
        - name: ':stopwatch: Конец'
          value: '<t:%ends_unix%:R>'
          inline: true
        - name: ':sparkles: Награда'
          value: '`%points% очк.`'
          inline: true
      footer: '%server%'
  #%winner% %winner_head% %winner_mention% %time% %points%
  win:
    embed:
      color: '%game_color%'
      author: '%game_emoji%  Гонка: %game%'
      title: ':checkered_flag:  %winner% выиграл(а) гонку!'
      thumbnail: '%winner_head%'
      description:
        - '### %amount%x %target%'
      fields:
        - name: ':stopwatch: Время'
          value: '`%time%s`'
          inline: true
        - name: ':sparkles: Очки'
          value: '`+%points%`'
          inline: true
      footer: '%server%'
      timestamp: true
  expired:
    enabled: true
    embed:
      color: '#4E5058'
      author: '%game_emoji%  Гонка: %game%'
      title: ':hourglass:  Время вышло'
      description:
        - '### %amount%x %target%'
        - '-# Никто не успел вовремя.'
      footer: '%server%'
      timestamp: true
  stopped:
    embed:
      color: '#4E5058'
      author: '%game_emoji%  Гонка: %game%'
      title: ':no_entry:  Гонка остановлена'
      description:
        - '-# Сотрудник сервера завершил эту гонку досрочно.'
      footer: '%server%'
      timestamp: true

#Глобальные игры, где весь сервер идёт к одной цели.
#%goal% (например, "500 Stone") %progress% %goal_amount% %percent% %bar% %contributors% %time_limit% %ends_unix%
global:
  enabled: true
  channels: [main]
  #true: пост показывает полосу прогресса и обновляется во время игры
  live: true
  #Как часто, самое большее, обновляется живой пост (только если прогресс изменился)
  update-seconds: 15
  bar: {length: 16, full: '█', empty: '░'}
  progress:
    embed:
      color: '%game_color%'
      author: ':globe_with_meridians:  Общая игра: %game%'
      title: 'Весь сервер играет вместе'
      description:
        - '### %goal%'
        - '`%bar%` **%percent%%**'
        - '-# %progress% / %goal_amount%'
      fields:
        - name: ':busts_in_silhouette: Помогают'
          value: '`%contributors%`'
          inline: true
        - name: ':stopwatch: Конец'
          value: '<t:%ends_unix%:R>'
          inline: true
      footer: '%server%'
  #%top_contributors% (самые активные участники, по одному в строке)
  completed:
    embed:
      color: '#57F287'
      author: ':globe_with_meridians:  Общая игра: %game%'
      title: ':tada:  Цель достигнута!'
      description:
        - '### %goal%'
        - '`%bar%` **%percent%%**'
      fields:
        - name: ':medal: Лучшие помощники'
          value: '%top_contributors%'
          inline: true
        - name: ':busts_in_silhouette: Помогли'
          value: '`%contributors%`'
          inline: true
      footer: '%server%'
      timestamp: true
  failed:
    embed:
      color: '#ED4245'
      author: ':globe_with_meridians:  Общая игра: %game%'
      title: ':x:  Цель не достигнута'
      description:
        - '### %goal%'
        - '`%bar%` **%percent%%**'
        - '-# %progress% / %goal_amount%'
      fields:
        - name: ':medal: Лучшие помощники'
          value: '%top_contributors%'
          inline: true
      footer: '%server%'
      timestamp: true
  #Сколько участников перечисляет %top_contributors%
  top-size: 5

#Игровые события (events.yml). %event%
events:
  enabled: true
  channels: [main]
  #%games% (сколько в нём игр)
  start:
    embed:
      color: '#FEE75C'
      author: ':calendar:  Игровое событие'
      title: '%event% начинается!'
      description:
        - '-# Выигрывайте игры подряд, чтобы получить очки события.'
      fields:
        - name: ':video_game: Игры'
          value: '`%games%`'
          inline: true
      footer: '%server%'
      timestamp: true
  #%standings% %players% (сколько набрали очки) %winner% %winner_head% %winner_mention%
  end:
    embed:
      color: '#FEE75C'
      author: ':calendar:  Игровое событие'
      title: ':trophy:  Итоги: %event%'
      thumbnail: '%winner_head%'
      description:
        - '%standings%'
      fields:
        - name: ':crown: Победитель'
          value: '%winner_mention%'
          inline: true
        - name: ':busts_in_silhouette: Игроки'
          value: '`%players%`'
          inline: true
      footer: '%server%'
      timestamp: true
  #Сколько мест перечисляет %standings%
  standings-size: 10

#Серия игрока достигает числа дней подряд (streaks.yml). %player% %player_head% %player_mention% %streak% %days%
streaks:
  enabled: false
  channels: [main]
  #Публикуются только эти числа дней
  days: [7, 14, 30, 60, 100, 365]
  message:
    embed:
      color: '#E67E22'
      author: {name: '%player%', icon: '%player_head%'}
      title: ':fire:  %days% дн. подряд!'
      description:
        - '-# %streak%'
      footer: '%server%'
      timestamp: true

#Игрок выполняет ежедневное или еженедельное испытание. %player% %player_head% %player_mention% %challenge% %period%
challenges:
  enabled: false
  channels: [main]
  #Что показывает %period%
  periods:
    daily: 'Ежедневное'
    weekly: 'Еженедельное'
  message:
    embed:
      color: '#57F287'
      author: {name: '%player%', icon: '%player_head%'}
      title: ':white_check_mark:  Испытание выполнено'
      description:
        - '### %challenge%'
        - '-# %period% испытание'
      footer: '%server%'
      timestamp: true

#Таблица лидеров, публикуемая в заданное время и по /chatgames discord leaderboard.
#%leaderboard% %total_points% (все игроки вместе)
leaderboard:
  enabled: false
  channels: [main]
  #Время сервера, 24 часа, например ['12:00', '20:00']
  times: ['20:00']
  #points или fastest (самые быстрые ответы во всех играх)
  type: points
  size: 10
  message:
    embed:
      color: '#5865F2'
      author: ':bar_chart:  Таблица лидеров'
      title: 'Лучшие игроки'
      description:
        - '%leaderboard%'
        - ''
        - '-# Всего выиграно очков: %total_points%'
      footer: '%server%'
      timestamp: true

