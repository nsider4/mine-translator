  #Не меняйте это
  case-sensitive: false
  #Время в секундах, которое у игроков есть, чтобы угадать, решить, написать и т. д.
  timeToGuess_seconds: 20

  #__Оставьте 2 следующих пустыми, чтобы отключить их__
  titleMessage: '&bРЕШИ'
  subtitleMessage: '&aДля &7`&b%symbol%&7`'

  #Диапазон случайного числа результата
  result-min: 20
  result-max: 100

  toGet: '✗'
  #Другие символы, которые можно добавить: ✪❃✿✠❂♫♪❦♡♤♢✦☾☽✹
  data:
    - '✯;10'
    - '♛;15'
    - '❅;20'
    - '♫;25'

sequence:
  enable: true
  winners: 1
  weight: 1
  points: 1
  hints:
    enable: true
    after-percent: 50
    max: 1
  countdown:
    enable: true
    last-seconds: 10

  #Не меняйте это
  case-sensitive: false

  #Время в секундах, которое у игроков есть, чтобы угадать, решить, написать и т. д.
  timeToGuess_seconds: 25

  #Игроки видят ряд чисел и пишут следующее, напр. "3, 6, 12, 24, ?" -> 48
  #Шаблоны: сложение (3, 7, 11), умножение (2, 6, 18), квадраты (4, 9, 16), чередование (5, 9, 7, 11), фибоначчи (2, 3, 5, 8)
  patterns:
    - add
    - multiply
    - squares
    - alternating
    - fibonacci
  #1-3. Высокая сложность разрешает более трудные шаблоны (квадраты и чередование с 2, фибоначчи на 3) и большие числа.
  difficulty: 2
  #Сколько чисел показывается перед '?' (4-8)
  shown-terms: 5

  #__Оставьте 2 следующих пустыми, чтобы отключить их__
  titleMessage: '&b%selection%'
  subtitleMessage: '&aПродолжи ряд'

