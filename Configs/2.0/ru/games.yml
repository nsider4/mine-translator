#Настройки, которые принимает каждая игра (если какой-то нет, действует показанное значение по умолчанию):
#  enable: true/false
#  weight: 1             Насколько охотно ротация выбирает эту игру по сравнению с другими (0 = никогда).
#                        Одна и та же игра никогда не идёт два раза подряд.
#  winners: 1            Сколько игроков могут выиграть каждый раунд.
#  points: 1             Очки за победу (/chatgames top).
#  case-sensitive: false Кто ответил верно, кроме регистра букв, получает сообщение 'wrong_case'.
#  timeToGuess_seconds: 20
#  min-answer-ms: 400    Более быстрые правильные ответы игнорируются и записываются в лог: никто не читает и не печатает
#                        так быстро, а боты — да. 0 отключает проверку.
#  hints:                Подсказки во время раунда, с 'hint_message' из messages.yml.
#    enable: false
#    after-percent: 50   Первая подсказка появляется, когда прошёл этот процент времени; остальные распределяются по оставшемуся времени.
#    max: 1              До 3.
#  countdown:            Оставшееся время, на панели действий. Работает на любой версии (от 1.8 до 26.x).
#    enable: false
#    last-seconds: 10    Только в последние N секунд; 0 показывает его весь раунд.
#  titleMessage / subtitleMessage: оставьте оба пустыми, чтобы не отправлять заголовок.
unscramble:
  enable: true
  winners: 1
  weight: 1
  points: 1
  hints:
    enable: true
    after-percent: 50
    max: 1
  countdown:
    enable: true
    last-seconds: 10

  case-sensitive: true
  #Время в секундах, которое у игроков есть, чтобы угадать, решить, написать и т. д.
  timeToGuess_seconds: 20
  #__Оставьте 2 следующих пустыми, чтобы отключить их__
  titleMessage: '&b%selection%'
  subtitleMessage: '&aРасшифруй'

