  enable: true
  winners: 1
  weight: 1
  points: 1
  hints:
    enable: true
    after-percent: 50
    max: 1
  countdown:
    enable: true
    last-seconds: 10

  case-sensitive: false

  listLength: 3
  #Каждый раунд берёт элементы из одного из этих списков (см. words.yml -> memorize.pools):
  #shopping_list, words, colors, numbers, blocks, mobs или ваш собственный список
  pools:
    - shopping_list
    - words
    - colors
    - numbers
    - blocks
    - mobs
  #Если false, элементы можно писать в любом порядке
  order-matters: true

  #Время в секундах, которое у игроков есть, чтобы запомнить, решить, написать и т. д.
  timeToMemorize: 7

  #Время в секундах, которое у игроков есть, чтобы угадать, решить, написать и т. д.
  timeToGuess_seconds: 20
  #Оставьте 2 следующих пустыми, чтобы отключить их
  titleMessage: '&bЗАПОМНИ'
  subtitleMessage: '&aПопробуй запомнить этот список!'

