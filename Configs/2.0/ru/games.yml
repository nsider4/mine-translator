#В этой игре создаётся строка заданной длины из случайных символов
random:
  enable: true
  winners: 1
  weight: 1
  points: 1
  countdown:
    enable: true
    last-seconds: 10

  case-sensitive: true
  #Время в секундах, которое у игроков есть, чтобы угадать, решить, написать и т. д.
  timeToGuess_seconds: 20
  #Длина случайной строки этой игры. Формат диапазона <min>-<max>. Для одной длины укажите одно число с обеих сторон
  lengthRange: 6-8
  #Доступные типы: ALPHA (буквы), ALPHANUMERIC (буквы и цифры), NUMERIC (цифры), SYMBOLIC (символы),
  #LOWERCASE_ALPHA (только строчные), UPPERCASE_ALPHA (только заглавные), HEXADECIMAL (шестнадцатеричные символы: 0123456789ABCDEF)
  #CUSTOM (использует то, что указано в 'custom_characters')
  character_type: ALPHANUMERIC
  #Эта строка используется, только если тип — "CUSTOM"
  custom_characters: 'abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789'

  #__Оставьте 2 следующих пустыми, чтобы отключить их__
  titleMessage: '&b%selection%'
  subtitleMessage: '&aНапиши'

math:
  enable: true
  winners: 1
  weight: 1
  points: 1
  hints:
    enable: true
    after-percent: 50
    max: 1
  countdown:
    enable: true
    last-seconds: 10

  #Не меняйте это
  case-sensitive: false
  #Время в секундах, которое у игроков есть, чтобы угадать, решить, написать и т. д.
  timeToGuess_seconds: 20
  #Диапазоны случайных чисел для каждой сложности:
  #1 - (1-9)
  #2 - (1-99)
  #3 - (1-999)
  #4 - (1-9999)
  #5 - (1-99999)
  difficulty: 2
  #Сколько операторов в каждом вопросе: 1 -> "12 + 7", 2 -> "12 + 7 x 3"
  operations: 1
  #solve: вычислить результат ("12 + 7 x 3").  missing-value: найти скрытое число ("12 + ? x 3 = 33").
  #Каждый раунд выбирает один из перечисленных режимов.
  modes:
    - solve
    - missing-value
  #Используемые операторы; доступны четыре перечисленных, уберите ненужные. Всегда оставляйте хотя бы 1
  #Деление всегда даёт целые числа.
  operators:
    - '+'
    - '-'
    - 'x'
    - '/'

  #__Оставьте 2 следующих пустыми, чтобы отключить их__
  titleMessage: '&b%selection%'
  subtitleMessage: '&aРеши'

variable:
  enable: true
  winners: 1
  weight: 1
  points: 1
