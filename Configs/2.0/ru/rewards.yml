#ВОЗМОЖНЫЕ ДЕЙСТВИЯ:
#
#[playercmd] - Выполняет команду от имени победителя
#[consolecmd] - Выполняет команду из консоли
#[playermsg] - Отправляет сообщение победителю
#[broadcast] - Отправляет сообщение всем игрокам во включённых мирах
#[player_as_op] - Выполняет команду от имени игрока как оператор
#
#ДОБАВЬТЕ ШАНСЫ К НАГРАДАМ ТАК:
#
#ПРИМЕР:
#  - '10.0%~ [consolecmd] give %player% iron_block 5'
#РАБОТАЕТ, ТОЛЬКО ЕСЛИ ФОРМАТ ТАКОЙ ЖЕ, КАК В ПРИМЕРЕ: <chance>% В НАЧАЛЕ, ЗАТЕМ ~ И ПРОБЕЛ. ВСЕГДА ПЕРВЫМ В КОМАНДЕ
#
#КОМАНДЫ БЕЗ % — ЭТО НАГРАДЫ, ВЫДАВАЕМЫЕ НА 100%.

#ПРОВЕРКА ПРАВ:
#
#ПОСТАВЬТЕ В КОНЕЦ СТРОКИ КОМАНДЫ.
#Пример:
#  - '[consolecmd] give %player% iron_block 5 has:test.permission'

#1 — для ПЕРВОГО победителя; ЕСЛИ ВЫ ДОБАВИТЕ БОЛЬШЕ ПОБЕДИТЕЛЕЙ В config.yml И ХОТИТЕ ДРУГИЕ НАГРАДЫ, ДОБАВЬТЕ ИХ МЕСТО (2:, и т. д.)
unscramble:
  rewards:
    1:
      reward_1:
        minimum-players: 2 #Условие по игрокам онлайн: награда может выпасть, только если онлайн 2 или больше игроков
        chance: 50
        data:
          - '10.0%~ [consolecmd] give %player% diamond_block 3 has:test.permission'
          - '[consolecmd] give %player% iron_block 5'
      reward_2:
        data:
          - '[consolecmd] give %player% iron_block 2'

