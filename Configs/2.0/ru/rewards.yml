#ДАЛЕЕ ИДУТ НАГРАДЫ ЗА ГОНКИ, В КОТОРЫХ ТОЛЬКО 1 ПОБЕДИТЕЛЬ
#
#ИСПОЛЬЗУЕТСЯ ДРУГОЙ ФОРМАТ! ЧИТАЙТЕ ВНИМАТЕЛЬНО

races:
  rewards:
    #ЭТО НАГРАДЫ, КОТОРЫЕ ВЫ УКАЗЫВАЕТЕ В 'races.yml'
    reward_1:
      chance: 50
      data:
        - '60.0%~ [consolecmd] give %player% diamond_block 5'
    #ЕСЛИ УБРАТЬ ЗНАЧЕНИЕ 'chance', НАГРАДА/КОМАНДА БУДЕТ СРАБАТЫВАТЬ ВСЕГДА
    reward_2:
      data:
        - '[consolecmd] give %player% iron_block 5'
        - '[playermsg] &aТы победил!'
    reward_3:
      chance: 50
      data:
        - '[consolecmd] give %player% diamond_block 3'