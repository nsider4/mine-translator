#У цій грі створюється рядок заданої довжини з випадкових символів
random:
  enable: true
  winners: 1
  weight: 1
  points: 1
  countdown:
    enable: true
    last-seconds: 10

  case-sensitive: true
  #Час у секундах, який гравці мають, щоб вгадати, розв'язати, написати тощо.
  timeToGuess_seconds: 20
  #Довжина випадкового рядка для цієї гри. Формат діапазону <lower>-<higher>. Для однієї довжини поставте те саме число з обох боків
  lengthRange: 6-8
  #Доступні типи: ALPHA (літери), ALPHANUMERIC (літери й цифри), NUMERIC (цифри), SYMBOLIC (символи),
  #LOWERCASE_ALPHA (усі малі літери), UPPERCASE_ALPHA (усі великі літери), HEXADECIMAL (шістнадцяткові символи: 0123456789ABCDEF)
  #CUSTOM (використовує те, що в 'custom_characters')
  character_type: ALPHANUMERIC
  #Цей рядок використовується, лише якщо type — "CUSTOM"
  custom_characters: 'abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789'

  #__Залиште наступні 2 порожніми, щоб вимкнути їх__
  titleMessage: '&b%selection%'
  subtitleMessage: '&aНапиши'

math:
  enable: true
  winners: 1
  weight: 1
  points: 1
  hints:
    enable: true
    after-percent: 50
    max: 1
  countdown:
    enable: true
    last-seconds: 10

  #Не змінюйте це
  case-sensitive: false
  #Час у секундах, який гравці мають, щоб вгадати, розв'язати, написати тощо.
  timeToGuess_seconds: 20
  #Діапазони випадкових чисел за складністю:
  #1 - (1-9)
  #2 - (1-99)
  #3 - (1-999)
  #4 - (1-9999)
  #5 - (1-99999)
  difficulty: 2
  #Скільки операторів має кожне питання: 1 -> "12 + 7", 2 -> "12 + 7 x 3"
  operations: 1
  #solve: обчислити результат ("12 + 7 x 3").  missing-value: знайти приховане число ("12 + ? x 3 = 33").
  #Кожен раунд обирає один із перелічених режимів.
  modes:
    - solve
    - missing-value
  #Оператори для використання; чотири перелічені — це всі доступні, можна прибрати непотрібні. Завжди залишайте хоча б 1
  #Ділення завжди дає ціле число.
  operators:
    - '+'
    - '-'
    - 'x'
    - '/'

  #__Залиште наступні 2 порожніми, щоб вимкнути їх__
  titleMessage: '&b%selection%'
  subtitleMessage: '&aОбчисли'

