#Налаштування, які приймає кожна гра (відсутнє бере показане типове значення):
#  enable: true/false
#  weight: 1             Наскільки ймовірно, що ротація обере цю гру порівняно з іншими (0 = ніколи).
#                        Та сама гра ніколи не йде двічі поспіль.
#  winners: 1            Скільки гравців можуть виграти кожен раунд.
#  points: 1             Очки за перемогу (/chatgames top).
#  case-sensitive: false Гравці, які помилилися лише в регістрі, отримують повідомлення 'wrong_case'.
#  timeToGuess_seconds: 20
#  min-answer-ms: 400    Правильні відповіді, швидші за це, ігноруються й записуються: ніхто не читає й не друкує
#                        так швидко, а чат-боти — так. 0 вимикає перевірку.
#  hints:                Підказки з'являються під час раунду, через 'hint_message' у messages.yml.
#    enable: false
#    after-percent: 50   Перша підказка з'являється, коли мине стільки часу; інші розподіляються на решту.
#    max: 1              До 3.
#  countdown:            Час, що залишився, на панелі дій. Працює на всіх версіях (від 1.8 до 26.x).
#    enable: false
#    last-seconds: 10    Лише впродовж останніх N секунд; 0 показує його весь раунд.
#  titleMessage / subtitleMessage: залиште обидва порожніми, щоб не надсилати заголовок.
unscramble:
  enable: true
  winners: 1
  weight: 1
  points: 1
  hints:
    enable: true
    after-percent: 50
    max: 1
  countdown:
    enable: true
    last-seconds: 10

  case-sensitive: true
  #Час у секундах, який гравці мають, щоб вгадати, розв'язати, написати тощо.
  timeToGuess_seconds: 20
  #__Залиште наступні 2 порожніми, щоб вимкнути їх__
  titleMessage: '&b%selection%'
  subtitleMessage: '&aРозплутай'

