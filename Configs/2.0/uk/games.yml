  timeToGuess_seconds: 25

  #Гравці бачать послідовність чисел і пишуть наступне, напр. "3, 6, 12, 24, ?" -> 48
  #Закономірності: додавання (3, 7, 11), множення (2, 6, 18), квадрати (4, 9, 16), чергування (5, 9, 7, 11), Фібоначчі (2, 3, 5, 8)
  patterns:
    - add
    - multiply
    - squares
    - alternating
    - fibonacci
  #1-3. Вища складність дає складніші закономірності (квадрати й чергування з 2, Фібоначчі на 3) і більші числа.
  difficulty: 2
  #Скільки чисел показується перед '?' (4-8)
  shown-terms: 5

  #__Залиште наступні 2 порожніми, щоб вимкнути їх__
  titleMessage: '&b%selection%'
  subtitleMessage: '&aПродовж послідовність'

