      name: '&dЗбирач очок'
      description: '&7Зароби %amount% очок'
      icon: EXPERIENCE_BOTTLE
      rewards:
        - '[consolecmd] give %player% iron_ingot 8'
    global_1:
      type: PLAY_GLOBAL
