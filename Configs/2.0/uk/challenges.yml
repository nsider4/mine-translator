  enabled: true
  #День, з якого починається кожен тиждень.
  reset-day: MONDAY
  mode: fixed
  amount: 3
  challenges:
    win_25:
      type: WIN_GAMES
      amount: 25
      name: '&6Чемпіон тижня'
      description: '&7Виграй %amount% чат-ігор цього тижня'
