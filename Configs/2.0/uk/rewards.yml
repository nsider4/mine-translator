#ДАЛІ — НАГОРОДИ ДЛЯ ПЕРЕГОНІВ, ДЕ Є ЛИШЕ 1 ПЕРЕМОЖЕЦЬ
#
#ВИКОРИСТОВУЄТЬСЯ ІНШИЙ ФОРМАТ! ЧИТАЙТЕ УВАЖНО

races:
  rewards:
    #ЦЕ НАГОРОДИ, ЯКІ ВИ ВКАЗУЄТЕ В 'races.yml'
    reward_1:
      chance: 50
      data:
        - '60.0%~ [consolecmd] give %player% diamond_block 5'
    #ЯКЩО ПРИБРАТИ ЗНАЧЕННЯ 'chance', НАГОРОДА/КОМАНДА СПРАЦЬОВУВАТИМЕ ЗАВЖДИ
    reward_2:
      data:
        - '[consolecmd] give %player% iron_block 5'
        - '[playermsg] &aТи переміг!'
    reward_3:
      chance: 50
      data:
        - '[consolecmd] give %player% diamond_block 3'