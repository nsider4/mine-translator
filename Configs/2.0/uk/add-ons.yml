#Налаштування Discord — у discord.yml.

#Файл, у який зберігатимуться журнали
log-file: 'game_log.txt'

#Якщо true, усі події чату записуватимуться в консоль; обидва варіанти можуть працювати одночасно
log-console: true

#Якщо true, усі події чату записуватимуться у файл; обидва варіанти можуть працювати одночасно
log-local: true