countdown_actionbar: '&7Залишилось &e%seconds%с'

waiting_for_other_winners: '&8[%prefix%&8] &aПравильно! &fЧекаємо на інших переможців...'
wrong_case: '&8[%prefix%&8] &cМайже... Перевір великі й малі літери!'
  #У correct_message УСІХ ІГОР МОЖНА ВИКОРИСТОВУВАТИ "%display_name%" ЗАМІСТЬ %player%.
  #
  #ТАКОЖ МОЖНА ВИКОРИСТОВУВАТИ %points_<position>%, ЩОБ ПОКАЗАТИ ОЧКИ ГРАВЦЯ, ЯКИЙ ВИГРАВ.
  #
  #Щоб показати 1-го, 2-го, 3-го переможця тощо, використовуйте %winner_<position>%, а для часу кожного — %time_<position>%

