  unscramble: 'Розплутай'
  unreverse: 'Переверни'
  reaction: 'Реакція'
  guess_the_number: 'Вгадай число'
  clickable: 'Натискання'
  fillout: 'Заповни пропуски'
  hoverable: 'Наведення'
  random: 'Випадкові символи'
  math: 'Математика'
  variable: 'Змінна'
  sequence: 'Послідовність'
  memorize: 'Запам''ятай'
  word_association: 'Асоціації'
  trivia: 'Вікторина'
  count: 'Рахунок'
  hunt: 'Полювання'
  mine: 'Видобуток'
  place: 'Будівництво'
  fish: 'Риболовля'
  eat: 'Їжа'
  craft: 'Крафт'
  furnace: 'Готування'
