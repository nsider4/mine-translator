#МЕНЮ
#
#Кожне меню в 'menus:' має 'title', розмір у 'rows' (1-6) і свої 'items'. Можна змінити,
#що робить будь-яка кнопка, додати кнопки або цілі нові меню (відкриваються через /chatgames menu <id>,
#або покладіть кожне в окремий файл у теці menus/ з назвою <id>.yml).
#
#Кожен предмет:
#  slot: де він стоїть, від 0 (угорі ліворуч) до rows*9-1. 'slots: [0, 1, '9-17']' повторює його.
#  material: будь-яка назва предмета від 1.8 до 26.x: нові або старі назви (lime_dye / INK_SACK:10 / 351:10),
#            або 'head:<ім'я гравця, текстура або URL textures.minecraft.net>'
#  name / lore: працюють коди кольорів (&a, і &#RRGGBB на 1.16+) та заповнювачі PlaceholderAPI.
#  amount, glow: true, enchantments: ['SHARPNESS:1'], flags: [HIDE_ATTRIBUTES], head: '%player%',
#  custom-model-data: 1001 (1.14+), item-model: 'namespace:key' (1.21.2+), color: '#FF0000' (шкіра)
#  actions: що робить натискання, по порядку. Також left-actions, right-actions, shift-left-actions,
#           shift-right-actions, middle-actions і drop-actions (кожна за відсутності бере actions).
#  view-requirements: предмет показується, лише коли проходить кожен рядок
#  click-requirements: коли рядок не проходить, замість actions виконуються 'deny-actions'
#  state + when-off: коли state хибний, ключі з when-off замінюють власні ключі предмета
#                    (не 'off': YAML читає просте off як false)
#Приберіть предмет, щоб сховати його. 'filler' заповнює кожне порожнє місце; приберіть його, щоб не було нічого.
#
#Дії:
#  [command] <command>        команду виконуєте ви        [console] <command>   її виконує консоль
#  [message] <text>           повідомлення вам            [broadcast] <text>    усім
#  [sound] <sound> [volume] [pitch]   будь-яка назва звуку від 1.8 до 26.x
#  [open] <menu> [values]     відкриває інше меню         [switch] <menu> [values]  те саме, але [back] його пропускає
#  [back] [menu]              попереднє меню (або вказане, або закриває)
#  [refresh]  [close]  [next-page]  [previous-page]  [wait] <ticks>
#  [chatgames:no-permission]  надсилає повідомлення про брак дозволу
#  Дії окремих меню описано над меню, у яких вони є.
#
#Вимоги, по одній на рядок (кожен рядок має пройти; почніть рядок із !, щоб обернути його):
#  permission <node>     порівняння на кшталт '%chatgames_points% >= 100' (==, !=, >=, <=, >, <)
#  або значення true / on / yes / число, відмінне від 0
#
#Меню-списки (завдання, ігри, події...) розміщують записи в 'list-slots' по порядку,
#за 'templates' меню. Коли записів більше, ніж місць, предмети з діями
#[next-page] / [previous-page] гортають сторінки; вони ховаються, коли гортати нікуди.
#Рядок lore, що містить лише заповнювач списку, як-от '%game_wins%', стає кількома рядками.
#Кожне меню також має %player%, %page%, %pages% і %entries% (скільки записів у списку).

#Назви та значки ігор у кожному меню й у повідомленнях, що називають гру (%game%).
#Гра, якої тут немає, називається за своїм ключем.
