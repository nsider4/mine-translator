enable-races: true

creative-enabled: true
#Корисні посилання для додавання ДАНИХ:
#
#https://hub.spigotmc.org/javadocs/spigot/org/bukkit/entity/EntityType.html
#https://helpch.at/docs/1.8/index.html?org/bukkit/entity/EntityType.html
#https://hub.spigotmc.org/javadocs/bukkit/org/bukkit/Material.html
#https://helpch.at/docs/1.8/org/bukkit/Material.html

#Назви можуть бути новими або старими (MOOSHROOM або MUSHROOM_COW, COD або RAW_FISH): вони зіставляються з версією
#вашого сервера. Назви, яких немає у вашій версії (напр. блок 1.21 на 1.8), пропускаються з приміткою в консолі.
#
#Кожні перегони також приймають (необов'язково):
#  points: 1     #очки, які отримує переможець (типово 1)
#  weight: 1     #як часто ротація обирає їх порівняно з іншими іграми (типово 1, 0 = ніколи)
#
#Адміни можуть почати перегони з власними значеннями: /chatgames <race> <material/mob> [amount]
#Без кількості використовується одна з перелічених нижче для того матеріалу/моба. Переможець отримує нагороди,
#перелічені саме для того матеріалу й кількості, або жодних, якщо їх тут немає (очки все одно даються).

hunt:
  enable: true

  timeToComplete_seconds: 180
  #__Залиште наступні 2 порожніми, щоб вимкнути їх__
  titleMessage: '&bПОЛЮВАННЯ'
  subtitleMessage: '&aВбий %amount% %value%!'

  #Чи рахувати мобів, що з'явилися зі спавнерів або яєць появи.
  count-spawner-mobs: true
  #Чи рахуються моби MythicMobs як моб, на якому вони засновані (зомбі MythicMobs як ZOMBIE).
