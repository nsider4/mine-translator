#TỪ ĐÂY TRỞ ĐI LÀ PHẦN THƯỞNG CHO CÁC CUỘC ĐUA CHỈ CÓ 1 NGƯỜI THẮNG
#
#DÙNG ĐỊNH DẠNG KHÁC! HÃY ĐỌC KỸ

races:
  rewards:
    #ĐÂY LÀ PHẦN THƯỞNG BẠN ĐẶT TRONG 'races.yml'
    reward_1:
      chance: 50
      data:
        - '60.0%~ [consolecmd] give %player% diamond_block 5'
    #XÓA GIÁ TRỊ 'chance' SẼ KHIẾN PHẦN THƯỞNG/LỆNH LUÔN XẢY RA
    reward_2:
      data:
        - '[consolecmd] give %player% iron_block 5'
        - '[playermsg] &aBạn đã thắng!'
    reward_3:
      chance: 50
      data:
        - '[consolecmd] give %player% diamond_block 3'