#Gửi kết quả trò chơi, cuộc đua, trò chơi toàn cầu, sự kiện và hơn thế lên Discord.
#
#Tin nhắn được gửi qua webhook của kênh (không cần cài gì), qua bot của
#plugin DiscordSRV, hoặc cả hai. Thử từng tin nhắn bằng /chatgames discord test <message>.
enabled: true

#__KÊNH__
#Nơi tin nhắn được gửi tới. Đặt tên tùy ý; mỗi thông báo bên dưới liệt kê các kênh nó dùng.
#  webhook: URL webhook của kênh. Trong Discord: Chỉnh sửa kênh > Tích hợp > Webhook >
#           Webhook mới > Sao chép URL webhook. Hãy giữ bí mật: ai có nó đều đăng được vào đó.
#  discordsrv: đăng bằng bot DiscordSRV của bạn (cần DiscordSRV). Tên kênh trong
#              mục Channels của config.yml của DiscordSRV (vd. global), hoặc ID kênh.
#  username / avatar: tên và ảnh hiển thị trên bài đăng webhook (bot giữ tên và ảnh riêng).
channels:
  main:
    webhook: ''
    discordsrv: ''
    username: 'Chat Games'
    avatar: 'https://www.spigotmc.org/data/resource_icons/107/107781.jpg?1676494289'

#__CHUNG__
#Hiển thị ở chân trang dưới dạng %server%
server-name: 'Minecraft Server'
#Ảnh cho %winner_head% / %player_head%. %name% và %uuid% được điền vào.
player-head-url: 'https://mc-heads.net/avatar/%name%/128'
#ID vai trò mà tin nhắn có thể ping (ghi <@&ID> trong văn bản). Không có gì khác được ping: không
#@everyone, và không có gì trong tên hay câu trả lời của người chơi.
#Để lấy ID, bật Chế độ nhà phát triển trong Discord (Cài đặt > Nâng cao), rồi nhấn chuột phải vào vai trò.
allowed-role-pings: []
#Với DiscordSRV, %winner_mention% / %player_mention% hiển thị tài khoản Discord đã liên kết của người chơi
#(nếu không thì tên của họ). true sẽ ping họ.
ping-linked-players: false
#Trò chơi và cuộc đua không bao giờ được đăng
ignored-games: []

#Màu (%game_color%) và emoji (%game_emoji%) cho từng trò. Màu: '#RRGGBB' hoặc tên màu.
#Emoji: tên như :trophy: (danh sách ở cuối tệp này), hoặc emoji máy chủ dạng <:name:ID>.
#Đừng dán ký tự emoji vào tệp này: máy chủ 1.8 không đọc được tệp có chúng.
styles:
  default: {color: '#5865F2', emoji: ':video_game:'}
  unscramble: {color: '#F1C40F', emoji: ':abc:'}
  unreverse: {color: '#E67E22', emoji: ':repeat:'}
  reaction: {color: '#E74C3C', emoji: ':zap:'}
  random: {color: '#9B59B6', emoji: ':game_die:'}
  fillout: {color: '#3498DB', emoji: ':pencil2:'}
  variable: {color: '#1ABC9C', emoji: ':heavy_plus_sign:'}
  clickable: {color: '#2ECC71', emoji: ':point_up:'}
  hoverable: {color: '#16A085', emoji: ':eyes:'}
  math: {color: '#E91E63', emoji: ':heavy_division_sign:'}
  sequence: {color: '#00BCD4', emoji: ':1234:'}
  memorize: {color: '#8E44AD', emoji: ':brain:'}
  guess_the_number: {color: '#FF9800', emoji: ':question:'}
  trivia: {color: '#3F51B5', emoji: ':books:'}
  word_association: {color: '#009688', emoji: ':link:'}
  count: {color: '#607D8B', emoji: ':1234:'}
  hunt: {color: '#C0392B', emoji: ':crossed_swords:'}
  mine: {color: '#7F8C8D', emoji: ':pick:'}
  place: {color: '#A0522D', emoji: ':bricks:'}
  fish: {color: '#2980B9', emoji: ':fishing_pole_and_fish:'}
  eat: {color: '#D35400', emoji: ':poultry_leg:'}
  craft: {color: '#8D6E63', emoji: ':hammer_and_pick:'}
  furnace: {color: '#E25822', emoji: ':fire:'}
  tame: {color: '#C69C6D', emoji: ':bone:'}
  shear: {color: '#ECF0F1', emoji: ':scissors:'}

#Cách ghi danh sách: người thắng, người đóng góp, thứ hạng và bảng xếp hạng.
#%medal% là huy chương cho hạng 1-3, và other-places cho các hạng còn lại.
lists:
  medals: [':first_place:', ':second_place:', ':third_place:']
  other-places: '`%place%.`'
  winner: '%medal% **%player%** `%time%s`'
  contributor: '%medal% **%player%** `%amount%`'
  standing: '%medal% **%player%** `%points% điểm`'
  leaderboard: '%medal% **%player%** `%value%`'
  #Hiển thị thay cho danh sách trống
  empty: '-# Chưa có ai'

#__TIN NHẮN__
#Mỗi tin nhắn có 'content' (văn bản thường phía trên embed) và/hoặc 'embed':
#  color, author (name, icon, url), title, url, description, thumbnail, image,
#  fields (name, value, inline), footer (text, icon), timestamp (true hiển thị thời điểm gửi).
#Văn bản có thể là một dòng hoặc danh sách dòng. Dòng chỉ có placeholder trống
#sẽ bị bỏ, trường để trống cũng vậy. Placeholder của PlaceholderAPI không cần người chơi cũng dùng được.
#Định dạng Discord dùng được trong mô tả và giá trị trường: '### ' bắt đầu tiêu đề, '-# ' chữ nhỏ màu
#xám, '> ' trích dẫn, **đậm**, `mã`.
#<t:%ends_unix%:R> hiển thị "sau 20 giây" theo giờ của từng người đọc, đếm ngược.
#Trong mọi tin nhắn: %server%, và với trò chơi là %game% %game_key% %game_emoji% %game_color%.

#Trò chơi chat. %question% %time_limit% %ends_unix% %winners_needed% %points%
games:
  enabled: true
  channels: [main]
  #true: đăng khi trò bắt đầu, rồi sửa bài đó thành kết quả. false: chỉ đăng kết quả.
  live: true
  #Ghi nhớ không bao giờ hiện danh sách ở đây: người chơi có thể đọc nó trên Discord.
  hidden-question: 'Xem khung chat trong game!'
  start:
    embed:
      color: '%game_color%'
      author: '%game_emoji%  %game%'
      title: 'Vòng mới'
      description:
        - '### %question%'
        - '-# Trả lời trong khung chat game để thắng.'
      fields:
        - name: ':stopwatch: Kết thúc'
          value: '<t:%ends_unix%:R>'
          inline: true
        - name: ':sparkles: Phần thưởng'
          value: '`%points% điểm`'
          inline: true
        - name: ':busts_in_silhouette: Người thắng'
          value: '`%winners_needed%`'
          inline: true
      footer: '%server%'
  #%winner% %winner_head% %winner_mention% %time% %answer% %points% %winner_count%
  #%winners% (mọi người thắng, mỗi dòng một người) %other_winners% (tất cả trừ người đầu tiên)
  win:
    embed:
      color: '%game_color%'
      author: '%game_emoji%  %game%'
      title: ':trophy:  %winner% đã trả lời đúng!'
      thumbnail: '%winner_head%'
      description:
        - '-# Đáp án là'
        - '### %answer%'
      fields:
        - name: ':stopwatch: Thời gian'
          value: '`%time%s`'
          inline: true
        - name: ':sparkles: Điểm'
          value: '`+%points%`'
          inline: true
        - name: ':medal: Cũng trả lời đúng'
          value: '%other_winners%'
          inline: false
      footer: '%server%'
      timestamp: true
  #%answer% %question% %time_limit%
  expired:
    enabled: true
    embed:
      color: '#4E5058'
      author: '%game_emoji%  %game%'
      title: ':hourglass:  Hết giờ'
      description:
        - '-# Không ai trả lời đúng. Đáp án là'
        - '### %answer%'
      footer: '%server%'
      timestamp: true
  #Khi một thành viên ban quản trị dừng trò chơi (chỉ sửa bài đăng trực tiếp)
  stopped:
    embed:
      color: '#4E5058'
      author: '%game_emoji%  %game%'
      title: ':no_entry:  Vòng đã dừng'
      description:
        - '-# Một thành viên ban quản trị đã kết thúc vòng này sớm.'
      footer: '%server%'
      timestamp: true

#Cuộc đua. %target% %amount% %time_limit% %ends_unix% %points%
races:
  enabled: true
  channels: [main]
  live: true
  start:
    embed:
      color: '%game_color%'
      author: '%game_emoji%  Đua %game%'
      title: 'Cuộc đua đã bắt đầu'
      description:
        - '### %amount%x %target%'
        - '-# Người hoàn thành đầu tiên sẽ thắng.'
      fields:
        - name: ':stopwatch: Kết thúc'
          value: '<t:%ends_unix%:R>'
          inline: true
        - name: ':sparkles: Phần thưởng'
          value: '`%points% điểm`'
          inline: true
      footer: '%server%'
  #%winner% %winner_head% %winner_mention% %time% %points%
  win:
    embed:
      color: '%game_color%'
      author: '%game_emoji%  Đua %game%'
      title: ':checkered_flag:  %winner% đã thắng cuộc đua!'
      thumbnail: '%winner_head%'
      description:
        - '### %amount%x %target%'
      fields:
        - name: ':stopwatch: Thời gian'
          value: '`%time%s`'
          inline: true
        - name: ':sparkles: Điểm'
          value: '`+%points%`'
          inline: true
      footer: '%server%'
      timestamp: true
  expired:
    enabled: true
    embed:
      color: '#4E5058'
      author: '%game_emoji%  Đua %game%'
      title: ':hourglass:  Hết giờ'
      description:
        - '### %amount%x %target%'
        - '-# Không ai hoàn thành kịp giờ.'
      footer: '%server%'
      timestamp: true
  stopped:
    embed:
      color: '#4E5058'
      author: '%game_emoji%  Đua %game%'
      title: ':no_entry:  Cuộc đua đã dừng'
      description:
        - '-# Một thành viên ban quản trị đã kết thúc cuộc đua này sớm.'
      footer: '%server%'
      timestamp: true

#Trò chơi toàn cầu, nơi cả máy chủ cùng hướng tới một mục tiêu.
#%goal% (vd. "500 Stone") %progress% %goal_amount% %percent% %bar% %contributors% %time_limit% %ends_unix%
global:
  enabled: true
  channels: [main]
  #true: bài đăng hiển thị thanh tiến độ và được cập nhật khi trò chơi đang chạy
  live: true
  #Tần suất tối đa cập nhật bài đăng trực tiếp (chỉ khi tiến độ thay đổi)
  update-seconds: 15
  bar: {length: 16, full: '█', empty: '░'}
  progress:
    embed:
      color: '%game_color%'
      author: ':globe_with_meridians:  %game% toàn cầu'
      title: 'Cả máy chủ cùng chơi'
      description:
        - '### %goal%'
        - '`%bar%` **%percent%%**'
        - '-# %progress% / %goal_amount%'
      fields:
        - name: ':busts_in_silhouette: Đang giúp'
          value: '`%contributors%`'
          inline: true
        - name: ':stopwatch: Kết thúc'
          value: '<t:%ends_unix%:R>'
          inline: true
      footer: '%server%'
  #%top_contributors% (người đóng góp nhiều nhất, mỗi dòng một người)
  completed:
    embed:
      color: '#57F287'
      author: ':globe_with_meridians:  %game% toàn cầu'
      title: ':tada:  Đã đạt mục tiêu!'
      description:
        - '### %goal%'
        - '`%bar%` **%percent%%**'
      fields:
        - name: ':medal: Người giúp nhiều nhất'
          value: '%top_contributors%'
          inline: true
        - name: ':busts_in_silhouette: Đã giúp'
          value: '`%contributors%`'
          inline: true
      footer: '%server%'
      timestamp: true
  failed:
    embed:
      color: '#ED4245'
      author: ':globe_with_meridians:  %game% toàn cầu'
      title: ':x:  Chưa đạt mục tiêu'
      description:
        - '### %goal%'
        - '`%bar%` **%percent%%**'
        - '-# %progress% / %goal_amount%'
      fields:
        - name: ':medal: Người giúp nhiều nhất'
          value: '%top_contributors%'
          inline: true
      footer: '%server%'
      timestamp: true
  #Số người đóng góp mà %top_contributors% liệt kê
  top-size: 5

#Sự kiện trò chơi (events.yml). %event%
events:
  enabled: true
  channels: [main]
  #%games% (số trò chơi của sự kiện)
  start:
    embed:
      color: '#FEE75C'
      author: ':calendar:  Sự kiện trò chơi'
      title: '%event% đã bắt đầu!'
      description:
        - '-# Thắng các trò liên tiếp để kiếm điểm sự kiện.'
      fields:
        - name: ':video_game: Trò chơi'
          value: '`%games%`'
          inline: true
      footer: '%server%'
      timestamp: true
  #%standings% %players% (số người ghi điểm) %winner% %winner_head% %winner_mention%
  end:
    embed:
      color: '#FEE75C'
      author: ':calendar:  Sự kiện trò chơi'
      title: ':trophy:  Kết quả %event%'
      thumbnail: '%winner_head%'
      description:
        - '%standings%'
      fields:
        - name: ':crown: Người thắng'
          value: '%winner_mention%'
          inline: true
        - name: ':busts_in_silhouette: Người chơi'
          value: '`%players%`'
          inline: true
      footer: '%server%'
      timestamp: true
  #Số thứ hạng mà %standings% liệt kê
  standings-size: 10

#Chuỗi của người chơi đạt một số ngày liên tiếp (streaks.yml). %player% %player_head% %player_mention% %streak% %days%
streaks:
  enabled: false
  channels: [main]
  #Chỉ đăng các số ngày này
  days: [7, 14, 30, 60, 100, 365]
  message:
    embed:
      color: '#E67E22'
      author: {name: '%player%', icon: '%player_head%'}
      title: ':fire:  %days% ngày liên tiếp!'
      description:
        - '-# %streak%'
      footer: '%server%'
      timestamp: true

#Người chơi hoàn thành thử thách hằng ngày hoặc hằng tuần. %player% %player_head% %player_mention% %challenge% %period%
challenges:
  enabled: false
  channels: [main]
  #Nội dung %period% hiển thị
  periods:
    daily: 'hằng ngày'
    weekly: 'hằng tuần'
  message:
    embed:
      color: '#57F287'
      author: {name: '%player%', icon: '%player_head%'}
      title: ':white_check_mark:  Đã hoàn thành thử thách'
      description:
        - '### %challenge%'
        - '-# Thử thách %period%'
      footer: '%server%'
      timestamp: true

#Bảng xếp hạng, đăng vào giờ định sẵn và bằng /chatgames discord leaderboard.
#%leaderboard% %total_points% (tất cả người chơi cộng lại)
leaderboard:
  enabled: false
  channels: [main]
  #Giờ máy chủ, dạng 24 giờ, vd. ['12:00', '20:00']
  times: ['20:00']
  #points, hoặc fastest (câu trả lời nhanh nhất của mọi trò)
  type: points
  size: 10
  message:
    embed:
      color: '#5865F2'
      author: ':bar_chart:  Bảng xếp hạng'
      title: 'Người chơi hàng đầu'
      description:
        - '%leaderboard%'
        - ''
        - '-# Tổng cộng đã giành %total_points% điểm'
      footer: '%server%'
      timestamp: true

#__EMOJI__
#Các tên bạn có thể ghi dạng :name: trong bất kỳ văn bản nào ở trên:
#  trophy, first_place, second_place, third_place, medal, military_medal, crown, star, star2,
