#Trò này tạo một chuỗi ký tự ngẫu nhiên với độ dài cho trước
random:
  enable: true
  winners: 1
  weight: 1
  points: 1
  countdown:
    enable: true
    last-seconds: 10

  case-sensitive: true
  #Thời gian tính bằng giây người chơi có để đoán, giải, gõ, v.v.
  timeToGuess_seconds: 20
  #Độ dài của chuỗi ngẫu nhiên cho trò này. Định dạng khoảng <lower>-<higher>. Với một độ dài duy nhất, đặt cùng một số ở cả hai bên
  lengthRange: 6-8
  #Các kiểu có sẵn: ALPHA (chữ cái), ALPHANUMERIC (chữ và số), NUMERIC (số), SYMBOLIC (ký hiệu),
  #LOWERCASE_ALPHA (toàn chữ thường), UPPERCASE_ALPHA (toàn chữ hoa), HEXADECIMAL (ký tự thập lục phân: 0123456789ABCDEF)
  #CUSTOM (dùng nội dung trong 'custom_characters')
  character_type: ALPHANUMERIC
  #Chuỗi này chỉ được dùng nếu type là "CUSTOM"
  custom_characters: 'abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789'

  #__Để trống 2 mục sau để tắt chúng__
  titleMessage: '&b%selection%'
  subtitleMessage: '&aGõ chữ'

math:
  enable: true
  winners: 1
  weight: 1
  points: 1
  hints:
    enable: true
    after-percent: 50
    max: 1
  countdown:
    enable: true
    last-seconds: 10

  #Đừng thay đổi mục này
  case-sensitive: false
  #Thời gian tính bằng giây người chơi có để đoán, giải, gõ, v.v.
  timeToGuess_seconds: 20
  #Khoảng số ngẫu nhiên theo độ khó:
  #1 - (1-9)
  #2 - (1-99)
  #3 - (1-999)
  #4 - (1-9999)
  #5 - (1-99999)
  difficulty: 2
  #Số toán tử trong mỗi câu hỏi: 1 -> "12 + 7", 2 -> "12 + 7 x 3"
  operations: 1
  #solve: tính kết quả ("12 + 7 x 3").  missing-value: tìm số bị ẩn ("12 + ? x 3 = 33").
  #Mỗi vòng chọn một trong các chế độ được liệt kê.
  modes:
    - solve
    - missing-value
  #Các toán tử sử dụng; bốn toán tử liệt kê là tất cả, có thể bỏ những cái không muốn. Luôn giữ ít nhất 1
  #Phép chia luôn cho ra số nguyên.
  operators:
    - '+'
    - '-'
    - 'x'
    - '/'

  #__Để trống 2 mục sau để tắt chúng__
  titleMessage: '&b%selection%'
  subtitleMessage: '&aTính toán'

variable:
  enable: true
  winners: 1
  weight: 1
  points: 1
  countdown:
    enable: true
    last-seconds: 10

  #Đừng thay đổi mục này
  case-sensitive: false
  #Thời gian tính bằng giây người chơi có để đoán, giải, gõ, v.v.
  timeToGuess_seconds: 20

  #__Để trống 2 mục sau để tắt chúng__
  titleMessage: '&bGIẢI'
  subtitleMessage: '&aTìm &7`&b%symbol%&7`'

  #Khoảng của số kết quả ngẫu nhiên
  result-min: 20
  result-max: 100

  toGet: '✗'
  #Đây là một số ký hiệu khác bạn có thể thêm: ✪❃✿✠❂♫♪❦♡♤♢✦☾☽✹
  data:
    - '✯;10'
    - '♛;15'
    - '❅;20'
    - '♫;25'

sequence:
  enable: true
  winners: 1
  weight: 1
  points: 1
  hints:
    enable: true
    after-percent: 50
    max: 1
  countdown:
    enable: true
    last-seconds: 10

  #Đừng thay đổi mục này
  case-sensitive: false

  #Thời gian tính bằng giây người chơi có để đoán, giải, gõ, v.v.
  timeToGuess_seconds: 25

  #Người chơi thấy một dãy số và gõ số tiếp theo, vd. "3, 6, 12, 24, ?" -> 48
  #Quy luật: cộng (3, 7, 11), nhân (2, 6, 18), bình phương (4, 9, 16), xen kẽ (5, 9, 7, 11), Fibonacci (2, 3, 5, 8)
  patterns:
    - add
    - multiply
    - squares
    - alternating
    - fibonacci
  #1-3. Độ khó cao hơn cho quy luật khó hơn (bình phương và xen kẽ từ 2, Fibonacci ở 3) và số lớn hơn.
  difficulty: 2
  #Số lượng số hiển thị trước '?' (4-8)
  shown-terms: 5

  #__Để trống 2 mục sau để tắt chúng__
  titleMessage: '&b%selection%'
  subtitleMessage: '&aTiếp tục dãy số'

