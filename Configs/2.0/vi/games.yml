#############################
######    TRÒ CHƠI CHAT    ######
#############################
#Các cài đặt mà mọi trò chơi đều nhận (mục nào thiếu sẽ dùng giá trị mặc định hiển thị):
#  enable: true/false
#  weight: 1             Khả năng vòng xoay chọn trò này so với các trò khác (0 = không bao giờ).
#                        Cùng một trò không bao giờ chạy hai lần liên tiếp.
#  winners: 1            Số người chơi có thể thắng mỗi vòng.
#  points: 1             Điểm cho mỗi trận thắng (/chatgames top).
#  case-sensitive: false Người chơi chỉ sai chữ hoa/thường sẽ nhận tin nhắn 'wrong_case'.
#  timeToGuess_seconds: 20
#  min-answer-ms: 400    Câu trả lời đúng nhanh hơn mức này bị bỏ qua và ghi lại: không ai đọc và gõ
#                        nhanh như vậy, còn bot chat thì có. 0 tắt kiểm tra này.
#  hints:                Gợi ý xuất hiện trong vòng chơi, qua 'hint_message' trong messages.yml.
#    enable: false
#    after-percent: 50   Gợi ý đầu tiên xuất hiện khi đã trôi qua chừng ấy thời gian; các gợi ý còn lại chia đều phần còn lại.
#    max: 1              Tối đa 3.
#  countdown:            Thời gian còn lại trên thanh hành động. Hoạt động trên mọi phiên bản (1.8 đến 26.x).
#    enable: false
#    last-seconds: 10    Chỉ trong N giây cuối; 0 hiển thị suốt cả vòng.
#  titleMessage / subtitleMessage: để trống cả hai để không gửi tiêu đề.
unscramble:
  enable: true
  winners: 1
  weight: 1
  points: 1
  hints:
    enable: true
    after-percent: 50
    max: 1
  countdown:
    enable: true
    last-seconds: 10

  case-sensitive: true
  #Thời gian tính bằng giây người chơi có để đoán, giải, gõ, v.v.
  timeToGuess_seconds: 20
  #__Để trống 2 mục sau để tắt chúng__
  titleMessage: '&b%selection%'
  subtitleMessage: '&aSắp xếp chữ'

