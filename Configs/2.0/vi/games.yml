    - mobs
  #Nếu false, có thể gõ các mục theo bất kỳ thứ tự nào
  order-matters: true

  #Thời gian tính bằng giây người chơi có để ghi nhớ, giải, gõ, v.v.
  timeToMemorize: 7

  #Thời gian tính bằng giây người chơi có để đoán, giải, gõ, v.v.
