enable-races: true

creative-enabled: true
#Liên kết hữu ích để thêm DỮ LIỆU:
#
#https://hub.spigotmc.org/javadocs/spigot/org/bukkit/entity/EntityType.html
#https://helpch.at/docs/1.8/index.html?org/bukkit/entity/EntityType.html
#https://hub.spigotmc.org/javadocs/bukkit/org/bukkit/Material.html
#https://helpch.at/docs/1.8/org/bukkit/Material.html

#Tên có thể mới hoặc cũ (MOOSHROOM hoặc MUSHROOM_COW, COD hoặc RAW_FISH): chúng được khớp với phiên bản
#máy chủ của bạn. Tên không có trong phiên bản của bạn (vd. khối 1.21 trên 1.8) bị bỏ qua, kèm ghi chú trong console.
#
#Mỗi cuộc đua còn nhận (tùy chọn):
#  points: 1     #điểm người thắng nhận (mặc định 1)
#  weight: 1     #tần suất vòng xoay chọn nó so với các trò khác (mặc định 1, 0 = không bao giờ)
#
#Quản trị viên có thể bắt đầu đua với giá trị riêng: /chatgames <race> <material/mob> [amount]
#Nếu không có số lượng, sẽ dùng một trong các số lượng liệt kê bên dưới cho vật liệu/sinh vật đó. Người thắng nhận phần thưởng liệt kê
#cho đúng vật liệu và số lượng đó, hoặc không có gì nếu chúng không được liệt kê ở đây (vẫn được cộng điểm).

