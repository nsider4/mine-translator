#THỬ THÁCH HẰNG NGÀY VÀ HẰNG TUẦN
#
#Mọi người nhận cùng các thử thách. Tiến độ được tính khi người chơi chơi; thử thách
#đã hoàn thành hiện "Có thể nhận" trong /chatgames challenges, và /chatgames claim trả thưởng.
#Phần thưởng chưa nhận sẽ mất khi các thử thách được đặt lại.
#
#LOẠI THỬ THÁCH (amount là số lượng cần):
#  WIN_GAMES    thắng trò chơi chat hoặc cuộc đua, ở bất kỳ thứ hạng nào
#  WIN_GAME     thắng một trò hoặc cuộc đua, đặt bằng 'game' (vd. game: unscramble)
#  WIN_RACES    thắng cuộc đua
#  PLAY_GLOBAL  giải trò chơi toàn cầu kịp giờ
#  WIN_GLOBAL   hoàn thành trò chơi toàn cầu ở thứ hạng có thưởng
#  FAST_WIN     thắng trò chơi chat trong 'seconds' giây hoặc ít hơn (không tính cuộc đua)
#  EARN_POINTS  kiếm điểm từ trò chơi
#  PLAY_EVENT   tham gia sự kiện trò chơi
#
#Mỗi thử thách có:
#  name / description: hiển thị trong chat và menu. %amount%, %game% và %seconds% được điền vào.
#  icon: vật phẩm trên menu (tên vật liệu)
#  rewards: các dòng như trong rewards.yml (tỉ lệ với '<chance>%~ ', quyền với 'has:<permission>').
#           %player% và %challenge% (tên) được điền vào.
#
#Các ID (win_3, fast_1...) được lưu cùng tiến độ người chơi: chỉ dùng a-z, 0-9, - và _,
#và đổi một ID sẽ khởi động lại tiến độ của thử thách đó.

#Múi giờ bắt đầu ngày, cho thử thách và chuỗi, vd. Asia/Ho_Chi_Minh hoặc America/New_York.
#Để trống sẽ dùng múi giờ của máy chủ.
timezone: ''

