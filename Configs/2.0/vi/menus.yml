#MENU
#
#Mỗi menu trong 'menus:' có 'title', kích thước 'rows' (1-6) và các 'items'. Bạn có thể đổi
#chức năng của bất kỳ nút nào, thêm nút hoặc cả menu mới (mở bằng /chatgames menu <id>,
#hoặc đặt mỗi menu vào một tệp riêng trong thư mục menus/, tên là <id>.yml).
#
#Mỗi mục:
#  slot: vị trí, từ 0 (trên cùng bên trái) đến rows*9-1. 'slots: [0, 1, '9-17']' lặp lại nó.
#  material: bất kỳ tên vật phẩm nào từ 1.8 đến 26.x: tên mới hoặc cũ (lime_dye / INK_SACK:10 / 351:10),
#            hoặc 'head:<tên người chơi, texture hoặc URL textures.minecraft.net>'
#  name / lore: mã màu (&a, và &#RRGGBB trên 1.16+) và placeholder của PlaceholderAPI đều dùng được.
#  amount, glow: true, enchantments: ['SHARPNESS:1'], flags: [HIDE_ATTRIBUTES], head: '%player%',
#  custom-model-data: 1001 (1.14+), item-model: 'namespace:key' (1.21.2+), color: '#FF0000' (đồ da)
#  actions: việc mà một cú nhấn thực hiện, theo thứ tự. Còn có left-actions, right-actions, shift-left-actions,
#           shift-right-actions, middle-actions và drop-actions (mỗi cái sẽ dùng actions nếu không có).
#  view-requirements: mục chỉ hiện khi mọi dòng đều đạt
#  click-requirements: khi một dòng không đạt, 'deny-actions' chạy thay cho actions
#  state + when-off: khi state là false, các khóa của when-off thay cho khóa của chính mục
#                    (không phải 'off': YAML đọc off đứng riêng là false)
#Bỏ một mục đi để ẩn nó. 'filler' lấp mọi ô trống; xóa nó nếu không muốn.
#
#Hành động:
#  [command] <command>        bạn chạy lệnh                [console] <command>   console chạy lệnh
#  [message] <text>           tin nhắn cho bạn             [broadcast] <text>    cho mọi người
#  [sound] <sound> [volume] [pitch]   bất kỳ tên âm thanh nào từ 1.8 đến 26.x
#  [open] <menu> [values]     mở menu khác                 [switch] <menu> [values]  giống vậy, nhưng [back] bỏ qua nó
#  [back] [menu]              menu trước (hoặc menu được chỉ định, hoặc đóng)
#  [refresh]  [close]  [next-page]  [previous-page]  [wait] <ticks>
#  [chatgames:no-permission]  gửi tin nhắn thiếu quyền
#  Các hành động riêng của menu được mô tả phía trên menu có chúng.
#
#Điều kiện, mỗi dòng một điều kiện (mọi dòng phải đạt; bắt đầu dòng bằng ! để đảo ngược):
#  permission <node>     một phép so sánh như '%chatgames_points% >= 100' (==, !=, >=, <=, >, <)
#  hoặc một giá trị là true / on / yes / một số khác 0
#
#Các menu liệt kê (thử thách, trò chơi, sự kiện...) đặt chúng vào 'list-slots' theo thứ tự,
#vẽ bằng 'templates' của menu. Khi có nhiều mục hơn số ô, các mục có hành động
#[next-page] / [previous-page] sẽ lật trang; chúng ẩn đi khi không còn trang để lật.
#Một dòng lore chỉ chứa placeholder danh sách, như '%game_wins%', sẽ thành nhiều dòng.
#Mọi menu còn có %player%, %page%, %pages% và %entries% (số mục trong danh sách).

#Tên và biểu tượng của trò chơi, trong mọi menu và trong tin nhắn nhắc đến trò chơi (%game%).
#Trò chơi không có ở đây sẽ lấy tên theo khóa của nó.
