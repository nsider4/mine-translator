#############################
######    聊天游戏    ######
#############################
#每个游戏都支持的设置（缺少的项使用所示的默认值）：
#  enable: true/false
#  weight: 1             与其他游戏相比，轮换选中此游戏的可能性（0 = 从不）。
#                        同一个游戏不会连续进行两次。
#  winners: 1            每局可以有多少名玩家获胜。
#  points: 1             每次获胜的积分（/chatgames top）。
#  case-sensitive: false 只有大小写不对的玩家会收到 'wrong_case' 消息。
#  timeToGuess_seconds: 20
#  min-answer-ms: 400    比这更快的正确答案会被忽略并记录：没有人能读得
#                        这么快又打得这么快，只有聊天机器人可以。设为 0 关闭此检查。
#  hints:                回合进行中会出现提示，使用 messages.yml 中的 'hint_message'。
#    enable: false
#    after-percent: 50   时间过去这么多时显示第一个提示；其余提示分布在剩余时间里。
#    max: 1              最多 3 个。
#  countdown:            剩余时间，显示在动作栏上。所有版本都可用（1.8 到 26.x）。
#    enable: false
#    last-seconds: 10    只在最后 N 秒显示；0 表示整局都显示。
#  titleMessage / subtitleMessage：两者都留空则不发送标题。
unscramble:
  enable: true
  winners: 1
  weight: 1
  points: 1
  hints:
    enable: true
    after-percent: 50
    max: 1
  countdown:
    enable: true
    last-seconds: 10

  case-sensitive: true
  #玩家猜测、解答、输入等的时间，单位为秒。
  timeToGuess_seconds: 20
  #__将以下 2 项留空即可禁用__
  titleMessage: '&b%selection%'
  subtitleMessage: '&a还原单词'

