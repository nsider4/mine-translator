help_command:
  - '&8&m-------------------------------------------------'
  - '&e&l-ChatGames-'
  - '&6'
  - '&6&l命令：'
  - '&6'
  - '&e/chatgames menu [menu] &8- &7打开菜单：个人资料、挑战、连续记录、排行榜（或 menus.yml 中的任意菜单）。'
  - '&e/chatgames profile [player] &8- &7显示你的（或其他玩家的）统计。'
  - '&e/chatgames top &8- &7显示积分最多的前 10 名玩家。'
  - '&e/chatgames fastest [game] &8- &7显示总体或某个游戏的最快赢家。'
  - '&e/chatgames points [player] &8- &7显示你的（或其他玩家的）积分。'
  - '&e/chatgames challenges &8- &7显示你的每日和每周挑战。'
  - '&e/chatgames streaks &8- &7显示你的连续记录。'
  - '&e/chatgames claim &8- &7领取已完成的挑战和连续记录奖励。'
  - '&e/chatgames event [list|top <event>] &8- &7显示游戏活动，或某个活动中得分最多的玩家。'
  - '&e/chatgames toggle [player] &8- &7为你开启或关闭聊天游戏。'
  - '&e/chatgames togglesound [player] &8- &7开启或关闭聊天游戏声音。'
  - '&6'
  - '&6&l管理员：'
  - '&e/chatgames admin &8- &7打开管理菜单。'
  - '&e/chatgames debug &8- &7打开调试菜单：私下测试任意游戏，没有奖励。'
  - '&e/chatgames (game) [values] &8- &7立即开始该游戏，可以使用你自己的单词/数值。'
  - '&e/chatgames any &8- &7开始轮换接下来会选的游戏。'
  - '&e/chatgames global <game> [values] &8- &7开始一局全服游戏：全服玩家一起合作。'
  - '&e/chatgames event start <event> | stop &8- &7开始或停止游戏活动。'
  - '&e/chatgames stop &8- &7结束正在进行的游戏，没有赢家。'
  - '&e/chatgames toggleAll &8- &7开启或关闭自动游戏轮换。'
  - '&e/chatgames preset <list|load|save> [name] &8- &7管理游戏预设。'
  - '&e/chatgames +points|-points|setpoints <player> <amount> &8- &7修改玩家的积分。'
  - '&e/chatgames remove <player> &8- &7删除玩家的数据。'
  - '&e/chatgames challenges reset <player> &8- &7清除玩家的挑战进度。'
  - '&e/chatgames streak set <player> <challenge|daily|global> <days> &8- &7设置玩家的连续记录。'
  - '&e/chatgames logs [amount] &8- &7显示最近的游戏日志。'
  - '&e/chatgames discord <test <message|all>|leaderboard> &8- &7向 Discord 发送测试消息或排行榜。'
  - '&e/chatgames reload &8- &7重新加载配置文件。'
  - '&6'
  - '&6&l游戏类型：'
  - '&7unscramble, unreverse, reaction, random, fillout, variable, clickable, math, sequence, memorize, guess_the_number, trivia, word_association, hoverable, hunt, mine, place, fish, craft, eat, furnace, tame, shear'
  - '&8&m-------------------------------------------------'

