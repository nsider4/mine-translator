#菜单
#
#'menus:' 下的每个菜单都有 'title'、以 'rows' 表示的大小（1-6）和它的 'items'。你可以修改
#任意按钮的功能、添加按钮，或添加全新的菜单（用 /chatgames menu <id> 打开，
#或者把每个菜单放到 menus/ 文件夹里单独的文件中，命名为 <id>.yml）。
#
#每个物品：
#  slot：放在哪里，从 0（左上角）到 rows*9-1。'slots: [0, 1, '9-17']' 会重复放置。
#  material：1.8 到 26.x 的任意物品名：新名或旧名都可以（lime_dye / INK_SACK:10 / 351:10），
#            或者 'head:<玩家名、材质或 textures.minecraft.net 网址>'
#  name / lore：颜色代码（&a，以及 1.16+ 的 &#RRGGBB）和 PlaceholderAPI 变量都可以使用。
#  amount, glow: true, enchantments: ['SHARPNESS:1'], flags: [HIDE_ATTRIBUTES], head: '%player%',
#  custom-model-data: 1001 (1.14+)、item-model: 'namespace:key' (1.21.2+)、color: '#FF0000'（皮革）
#  actions：点击后按顺序执行的操作。还有 left-actions、right-actions、shift-left-actions、
#           shift-right-actions、middle-actions 和 drop-actions（没有设置时都使用 actions）。
#  view-requirements：只有每一行都通过时才显示这个物品
#  click-requirements：某一行不通过时，执行 'deny-actions' 而不是 actions
#  state + when-off：当 state 为 false 时，when-off 中的键会替换物品自身的键
#                    （不要写 'off'：YAML 会把单独的 off 读作 false）
#不写某个物品即可隐藏它。'filler' 会填满所有空格子；删掉它就没有填充。
#
#操作：
#  [command] <command>        你执行该命令               [console] <command>   由控制台执行
#  [message] <text>           发给你的消息               [broadcast] <text>    发给所有人
#  [sound] <sound> [volume] [pitch]   1.8 到 26.x 的任意声音名
#  [open] <menu> [values]     打开另一个菜单             [switch] <menu> [values]  同上，但 [back] 会跳过它
#  [back] [menu]              返回上一个菜单（或指定菜单，或关闭）
#  [refresh]  [close]  [next-page]  [previous-page]  [wait] <ticks>
#  [chatgames:no-permission]  发送没有权限的消息
#  各菜单专用的操作写在拥有它们的菜单上方。
#
#条件，每行一个（每一行都必须通过；行首加 ! 表示取反）：
#  permission <node>     比较式，例如 '%chatgames_points% >= 100'（==、!=、>=、<=、>、<）
#  或者一个为 true / on / yes / 非 0 数字的值
#
#列出内容的菜单（挑战、游戏、活动……）会把它们按顺序放进 'list-slots'，
#并用菜单的 'templates' 绘制。条目多于格子时，操作为
#[next-page] / [previous-page] 的物品用来翻页；没有页可翻时它们会隐藏。
#只包含一个列表变量的 lore 行（例如 '%game_wins%'）会变成多行。
#每个菜单还都有 %player%、%page%、%pages% 和 %entries%（列表有多少条目）。

#游戏的名称和图标，用于所有菜单和提到游戏的消息（%game%）中。
#没有列在这里的游戏以它的键命名。
game-names:
  unscramble: '还原单词'
  unreverse: '倒转还原'
  reaction: '反应'
  guess_the_number: '猜数字'
  clickable: '点击'
  fillout: '填空'
  hoverable: '悬停'
  random: '随机字符'
  math: '数学'
  variable: '变量'
  sequence: '数列'
  memorize: '记忆'
  word_association: '词语联想'
  trivia: '知识问答'
  count: '计数'
  hunt: '狩猎'
  mine: '挖掘'
  place: '放置'
  fish: '钓鱼'
  eat: '进食'
  craft: '合成'
  furnace: '烧制'
  tame: '驯服'
  shear: '剪毛'
game-icons:
  unscramble: book
  math: redstone
  trivia: enchanted_book
  reaction: feather
  clickable: stone_button
  random: ender_pearl
  unreverse: compass
  variable: name_tag
  guess_the_number: clock
  memorize: map
  sequence: ladder
  fillout: paper
  hoverable: ender_eye
  word_association: lead
  count: clock
  hunt: iron_sword
  place: grass_block
  mine: iron_pickaxe
  fish: fishing_rod
  eat: cooked_beef
  craft: crafting_table
  furnace: furnace
  tame: bone
  shear: shears

formats:
  #还没有排名的玩家显示这个，而不是名次
  no-rank: '-'

#发给玩家，来自调试菜单。把一行留空（''）则不发送。
messages:
  debug-round: '&8[&c调试&8] &f新的私人 &e%game% &f回合（答案：&a%answer%&f），生成用时 &e%generated% 毫秒&f。只有你能看到。'
  debug-failed: '&8[&c调试&8] &c无法生成 %game% 回合；控制台会说明原因。'
  debug-race: '&8[&c调试&8] &c竞赛在世界中进行，所以不能在这里测试。用 /chatgames <race> 开始一场。'
  debug-no-letters: '&8[&c调试&8] &7这个答案没有字母，所以不会有大小写错误。'
  debug-timeout-started: '&8[&c调试&8] &7正在等待 &e%time%s &7的时间限制结束……'
  debug-timeout: '&8[&c调试&8] &e%game%&7：时间到。玩家会被告知答案是 &f%answer%&7。'
  #%verdict% 是下面的其中一行
  debug-result: '&8[&c调试&8] &e%game% &7| 在 &e%ms% 毫秒&7后输入了 &f%input%&7：%verdict%'
  debug-verdicts:
    accepted: '&a已接受 &7（会获得名次和 &e%points% &7积分）'
    wrong: '&c错误 &7（已忽略）'
    wrong-case: '&6大小写错误 &7（会提示玩家检查）'
    macro: '&c视为宏而忽略 &7（快于 min-answer-ms，&e%min_ms% 毫秒&7）'
    late: '&c太晚了 &7（超过时间限制）'

menus:

  #/chatgames menu。%points% %rank% %wins% %claimable%（可领取的奖励）、
  #%daily_completed% %daily_total% %weekly_completed% %weekly_total%,
  #%games_on% / %sound_on%（true 或 false）以及 %games_state% / %sound_state%（开启/关闭文字）
  main:
    title: '&8&lChatGames'
    rows: 3
    filler:
      material: gray_stained_glass_pane
      name: ' '
    items:
      profile:
        slot: 10
        material: player_head
        head: '%player%'
        name: '&e&l你的资料'
        lore:
          - '&7积分：&e%points% &8(%rank%)'
          - '&7胜场：&e%wins%'
          - ''
          - '&e点击查看你的统计'
        actions: ['[open] profile']
      challenges:
        slot: 11
        material: writable_book
        name: '&a&l挑战'
        lore:
          - '&7每日：&e%daily_completed%&7/&e%daily_total%'
          - '&7每周：&e%weekly_completed%&7/&e%weekly_total%'
          - '&7可领取的奖励：&e%claimable%'
          - ''
          - '&e点击打开'
        actions: ['[open] challenges daily']
      streaks:
        slot: 12
        material: blaze_powder
        name: '&6&l连续记录'
        lore:
          - '&7每天都玩，让它们延续下去。'
          - ''
          - '&e点击打开'
        actions: ['[open] streaks']
      leaderboards:
        slot: 13
        material: gold_ingot
        name: '&e&l排行榜'
        lore:
          - '&7积分最高和最快的玩家。'
          - ''
          - '&e点击打开'
        actions: ['[open] leaderboards']
      games-toggle:
        slot: 15
        material: lime_dye
        name: '&f聊天游戏：%games_state%'
        lore:
          - '&7点击为你关闭聊天游戏。'
        state: '%games_on%'
        actions: ['[command] chatgames toggle', '[refresh]']
        when-off:
          material: gray_dye
          lore:
            - '&7点击为你开启聊天游戏。'
      sound-toggle:
        slot: 16
        material: note_block
        name: '&f游戏声音：%sound_state%'
        lore:
          - '&7点击关闭游戏声音。'
        state: '%sound_on%'
        actions: ['[command] chatgames togglesound', '[refresh]']
        when-off:
          material: gray_dye
          lore:
            - '&7点击开启游戏声音。'
      admin:
        slot: 22
        material: command_block
        name: '&c&l管理'
        lore:
          - '&7开始游戏、活动、预设……'
        view-requirements: ['permission chatgames.admin']
        actions: ['[open] admin']
      close:
        slot: 26
        material: barrier
        name: '&c关闭'
        actions: ['[close]']

  #/chatgames profile [player]。%target% %points% %rank% %wins% %race_wins% %global_played%
  #%global_won%（已完成） %contributions% %events_played% %event_wins% %event_best_place% %fastest% %challenges_completed%
  #%milestones% %milestones_total% %streak_<challenge|daily|global>% 和 %streak_<...>_longest%。
  #列表：%game_wins% 和 %game_fastest%。[open] profile <name> 打开别人的资料。
  profile:
    title: '&8资料：%target%'
    rows: 5
    filler:
      material: gray_stained_glass_pane
      name: ' '
    formats:
      none: '&7还没有'
      game-wins: '&7%game%：&f%wins%'
      game-fastest: '&7%game%：&f%time%s'
    items:
      head:
        slot: 4
        material: player_head
        head: '%target%'
        name: '&e&l%target%'
        lore:
          - '&7积分：&e%points% &8(%rank%)'
      wins:
        slot: 19
        material: diamond
        name: '&b&l胜场'
        lore:
          - '&7聊天游戏胜场：&f%wins%'
          - '&7竞赛胜场：&f%race_wins%'
          - ''
          - '%game_wins%'
      fastest:
        slot: 20
        material: clock
        name: '&e&l最快时间'
        lore:
          - '&7总体最佳：&f%fastest%'
          - ''
          - '%game_fastest%'
      global:
        slot: 21
        material: beacon
        name: '&3&l全服游戏'
        lore:
          - '&7参与：&f%global_played%'
          - '&7完成：&f%global_won%'
          - '&7贡献：&f%contributions%'
      events:
        slot: 23
        material: nether_star
        name: '&6&l活动'
        lore:
          - '&7参与：&f%events_played%'
          - '&7获胜：&f%event_wins%'
          - '&7最佳名次：&f%event_best_place%'
      streaks:
        slot: 24
        material: blaze_powder
        name: '&6&l连续记录'
        lore:
          - '&7挑战：&f%streak_challenge% &8（最佳 %streak_challenge_longest%）'
          - '&7每日胜利：&f%streak_daily% &8（最佳 %streak_daily_longest%）'
          - '&7全服：&f%streak_global% &8（最佳 %streak_global_longest%）'
      progress:
        slot: 25
        material: experience_bottle
        name: '&a&l进度'
        lore:
          - '&7积分：&f%points%'
          - '&7达成的里程碑：&f%milestones%&7/&f%milestones_total%'
          - '&7完成的挑战：&f%challenges_completed%'
      back:
        slot: 36
        material: arrow
        name: '&7返回'
        actions: ['[back] main']
      close:
        slot: 44
        material: barrier
        name: '&c关闭'
        actions: ['[close]']

  #[open] challenges <daily|weekly>。%period% %period_key% %completed% %total% %resets%。
  #条目：%challenge% %id% %description% %progress% %amount% %percent% %bar% %icon%。
  #[chatgames:claim-challenge] <period> <id> 领取一个挑战。
  challenges:
    title: '&8%period%挑战'
    rows: 5
    filler:
      material: gray_stained_glass_pane
      name: ' '
    list-slots: ['19-25', '28-34']
    progress-bar:
      length: 10
      done: '&a|'
      left: '&7|'
    items:
      tab-daily:
        slot: 2
        material: sunflower
        name: '&e&l每日'
        glow: true
        lore:
          - '&7正在显示今天的挑战。'
        state: '%period_key% == daily'
        actions: ['[switch] challenges daily']
        when-off:
          glow: false
          lore:
            - '&e点击显示今天的挑战'
      tab-weekly:
        slot: 6
        material: clock
        name: '&b&l每周'
        glow: true
        lore:
          - '&7正在显示本周的挑战。'
        state: '%period_key% == weekly'
        actions: ['[switch] challenges weekly']
        when-off:
          glow: false
          lore:
            - '&e点击显示本周的挑战'
      info:
        slot: 4
        material: book
        name: '&f%period%：&e%completed%&7/&e%total% &f已完成'
        lore:
          - '&7新挑战刷新倒计时：&f%resets%'
      none:
        slot: 22
        material: barrier
        name: '&7现在没有%period%挑战'
        view-requirements: ['%entries% == 0']
      claim-all:
        slot: 40
        material: chest
        name: '&a&l全部领取'
        lore:
          - '&7领取所有已完成的挑战'
          - '&7和连续记录奖励。'
        actions: ['[command] chatgames claim', '[wait] 2', '[refresh]']
      previous:
        slot: 39
        material: arrow
        name: '&7上一页'
        actions: ['[previous-page]']
      next:
        slot: 41
        material: arrow
        name: '&7下一页 &8(%page%/%pages%)'
        actions: ['[next-page]']
      back:
        slot: 36
        material: arrow
        name: '&7返回'
        actions: ['[back] main']
      close:
        slot: 44
        material: barrier
        name: '&c关闭'
        actions: ['[close]']
    templates:
      in-progress:
        material: '%icon%'
        name: '%challenge%'
        lore:
          - '%description%'
          - ''
          - '%bar% &f%progress%&7/&f%amount%'
          - '&7进行中'
      ready:
        material: '%icon%'
        glow: true
        name: '%challenge% &a&l（已完成）'
        lore:
          - '%description%'
          - ''
          - '%bar% &f%progress%&7/&f%amount%'
          - '&a&l点击领取你的奖励！'
        actions: ['[chatgames:claim-challenge] %period_key% %id%', '[refresh]']
      claimed:
        material: lime_stained_glass_pane
        name: '%challenge% &7（已领取）'
        lore:
          - '%description%'
          - ''
          - '&a奖励已领取'

  #每个连续记录都有 %streak_<type>%（天数）、%streak_<type>_name%、%streak_<type>_longest%、
  #%streak_<type>_unclaimed% 和 %streak_<type>_enabled%，其中 <type> 为 challenge、daily 或 global。
  #每个连续记录的 7 天奖励阶梯放在以它命名的列表中，第 1 到 7 天（第二周为 8-14……）。
  #阶梯天数：%day% %ladder_day%（它的奖励日，1-7） %type% %streak%，以及 %today%（今天为 true）。
  #[chatgames:claim-streak] <type> 领取某个连续记录所有未领取的天数。
  streaks:
    title: '&8连续记录'
    rows: 5
    filler:
      material: gray_stained_glass_pane
      name: ' '
    lists:
      challenge: ['11-17']
      daily: ['20-26']
      global: ['29-35']
    items:
      challenge:
        slot: 10
        material: writable_book
        name: '%streak_challenge_name%'
        lore:
          - '&7每天完成所有每日挑战。'
          - ''
          - '&7当前：&f%streak_challenge% &7天 &8（最佳 %streak_challenge_longest%）'
          - '&7可领取天数：&e%streak_challenge_unclaimed%'
        view-requirements: ['%streak_challenge_enabled%']
        click-requirements: ['%streak_challenge_unclaimed% > 0']
        actions: ['[chatgames:claim-streak] challenge', '[refresh]']
      daily:
        slot: 19
        material: gold_ingot
        name: '%streak_daily_name%'
        lore:
          - '&7每天至少赢一局游戏。'
          - ''
          - '&7当前：&f%streak_daily% &7天 &8（最佳 %streak_daily_longest%）'
          - '&7可领取天数：&e%streak_daily_unclaimed%'
        view-requirements: ['%streak_daily_enabled%']
        click-requirements: ['%streak_daily_unclaimed% > 0']
        actions: ['[chatgames:claim-streak] daily', '[refresh]']
      global:
        slot: 28
        material: beacon
        name: '%streak_global_name%'
        lore:
          - '&7每天完成一局全服游戏。'
          - ''
          - '&7当前：&f%streak_global% &7天 &8（最佳 %streak_global_longest%）'
          - '&7可领取天数：&e%streak_global_unclaimed%'
        view-requirements: ['%streak_global_enabled%']
        click-requirements: ['%streak_global_unclaimed% > 0']
        actions: ['[chatgames:claim-streak] global', '[refresh]']
      back:
        slot: 36
        material: arrow
        name: '&7返回'
        actions: ['[back] main']
      close:
        slot: 44
        material: barrier
        name: '&c关闭'
        actions: ['[close]']
    templates:
      day-claimed:
        material: lime_stained_glass_pane
        glow: '%today%'
        name: '&a第 %day% 天 &7（已领取）'
      day-ready:
        material: chest
        glow: '%today%'
        name: '&e&l第 %day% 天'
        lore:
          - '&a&l点击领取！'
        actions: ['[chatgames:claim-streak] %type%', '[refresh]']
      day-today:
        material: yellow_stained_glass_pane
        glow: true
        name: '&e第 %day% 天 &7（今天）'
        lore:
          - '&7今天继续保持连续记录'
          - '&7即可解锁此奖励。'
      day-locked:
        material: red_stained_glass_pane
        name: '&c第 %day% 天'
        lore:
          - '&7尚未达到。'

  #%points_rank% %fastest_rank% %total_points%；列表 %top_points% 和 %top_fastest%（top-size 行）
  leaderboards:
    title: '&8排行榜'
    rows: 3
    top-size: 10
    filler:
      material: gray_stained_glass_pane
      name: ' '
    formats:
      entry: '&e#%rank% &f%name% &7- &e%value%'
      empty: '&7还没有人'
    items:
      points:
        slot: 10
        material: gold_block
        name: '&e&l积分最多'
        lore:
          - '%top_points%'
      fastest:
        slot: 11
        material: clock
        name: '&b&l打字最快'
        lore:
          - '%top_fastest%'
      you:
        slot: 13
        material: player_head
        head: '%player%'
        name: '&a&l你'
        lore:
          - '&7积分排名：&f%points_rank%'
          - '&7最快排名：&f%fastest_rank%'
          - ''
          - '&7所有人获得的积分：&f%total_points%'
      games:
        slot: 15
        material: book
        name: '&d&l各游戏最快'
        lore:
          - '&e点击查看所有游戏'
        actions: ['[open] leaderboard-games']
      events:
        slot: 16
        material: nether_star
        name: '&6&l活动'
        lore:
          - '&e点击查看活动'
        view-requirements: ['permission chatgames.event']
        actions: ['[open] leaderboard-events']
      back:
        slot: 18
        material: arrow
        name: '&7返回'
        actions: ['[back] main']
      close:
        slot: 26
        material: barrier
        name: '&c关闭'
        actions: ['[close]']

  #每个游戏和竞赛一个条目：%game% %key% %icon%，以及 %top%（该游戏最快的玩家）
  leaderboard-games:
    title: '&8各游戏最快'
    rows: 6
    top-size: 5
    filler:
      material: gray_stained_glass_pane
      name: ' '
    formats:
      entry: '&e#%rank% &f%name% &7- &e%value%'
      empty: '&7还没有人'
    list-slots: ['10-16', '19-25', '28-34']
    items:
      previous:
        slot: 48
        material: arrow
        name: '&7上一页'
        actions: ['[previous-page]']
      next:
        slot: 50
        material: arrow
        name: '&7下一页 &8(%page%/%pages%)'
        actions: ['[next-page]']
      back:
        slot: 45
        material: arrow
        name: '&7返回'
        actions: ['[back] leaderboards']
      close:
        slot: 53
        material: barrier
        name: '&c关闭'
        actions: ['[close]']
    templates:
      game:
        material: '%icon%'
        name: '&e&l%game%'
        lore:
          - '%top%'

  #每个活动一个条目：%event% %id% %steps%
  leaderboard-events:
    title: '&8活动排行榜'
    rows: 4
    filler:
      material: gray_stained_glass_pane
      name: ' '
    list-slots: ['10-16', '19-25']
    items:
      none:
        slot: 13
        material: barrier
        name: '&7没有设置任何活动'
        view-requirements: ['%entries% == 0']
      previous:
        slot: 30
        material: arrow
        name: '&7上一页'
        actions: ['[previous-page]']
      next:
        slot: 32
        material: arrow
        name: '&7下一页 &8(%page%/%pages%)'
        actions: ['[next-page]']
      back:
        slot: 27
        material: arrow
        name: '&7返回'
        actions: ['[back] leaderboards']
      close:
        slot: 35
        material: barrier
        name: '&c关闭'
        actions: ['[close]']
    templates:
      event:
        material: nether_star
        name: '%event%'
        lore:
          - '&7%steps% 局游戏'
          - ''
          - '&e点击查看谁得分最多'
        actions: ['[close]', '[command] chatgames event top %id%']

  #/chatgames admin。%current_game% %next_game% %rotation_state% %event% %preset%，
  #%rotation_on% 和 %games_on%（true 或 false）。每个按钮执行对应的命令，
  #命令会像手动输入一样检查自己的权限。
  admin:
    title: '&4&lChatGames 管理'
    rows: 5
    open-requirements: ['permission chatgames.admin']
    open-deny-actions: ['[chatgames:no-permission]']
    filler:
      material: gray_stained_glass_pane
      name: ' '
    formats:
      none: '&7无'
    items:
      status:
        slot: 4
        material: repeater
        name: '&f&l状态'
        lore:
          - '&7进行中：&f%current_game%'
          - '&7下一局游戏：&f%next_game%'
          - '&7轮换：%rotation_state%'
          - '&7活动：&f%event%'
          - '&7预设：&f%preset%'
      start-game:
        slot: 19
        material: diamond_sword
        name: '&a&l开始游戏'
        lore:
          - '&7任意游戏或竞赛，立即开始。'
        actions: ['[open] admin-start']
      global:
        slot: 20
        material: beacon
        name: '&3&l开始全服游戏'
        lore:
          - '&7所有及时完成的人都能获胜。'
        actions: ['[open] admin-global']
      events:
        slot: 21
        material: nether_star
        name: '&6&l活动'
        lore:
          - '&7开始或停止游戏活动。'
        actions: ['[open] admin-events']
      presets:
        slot: 23
        material: chest
        name: '&d&l预设'
        lore:
          - '&7加载一组启用的游戏。'
        actions: ['[open] admin-presets']
      logs:
        slot: 24
        material: oak_sign
        name: '&f&l日志'
        lore:
          - '&7在聊天中显示最近的游戏。'
        actions: ['[open] admin-logs']
      stop:
        slot: 25
        material: red_wool
        name: '&c&l停止游戏'
        lore:
          - '&7结束正在进行的游戏，没有赢家。'
        actions: ['[command] chatgames stop', '[wait] 2', '[refresh]']
      toggle:
        slot: 29
        material: lime_dye
        name: '&f你的聊天游戏：&a开启'
        lore:
          - '&7点击为你关闭它们。'
        state: '%games_on%'
        actions: ['[command] chatgames toggle', '[refresh]']
        when-off:
          material: gray_dye
          name: '&f你的聊天游戏：&c关闭'
          lore:
            - '&7点击为你开启它们。'
      toggle-all:
        slot: 30
        material: lime_dye
        name: '&f游戏轮换：&a开启'
        lore:
          - '&7点击为所有人停止自动游戏。'
        state: '%rotation_on%'
        #toggleAll 在全局线程上完成，在 Folia 上会晚一个 tick
        actions: ['[command] chatgames toggleAll', '[wait] 2', '[refresh]']
        when-off:
          material: gray_dye
          name: '&f游戏轮换：&c关闭'
          lore:
            - '&7点击重新开始自动游戏。'
      reload:
        slot: 32
        material: hopper
        name: '&e&l重新加载'
        lore:
          - '&7重新加载所有配置文件。'
        actions: ['[close]', '[command] chatgames reload']
      debug:
        slot: 33
        material: command_block
        name: '&c&l调试'
        lore:
          - '&7私下测试任意游戏。'
        view-requirements: ['permission chatgames.debug']
        actions: ['[open] debug']
      back:
        slot: 36
        material: arrow
        name: '&7返回'
        actions: ['[back] main']
      close:
        slot: 44
        material: barrier
        name: '&c关闭'
        actions: ['[close]']

  #每个游戏和竞赛：%game% %key%（与命令中相同） %icon%
  admin-start:
    title: '&8开始游戏'
    rows: 6
    open-requirements: ['permission chatgames.admin']
    open-deny-actions: ['[chatgames:no-permission]']
    filler:
      material: gray_stained_glass_pane
      name: ' '
    list-slots: ['10-16', '19-25', '28-34']
    items:
      previous:
        slot: 48
        material: arrow
        name: '&7上一页'
        actions: ['[previous-page]']
      next:
        slot: 50
        material: arrow
        name: '&7下一页 &8(%page%/%pages%)'
        actions: ['[next-page]']
      back:
        slot: 45
        material: arrow
        name: '&7返回'
        actions: ['[back] admin']
      close:
        slot: 53
        material: barrier
        name: '&c关闭'
        actions: ['[close]']
    templates:
      game:
        material: '%icon%'
        name: '&a%game%'
        lore:
          - '&7聊天游戏'
          - '&e点击开始'
        actions: ['[close]', '[command] chatgames %key%']
      race:
        material: '%icon%'
        name: '&6%game%'
        lore:
          - '&7竞赛'
          - '&e点击开始'
        actions: ['[close]', '[command] chatgames %key%']

  #global_games.yml 中启用的游戏：%game% %key% %icon% %goal% %duration% %points%。
  #正在进行的那局：%global_running% %global_game% %global_goal%（例如 "500 石头"）
  #%global_progress% %global_goal_amount% %global_percent% %global_contributors% %global_time_left%
  admin-global:
    title: '&8全服游戏'
    rows: 5
    update-interval: 20
    open-requirements: ['permission chatgames.admin']
    open-deny-actions: ['[chatgames:no-permission]']
    filler:
      material: gray_stained_glass_pane
      name: ' '
    list-slots: ['19-25', '28-34']
    items:
      status:
        slot: 4
        material: beacon
        name: '&3&l进行中：&f%global_game%'
        lore:
          - '&7目标：&f%global_goal%'
          - '&7进度：&e%global_progress%&7/&e%global_goal_amount% &8(%global_percent%%)'
          - '&7参与的玩家：&f%global_contributors%'
          - '&7剩余时间：&f%global_time_left%s'
          - ''
          - '&c点击停止（没有奖励）'
        view-requirements: ['%global_running%']
        actions: ['[command] chatgames stop', '[wait] 2', '[refresh]']
      idle:
        slot: 4
        material: gray_dye
        name: '&7没有正在进行的全服游戏'
        lore:
          - '&7在下面选一个开始。'
        view-requirements: ['!%global_running%']
      none:
        slot: 22
        material: barrier
        name: '&7没有启用任何全服游戏'
        view-requirements: ['%entries% == 0']
      previous:
        slot: 39
        material: arrow
        name: '&7上一页'
        actions: ['[previous-page]']
      next:
        slot: 41
        material: arrow
        name: '&7下一页 &8(%page%/%pages%)'
        actions: ['[next-page]']
      back:
        slot: 36
        material: arrow
        name: '&7返回'
        actions: ['[back] admin']
      close:
        slot: 44
        material: barrier
        name: '&c关闭'
        actions: ['[close]']
    templates:
      game:
        material: '%icon%'
        name: '&3全服%game%'
        lore:
          - '&7目标：&f%goal% 个正确答案'
          - '&7时间：&f%duration%s'
          - '&7积分：&f%points%'
          - ''
          - '&e点击开始'
        actions: ['[close]', '[command] chatgames global %key%']
      race:
        material: '%icon%'
        name: '&3全服%game%竞赛'
        lore:
          - '&7目标：一起完成 &f%goal%'
          - '&7时间：&f%duration%s'
          - '&7积分：&f%points%'
          - ''
          - '&e点击开始'
        actions: ['[close]', '[command] chatgames global %key%']
      count:
        material: '%icon%'
        name: '&3全服%game%'
        lore:
          - '&7在聊天中一起计数'
          - '&7时间：&f%duration%s'
          - '&7积分：&f%points%'
          - ''
          - '&e点击开始'
        actions: ['[close]', '[command] chatgames global %key%']

  #events.yml 中的活动：%event% %id% %steps%，正在进行的活动还有 %step%（当前进行的游戏）
  admin-events:
    title: '&8活动'
    rows: 4
    open-requirements: ['permission chatgames.admin']
    open-deny-actions: ['[chatgames:no-permission]']
    filler:
      material: gray_stained_glass_pane
      name: ' '
    list-slots: ['10-16', '19-25']
    items:
      none:
        slot: 13
        material: barrier
        name: '&7events.yml 中没有设置任何活动'
        view-requirements: ['%entries% == 0']
      previous:
        slot: 30
        material: arrow
        name: '&7上一页'
        actions: ['[previous-page]']
      next:
        slot: 32
        material: arrow
        name: '&7下一页 &8(%page%/%pages%)'
        actions: ['[next-page]']
      back:
        slot: 27
        material: arrow
        name: '&7返回'
        actions: ['[back] admin']
      close:
        slot: 35
        material: barrier
        name: '&c关闭'
        actions: ['[close]']
    templates:
      event:
        material: nether_star
        name: '%event%'
        lore:
          - '&7%steps% 局游戏'
          - ''
          - '&e点击开始'
        actions: ['[command] chatgames event start %id%', '[wait] 2', '[refresh]']
      running:
        material: nether_star
        glow: true
        name: '%event% &a（进行中）'
        lore:
          - '&7第 %step% 局，共 %steps% 局'
          - ''
          - '&c点击停止'
        actions: ['[command] chatgames event stop', '[wait] 2', '[refresh]']

  #预设以及 'none'（games.yml 中的启用开关）：%preset% %games%
  admin-presets:
    title: '&8预设'
    rows: 4
    open-requirements: ['permission chatgames.admin']
    open-deny-actions: ['[chatgames:no-permission]']
    filler:
      material: gray_stained_glass_pane
      name: ' '
    list-slots: ['10-16', '19-25']
    items:
      previous:
        slot: 30
        material: arrow
        name: '&7上一页'
        actions: ['[previous-page]']
      next:
        slot: 32
        material: arrow
        name: '&7下一页 &8(%page%/%pages%)'
        actions: ['[next-page]']
      back:
        slot: 27
        material: arrow
        name: '&7返回'
        actions: ['[back] admin']
      close:
        slot: 35
        material: barrier
        name: '&c关闭'
        actions: ['[close]']
    templates:
      preset:
        material: chest
        name: '&d%preset%'
        lore:
          - '&7游戏：&f%games%'
          - ''
          - '&e点击加载'
        actions: ['[command] chatgames preset load %preset%', '[wait] 2', '[refresh]']
      active:
        material: ender_chest
        glow: true
        name: '&d%preset% &a（使用中）'
        lore:
          - '&7游戏：&f%games%'

  #完全在这里构建：可以随意添加或修改数量
  admin-logs:
    title: '&8日志'
    rows: 3
    open-requirements: ['permission chatgames.admin']
    open-deny-actions: ['[chatgames:no-permission]']
    filler:
      material: gray_stained_glass_pane
      name: ' '
    items:
      last-10:
        slot: 11
        material: paper
        name: '&f最近 &e10 &f局游戏'
        lore: ['&e点击在聊天中显示']
        actions: ['[close]', '[command] chatgames logs 10']
      last-25:
        slot: 12
        material: paper
        name: '&f最近 &e25 &f局游戏'
        lore: ['&e点击在聊天中显示']
        actions: ['[close]', '[command] chatgames logs 25']
      last-50:
        slot: 14
        material: paper
        name: '&f最近 &e50 &f局游戏'
        lore: ['&e点击在聊天中显示']
        actions: ['[close]', '[command] chatgames logs 50']
      last-100:
        slot: 15
        material: paper
        name: '&f最近 &e100 &f局游戏'
        lore: ['&e点击在聊天中显示']
        actions: ['[close]', '[command] chatgames logs 100']
      back:
        slot: 18
        material: arrow
        name: '&7返回'
        actions: ['[back] admin']
      close:
        slot: 26
        material: barrier
        name: '&c关闭'
        actions: ['[close]']

  #/chatgames debug：所有聊天游戏（%game% %key% %icon%）。[chatgames:debug] <game> 开始一个
  #私人回合并打开 debug-session。
  debug:
    title: '&4调试：选择一个游戏'
    rows: 4
    open-requirements: ['permission chatgames.debug']
    open-deny-actions: ['[chatgames:no-permission]']
    filler:
      material: gray_stained_glass_pane
      name: ' '
    list-slots: ['10-16', '19-25']
    items:
      previous:
        slot: 30
        material: arrow
        name: '&7上一页'
        actions: ['[previous-page]']
      next:
        slot: 32
        material: arrow
        name: '&7下一页 &8(%page%/%pages%)'
        actions: ['[next-page]']
      back:
        slot: 27
        material: arrow
        name: '&7返回'
        actions: ['[back] admin']
      close:
        slot: 35
        material: barrier
        name: '&c关闭'
        actions: ['[close]']
    templates:
      game:
        material: '%icon%'
        name: '&c%game%'
        lore:
          - '&7生成一个私人回合。'
          - '&7没有奖励，不保存任何东西。'
        actions: ['[chatgames:debug] %key%']

  #私人回合：%game% %key% %icon% %question% %answer% %time% %min_ms% %case_sensitive%
  #%winners% %points% %hints% %generated%；列表 %placeholders% 和 %answers%。
  #[chatgames:debug-answer] <correct|wrong|wrong-case> [ms] 发送一个模拟答案（在 ms 之后）；
  #[chatgames:debug-timeout] 等待时间限制结束；[chatgames:debug-reroll] 生成新回合；
  #[chatgames:debug-end] 结束会话。
  debug-session:
    title: '&4调试：%game%'
    rows: 5
    open-requirements: ['permission chatgames.debug']
    open-deny-actions: ['[chatgames:no-permission]']
    filler:
      material: gray_stained_glass_pane
      name: ' '
    #每个延迟一个“在 X 毫秒后正确作答”按钮，放在 'delays' 列表格子中
    delays: [100, 500, 1000, 5000]
    lists:
      delays: ['29-32']
    items:
      question:
        slot: 11
        material: '%icon%'
        name: '&e&l题目'
        lore:
          - '&f%question%'
          - ''
          - '%placeholders%'
      answer:
        slot: 13
        material: emerald
        name: '&a&l可接受的答案'
        lore:
          - '%answers%'
      settings:
        slot: 15
        material: repeater
        name: '&f&l设置'
        lore:
          - '&7时间限制：&f%time%s'
          - '&7最短作答时间：&f%min_ms% 毫秒'
          - '&7区分大小写：%case_sensitive%'
          - '&7赢家数：&f%winners%  &7积分：&f%points%'
          - '&7准备的提示：&f%hints%'
          - '&7生成用时：&f%generated% 毫秒'
      correct-now:
        slot: 28
        material: lime_wool
        name: '&a立即正确作答'
        lore:
          - '&7比任何人都快：展示'
          - '&7反宏检查的效果。'
        actions: ['[chatgames:debug-answer] correct']
      wrong:
        slot: 33
        material: red_wool
        name: '&c错误作答'
        actions: ['[chatgames:debug-answer] wrong']
      wrong-case:
        slot: 34
        material: orange_wool
        name: '&6用错误的大小写作答'
        actions: ['[chatgames:debug-answer] wrong-case']
      timeout:
        slot: 39
        material: clock
        name: '&e让它超时'
        lore:
          - '&7等待时间限制结束，然后报告。'
        actions: ['[chatgames:debug-timeout]']
      reroll:
        slot: 41
        material: ender_pearl
        name: '&d新回合'
        actions: ['[chatgames:debug-reroll]']
      back:
        slot: 36
        material: arrow
        name: '&7返回'
        actions: ['[chatgames:debug-end]', '[back] debug']
      close:
        slot: 44
        material: barrier
        name: '&c关闭'
        actions: ['[close]']
    templates:
      correct-after:
        material: yellow_wool
        name: '&e在 %ms% 毫秒后正确作答'
        actions: ['[chatgames:debug-answer] correct %ms%']
