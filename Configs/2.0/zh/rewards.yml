#从这里开始是竞赛的奖励，竞赛只有 1 名赢家
#
#使用的是不同的格式！请仔细阅读

races:
  rewards:
    #这些是你在 'races.yml' 中填写的奖励
    reward_1:
      chance: 50
      data:
        - '60.0%~ [consolecmd] give %player% diamond_block 5'
    #删除 'chance' 值会让奖励/命令总是执行
    reward_2:
      data:
        - '[consolecmd] give %player% iron_block 5'
        - '[playermsg] &a你赢了！'
    reward_3:
      chance: 50
      data:
        - '[consolecmd] give %player% diamond_block 3'