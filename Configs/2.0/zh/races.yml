enable-races: true

creative-enabled: true
#添加数据时有用的链接：
#
#https://hub.spigotmc.org/javadocs/spigot/org/bukkit/entity/EntityType.html
#https://helpch.at/docs/1.8/index.html?org/bukkit/entity/EntityType.html
#https://hub.spigotmc.org/javadocs/bukkit/org/bukkit/Material.html
#https://helpch.at/docs/1.8/org/bukkit/Material.html

#名称可以是新名或旧名（MOOSHROOM 或 MUSHROOM_COW，COD 或 RAW_FISH）：它们会匹配你服务器的
#版本。你的版本中不存在的名称（例如 1.8 上的 1.21 方块）会被跳过，并在控制台提示。
#
#每个竞赛还可以设置（可选）：
#  points: 1     #赢家获得的积分（默认 1）
#  weight: 1     #与其他游戏相比，轮换选中它的频率（默认 1，0 = 从不）
#
#管理员可以用自己的值开始竞赛：/chatgames <race> <material/mob> [amount]
#没有指定数量时，使用下面为该材料/生物列出的数量。赢家会获得为
#这个材料和数量列出的奖励，如果这里没有列出则没有奖励（积分照常发放）。

hunt:
  enable: true

  timeToComplete_seconds: 180
  #__将以下 2 项留空即可禁用__
  titleMessage: '&b狩猎'
  subtitleMessage: '&a击杀 %amount% 个 %value%！'

  #是否计算由刷怪笼或刷怪蛋生成的生物。
  count-spawner-mobs: true
  #MythicMobs 生物是否也算作它们所基于的生物（MythicMobs 僵尸算作 ZOMBIE）。
  count-mythic-mobs: true

  data:
    #这些值必须是有效的 Minecraft 生物 ID（见文件开头的有用链接）
    #安装 MythicMobs 后，mythic:<mob type> 表示它的一个生物（示例在这个列表的末尾）
    ZOMBIE:
      3:
        #你添加的所有奖励的概率之和不能超过 100%
        rewards:
          - reward_2
      5:
        rewards:
          - reward_1

    CREEPER:
      3:
        rewards:
          - reward_2
      5:
        rewards:
          - reward_1
    SKELETON:
      3:
        rewards:
          - reward_2
      5:
        rewards:
          - reward_1
    SPIDER:
      3:
        rewards:
          - reward_2
      5:
        rewards:
          - reward_1
    PIG:
      3:
        rewards:
