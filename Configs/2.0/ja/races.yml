enable-races: true

creative-enabled: true
#データを追加するのに役立つリンク：
#
#https://hub.spigotmc.org/javadocs/spigot/org/bukkit/entity/EntityType.html
#https://helpch.at/docs/1.8/index.html?org/bukkit/entity/EntityType.html
#https://hub.spigotmc.org/javadocs/bukkit/org/bukkit/Material.html
#https://helpch.at/docs/1.8/org/bukkit/Material.html

#名前は新しくても古くても構いません（MOOSHROOM か MUSHROOM_COW、COD か RAW_FISH）。サーバーの
#バージョンに合わせて照合されます。そのバージョンにない名前（例：1.8 での 1.21 のブロック）は飛ばされ、コンソールに通知されます。
#
#各レースには次も設定できます（任意）：
#  points: 1     #勝者がもらうポイント（初期値 1）
#  weight: 1     #ほかのゲームと比べてローテーションで選ばれる頻度（初期値 1、0 = 選ばれない）
#
#管理者は自分の値でレースを開始できます：/chatgames <race> <material/mob> [amount]
#数を指定しない場合、下でその素材/モブに書かれた数が使われます。勝者がもらえるのは、
#その素材と数に書かれた報酬だけです。ここになければ報酬はありません（ポイントはもらえます）。

hunt:
  enable: true

  timeToComplete_seconds: 180
  #__次の 2 つを空にすると無効になります__
  titleMessage: '&bハント'
  subtitleMessage: '&a%value% を %amount% 体倒せ！'

  #スポナーブロックやスポーンエッグで出たモブも数えるかどうか。
  count-spawner-mobs: true
  #MythicMobs のモブを、元になったモブとしても数えるかどうか（MythicMobs のゾンビを ZOMBIE として）。
  count-mythic-mobs: true

  data:
    #これらの値は有効な Minecraft のモブ ID でなければなりません（ファイル先頭の役立つリンクを参照）
    #MythicMobs を入れている場合、mythic:<mob type> はそのモブの 1 つです（例はこの一覧の最後にあります）
    ZOMBIE:
      3:
        #追加する報酬の確率の合計は 100% を超えてはいけません
        rewards:
          - reward_2
      5:
        rewards:
          - reward_1

    CREEPER:
      3:
        rewards:
          - reward_2
      5:
        rewards:
          - reward_1
    SKELETON:
      3:
        rewards:
          - reward_2
      5:
        rewards:
          - reward_1
    SPIDER:
      3:
        rewards:
          - reward_2
      5:
        rewards:
          - reward_1
    PIG:
      3:
        rewards:
