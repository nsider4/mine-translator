variable:
  #表示される形式です。'line1and2-format' で %symbol% を繰り返す回数は変えられますが、3 行目の変数はすべてこのままにしてください。
  line1and2-format: '&c%symbol%&f + &c%symbol%&f + &c%symbol%&f = &e'
  line3-format: '&c%symbol_1%&f + &c%symbol_2%&f + &b%toGet% &f= &e%result%'
  gameStartAnnouncement:
    - ''
    - '<center>&r✓ ✯ %prefix%&r ✯ ✓'
    - ''
    - '<center>&f&e%timeToGuess% 秒&fで&d求めよう&f：`&b%symbol%&f`'
    - ''
    - '<center>%line_1%'
    - '<center>%line_2%'
    - '<center>%line_3%'
    - ''
  correct_message:
    - ''
    - '<center>&r✓ ✯ %prefix% &r✯ ✓'
    - ''
    - '<center>&a%winner_1% &7が最速で `&e%correct_answer%&7` を求め（&c%time_1%s&7）、賞品をゲット！'
