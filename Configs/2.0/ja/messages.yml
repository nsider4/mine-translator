memorize:
  gameStartAnnouncement:
    - ''
    - '<center>&r✓ ✯ %prefix%&r ✯ ✓'
    - ''
    - '<center>&f&e%timeToMemorize% 秒&fでこのリストを&d覚えよう&f：'
    - ''
    - '<center>&f`&b%selection%&f`'
    - ''
  messageAfterMemorized:
    - ''
    - '<center>&r✓ ✯ %prefix%&r ✯ ✓'
    - ''
    - '<center>&f&e%timeToGuess% 秒&fでリストを&d順番どおりに&f書こう！'
    - ''
    - '<center>&f各アイテムはカンマで区切ってね！（例：`&bりんご, バナナ, チョコレート&f`）'
    - ''
  correct_message:
    - ''
    - '<center>&r✓ ✯ %prefix% &r✯ ✓'
    - ''
    - '<center>&a%winner_1% &7が最初にリストを書き、賞品をゲット！（&c%time_1%s&7）'
    - ''
    - '<center>&fリストは：&f`&b%correct_answer%&f`'
    - ''
  time_expired_message:
    - ''
    - '<center>&r✓ ✯ %prefix%&r ✯ ✓'
    - ''
    - '<center>&f%timeToGuess%秒&cが経過！&fメモライズゲームは終了です！'
    - ''
    - '<center>&fリストは：&f`&b%correct_answer%&f`'
    - ''

