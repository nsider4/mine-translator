help_command:
  - '&8&m-------------------------------------------------'
  - '&e&l-ChatGames-'
  - '&6'
  - '&6&lコマンド：'
  - '&6'
  - '&e/chatgames menu [menu] &8- &7メニューを開きます：プロフィール、チャレンジ、連続記録、ランキング（または menus.yml の任意のメニュー）。'
  - '&e/chatgames profile [player] &8- &7自分（または他のプレイヤー）の統計を表示します。'
  - '&e/chatgames top &8- &7ポイントが多い上位 10 人を表示します。'
  - '&e/chatgames fastest [game] &8- &7全体または 1 つのゲームの最速の勝者を表示します。'
  - '&e/chatgames points [player] &8- &7自分（または他のプレイヤー）のポイントを表示します。'
  - '&e/chatgames challenges &8- &7デイリーとウィークリーのチャレンジを表示します。'
  - '&e/chatgames streaks &8- &7連続記録を表示します。'
  - '&e/chatgames claim &8- &7達成したチャレンジと連続記録の報酬を受け取ります。'
  - '&e/chatgames event [list|top <event>] &8- &7ゲームイベント、または 1 つのイベントで最も得点した人を表示します。'
  - '&e/chatgames toggle [player] &8- &7チャットゲームのオン/オフを切り替えます。'
  - '&e/chatgames togglesound [player] &8- &7チャットゲームのサウンドのオン/オフを切り替えます。'
  - '&6'
  - '&6&l管理者：'
  - '&e/chatgames admin &8- &7管理メニューを開きます。'
  - '&e/chatgames debug &8- &7デバッグメニューを開きます：どのゲームも報酬なしで個人的にテストできます。'
  - '&e/chatgames (game) [values] &8- &7そのゲームを今すぐ開始します。自分の単語/値も指定できます。'
  - '&e/chatgames any &8- &7ローテーションが次に選ぶゲームを開始します。'
  - '&e/chatgames global <game> [values] &8- &7グローバルゲームを開始します：サーバー全員で協力してプレイします。'
  - '&e/chatgames event start <event> | stop &8- &7ゲームイベントを開始または停止します。'
  - '&e/chatgames stop &8- &7進行中のゲームを勝者なしで終了します。'
  - '&e/chatgames toggleAll &8- &7ゲームの自動ローテーションをオン/オフします。'
  - '&e/chatgames preset <list|load|save> [name] &8- &7ゲームのプリセットを管理します。'
  - '&e/chatgames +points|-points|setpoints <player> <amount> &8- &7プレイヤーのポイントを変更します。'
  - '&e/chatgames remove <player> &8- &7プレイヤーのデータを削除します。'
  - '&e/chatgames challenges reset <player> &8- &7プレイヤーのチャレンジ進行を消去します。'
  - '&e/chatgames streak set <player> <challenge|daily|global> <days> &8- &7プレイヤーの連続記録を設定します。'
  - '&e/chatgames logs [amount] &8- &7直近のゲームのログを表示します。'
  - '&e/chatgames discord <test <message|all>|leaderboard> &8- &7Discord にテストメッセージかランキングを送ります。'
  - '&e/chatgames reload &8- &7設定ファイルを再読み込みします。'
  - '&6'
  - '&6&lゲームの種類：'
  - '&7unscramble, unreverse, reaction, random, fillout, variable, clickable, math, sequence, memorize, guess_the_number, trivia, word_association, hoverable, hunt, mine, place, fish, craft, eat, furnace, tame, shear'
  - '&8&m-------------------------------------------------'

#リスト形式のメッセージで <center> を使うと中央寄せになります。それを含む行が中央に表示されます！

#############################
##    チャットゲームのメッセージ    ##
#############################
#すべてのゲームで共通です。各ゲームは下の自分のセクションの 'hint_message' / 'countdown_actionbar' で上書きできます。
hint_message: '&8[%prefix%&8] &eヒント：&f%hint%'
countdown_actionbar: '&7残り &e%seconds%秒'

waiting_for_other_winners: '&8[%prefix%&8] &a正解！&fほかの勝者を待っています…'
wrong_case: '&8[%prefix%&8] &c惜しい…大文字と小文字を確認して！'
  #すべてのゲームの correct_message で、%player% の代わりに "%display_name%" を使えます。
  #
  #%points_<position>% で勝ったプレイヤーのポイントも表示できます。
  #
  #1 位、2 位、3 位…の勝者を表示するには %winner_<position>%、それぞれのタイムには %time_<position>% を使います

  ##例：勝者 2 人の場合：
  #
  #correct_message:
  #- ''
  #- '<center>&r✓ ✯ %prefix% &r✯ ✓'
  #- ''
  #- '&7正解は `&e%correct_answer%&7` でした！勝者は：'
  #- '<center>&f1. &a%winner_1% - (&c%time_1%s&7)'
  #- '<center>&f2. &a%winner_2% - (&c%time_2%s&7)'
#- ''
unscramble:
  gameStartAnnouncement:
    - ''
    - '<center>&r✓ ✯ %prefix%&r ✯ ✓'
    - ''
    - '<center>&f&e%timeToGuess% 秒&fで&d並べ替えよう&f：`&b%selection%&f`'
    - ''
  correct_message:
    - ''
    - '<center>&r✓ ✯ %prefix% &r✯ ✓'
    - ''
    - '<center>&a%winner_1% &7が `&e%correct_answer%&7` を正しく並べ替え（&c%time_1%s&7）、賞品をゲット！'
    - ''
  time_expired_message:
    - ''
    - '<center>&r✓ ✯ %prefix%&r ✯ ✓'
    - ''
    - '<center>&f%timeToGuess%秒&cが経過！&f並べ替えゲームは終了です！'
    - '<center>正解は &e%correct_answer%&f でした！'
    - ''

