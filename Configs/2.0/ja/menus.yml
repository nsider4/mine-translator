      previous:
        slot: 30
        material: arrow
        name: '&7前のページ'
        actions: ['[previous-page]']
      next:
        slot: 32
        material: arrow
        name: '&7次のページ &8(%page%/%pages%)'
        actions: ['[next-page]']
      back:
        slot: 27
        material: arrow
        name: '&7戻る'
        actions: ['[back] leaderboards']
      close:
        slot: 35
        material: barrier
        name: '&c閉じる'
        actions: ['[close]']
    templates:
      event:
        material: nether_star
        name: '%event%'
        lore:
          - '&7%steps% ゲーム'
          - ''
          - '&eクリックで最も得点した人を見る'
        actions: ['[close]', '[command] chatgames event top %id%']

  #/chatgames admin。%current_game% %next_game% %rotation_state% %event% %preset%、
  #%rotation_on% と %games_on%（true か false）。各ボタンは対応するコマンドを実行し、
  #入力したときと同じように権限が確認されます。
  admin:
    title: '&4&lChatGames 管理'
    rows: 5
    open-requirements: ['permission chatgames.admin']
    open-deny-actions: ['[chatgames:no-permission]']
    filler:
      material: gray_stained_glass_pane
      name: ' '
    formats:
      none: '&7なし'
    items:
      status:
        slot: 4
        material: repeater
        name: '&f&l状態'
        lore:
          - '&7進行中：&f%current_game%'
          - '&7次のゲームまで：&f%next_game%'
          - '&7ローテーション：%rotation_state%'
          - '&7イベント：&f%event%'
          - '&7プリセット：&f%preset%'
      start-game:
        slot: 19
        material: diamond_sword
        name: '&a&lゲームを開始'
        lore:
          - '&7どのゲームやレースでも、今すぐ。'
        actions: ['[open] admin-start']
      global:
        slot: 20
        material: beacon
        name: '&3&lグローバルゲームを開始'
        lore:
          - '&7時間内に達成した全員が勝ちます。'
        actions: ['[open] admin-global']
      events:
        slot: 21
        material: nether_star
        name: '&6&lイベント'
        lore:
          - '&7ゲームイベントを開始または停止します。'
        actions: ['[open] admin-events']
      presets:
        slot: 23
        material: chest
        name: '&d&lプリセット'
        lore:
          - '&7有効なゲームのセットを読み込みます。'
        actions: ['[open] admin-presets']
      logs:
        slot: 24
        material: oak_sign
        name: '&f&lログ'
        lore:
          - '&7直近のゲームをチャットに表示します。'
        actions: ['[open] admin-logs']
      stop:
        slot: 25
        material: red_wool
        name: '&c&lゲームを停止'
        lore:
          - '&7進行中のゲームを勝者なしで終了します。'
        actions: ['[command] chatgames stop', '[wait] 2', '[refresh]']
      toggle:
        slot: 29
        material: lime_dye
        name: '&fあなたのチャットゲーム：&aオン'
        lore:
          - '&7クリックでオフにします。'
        state: '%games_on%'
        actions: ['[command] chatgames toggle', '[refresh]']
        when-off:
          material: gray_dye
          name: '&fあなたのチャットゲーム：&cオフ'
          lore:
            - '&7クリックでオンにします。'
      toggle-all:
        slot: 30
        material: lime_dye
        name: '&fゲームローテーション：&aオン'
        lore:
          - '&7クリックで全員の自動ゲームを止めます。'
        state: '%rotation_on%'
        #toggleAll はグローバルスレッドで終わります。Folia では 1 tick 後です
        actions: ['[command] chatgames toggleAll', '[wait] 2', '[refresh]']
        when-off:
          material: gray_dye
          name: '&fゲームローテーション：&cオフ'
          lore:
            - '&7クリックで自動ゲームを再開します。'
      reload:
        slot: 32
        material: hopper
        name: '&e&l再読み込み'
        lore:
          - '&7すべての設定ファイルを再読み込みします。'
        actions: ['[close]', '[command] chatgames reload']
      debug:
        slot: 33
        material: command_block
        name: '&c&lデバッグ'
        lore:
          - '&7どのゲームも個人的にテストします。'
        view-requirements: ['permission chatgames.debug']
        actions: ['[open] debug']
      back:
        slot: 36
        material: arrow
        name: '&7戻る'
        actions: ['[back] main']
      close:
        slot: 44
        material: barrier
        name: '&c閉じる'
        actions: ['[close]']

  #すべてのゲームとレース：%game% %key%（コマンドと同じ） %icon%
  admin-start:
    title: '&8ゲームを開始'
    rows: 6
    open-requirements: ['permission chatgames.admin']
    open-deny-actions: ['[chatgames:no-permission]']
    filler:
      material: gray_stained_glass_pane
      name: ' '
    list-slots: ['10-16', '19-25', '28-34']
    items:
      previous:
        slot: 48
        material: arrow
        name: '&7前のページ'
        actions: ['[previous-page]']
      next:
        slot: 50
        material: arrow
        name: '&7次のページ &8(%page%/%pages%)'
        actions: ['[next-page]']
      back:
        slot: 45
        material: arrow
        name: '&7戻る'
        actions: ['[back] admin']
      close:
        slot: 53
        material: barrier
        name: '&c閉じる'
        actions: ['[close]']
    templates:
      game:
        material: '%icon%'
        name: '&a%game%'
        lore:
          - '&7チャットゲーム'
          - '&eクリックで開始'
        actions: ['[close]', '[command] chatgames %key%']
      race:
        material: '%icon%'
        name: '&6%game%'
        lore:
          - '&7レース'
          - '&eクリックで開始'
        actions: ['[close]', '[command] chatgames %key%']

  #global_games.yml で有効なゲーム：%game% %key% %icon% %goal% %duration% %points%。
  #進行中のもの：%global_running% %global_game% %global_goal%（例："500 石"）
  #%global_progress% %global_goal_amount% %global_percent% %global_contributors% %global_time_left%
  admin-global:
    title: '&8グローバルゲーム'
    rows: 5
    update-interval: 20
    open-requirements: ['permission chatgames.admin']
    open-deny-actions: ['[chatgames:no-permission]']
    filler:
      material: gray_stained_glass_pane
      name: ' '
    list-slots: ['19-25', '28-34']
    items:
      status:
        slot: 4
        material: beacon
        name: '&3&l進行中：&f%global_game%'
        lore:
          - '&7目標：&f%global_goal%'
          - '&7進行：&e%global_progress%&7/&e%global_goal_amount% &8(%global_percent%%)'
          - '&7協力中のプレイヤー：&f%global_contributors%'
          - '&7残り時間：&f%global_time_left%s'
          - ''
          - '&cクリックで停止（報酬なし）'
        view-requirements: ['%global_running%']
        actions: ['[command] chatgames stop', '[wait] 2', '[refresh]']
      idle:
        slot: 4
        material: gray_dye
        name: '&7進行中のグローバルゲームはありません'
        lore:
          - '&7下から 1 つ選んで開始します。'
        view-requirements: ['!%global_running%']
      none:
        slot: 22
        material: barrier
        name: '&7有効なグローバルゲームがありません'
        view-requirements: ['%entries% == 0']
      previous:
        slot: 39
        material: arrow
        name: '&7前のページ'
        actions: ['[previous-page]']
      next:
        slot: 41
        material: arrow
        name: '&7次のページ &8(%page%/%pages%)'
        actions: ['[next-page]']
      back:
        slot: 36
        material: arrow
        name: '&7戻る'
        actions: ['[back] admin']
      close:
        slot: 44
        material: barrier
        name: '&c閉じる'
        actions: ['[close]']
    templates:
      game:
        material: '%icon%'
        name: '&3グローバル%game%'
        lore:
          - '&7目標：正解 &f%goal% 回'
          - '&7時間：&f%duration%s'
          - '&7ポイント：&f%points%'
          - ''
          - '&eクリックで開始'
        actions: ['[close]', '[command] chatgames global %key%']
      race:
        material: '%icon%'
        name: '&3グローバル%game%レース'
        lore:
          - '&7目標：みんなで &f%goal%'
          - '&7時間：&f%duration%s'
          - '&7ポイント：&f%points%'
          - ''
          - '&eクリックで開始'
        actions: ['[close]', '[command] chatgames global %key%']
      count:
        material: '%icon%'
        name: '&3グローバル%game%'
        lore:
          - '&7チャットでみんなで数えよう'
          - '&7時間：&f%duration%s'
          - '&7ポイント：&f%points%'
          - ''
          - '&eクリックで開始'
        actions: ['[close]', '[command] chatgames global %key%']

  #events.yml のイベント：%event% %id% %steps%、開催中のものには %step%（今のゲーム）
  admin-events:
    title: '&8イベント'
    rows: 4
    open-requirements: ['permission chatgames.admin']
    open-deny-actions: ['[chatgames:no-permission]']
    filler:
      material: gray_stained_glass_pane
      name: ' '
    list-slots: ['10-16', '19-25']
    items:
      none:
        slot: 13
        material: barrier
        name: '&7events.yml にイベントが設定されていません'
        view-requirements: ['%entries% == 0']
      previous:
        slot: 30
        material: arrow
        name: '&7前のページ'
        actions: ['[previous-page]']
      next:
        slot: 32
        material: arrow
        name: '&7次のページ &8(%page%/%pages%)'
        actions: ['[next-page]']
      back:
        slot: 27
        material: arrow
        name: '&7戻る'
        actions: ['[back] admin']
      close:
        slot: 35
        material: barrier
        name: '&c閉じる'
        actions: ['[close]']
    templates:
      event:
        material: nether_star
        name: '%event%'
        lore:
          - '&7%steps% ゲーム'
          - ''
          - '&eクリックで開始'
        actions: ['[command] chatgames event start %id%', '[wait] 2', '[refresh]']
      running:
        material: nether_star
        glow: true
        name: '%event% &a（進行中）'
        lore:
          - '&7%steps% ゲーム中 %step% ゲーム目'
          - ''
          - '&cクリックで停止'
        actions: ['[command] chatgames event stop', '[wait] 2', '[refresh]']

  #プリセットと 'none'（games.yml の有効フラグ）：%preset% %games%
  admin-presets:
    title: '&8プリセット'
    rows: 4
    open-requirements: ['permission chatgames.admin']
    open-deny-actions: ['[chatgames:no-permission]']
    filler:
      material: gray_stained_glass_pane
      name: ' '
    list-slots: ['10-16', '19-25']
    items:
      previous:
        slot: 30
        material: arrow
        name: '&7前のページ'
        actions: ['[previous-page]']
      next:
        slot: 32
        material: arrow
        name: '&7次のページ &8(%page%/%pages%)'
        actions: ['[next-page]']
      back:
        slot: 27
        material: arrow
        name: '&7戻る'
        actions: ['[back] admin']
      close:
        slot: 35
        material: barrier
        name: '&c閉じる'
        actions: ['[close]']
    templates:
      preset:
        material: chest
        name: '&d%preset%'
        lore:
          - '&7ゲーム：&f%games%'
          - ''
          - '&eクリックで読み込む'
        actions: ['[command] chatgames preset load %preset%', '[wait] 2', '[refresh]']
      active:
        material: ender_chest
        glow: true
        name: '&d%preset% &a（使用中）'
        lore:
          - '&7ゲーム：&f%games%'

  #すべてここで作られています。数は自由に追加・変更できます
  admin-logs:
    title: '&8ログ'
    rows: 3
    open-requirements: ['permission chatgames.admin']
    open-deny-actions: ['[chatgames:no-permission]']
    filler:
      material: gray_stained_glass_pane
      name: ' '
    items:
      last-10:
        slot: 11
        material: paper
        name: '&f直近 &e10 &fゲーム'
        lore: ['&eクリックでチャットに表示']
        actions: ['[close]', '[command] chatgames logs 10']
      last-25:
        slot: 12
        material: paper
        name: '&f直近 &e25 &fゲーム'
        lore: ['&eクリックでチャットに表示']
        actions: ['[close]', '[command] chatgames logs 25']
      last-50:
        slot: 14
        material: paper
        name: '&f直近 &e50 &fゲーム'
        lore: ['&eクリックでチャットに表示']
        actions: ['[close]', '[command] chatgames logs 50']
      last-100:
        slot: 15
        material: paper
        name: '&f直近 &e100 &fゲーム'
        lore: ['&eクリックでチャットに表示']
        actions: ['[close]', '[command] chatgames logs 100']
      back:
        slot: 18
        material: arrow
        name: '&7戻る'
        actions: ['[back] admin']
      close:
        slot: 26
        material: barrier
        name: '&c閉じる'
        actions: ['[close]']

  #/chatgames debug：すべてのチャットゲーム（%game% %key% %icon%）。[chatgames:debug] <game> で
  #プライベートなラウンドを始め、debug-session を開きます。
  debug:
    title: '&4デバッグ：ゲームを選ぶ'
    rows: 4
    open-requirements: ['permission chatgames.debug']
    open-deny-actions: ['[chatgames:no-permission]']
    filler:
      material: gray_stained_glass_pane
      name: ' '
    list-slots: ['10-16', '19-25']
    items:
      previous:
        slot: 30
        material: arrow
        name: '&7前のページ'
        actions: ['[previous-page]']
      next:
        slot: 32
        material: arrow
        name: '&7次のページ &8(%page%/%pages%)'
        actions: ['[next-page]']
      back:
        slot: 27
        material: arrow
        name: '&7戻る'
        actions: ['[back] admin']
      close:
        slot: 35
        material: barrier
        name: '&c閉じる'
        actions: ['[close]']
    templates:
      game:
        material: '%icon%'
        name: '&c%game%'
        lore:
          - '&7プライベートなラウンドを作ります。'
          - '&7報酬なし、何も保存されません。'
        actions: ['[chatgames:debug] %key%']

  #プライベートなラウンド：%game% %key% %icon% %question% %answer% %time% %min_ms% %case_sensitive%
  #%winners% %points% %hints% %generated%、一覧は %placeholders% と %answers%。
  #[chatgames:debug-answer] <correct|wrong|wrong-case> [ms] で模擬回答を送ります（ms 後）。
  #[chatgames:debug-timeout] は制限時間まで待ちます。[chatgames:debug-reroll] は新しいラウンドを作ります。
  #[chatgames:debug-end] でセッションを終了します。
  debug-session:
    title: '&4デバッグ：%game%'
    rows: 5
    open-requirements: ['permission chatgames.debug']
    open-deny-actions: ['[chatgames:no-permission]']
    filler:
      material: gray_stained_glass_pane
      name: ' '
    #待ち時間ごとに「X ms 後に正解する」ボタンが 1 つ、'delays' 一覧のスロットに置かれます
    delays: [100, 500, 1000, 5000]
    lists:
      delays: ['29-32']
    items:
      question:
        slot: 11
        material: '%icon%'
        name: '&e&l問題'
        lore:
          - '&f%question%'
          - ''
          - '%placeholders%'
      answer:
        slot: 13
        material: emerald
        name: '&a&l受理される答え'
        lore:
          - '%answers%'
      settings:
        slot: 15
        material: repeater
        name: '&f&l設定'
        lore:
          - '&7制限時間：&f%time%s'
          - '&7最短回答時間：&f%min_ms% ms'
          - '&7大文字・小文字の区別：%case_sensitive%'
          - '&7勝者数：&f%winners%  &7ポイント：&f%points%'
          - '&7用意されたヒント：&f%hints%'
          - '&7生成時間：&f%generated% ms'
      correct-now:
        slot: 28
        material: lime_wool
        name: '&a今すぐ正解する'
        lore:
          - '&7どんな人よりも速い：アンチマクロの'
          - '&7チェックが働く様子を見られます。'
        actions: ['[chatgames:debug-answer] correct']
      wrong:
        slot: 33
        material: red_wool
        name: '&c不正解で答える'
        actions: ['[chatgames:debug-answer] wrong']
      wrong-case:
        slot: 34
        material: orange_wool
        name: '&6大文字・小文字を間違えて答える'
        actions: ['[chatgames:debug-answer] wrong-case']
      timeout:
        slot: 39
        material: clock
        name: '&e時間切れにする'
        lore:
          - '&7制限時間まで待ってから報告します。'
        actions: ['[chatgames:debug-timeout]']
      reroll:
        slot: 41
        material: ender_pearl
        name: '&d新しいラウンド'
        actions: ['[chatgames:debug-reroll]']
      back:
        slot: 36
        material: arrow
        name: '&7戻る'
        actions: ['[chatgames:debug-end]', '[back] debug']
      close:
        slot: 44
        material: barrier
        name: '&c閉じる'
        actions: ['[close]']
    templates:
      correct-after:
        material: yellow_wool
        name: '&e%ms% ms 後に正解する'
        actions: ['[chatgames:debug-answer] correct %ms%']
