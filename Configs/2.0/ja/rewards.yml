#ここから先は、勝者が 1 人だけのレースの報酬です
#
#形式が違います！よく読んでください

races:
  rewards:
    #これらは 'races.yml' に書く報酬です
    reward_1:
      chance: 50
      data:
        - '60.0%~ [consolecmd] give %player% diamond_block 5'
    #'chance' の値を消すと、その報酬/コマンドは必ず実行されます
    reward_2:
      data:
        - '[consolecmd] give %player% iron_block 5'
        - '[playermsg] &a勝利！'
    reward_3:
      chance: 50
      data:
        - '[consolecmd] give %player% diamond_block 3'