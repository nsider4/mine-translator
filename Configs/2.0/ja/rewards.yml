#使える動作：
#
#[playercmd] - 勝者としてコマンドを実行
#[consolecmd] - コンソールからコマンドを実行
#[playermsg] - 勝者にメッセージを送る
#[broadcast] - 有効なワールドの全プレイヤーにメッセージを流す
#[player_as_op] - プレイヤーに OP としてコマンドを実行させる
#
#報酬に確率をつけるには次のようにします：
#
#例：
#  - '10.0%~ [consolecmd] give %player% iron_block 5'
#例と同じ形式のときだけ動きます。先頭に <chance>%、続けて ~ と半角スペース。必ずコマンドの最初に書きます
#
#% のないコマンドは 100% もらえる報酬です。

#権限のチェック：
#
#コマンドの行の最後に書きます。
#例：
#  - '[consolecmd] give %player% iron_block 5 has:test.permission'

#1 は 1 人目の勝者です。config.yml で勝者を増やして別の報酬にしたい場合は、その順位（2: など）を追加します
unscramble:
  rewards:
    1:
      reward_1:
        minimum-players: 2 #オンライン人数による条件。オンラインが 2 人以上のときだけこの報酬が選ばれます
        chance: 50
        data:
          - '10.0%~ [consolecmd] give %player% diamond_block 3 has:test.permission'
          - '[consolecmd] give %player% iron_block 5'
      reward_2:
        data:
          - '[consolecmd] give %player% iron_block 2'

