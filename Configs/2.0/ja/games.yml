#############################
######    チャットゲーム    ######
#############################
#すべてのゲームで使える設定（書かれていないものは表示の初期値になります）：
#  enable: true/false
#  weight: 1             ほかのゲームと比べて、ローテーションでこのゲームが選ばれやすさ（0 = 選ばれない）。
#                        同じゲームが 2 回続けて行われることはありません。
#  winners: 1            1 ラウンドで何人が勝てるか。
#  points: 1             1 勝あたりのポイント（/chatgames top）。
#  case-sensitive: false 大文字・小文字だけが違うプレイヤーには 'wrong_case' メッセージが送られます。
#  timeToGuess_seconds: 20
#  min-answer-ms: 400    これより速い正解は無視され、記録されます。人はそんなに速く読んで
#                        入力できません。チャットボットだけです。0 でこのチェックをオフにします。
#  hints:                ラウンド中にヒントが表示されます。messages.yml の 'hint_message' を使います。
#    enable: false
#    after-percent: 50   時間がこれだけ過ぎると最初のヒントが表示されます。残りは残り時間に分散されます。
#    max: 1              最大 3。
#  countdown:            残り時間をアクションバーに表示します。すべてのバージョンで動作します（1.8 から 26.x）。
#    enable: false
#    last-seconds: 10    最後の N 秒だけ表示します。0 でラウンド中ずっと表示します。
#  titleMessage / subtitleMessage：両方空にするとタイトルを送りません。
unscramble:
  enable: true
  winners: 1
  weight: 1
  points: 1
  hints:
    enable: true
    after-percent: 50
    max: 1
  countdown:
    enable: true
    last-seconds: 10

  case-sensitive: true
  #プレイヤーが当てる・解く・入力するなどのための時間（秒）。
  timeToGuess_seconds: 20
  #__次の 2 つを空にすると無効になります__
  titleMessage: '&b%selection%'
  subtitleMessage: '&a並べ替え'

