#DE AQUÍ EN ADELANTE SON RECOMPENSAS PARA CARRERAS, QUE SOLO TIENEN 1 GANADOR
#
#¡SE USA UN FORMATO DISTINTO! LEE CON ATENCIÓN

races:
  rewards:
    #ESTAS SON LAS RECOMPENSAS QUE PONES EN 'races.yml'
    reward_1:
      chance: 50
      data:
        - '60.0%~ [consolecmd] give %player% diamond_block 5'
    #QUITAR EL VALOR 'chance' HACE QUE LA RECOMPENSA/COMANDO SE DÉ SIEMPRE
    reward_2:
      data:
        - '[consolecmd] give %player% iron_block 5'
        - '[playermsg] &a¡Has ganado!'
    reward_3:
      chance: 50
      data:
        - '[consolecmd] give %player% diamond_block 3'