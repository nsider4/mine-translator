discord:
  #Si url está vacío, esto se ignora porque no habrá webhook
  webhook-url: ''
  message-content: 'Latest game results:'
  img-url: 'https://www.spigotmc.org/data/resource_icons/107/107781.jpg?1676494289'
  username: 'Chat Games'
  title: 'Chat Games Result'
  description: 'The winner is:'
  winner-field: '%winner% (%time%)'
  game-field: 'Game: %game%'


#El archivo donde se guardarán los registros
log-file: 'game_log.txt'

#Si es true, registra todos los eventos de chat en la consola; puede hacerse a la vez que lo siguiente
