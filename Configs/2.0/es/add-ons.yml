#Los ajustes de Discord están en discord.yml.

#El archivo donde se guardarán los registros
log-file: 'game_log.txt'

#Si es true, registra todos los eventos de chat en la consola; puede hacerse a la vez que lo siguiente
log-console: true

#Si es true, registra todos los eventos de chat en un archivo; puede hacerse a la vez que lo anterior
log-local: true