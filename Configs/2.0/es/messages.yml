help_command:
  - '&8&m-------------------------------------------------'
  - '&e&l-ChatGames-'
  - '&6'
  - '&6&lCOMANDOS:'
  - '&6'
  - '&e/chatgames menu [menu] &8- &7Abre el menú: perfil, desafíos, rachas, clasificaciones (o cualquier menú de menus.yml).'
  - '&e/chatgames profile [player] &8- &7Muestra tus estadísticas (o las de otro jugador).'
  - '&e/chatgames top &8- &7Muestra los 10 jugadores con más puntos.'
  - '&e/chatgames fastest [game] &8- &7Muestra los ganadores más rápidos, en general o de un juego.'
  - '&e/chatgames points [player] &8- &7Muestra tus puntos (o los de otro jugador).'
  - '&e/chatgames challenges &8- &7Muestra tus desafíos diarios y semanales.'
  - '&e/chatgames streaks &8- &7Muestra tus rachas.'
  - '&e/chatgames claim &8- &7Reclama los desafíos terminados y las recompensas de racha.'
  - '&e/chatgames event [list|top <event>] &8- &7Muestra los eventos de juegos, o quién puntuó más en uno.'
  - '&e/chatgames toggle [player] &8- &7Activa o desactiva los juegos de chat para ti.'
  - '&e/chatgames togglesound [player] &8- &7Activa o desactiva los sonidos de los juegos.'
  - '&6'
  - '&6&lADMIN:'
  - '&e/chatgames admin &8- &7Abre el menú de administración.'
  - '&e/chatgames debug &8- &7Abre el menú de depuración: prueba cualquier juego en privado, sin recompensas.'
  - '&e/chatgames (game) [values] &8- &7Inicia ese juego ya, opcionalmente con tu propia palabra/valores.'
  - '&e/chatgames any &8- &7Inicia el juego que elegiría la rotación a continuación.'
  - '&e/chatgames global <game> [values] &8- &7Inicia un juego global: todo el servidor juega en equipo.'
  - '&e/chatgames event start <event> | stop &8- &7Inicia o detiene un evento de juegos.'
  - '&e/chatgames stop &8- &7Termina el juego en curso sin ganador.'
  - '&e/chatgames toggleAll &8- &7Activa o desactiva la rotación automática de juegos.'
  - '&e/chatgames preset <list|load|save> [name] &8- &7Gestiona los presets de juegos.'
  - '&e/chatgames +points|-points|setpoints <player> <amount> &8- &7Cambia los puntos de un jugador.'
  - '&e/chatgames remove <player> &8- &7Borra los datos de un jugador.'
  - '&e/chatgames challenges reset <player> &8- &7Borra el progreso de desafíos de un jugador.'
  - '&e/chatgames streak set <player> <challenge|daily|global> <days> &8- &7Fija la racha de un jugador.'
  - '&e/chatgames logs [amount] &8- &7Muestra los últimos registros de juegos.'
  - '&e/chatgames discord <test <message|all>|leaderboard> &8- &7Envía un mensaje de prueba o la clasificación a Discord.'
  - '&e/chatgames reload &8- &7Recarga los archivos de configuración.'
  - '&6'
  - '&6&lTIPOS DE JUEGO:'
  - '&7unscramble, unreverse, reaction, random, fillout, variable, clickable, math, sequence, memorize, guess_the_number, trivia, word_association, hoverable, hunt, mine, place, fish, craft, eat, furnace, tame, shear'
  - '&8&m-------------------------------------------------'

