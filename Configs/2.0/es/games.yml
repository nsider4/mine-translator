#En este juego se crea una cadena de la longitud indicada con caracteres aleatorios
random:
  enable: true
  winners: 1
  weight: 1
  points: 1
  countdown:
    enable: true
    last-seconds: 10

  case-sensitive: true
  #El tiempo en segundos que tienen los jugadores para adivinar, resolver, escribir, etc.
  timeToGuess_seconds: 20
  #La longitud de la cadena aleatoria de este juego. Formato de rango <menor>-<mayor>. Para una sola longitud usa el mismo número en ambos lados
  lengthRange: 6-8
  #Tipos disponibles: ALPHA (letras), ALPHANUMERIC (letras y números), NUMERIC (números), SYMBOLIC (símbolos),
  #LOWERCASE_ALPHA (todo minúsculas), UPPERCASE_ALPHA (todo mayúsculas), HEXADECIMAL (caracteres hexadecimales: 0123456789ABCDEF)
  #CUSTOM (usa lo que haya en 'custom_characters')
  character_type: ALPHANUMERIC
  #Esta línea solo se usa si el tipo es "CUSTOM"
  custom_characters: 'abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789'

  #__Deja los 2 siguientes vacíos para desactivarlos__
  titleMessage: '&b%selection%'
  subtitleMessage: '&aEscribe'

math:
  enable: true
  winners: 1
  weight: 1
  points: 1
  hints:
    enable: true
    after-percent: 50
    max: 1
  countdown:
    enable: true
    last-seconds: 10

  #No cambies esto
  case-sensitive: false
  #El tiempo en segundos que tienen los jugadores para adivinar, resolver, escribir, etc.
  timeToGuess_seconds: 20
  #Rangos de números aleatorios por dificultad:
  #1 - (1-9)
  #2 - (1-99)
  #3 - (1-999)
  #4 - (1-9999)
  #5 - (1-99999)
  difficulty: 2
  #Cuántos operadores tiene cada pregunta: 1 -> "12 + 7", 2 -> "12 + 7 x 3"
  operations: 1
  #solve: calcular el resultado ("12 + 7 x 3").  missing-value: hallar el número oculto ("12 + ? x 3 = 33").
  #Cada ronda elige uno de los modos de la lista.
  modes:
    - solve
    - missing-value
  #Operadores a usar; los cuatro de la lista son los disponibles, puedes quitar los que no quieras. Deja siempre al menos 1
  #Las divisiones siempre dan números enteros.
  operators:
    - '+'
    - '-'
    - 'x'
    - '/'

  #__Deja los 2 siguientes vacíos para desactivarlos__
  titleMessage: '&b%selection%'
  subtitleMessage: '&aResuelve'

variable:
  enable: true
  winners: 1
  weight: 1
  points: 1
  countdown:
    enable: true
    last-seconds: 10

  #No cambies esto
  case-sensitive: false
  #El tiempo en segundos que tienen los jugadores para adivinar, resolver, escribir, etc.
  timeToGuess_seconds: 20

  #__Deja los 2 siguientes vacíos para desactivarlos__
  titleMessage: '&bRESUELVE'
  subtitleMessage: '&aPara &7`&b%symbol%&7`'

  #El rango del número resultado aleatorio
  result-min: 20
  result-max: 100

  toGet: '✗'
  #Otros símbolos que puedes añadir: ✪❃✿✠❂♫♪❦♡♤♢✦☾☽✹
  data:
    - '✯;10'
    - '♛;15'
    - '❅;20'
    - '♫;25'

sequence:
  enable: true
  winners: 1
  weight: 1
  points: 1
  hints:
    enable: true
    after-percent: 50
    max: 1
  countdown:
    enable: true
    last-seconds: 10

  #No cambies esto
  case-sensitive: false

  #El tiempo en segundos que tienen los jugadores para adivinar, resolver, escribir, etc.
  timeToGuess_seconds: 25

  #Los jugadores ven una serie de números y escriben el siguiente, p. ej. "3, 6, 12, 24, ?" -> 48
  #Patrones: sumar (3, 7, 11), multiplicar (2, 6, 18), cuadrados (4, 9, 16), alternos (5, 9, 7, 11), fibonacci (2, 3, 5, 8)
  patterns:
    - add
    - multiply
    - squares
    - alternating
    - fibonacci
  #1-3. Más dificultad permite patrones más difíciles (cuadrados y alternos desde 2, fibonacci en 3) y números más grandes.
  difficulty: 2
  #Cuántos números se muestran antes del '?' (4-8)
  shown-terms: 5

  #__Deja los 2 siguientes vacíos para desactivarlos__
  titleMessage: '&b%selection%'
  subtitleMessage: '&aCompleta la serie'

memorize:
  enable: true
  winners: 1
  weight: 1
  points: 1
  hints:
    enable: true
    after-percent: 50
    max: 1
  countdown:
    enable: true
    last-seconds: 10

  case-sensitive: false

  listLength: 3
  #Cada ronda toma sus elementos de una de estas listas (ver words.yml -> memorize.pools):
  #shopping_list, words, colors, numbers, blocks, mobs, o una lista propia
  pools:
    - shopping_list
    - words
    - colors
    - numbers
    - blocks
    - mobs
  #Si es false, los elementos se pueden escribir en cualquier orden
  order-matters: true

  #El tiempo en segundos que tienen los jugadores para memorizar, resolver, escribir, etc.
  timeToMemorize: 7

  #El tiempo en segundos que tienen los jugadores para adivinar, resolver, escribir, etc.
  timeToGuess_seconds: 20
  #Deja los 2 siguientes vacíos para desactivarlos
  titleMessage: '&bMemoriza'
  subtitleMessage: '&a¡Intenta recordar esta lista!'

