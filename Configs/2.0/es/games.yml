#Ajustes que acepta cada juego (si falta uno se usa el valor mostrado):
#  enable: true/false
#  weight: 1             Probabilidad de que la rotación elija este juego frente a los demás (0 = nunca).
#                        El mismo juego nunca se juega dos veces seguidas.
#  winners: 1            Cuántos jugadores pueden ganar cada ronda.
#  points: 1             Puntos por victoria (/chatgames top).
#  case-sensitive: false Quien acierta salvo por las mayúsculas recibe el mensaje 'wrong_case'.
#  timeToGuess_seconds: 20
#  min-answer-ms: 400    Las respuestas correctas más rápidas que esto se ignoran y se registran: nadie lee y escribe
#                        tan rápido, los bots sí. 0 desactiva la comprobación.
#  hints:                Pistas que aparecen durante la ronda, con 'hint_message' de messages.yml.
#    enable: false
#    after-percent: 50   La primera pista sale cuando ha pasado este porcentaje del tiempo; las demás se reparten en el resto.
#    max: 1              Hasta 3.
#  countdown:            Tiempo restante, en la barra de acción. Funciona en todas las versiones (1.8 a 26.x).
#    enable: false
#    last-seconds: 10    Solo durante los últimos N segundos; 0 lo muestra toda la ronda.
#  titleMessage / subtitleMessage: deja ambos vacíos para no enviar título.
unscramble:
  enable: true
  winners: 1
  weight: 1
  points: 1
  hints:
    enable: true
    after-percent: 50
    max: 1
  countdown:
    enable: true
    last-seconds: 10

  case-sensitive: true
  #El tiempo en segundos que tienen los jugadores para adivinar, resolver, escribir, etc.
  timeToGuess_seconds: 20
  #__Deja los 2 siguientes vacíos para desactivarlos__
  titleMessage: '&b%selection%'
  subtitleMessage: '&aDesordena'

