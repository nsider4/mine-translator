enable-races: true

creative-enabled: true
#Enlaces útiles para añadir DATOS:
#
#https://hub.spigotmc.org/javadocs/spigot/org/bukkit/entity/EntityType.html
#https://helpch.at/docs/1.8/index.html?org/bukkit/entity/EntityType.html
#https://hub.spigotmc.org/javadocs/bukkit/org/bukkit/Material.html
#https://helpch.at/docs/1.8/org/bukkit/Material.html

#Los nombres pueden ser modernos o antiguos (MOOSHROOM o MUSHROOM_COW, COD o RAW_FISH): se adaptan a la versión de tu
#servidor. Los nombres que no existen en tu versión (p. ej. un bloque de 1.21 en 1.8) se omiten, con un aviso en consola.
#
#Cada carrera acepta además (opcional):
#  points: 1     #puntos que recibe el ganador (por defecto 1)
#  weight: 1     #con qué frecuencia la elige la rotación frente a otros juegos (por defecto 1, 0 = nunca)
#
#Los admins pueden iniciar una carrera con sus propios valores: /chatgames <race> <material/mob> [amount]
#Sin cantidad, se usa una de las listadas abajo para ese material/criatura. El ganador recibe las recompensas listadas
#para exactamente ese material y cantidad, o ninguna si no están aquí (los puntos se dan igualmente).

