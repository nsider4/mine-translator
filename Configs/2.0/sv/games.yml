    enable: true
    after-percent: 50
    max: 1
  countdown:
    enable: true
    last-seconds: 10

  case-sensitive: false

  listLength: 3
  #Varje omgång tar föremål från en av dessa samlingar (se words.yml -> memorize.pools):
  #shopping_list, words, colors, numbers, blocks, mobs eller din egen lista
  pools:
    - shopping_list
    - words
    - colors
    - numbers
    - blocks
    - mobs
  #Om false kan föremålen skrivas i valfri ordning
  order-matters: true

  #Tiden i sekunder som spelarna har för att memorera, lösa, skriva osv.
  timeToMemorize: 7

  #Tiden i sekunder som spelarna har för att gissa, lösa, skriva osv.
  timeToGuess_seconds: 20
  #Lämna de 2 följande tomma för att stänga av dem
  titleMessage: '&bMemorera'
  subtitleMessage: '&aFörsök memorera den här listan!'

