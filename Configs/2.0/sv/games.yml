######    CHATTSPEL    ######
#############################
#Inställningar som varje spel tar (det som saknas använder visat standardvärde):
#  enable: true/false
#  weight: 1             Hur troligt det är att rotationen väljer detta spel jämfört med andra (0 = aldrig).
#                        Samma spel körs aldrig två gånger i rad.
#  winners: 1            Hur många spelare som kan vinna varje omgång.
#  points: 1             Poäng per vinst (/chatgames top).
#  case-sensitive: false Spelare som bara fick versalerna fel får meddelandet 'wrong_case'.
#  timeToGuess_seconds: 20
#  min-answer-ms: 400    Rätta svar snabbare än detta ignoreras och loggas: ingen läser och skriver
#                        så snabbt, chattbotar gör det. 0 stänger av kontrollen.
#  hints:                Ledtrådar visas under omgången, via 'hint_message' i messages.yml.
#    enable: false
#    after-percent: 50   Första ledtråden visas när så mycket av tiden har gått; resten sprids över återstoden.
#    max: 1              Upp till 3.
#  countdown:            Återstående tid i åtgärdsfältet. Fungerar på alla versioner (1.8 till 26.x).
#    enable: false
#    last-seconds: 10    Bara under de sista N sekunderna; 0 visar den hela omgången.
#  titleMessage / subtitleMessage: lämna båda tomma för att inte skicka någon titel.
unscramble:
  enable: true
  winners: 1
  weight: 1
  points: 1
  hints:
    enable: true
    after-percent: 50
    max: 1
  countdown:
    enable: true
    last-seconds: 10

  case-sensitive: true
  #Tiden i sekunder som spelarna har för att gissa, lösa, skriva osv.
  timeToGuess_seconds: 20
  #__Lämna de 2 följande tomma för att stänga av dem__
  titleMessage: '&b%selection%'
  subtitleMessage: '&aKasta om'

