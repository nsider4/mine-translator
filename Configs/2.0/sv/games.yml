#Detta spel skapar en sträng av angiven längd med slumpmässiga tecken
random:
  enable: true
  winners: 1
  weight: 1
  points: 1
  countdown:
    enable: true
    last-seconds: 10

  case-sensitive: true
  #Tiden i sekunder som spelarna har för att gissa, lösa, skriva osv.
  timeToGuess_seconds: 20
  #Längden på den slumpmässiga strängen för detta spel. Intervallformat <lower>-<higher>. För en enda längd, sätt samma tal på båda sidor
  lengthRange: 6-8
  #Tillgängliga typer: ALPHA (bokstäver), ALPHANUMERIC (bokstäver och siffror), NUMERIC (siffror), SYMBOLIC (symboler),
  #LOWERCASE_ALPHA (bara gemener), UPPERCASE_ALPHA (bara versaler), HEXADECIMAL (hexadecimala tecken: 0123456789ABCDEF)
  #CUSTOM (använder det som står i 'custom_characters')
  character_type: ALPHANUMERIC
  #Denna sträng används bara om type är "CUSTOM"
  custom_characters: 'abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789'

  #__Lämna de 2 följande tomma för att stänga av dem__
  titleMessage: '&b%selection%'
  subtitleMessage: '&aSkriv'

math:
  enable: true
  winners: 1
  weight: 1
  points: 1
  hints:
    enable: true
    after-percent: 50
    max: 1
  countdown:
    enable: true
    last-seconds: 10

  #Ändra inte detta
  case-sensitive: false
  #Tiden i sekunder som spelarna har för att gissa, lösa, skriva osv.
  timeToGuess_seconds: 20
  #Intervall för slumptal efter svårighet:
  #1 - (1-9)
  #2 - (1-99)
  #3 - (1-999)
  #4 - (1-9999)
  #5 - (1-99999)
  difficulty: 2
  #Hur många operatorer varje fråga har: 1 -> "12 + 7", 2 -> "12 + 7 x 3"
  operations: 1
  #solve: räkna ut resultatet ("12 + 7 x 3").  missing-value: hitta det dolda talet ("12 + ? x 3 = 33").
  #Varje omgång väljer ett av de listade lägena.
  modes:
    - solve
    - missing-value
  #Operatorer att använda; de fyra listade är alla som finns, ta bort de du inte vill ha. Behåll alltid minst 1
  #Division ger alltid ett heltal.
  operators:
    - '+'
    - '-'
    - 'x'
    - '/'

  #__Lämna de 2 följande tomma för att stänga av dem__
  titleMessage: '&b%selection%'
  subtitleMessage: '&aRäkna ut'

variable:
  enable: true
  winners: 1
  weight: 1
  points: 1
  countdown:
    enable: true
    last-seconds: 10

  #Ändra inte detta
  case-sensitive: false
  #Tiden i sekunder som spelarna har för att gissa, lösa, skriva osv.
  timeToGuess_seconds: 20

  #__Lämna de 2 följande tomma för att stänga av dem__
  titleMessage: '&bLÖS'
  subtitleMessage: '&aHitta &7`&b%symbol%&7`'

  #Intervall för det slumpmässiga resultattalet
  result-min: 20
  result-max: 100

  toGet: '✗'
  #Här är fler symboler du kan lägga till: ✪❃✿✠❂♫♪❦♡♤♢✦☾☽✹
  data:
    - '✯;10'
    - '♛;15'
    - '❅;20'
    - '♫;25'

sequence:
  enable: true
  winners: 1
  weight: 1
  points: 1
  hints:
    enable: true
    after-percent: 50
    max: 1
  countdown:
    enable: true
    last-seconds: 10

  #Ändra inte detta
  case-sensitive: false

  #Tiden i sekunder som spelarna har för att gissa, lösa, skriva osv.
  timeToGuess_seconds: 25

  #Spelarna ser en talföljd och skriver nästa tal, t.ex. "3, 6, 12, 24, ?" -> 48
  #Mönster: addition (3, 7, 11), multiplikation (2, 6, 18), kvadrater (4, 9, 16), växlande (5, 9, 7, 11), Fibonacci (2, 3, 5, 8)
  patterns:
    - add
    - multiply
    - squares
    - alternating
    - fibonacci
  #1-3. Högre svårighet ger svårare mönster (kvadrater och växlande från 2, Fibonacci på 3) och större tal.
  difficulty: 2
  #Hur många tal som visas före '?' (4-8)
  shown-terms: 5

  #__Lämna de 2 följande tomma för att stänga av dem__
  titleMessage: '&b%selection%'
  subtitleMessage: '&aFortsätt talföljden'

memorize:
  enable: true
