#MÖJLIGA ÅTGÄRDER:
#
#[playercmd] - Kör kommandot som vinnaren
#[consolecmd] - Kör kommandot från konsolen
#[playermsg] - Skickar ett meddelande till vinnaren
#[broadcast] - Skickar ett meddelande till alla spelare i aktiverade världar
#[player_as_op] - Kör ett kommando som op åt spelaren
#
#LÄGG TILL CHANSER FÖR BELÖNINGAR SÅ HÄR:
#
#EXEMPEL:
#  - '10.0%~ [consolecmd] give %player% iron_block 5'
#FUNGERAR BARA OM FORMATET ÄR SAMMA SOM I EXEMPLET, MED <chance>% I BÖRJAN FÖLJT AV ~ OCH ETT MELLANSLAG. ALLTID FÖRST I KOMMANDOT
#
#KOMMANDON UTAN % BLIR BELÖNINGAR SOM GES TILL 100%.

#BEHÖRIGHETSKONTROLL:
#
#LÄGG I SLUTET AV KOMMANDORADEN.
#Exempel:
#  - '[consolecmd] give %player% iron_block 5 has:test.permission'

#1 är för den FÖRSTA vinnaren, OM DU LÄGGER TILL FLER VINNARE I config.yml OCH VILL HA ANDRA BELÖNINGAR, LÄGG TILL DERAS PLATS (2:, osv.)
unscramble:
  rewards:
    1:
      reward_1:
        minimum-players: 2 #Villkor baserat på spelare online, belöningen kan bara väljas om 2 eller fler spelare är online
        chance: 50
        data:
          - '10.0%~ [consolecmd] give %player% diamond_block 3 has:test.permission'
          - '[consolecmd] give %player% iron_block 5'
      reward_2:
        data:
          - '[consolecmd] give %player% iron_block 2'

