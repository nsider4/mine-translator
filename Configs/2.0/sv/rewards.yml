#HÄRIFRÅN ÄR DET BELÖNINGAR FÖR LOPP SOM BARA HAR 1 VINNARE
#
#ETT ANNAT FORMAT ANVÄNDS! LÄS NOGA

races:
  rewards:
    #DETTA ÄR BELÖNINGARNA DU LÄGGER I 'races.yml'
    reward_1:
      chance: 50
      data:
        - '60.0%~ [consolecmd] give %player% diamond_block 5'
    #OM VÄRDET 'chance' TAS BORT SKER BELÖNINGEN/KOMMANDOT ALLTID
    reward_2:
      data:
        - '[consolecmd] give %player% iron_block 5'
        - '[playermsg] &aDu vann!'
    reward_3:
      chance: 50
      data:
        - '[consolecmd] give %player% diamond_block 3'