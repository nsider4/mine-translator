#Skickar spelresultat, lopp, globala spel, evenemang med mera till Discord.
#
#Meddelanden skickas via en kanals webhook (inget att installera), via boten i
#pluginet DiscordSRV, eller båda. Testa varje meddelande med /chatgames discord test <message>.
enabled: true

#__KANALER__
#Vart meddelandena går. Namnge dem som du vill; varje avisering nedan listar kanalerna den använder.
#  webhook: en kanals webhook-URL. I Discord: Redigera kanal > Integrationer > Webhooks >
#           Ny webhook > Kopiera webhook-URL. Håll den hemlig: alla som har den kan skriva där.
#  discordsrv: skickar via din DiscordSRV-bot i stället (kräver DiscordSRV). Ett kanalnamn från
#              Channels-sektionen i DiscordSRV:s config.yml (t.ex. global), eller ett kanal-ID.
#  username / avatar: namnet och bilden som webhookinläggen visar (en bot behåller sina egna).
channels:
  main:
    webhook: ''
    discordsrv: ''
    username: 'Chat Games'
    avatar: 'https://www.spigotmc.org/data/resource_icons/107/107781.jpg?1676494289'

#__ALLMÄNT__
#Visas i sidfötter som %server%
server-name: 'Minecraft Server'
#Bilden för %winner_head% / %player_head%. %name% och %uuid% fylls i.
player-head-url: 'https://mc-heads.net/avatar/%name%/128'
#Roll-ID:n som meddelanden får pinga (skriv <@&ID> i en text). Inget annat pingas någonsin: inte
#@everyone, och inte något i en spelares namn eller svar.
#För att få ett ID, slå på Utvecklarläge i Discord (Inställningar > Avancerat), högerklicka sedan på rollen.
allowed-role-pings: []
#Med DiscordSRV visar %winner_mention% / %player_mention% en spelares länkade Discord-konto
#(annars namnet). true pingar dem också.
ping-linked-players: false
#Spel och lopp som aldrig skickas
ignored-games: []

#Färger (%game_color%) och emoji (%game_emoji%) per spel. Färger: '#RRGGBB' eller ett namn.
#Emoji: namn som :trophy: (listan finns i slutet av filen), eller en serveremoji som <:name:ID>.
#Klistra inte in emojitecken i den här filen: 1.8-servrar kan inte läsa en fil som har dem.
styles:
  default: {color: '#5865F2', emoji: ':video_game:'}
  unscramble: {color: '#F1C40F', emoji: ':abc:'}
  unreverse: {color: '#E67E22', emoji: ':repeat:'}
  reaction: {color: '#E74C3C', emoji: ':zap:'}
  random: {color: '#9B59B6', emoji: ':game_die:'}
  fillout: {color: '#3498DB', emoji: ':pencil2:'}
  variable: {color: '#1ABC9C', emoji: ':heavy_plus_sign:'}
  clickable: {color: '#2ECC71', emoji: ':point_up:'}
  hoverable: {color: '#16A085', emoji: ':eyes:'}
  math: {color: '#E91E63', emoji: ':heavy_division_sign:'}
  sequence: {color: '#00BCD4', emoji: ':1234:'}
  memorize: {color: '#8E44AD', emoji: ':brain:'}
  guess_the_number: {color: '#FF9800', emoji: ':question:'}
  trivia: {color: '#3F51B5', emoji: ':books:'}
  word_association: {color: '#009688', emoji: ':link:'}
  count: {color: '#607D8B', emoji: ':1234:'}
  hunt: {color: '#C0392B', emoji: ':crossed_swords:'}
  mine: {color: '#7F8C8D', emoji: ':pick:'}
  place: {color: '#A0522D', emoji: ':bricks:'}
  fish: {color: '#2980B9', emoji: ':fishing_pole_and_fish:'}
  eat: {color: '#D35400', emoji: ':poultry_leg:'}
  craft: {color: '#8D6E63', emoji: ':hammer_and_pick:'}
  furnace: {color: '#E25822', emoji: ':fire:'}
  tame: {color: '#C69C6D', emoji: ':bone:'}
  shear: {color: '#ECF0F1', emoji: ':scissors:'}

#Hur listor skrivs: vinnare, bidragsgivare, ställningar och topplistor.
#%medal% är medaljen för plats 1-3, och other-places för resten.
lists:
  medals: [':first_place:', ':second_place:', ':third_place:']
  other-places: '`%place%.`'
  winner: '%medal% **%player%** `%time%s`'
  contributor: '%medal% **%player%** `%amount%`'
  standing: '%medal% **%player%** `%points% p`'
  leaderboard: '%medal% **%player%** `%value%`'
  #Visas i stället för en tom lista
  empty: '-# Ingen än'

#__MEDDELANDEN__
#Varje meddelande har 'content' (vanlig text ovanför inbäddningen) och/eller en 'embed':
#  color, author (name, icon, url), title, url, description, thumbnail, image,
#  fields (name, value, inline), footer (text, icon), timestamp (true visar tiden det skickades).
#En text kan vara en rad eller en lista med rader. En rad som bara hade tomma platshållare
#utelämnas, liksom ett tomt fält. PlaceholderAPI-platshållare som inte behöver en spelare fungerar också.
#Discord-formatering fungerar i beskrivningar och fältvärden: '### ' börjar en rubrik, '-# ' liten grå
#text, '> ' ett citat, **fetstil**, `kod`.
#<t:%ends_unix%:R> visar ”om 20 sekunder” i varje läsares egen tid, med nedräkning.
#I varje meddelande: %server%, och för spel %game% %game_key% %game_emoji% %game_color%.

#Chattspel. %question% %time_limit% %ends_unix% %winners_needed% %points%
games:
  enabled: true
  channels: [main]
  #true: skicka när ett spel startar, och redigera sedan inlägget till resultatet. false: skicka bara resultatet.
  live: true
  #Memorera visar aldrig sin lista här: spelarna skulle kunna läsa den i Discord.
  hidden-question: 'Titta i spelchatten!'
  start:
    embed:
      color: '%game_color%'
      author: '%game_emoji%  %game%'
      title: 'Ny omgång'
      description:
        - '### %question%'
        - '-# Svara i spelchatten för att vinna.'
      fields:
        - name: ':stopwatch: Slutar'
          value: '<t:%ends_unix%:R>'
          inline: true
        - name: ':sparkles: Belöning'
          value: '`%points% p`'
          inline: true
        - name: ':busts_in_silhouette: Vinnare'
          value: '`%winners_needed%`'
          inline: true
      footer: '%server%'
  #%winner% %winner_head% %winner_mention% %time% %answer% %points% %winner_count%
  #%winners% (varje vinnare, en per rad) %other_winners% (alla utom den första)
  win:
    embed:
      color: '%game_color%'
      author: '%game_emoji%  %game%'
      title: ':trophy:  %winner% klarade det!'
      thumbnail: '%winner_head%'
      description:
        - '-# Svaret var'
        - '### %answer%'
      fields:
        - name: ':stopwatch: Tid'
          value: '`%time%s`'
          inline: true
        - name: ':sparkles: Poäng'
          value: '`+%points%`'
          inline: true
        - name: ':medal: Svarade också'
          value: '%other_winners%'
          inline: false
      footer: '%server%'
      timestamp: true
  #%answer% %question% %time_limit%
  expired:
    enabled: true
    embed:
      color: '#4E5058'
      author: '%game_emoji%  %game%'
      title: ':hourglass:  Tiden är ute'
      description:
        - '-# Ingen klarade det. Svaret var'
        - '### %answer%'
      footer: '%server%'
      timestamp: true
  #När en i personalen stoppar spelet (redigerar bara ett live-inlägg)
  stopped:
    embed:
      color: '#4E5058'
      author: '%game_emoji%  %game%'
      title: ':no_entry:  Omgången stoppad'
      description:
        - '-# En i personalen avslutade omgången i förtid.'
      footer: '%server%'
      timestamp: true

#Lopp. %target% %amount% %time_limit% %ends_unix% %points%
races:
  enabled: true
  channels: [main]
  live: true
  start:
    embed:
      color: '%game_color%'
      author: '%game_emoji%  %game%-lopp'
      title: 'Loppet har startat'
      description:
        - '### %amount%x %target%'
        - '-# Första spelaren i mål vinner.'
      fields:
        - name: ':stopwatch: Slutar'
          value: '<t:%ends_unix%:R>'
          inline: true
        - name: ':sparkles: Belöning'
          value: '`%points% p`'
          inline: true
      footer: '%server%'
  #%winner% %winner_head% %winner_mention% %time% %points%
  win:
    embed:
      color: '%game_color%'
      author: '%game_emoji%  %game%-lopp'
      title: ':checkered_flag:  %winner% vann loppet!'
      thumbnail: '%winner_head%'
      description:
        - '### %amount%x %target%'
      fields:
        - name: ':stopwatch: Tid'
          value: '`%time%s`'
          inline: true
        - name: ':sparkles: Poäng'
          value: '`+%points%`'
          inline: true
      footer: '%server%'
      timestamp: true
  expired:
    enabled: true
    embed:
      color: '#4E5058'
      author: '%game_emoji%  %game%-lopp'
      title: ':hourglass:  Tiden är ute'
      description:
        - '### %amount%x %target%'
        - '-# Ingen blev klar i tid.'
      footer: '%server%'
      timestamp: true
  stopped:
    embed:
      color: '#4E5058'
      author: '%game_emoji%  %game%-lopp'
      title: ':no_entry:  Loppet stoppat'
      description:
        - '-# En i personalen avslutade loppet i förtid.'
      footer: '%server%'
      timestamp: true

#Globala spel, där hela servern arbetar mot ett mål.
#%goal% (t.ex. "500 Stone") %progress% %goal_amount% %percent% %bar% %contributors% %time_limit% %ends_unix%
global:
  enabled: true
  channels: [main]
  #true: inlägget visar förloppsindikatorn och uppdateras medan spelet pågår
  live: true
  #Hur ofta live-inlägget uppdateras, som mest (bara när framstegen ändrats)
  update-seconds: 15
  bar: {length: 16, full: '█', empty: '░'}
  progress:
    embed:
      color: '%game_color%'
      author: ':globe_with_meridians:  Globalt %game%'
      title: 'Hela servern spelar tillsammans'
      description:
        - '### %goal%'
        - '`%bar%` **%percent%%**'
        - '-# %progress% / %goal_amount%'
      fields:
        - name: ':busts_in_silhouette: Hjälper till'
          value: '`%contributors%`'
          inline: true
        - name: ':stopwatch: Slutar'
          value: '<t:%ends_unix%:R>'
          inline: true
      footer: '%server%'
  #%top_contributors% (de största bidragsgivarna, en per rad)
  completed:
    embed:
      color: '#57F287'
      author: ':globe_with_meridians:  Globalt %game%'
      title: ':tada:  Målet nått!'
      description:
        - '### %goal%'
        - '`%bar%` **%percent%%**'
      fields:
        - name: ':medal: Bästa hjälparna'
          value: '%top_contributors%'
          inline: true
        - name: ':busts_in_silhouette: Hjälpte till'
          value: '`%contributors%`'
          inline: true
      footer: '%server%'
      timestamp: true
  failed:
    embed:
      color: '#ED4245'
      author: ':globe_with_meridians:  Globalt %game%'
      title: ':x:  Målet inte nått'
      description:
        - '### %goal%'
        - '`%bar%` **%percent%%**'
        - '-# %progress% / %goal_amount%'
      fields:
        - name: ':medal: Bästa hjälparna'
          value: '%top_contributors%'
          inline: true
      footer: '%server%'
      timestamp: true
  #Hur många bidragsgivare %top_contributors% listar
  top-size: 5

#Spelevenemang (events.yml). %event%
events:
  enabled: true
  channels: [main]
  #%games% (hur många spel det har)
  start:
    embed:
      color: '#FEE75C'
      author: ':calendar:  Spelevenemang'
      title: '%event% har startat!'
      description:
        - '-# Vinn spelen i följd för att tjäna evenemangspoäng.'
      fields:
        - name: ':video_game: Spel'
          value: '`%games%`'
          inline: true
      footer: '%server%'
      timestamp: true
  #%standings% %players% (hur många som fick poäng) %winner% %winner_head% %winner_mention%
  end:
    embed:
      color: '#FEE75C'
      author: ':calendar:  Spelevenemang'
      title: ':trophy:  Resultat för %event%'
      thumbnail: '%winner_head%'
      description:
        - '%standings%'
      fields:
        - name: ':crown: Vinnare'
          value: '%winner_mention%'
          inline: true
        - name: ':busts_in_silhouette: Spelare'
          value: '`%players%`'
          inline: true
      footer: '%server%'
      timestamp: true
  #Hur många placeringar %standings% listar
  standings-size: 10

#En spelares svit når ett antal dagar i rad (streaks.yml). %player% %player_head% %player_mention% %streak% %days%
streaks:
  enabled: false
  channels: [main]
  #Bara dessa dagantal skickas
  days: [7, 14, 30, 60, 100, 365]
  message:
    embed:
      color: '#E67E22'
      author: {name: '%player%', icon: '%player_head%'}
      title: ':fire:  %days% dagar i rad!'
      description:
        - '-# %streak%'
      footer: '%server%'
      timestamp: true

#En spelare klarar en daglig eller veckovis utmaning. %player% %player_head% %player_mention% %challenge% %period%
challenges:
  enabled: false
  channels: [main]
  #Vad %period% visar
  periods:
    daily: 'Dagliga'
    weekly: 'Veckans'
  message:
    embed:
      color: '#57F287'
      author: {name: '%player%', icon: '%player_head%'}
      title: ':white_check_mark:  Utmaning klar'
      description:
        - '### %challenge%'
        - '-# %period% utmaningar'
      footer: '%server%'
      timestamp: true

#En topplista, skickad vid inställda tider och med /chatgames discord leaderboard.
#%leaderboard% %total_points% (alla spelare tillsammans)
leaderboard:
  enabled: false
  channels: [main]
  #Servertid, 24-timmars, t.ex. ['12:00', '20:00']
  times: ['20:00']
  #points, eller fastest (de snabbaste svaren i alla spel)
  type: points
  size: 10
  message:
    embed:
      color: '#5865F2'
      author: ':bar_chart:  Topplista'
      title: 'Toppspelare'
      description:
        - '%leaderboard%'
        - ''
        - '-# %total_points% poäng vunna totalt'
      footer: '%server%'
      timestamp: true

