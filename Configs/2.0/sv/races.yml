enable-races: true

creative-enabled: true
#Användbara länkar för att lägga till DATA:
#
#https://hub.spigotmc.org/javadocs/spigot/org/bukkit/entity/EntityType.html
#https://helpch.at/docs/1.8/index.html?org/bukkit/entity/EntityType.html
#https://hub.spigotmc.org/javadocs/bukkit/org/bukkit/Material.html
#https://helpch.at/docs/1.8/org/bukkit/Material.html

#Namn kan vara nya eller gamla (MOOSHROOM eller MUSHROOM_COW, COD eller RAW_FISH): de matchas mot din servers
#version. Namn som inte finns i din version (t.ex. ett 1.21-block på 1.8) hoppas över, med en notis i konsolen.
#
#Varje lopp tar också (valfritt):
#  points: 1     #poäng som vinnaren får (standard 1)
#  weight: 1     #hur ofta rotationen väljer det jämfört med andra spel (standard 1, 0 = aldrig)
#
#Administratörer kan starta ett lopp med egna värden: /chatgames <race> <material/mob> [amount]
#Utan antal används ett av dem som listas nedan för det materialet/den varelsen. Vinnaren får belöningarna som listas
#för exakt det materialet och antalet, eller inga om de inte listas här (poäng ges ändå).

hunt:
  enable: true

  timeToComplete_seconds: 180
  #__Lämna de 2 följande tomma för att stänga av dem__
  titleMessage: '&bJAKT'
  subtitleMessage: '&aDöda %amount% %value%!'

  #Om varelser som skapats av spawnerblock eller spawnägg ska räknas.
  count-spawner-mobs: true
  #Om MythicMobs-varelser också räknas som varelsen de bygger på (en MythicMobs-zombie som ZOMBIE).
  count-mythic-mobs: true

  data:
    #Dessa värden måste vara giltiga Minecraft-varelse-ID:n (se Användbara länkar högst upp i filen)
