#Publica no Discord os resultados de jogos, corridas, jogos globais, eventos e mais.
#
#As mensagens são enviadas pelo webhook de um canal (nada para instalar), pelo bot do
#plugin DiscordSRV, ou pelos dois. Teste cada mensagem com /chatgames discord test <message>.
enabled: true

#__CANAIS__
#Para onde vão as mensagens. Dê o nome que quiser; cada notificação abaixo indica os canais que usa.
#  webhook: a URL do webhook de um canal. No Discord: Editar canal > Integrações > Webhooks >
#           Novo webhook > Copiar URL do webhook. Mantenha em segredo: quem a tiver pode publicar lá.
#  discordsrv: publica com o seu bot do DiscordSRV em vez disso (precisa do DiscordSRV). O nome de um canal da
#              seção Channels do config.yml do DiscordSRV (ex. global), ou um ID de canal.
#  username / avatar: o nome e a imagem que as publicações do webhook mostram (um bot mantém os seus).
channels:
  main:
    webhook: ''
    discordsrv: ''
    username: 'Chat Games'
    avatar: 'https://www.spigotmc.org/data/resource_icons/107/107781.jpg?1676494289'

#__GERAL__
#Mostrado nos rodapés como %server%
server-name: 'Minecraft Server'
#A imagem de %winner_head% / %player_head%. %name% e %uuid% são preenchidos.
player-head-url: 'https://mc-heads.net/avatar/%name%/128'
#IDs de cargos que as mensagens podem mencionar (escreva <@&ID> num texto). Nada mais menciona nunca: nem
#@everyone, nem nada no nome ou na resposta de um jogador.
#Para obter um ID, ative o Modo desenvolvedor no Discord (Configurações > Avançado) e clique com o botão direito no cargo.
allowed-role-pings: []
#Com o DiscordSRV, %winner_mention% / %player_mention% mostram a conta do Discord vinculada de um jogador
#(senão o nome dele). true também o menciona.
ping-linked-players: false
#Jogos e corridas que nunca são publicados
ignored-games: []

#Cores (%game_color%) e emoji (%game_emoji%) por jogo. Cores: '#RRGGBB' ou um nome.
#Emoji: nomes como :trophy: (a lista está no fim deste arquivo), ou um emoji do servidor como <:name:ID>.
#Não cole caracteres emoji neste arquivo: servidores 1.8 não conseguem ler um arquivo que os tenha.
styles:
  default: {color: '#5865F2', emoji: ':video_game:'}
  unscramble: {color: '#F1C40F', emoji: ':abc:'}
  unreverse: {color: '#E67E22', emoji: ':repeat:'}
  reaction: {color: '#E74C3C', emoji: ':zap:'}
  random: {color: '#9B59B6', emoji: ':game_die:'}
  fillout: {color: '#3498DB', emoji: ':pencil2:'}
  variable: {color: '#1ABC9C', emoji: ':heavy_plus_sign:'}
  clickable: {color: '#2ECC71', emoji: ':point_up:'}
  hoverable: {color: '#16A085', emoji: ':eyes:'}
  math: {color: '#E91E63', emoji: ':heavy_division_sign:'}
  sequence: {color: '#00BCD4', emoji: ':1234:'}
  memorize: {color: '#8E44AD', emoji: ':brain:'}
  guess_the_number: {color: '#FF9800', emoji: ':question:'}
  trivia: {color: '#3F51B5', emoji: ':books:'}
  word_association: {color: '#009688', emoji: ':link:'}
  count: {color: '#607D8B', emoji: ':1234:'}
  hunt: {color: '#C0392B', emoji: ':crossed_swords:'}
  mine: {color: '#7F8C8D', emoji: ':pick:'}
  place: {color: '#A0522D', emoji: ':bricks:'}
  fish: {color: '#2980B9', emoji: ':fishing_pole_and_fish:'}
  eat: {color: '#D35400', emoji: ':poultry_leg:'}
  craft: {color: '#8D6E63', emoji: ':hammer_and_pick:'}
  furnace: {color: '#E25822', emoji: ':fire:'}
  tame: {color: '#C69C6D', emoji: ':bone:'}
  shear: {color: '#ECF0F1', emoji: ':scissors:'}

#Como as listas são escritas: vencedores, colaboradores, classificações e rankings.
#%medal% é a medalha dos lugares 1-3, e other-places a dos restantes.
lists:
  medals: [':first_place:', ':second_place:', ':third_place:']
  other-places: '`%place%.`'
  winner: '%medal% **%player%** `%time%s`'
  contributor: '%medal% **%player%** `%amount%`'
  standing: '%medal% **%player%** `%points% pts`'
  leaderboard: '%medal% **%player%** `%value%`'
  #Mostrado no lugar de uma lista vazia
  empty: '-# Ninguém ainda'

#__MENSAGENS__
#Cada mensagem tem 'content' (texto simples acima do embed) e/ou um 'embed':
#  color, author (name, icon, url), title, url, description, thumbnail, image,
#  fields (name, value, inline), footer (text, icon), timestamp (true mostra a hora do envio).
#Um texto pode ser uma linha ou uma lista de linhas. Uma linha que só tinha placeholders vazios
#é retirada, assim como um campo vazio. Placeholders do PlaceholderAPI que não precisam de jogador também funcionam.
#A formatação do Discord funciona nas descrições e nos valores dos campos: '### ' começa um título, '-# ' texto pequeno
#cinza, '> ' uma citação, **negrito**, `código`.
#<t:%ends_unix%:R> mostra "em 20 segundos" no horário de cada leitor, em contagem regressiva.
#Em todas as mensagens: %server%, e nos jogos %game% %game_key% %game_emoji% %game_color%.

#Jogos de chat. %question% %time_limit% %ends_unix% %winners_needed% %points%
games:
  enabled: true
  channels: [main]
  #true: publica quando o jogo começa e depois edita essa publicação com o resultado. false: só publica o resultado.
  live: true
  #O Memorize nunca mostra a sua lista aqui: os jogadores poderiam lê-la no Discord.
  hidden-question: 'Olhe o chat do jogo!'
  start:
    embed:
      color: '%game_color%'
      author: '%game_emoji%  %game%'
      title: 'Nova rodada'
      description:
        - '### %question%'
        - '-# Responda no chat do jogo para ganhar.'
      fields:
        - name: ':stopwatch: Termina'
          value: '<t:%ends_unix%:R>'
          inline: true
        - name: ':sparkles: Prêmio'
          value: '`%points% pts`'
          inline: true
        - name: ':busts_in_silhouette: Vencedores'
          value: '`%winners_needed%`'
          inline: true
      footer: '%server%'
  #%winner% %winner_head% %winner_mention% %time% %answer% %points% %winner_count%
  #%winners% (todos os vencedores, um por linha) %other_winners% (todos menos o primeiro)
  win:
    embed:
      color: '%game_color%'
      author: '%game_emoji%  %game%'
      title: ':trophy:  %winner% acertou!'
      thumbnail: '%winner_head%'
      description:
        - '-# A resposta era'
        - '### %answer%'
      fields:
        - name: ':stopwatch: Tempo'
          value: '`%time%s`'
          inline: true
        - name: ':sparkles: Pontos'
          value: '`+%points%`'
          inline: true
        - name: ':medal: Também acertaram'
          value: '%other_winners%'
          inline: false
      footer: '%server%'
      timestamp: true
  #%answer% %question% %time_limit%
  expired:
    enabled: true
    embed:
      color: '#4E5058'
      author: '%game_emoji%  %game%'
      title: ':hourglass:  Acabou o tempo'
      description:
        - '-# Ninguém acertou. A resposta era'
        - '### %answer%'
      footer: '%server%'
      timestamp: true
  #Quando alguém da staff para o jogo (só edita uma publicação ao vivo)
  stopped:
    embed:
      color: '#4E5058'
      author: '%game_emoji%  %game%'
      title: ':no_entry:  Rodada interrompida'
      description:
        - '-# Um membro da equipe encerrou esta rodada antes da hora.'
      footer: '%server%'
      timestamp: true

#Corridas. %target% %amount% %time_limit% %ends_unix% %points%
races:
  enabled: true
  channels: [main]
  live: true
  start:
    embed:
      color: '%game_color%'
      author: '%game_emoji%  Corrida de %game%'
      title: 'Corrida iniciada'
      description:
        - '### %amount%x %target%'
        - '-# O primeiro a terminar vence.'
      fields:
        - name: ':stopwatch: Termina'
          value: '<t:%ends_unix%:R>'
          inline: true
        - name: ':sparkles: Prêmio'
          value: '`%points% pts`'
          inline: true
      footer: '%server%'
  #%winner% %winner_head% %winner_mention% %time% %points%
  win:
    embed:
      color: '%game_color%'
      author: '%game_emoji%  Corrida de %game%'
      title: ':checkered_flag:  %winner% venceu a corrida!'
      thumbnail: '%winner_head%'
      description:
        - '### %amount%x %target%'
      fields:
        - name: ':stopwatch: Tempo'
          value: '`%time%s`'
          inline: true
        - name: ':sparkles: Pontos'
          value: '`+%points%`'
          inline: true
      footer: '%server%'
      timestamp: true
  expired:
    enabled: true
    embed:
      color: '#4E5058'
      author: '%game_emoji%  Corrida de %game%'
      title: ':hourglass:  Acabou o tempo'
      description:
        - '### %amount%x %target%'
        - '-# Ninguém terminou a tempo.'
      footer: '%server%'
      timestamp: true
  stopped:
    embed:
      color: '#4E5058'
      author: '%game_emoji%  Corrida de %game%'
      title: ':no_entry:  Corrida interrompida'
      description:
        - '-# Um membro da equipe encerrou esta corrida antes da hora.'
      footer: '%server%'
      timestamp: true

#Jogos globais, em que o servidor inteiro trabalha para um objetivo.
#%goal% (ex. "500 Stone") %progress% %goal_amount% %percent% %bar% %contributors% %time_limit% %ends_unix%
global:
  enabled: true
  channels: [main]
  #true: a publicação mostra a barra de progresso e é atualizada enquanto o jogo decorre
  live: true
  #Com que frequência máxima a publicação ao vivo é atualizada (só quando o progresso mudou)
  update-seconds: 15
  bar: {length: 16, full: '█', empty: '░'}
  progress:
    embed:
      color: '%game_color%'
      author: ':globe_with_meridians:  %game% global'
      title: 'O servidor inteiro joga junto'
      description:
        - '### %goal%'
        - '`%bar%` **%percent%%**'
        - '-# %progress% / %goal_amount%'
      fields:
        - name: ':busts_in_silhouette: Ajudando'
          value: '`%contributors%`'
          inline: true
        - name: ':stopwatch: Termina'
          value: '<t:%ends_unix%:R>'
          inline: true
      footer: '%server%'
  #%top_contributors% (os maiores colaboradores, um por linha)
  completed:
    embed:
      color: '#57F287'
      author: ':globe_with_meridians:  %game% global'
      title: ':tada:  Meta alcançada!'
      description:
        - '### %goal%'
        - '`%bar%` **%percent%%**'
      fields:
        - name: ':medal: Quem mais ajudou'
          value: '%top_contributors%'
          inline: true
        - name: ':busts_in_silhouette: Ajudaram'
          value: '`%contributors%`'
          inline: true
      footer: '%server%'
      timestamp: true
  failed:
    embed:
      color: '#ED4245'
      author: ':globe_with_meridians:  %game% global'
      title: ':x:  Meta não alcançada'
      description:
        - '### %goal%'
        - '`%bar%` **%percent%%**'
        - '-# %progress% / %goal_amount%'
      fields:
        - name: ':medal: Quem mais ajudou'
          value: '%top_contributors%'
          inline: true
      footer: '%server%'
      timestamp: true
  #Quantos colaboradores %top_contributors% lista
  top-size: 5

#Eventos de jogos (events.yml). %event%
events:
  enabled: true
  channels: [main]
  #%games% (quantos jogos tem)
  start:
    embed:
      color: '#FEE75C'
      author: ':calendar:  Evento de jogos'
      title: '%event% começou!'
      description:
        - '-# Vença os jogos em sequência para ganhar pontos do evento.'
      fields:
        - name: ':video_game: Jogos'
          value: '`%games%`'
          inline: true
      footer: '%server%'
      timestamp: true
  #%standings% %players% (quantos pontuaram) %winner% %winner_head% %winner_mention%
  end:
    embed:
      color: '#FEE75C'
      author: ':calendar:  Evento de jogos'
      title: ':trophy:  Resultados de %event%'
      thumbnail: '%winner_head%'
      description:
        - '%standings%'
      fields:
        - name: ':crown: Vencedor'
          value: '%winner_mention%'
          inline: true
        - name: ':busts_in_silhouette: Jogadores'
          value: '`%players%`'
          inline: true
      footer: '%server%'
      timestamp: true
  #Quantos lugares %standings% lista
  standings-size: 10

#A sequência de um jogador chega a um número de dias seguidos (streaks.yml). %player% %player_head% %player_mention% %streak% %days%
streaks:
  enabled: false
  channels: [main]
  #Só estes números de dias são publicados
  days: [7, 14, 30, 60, 100, 365]
  message:
    embed:
      color: '#E67E22'
      author: {name: '%player%', icon: '%player_head%'}
      title: ':fire:  %days% dias seguidos!'
      description:
        - '-# %streak%'
      footer: '%server%'
      timestamp: true

#Um jogador conclui um desafio diário ou semanal. %player% %player_head% %player_mention% %challenge% %period%
challenges:
  enabled: false
  channels: [main]
  #O que %period% mostra
  periods:
    daily: 'diário'
    weekly: 'semanal'
  message:
    embed:
      color: '#57F287'
      author: {name: '%player%', icon: '%player_head%'}
      title: ':white_check_mark:  Desafio concluído'
      description:
        - '### %challenge%'
        - '-# Desafio %period%'
      footer: '%server%'
      timestamp: true

#Um ranking, publicado em horários fixos e com /chatgames discord leaderboard.
#%leaderboard% %total_points% (todos os jogadores juntos)
leaderboard:
  enabled: false
  channels: [main]
  #Hora do servidor, 24 horas, ex. ['12:00', '20:00']
  times: ['20:00']
  #points, ou fastest (as respostas mais rápidas de todos os jogos)
  type: points
  size: 10
  message:
    embed:
      color: '#5865F2'
      author: ':bar_chart:  Classificação'
      title: 'Melhores jogadores'
      description:
        - '%leaderboard%'
        - ''
        - '-# %total_points% pontos ganhos no total'
      footer: '%server%'
      timestamp: true

