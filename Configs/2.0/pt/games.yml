#Configurações que todo jogo aceita (se faltar uma, usa-se o padrão mostrado):
#  enable: true/false
#  weight: 1             A chance de a rotação escolher este jogo em relação aos outros (0 = nunca).
#                        O mesmo jogo nunca é jogado duas vezes seguidas.
#  winners: 1            Quantos jogadores podem vencer cada rodada.
#  points: 1             Pontos por vitória (/chatgames top).
#  case-sensitive: false Quem acerta tudo menos as maiúsculas recebe a mensagem 'wrong_case'.
#  timeToGuess_seconds: 20
#  min-answer-ms: 400    Respostas certas mais rápidas que isto são ignoradas e registradas: ninguém lê e digita
#                        tão rápido, bots sim. 0 desativa a verificação.
#  hints:                Dicas que aparecem durante a rodada, com 'hint_message' do messages.yml.
#    enable: false
#    after-percent: 50   A primeira dica aparece quando passa esta porcentagem do tempo; as outras se espalham pelo resto.
#    max: 1              Até 3.
#  countdown:            Tempo restante, na barra de ação. Funciona em todas as versões (1.8 a 26.x).
#    enable: false
#    last-seconds: 10    Só nos últimos N segundos; 0 mostra durante toda a rodada.
#  titleMessage / subtitleMessage: deixe os dois vazios para não enviar título.
unscramble:
  enable: true
  winners: 1
  weight: 1
  points: 1
  hints:
    enable: true
    after-percent: 50
    max: 1
  countdown:
    enable: true
    last-seconds: 10

  case-sensitive: true
  #O tempo em segundos que os jogadores têm para adivinhar, resolver, escrever, etc.
  timeToGuess_seconds: 20
  #__Deixe os 2 seguintes vazios para desativá-los__
  titleMessage: '&b%selection%'
  subtitleMessage: '&aDesembaralhe'

