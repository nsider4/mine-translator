#AÇÕES POSSÍVEIS:
#
#[playercmd] - Executa o comando como o vencedor
#[consolecmd] - Executa o comando pelo console
#[playermsg] - Envia uma mensagem ao vencedor
#[broadcast] - Envia uma mensagem a todos os jogadores nos mundos ativados
#[player_as_op] - Executa um comando como op para o jogador
#
#ADICIONE CHANCES ÀS RECOMPENSAS ASSIM:
#
#EXEMPLO:
#  - '10.0%~ [consolecmd] give %player% iron_block 5'
#SÓ FUNCIONA SE O FORMATO FOR IGUAL AO DO EXEMPLO, COM O <chance>% NO INÍCIO SEGUIDO DE UM ~ E UM ESPAÇO. SEMPRE PRIMEIRO NO COMANDO
#
#COMANDOS SEM NENHUM % SÃO RECOMPENSAS DADAS 100% DAS VEZES.

#VERIFICAÇÃO DE PERMISSÃO:
#
#COLOQUE NO FIM DA LINHA DO COMANDO.
#Exemplo:
#  - '[consolecmd] give %player% iron_block 5 has:test.permission'

#O 1 é para o PRIMEIRO vencedor; SE VOCÊ ADICIONAR MAIS VENCEDORES NO config.yml E QUISER RECOMPENSAS DIFERENTES, ADICIONE A POSIÇÃO DELES (2:, etc)
unscramble:
  rewards:
    1:
      reward_1:
        minimum-players: 2 #Condição pelos jogadores online: a recompensa só pode sair se houver 2 ou mais jogadores online
        chance: 50
        data:
          - '10.0%~ [consolecmd] give %player% diamond_block 3 has:test.permission'
          - '[consolecmd] give %player% iron_block 5'
      reward_2:
        data:
          - '[consolecmd] give %player% iron_block 2'

