#DAQUI EM DIANTE SÃO RECOMPENSAS DE CORRIDAS, QUE SÓ TÊM 1 VENCEDOR
#
#UM FORMATO DIFERENTE É USADO! LEIA COM ATENÇÃO

races:
  rewards:
    #ESTAS SÃO AS RECOMPENSAS QUE VOCÊ COLOCA NO 'races.yml'
    reward_1:
      chance: 50
      data:
        - '60.0%~ [consolecmd] give %player% diamond_block 5'
    #REMOVER O VALOR 'chance' FAZ A RECOMPENSA/COMANDO ACONTECER SEMPRE
    reward_2:
      data:
        - '[consolecmd] give %player% iron_block 5'
        - '[playermsg] &aVocê venceu!'
    reward_3:
      chance: 50
      data:
        - '[consolecmd] give %player% diamond_block 3'