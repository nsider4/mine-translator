enable-races: true

creative-enabled: true
#Links úteis para adicionar DADOS:
#
#https://hub.spigotmc.org/javadocs/spigot/org/bukkit/entity/EntityType.html
#https://helpch.at/docs/1.8/index.html?org/bukkit/entity/EntityType.html
#https://hub.spigotmc.org/javadocs/bukkit/org/bukkit/Material.html
#https://helpch.at/docs/1.8/org/bukkit/Material.html

#Os nomes podem ser modernos ou antigos (MOOSHROOM ou MUSHROOM_COW, COD ou RAW_FISH): são ajustados à versão do seu
#servidor. Nomes que não existem na sua versão (ex.: um bloco da 1.21 na 1.8) são ignorados, com um aviso no console.
#
#Cada corrida também aceita (opcional):
#  points: 1     #pontos que o vencedor recebe (padrão 1)
#  weight: 1     #com que frequência a rotação a escolhe em relação aos outros jogos (padrão 1, 0 = nunca)
#
#Admins podem iniciar uma corrida com valores próprios: /chatgames <race> <material/mob> [amount]
#Sem quantidade, usa-se uma das listadas abaixo para esse material/criatura. O vencedor recebe as recompensas listadas
#para exatamente esse material e quantidade, ou nenhuma se não estiverem aqui (os pontos são dados mesmo assim).

