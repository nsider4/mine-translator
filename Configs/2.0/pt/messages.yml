help_command:
  - '&8&m-------------------------------------------------'
  - '&e&l-ChatGames-'
  - '&6'
  - '&6&lCOMANDOS:'
  - '&6'
  - '&e/chatgames menu [menu] &8- &7Abre o menu: perfil, desafios, sequências, rankings (ou qualquer menu do menus.yml).'
  - '&e/chatgames profile [player] &8- &7Mostra suas estatísticas (ou as de outro jogador).'
  - '&e/chatgames top &8- &7Mostra os 10 jogadores com mais pontos.'
  - '&e/chatgames fastest [game] &8- &7Mostra os vencedores mais rápidos, no geral ou de um jogo.'
  - '&e/chatgames points [player] &8- &7Mostra seus pontos (ou os de outro jogador).'
  - '&e/chatgames challenges &8- &7Mostra seus desafios diários e semanais.'
  - '&e/chatgames streaks &8- &7Mostra suas sequências.'
  - '&e/chatgames claim &8- &7Resgata desafios concluídos e recompensas de sequência.'
  - '&e/chatgames event [list|top <event>] &8- &7Mostra os eventos de jogos, ou quem mais pontuou em um.'
  - '&e/chatgames toggle [player] &8- &7Ativa ou desativa os jogos de chat para você.'
  - '&e/chatgames togglesound [player] &8- &7Ativa ou desativa os sons dos jogos.'
  - '&6'
  - '&6&lADMIN:'
  - '&e/chatgames admin &8- &7Abre o menu de administração.'
  - '&e/chatgames debug &8- &7Abre o menu de depuração: teste qualquer jogo em privado, sem recompensas.'
  - '&e/chatgames (game) [values] &8- &7Inicia esse jogo agora, opcionalmente com sua própria palavra/valores.'
  - '&e/chatgames any &8- &7Inicia o jogo que a rotação escolheria em seguida.'
  - '&e/chatgames global <game> [values] &8- &7Inicia um jogo global: o servidor inteiro joga junto.'
  - '&e/chatgames event start <event> | stop &8- &7Inicia ou para um evento de jogos.'
  - '&e/chatgames stop &8- &7Encerra o jogo em andamento sem vencedor.'
  - '&e/chatgames toggleAll &8- &7Ativa ou desativa a rotação automática de jogos.'
  - '&e/chatgames preset <list|load|save> [name] &8- &7Gerencia os presets de jogos.'
  - '&e/chatgames +points|-points|setpoints <player> <amount> &8- &7Altera os pontos de um jogador.'
  - '&e/chatgames remove <player> &8- &7Apaga os dados de um jogador.'
  - '&e/chatgames challenges reset <player> &8- &7Zera o progresso de desafios de um jogador.'
  - '&e/chatgames streak set <player> <challenge|daily|global> <days> &8- &7Define a sequência de um jogador.'
  - '&e/chatgames logs [amount] &8- &7Mostra os últimos registros de jogos.'
  - '&e/chatgames discord <test <message|all>|leaderboard> &8- &7Envia uma mensagem de teste ou o ranking para o Discord.'
  - '&e/chatgames reload &8- &7Recarrega os arquivos de configuração.'
  - '&6'
  - '&6&lTIPOS DE JOGO:'
  - '&7unscramble, unreverse, reaction, random, fillout, variable, clickable, math, sequence, memorize, guess_the_number, trivia, word_association, hoverable, hunt, mine, place, fish, craft, eat, furnace, tame, shear'
  - '&8&m-------------------------------------------------'

#Use <center> nas mensagens em LISTA para centralizá-las; as linhas com isso ficarão centralizadas!

#############################
##    MENSAGENS DOS JOGOS    ##
#############################
#Compartilhadas por todos os jogos. Um jogo pode substituí-las com seu próprio 'hint_message' / 'countdown_actionbar' na seção dele abaixo.
hint_message: '&8[%prefix%&8] &eDica: &f%hint%'
countdown_actionbar: '&e%seconds%s &7restantes'

waiting_for_other_winners: '&8[%prefix%&8] &aVocê acertou! &fAguardando outros vencedores...'
wrong_case: '&8[%prefix%&8] &cQuase... Confira as maiúsculas!'
  #VOCÊ PODE USAR "%display_name%" NO LUGAR DE %player% NO correct_message EM TODOS OS JOGOS.
  #
  #VOCÊ TAMBÉM PODE USAR %points_<position>% PARA MOSTRAR OS PONTOS DO JOGADOR QUE VENCEU.
  #
  #Para mostrar o 1º, 2º, 3º vencedor e assim por diante use %winner_<position>% e para o tempo de cada um %time_<position>%

