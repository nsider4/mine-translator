  hoverText: '&eClique aqui!'

  gameStartAnnouncement:
    - ''
    - '<center>&r✓ ✯ %prefix%&r ✯ ✓'
    - ''
    - '<center>&fVocê tem &e%timeToGuess% segundos &fpara &dclicar&f no texto:'
    - ''
    - '<center>&b%clickableText%'
    - ''
  #USE %winner_
  correct_message:
    - ''
    - '<center>&r✓ ✯ %prefix% &r✯ ✓'
    - ''
    - '<center>&a%winner_1% &7foi o mais rápido a clicar no texto (&c%time_1%s&7) e ganhou um prêmio!'
    - ''
  time_expired_message:
    - ''
    - '<center>&r✓ ✯ %prefix%&r ✯ ✓'
    - ''
    - '<center>&f%timeToGuess%s &cesgotados! &fO jogo do clique acabou!'
    - ''

