#CORRIDAS
#Por enquanto as corridas não aceitam vários vencedores, pois não vejo motivo: são 'corridas' ou 'desafios entre jogadores' que o primeiro deve levar.

#%value% é o material ou a criatura, %amount% a quantidade, %timeToComplete% o tempo limite em segundos.
#No correct_message: %winner%, %winner_displayname%, %time% (segundos) e %points% (os pontos do vencedor).

