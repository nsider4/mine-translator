#GÜNLÜK VE HAFTALIK GÖREVLER
#
#Herkes aynı görevleri alır. İlerleme oyuncular oynadıkça sayılır; tamamlanan bir
#görev /chatgames challenges içinde "Alınmaya hazır" gösterir, /chatgames claim ödülünü verir.
#Alınmayan ödüller görevler yenilendiğinde kaybolur.
#
#GÖREV TÜRLERİ (amount kaç tane gerektiğidir):
#  WIN_GAMES    herhangi bir sırada sohbet oyunları veya yarışlar kazan
#  WIN_GAME     'game' ile ayarlanan tek bir oyun veya yarış kazan (ör. game: unscramble)
#  WIN_RACES    yarışlar kazan
#  PLAY_GLOBAL  küresel oyunları zamanında başar
#  WIN_GLOBAL   küresel oyunları ödüllü bir sırada bitir
#  FAST_WIN     sohbet oyunlarını 'seconds' veya daha kısa sürede kazan (yarışlar sayılmaz)
#  EARN_POINTS  oyunlardan puan kazan
#  PLAY_EVENT   oyun etkinliklerine katıl
#
#Her görevin şunları vardır:
#  name / description: sohbette ve menüde gösterilir. %amount%, %game% ve %seconds% doldurulur.
#  icon: menüdeki öğe (bir malzeme adı)
#  rewards: rewards.yml'deki gibi satırlar ('<chance>%~ ' ile şanslar, 'has:<permission>' ile izinler).
#           %player% ve %challenge% (ad) doldurulur.
#
#Kimlikler (win_3, fast_1...) oyuncuların ilerlemesiyle kaydedilir: yalnızca a-z, 0-9, - ve _ kullan,
#birini değiştirmek o görevin ilerlemesini baştan başlatır.

#Görevler ve seriler için günlerin başladığı saat dilimi, ör. Europe/Istanbul veya America/New_York.
#Boşsa sunucununki kullanılır.
timezone: ''

