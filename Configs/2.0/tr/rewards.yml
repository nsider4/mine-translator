#BURADAN SONRASI YALNIZCA 1 KAZANANI OLAN YARIŞLARIN ÖDÜLLERİDİR
#
#FARKLI BİR BİÇİM KULLANILIR! DİKKATLE OKU

races:
  rewards:
    #BUNLAR 'races.yml' İÇİNE YAZDIĞIN ÖDÜLLERDİR
    reward_1:
      chance: 50
      data:
        - '60.0%~ [consolecmd] give %player% diamond_block 5'
    #'chance' DEĞERİNİ KALDIRMAK ÖDÜLÜN/KOMUTUN HER ZAMAN GERÇEKLEŞMESİNİ SAĞLAR
    reward_2:
      data:
        - '[consolecmd] give %player% iron_block 5'
        - '[playermsg] &aKazandın!'
    reward_3:
      chance: 50
      data:
        - '[consolecmd] give %player% diamond_block 3'