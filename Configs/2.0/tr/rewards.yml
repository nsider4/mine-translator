#OLASI EYLEMLER:
#
#[playercmd] - Komutu kazanan olarak çalıştırır
#[consolecmd] - Komutu konsoldan çalıştırır
#[playermsg] - Kazanana bir mesaj gönderir
#[broadcast] - Açık dünyalardaki tüm oyunculara bir mesaj yayınlar
#[player_as_op] - Oyuncu için op olarak bir komut çalıştırır
#
#ÖDÜLLERE ŞU ŞEKİLDE ŞANS EKLE:
#
#ÖRNEK:
#  - '10.0%~ [consolecmd] give %player% iron_block 5'
#YALNIZCA BİÇİM ÖRNEKTEKİYLE AYNIYSA ÇALIŞIR: BAŞTA <chance>%, ARDINDAN ~ VE BİR BOŞLUK. KOMUTTA HER ZAMAN İLK SIRADA
#
#% İÇERMEYEN KOMUTLAR %100 VERİLEN ÖDÜLLERDİR.

#İZİN KONTROLÜ:
#
#KOMUT SATIRININ SONUNA KOY.
#Örnek:
#  - '[consolecmd] give %player% iron_block 5 has:test.permission'

#1 İLK kazanan içindir; config.yml'DE DAHA FAZLA KAZANAN EKLER VE FARKLI ÖDÜLLER İSTERSEN SIRALARINI EKLE (2:, vb.)
unscramble:
  rewards:
    1:
      reward_1:
        minimum-players: 2 #Online players-based condition, reward can only be chosen if there are 2 or more players online
        chance: 50
        data:
          - '10.0%~ [consolecmd] give %player% diamond_block 3 has:test.permission'
          - '[consolecmd] give %player% iron_block 5'
      reward_2:
        data:
          - '[consolecmd] give %player% iron_block 2'

