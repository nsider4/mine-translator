#Bu oyunda verilen uzunlukta rastgele karakterlerden bir dizi oluşturulur
random:
  enable: true
  winners: 1
  weight: 1
  points: 1
  countdown:
    enable: true
    last-seconds: 10

  case-sensitive: true
  #Oyuncuların tahmin etmek, çözmek, yazmak vb. için saniye cinsinden süresi.
  timeToGuess_seconds: 20
  #Bu oyunun rastgele dizisinin uzunluğu. Aralık biçimi <min>-<max>. Tek uzunluk için iki tarafa aynı sayıyı yaz
  lengthRange: 6-8
  #Kullanılabilir türler: ALPHA (harfler), ALPHANUMERIC (harf ve rakamlar), NUMERIC (rakamlar), SYMBOLIC (semboller),
  #LOWERCASE_ALPHA (yalnızca küçük harfler), UPPERCASE_ALPHA (yalnızca büyük harfler), HEXADECIMAL (onaltılık karakterler: 0123456789ABCDEF)
  #CUSTOM ('custom_characters' içindekileri kullanır)
  character_type: ALPHANUMERIC
  #Bu satır yalnızca tür "CUSTOM" ise kullanılır
  custom_characters: 'abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789'

  #__Kapatmak için sonraki 2 değeri boş bırak__
  titleMessage: '&b%selection%'
  subtitleMessage: '&aYaz'

math:
  enable: true
  winners: 1
  weight: 1
  points: 1
  hints:
    enable: true
    after-percent: 50
    max: 1
  countdown:
    enable: true
    last-seconds: 10

  #Bunu değiştirme
  case-sensitive: false
  #Oyuncuların tahmin etmek, çözmek, yazmak vb. için saniye cinsinden süresi.
  timeToGuess_seconds: 20
  #Her zorluk için rastgele sayı aralıkları:
  #1 - (1-9)
  #2 - (1-99)
  #3 - (1-999)
  #4 - (1-9999)
  #5 - (1-99999)
  difficulty: 2
  #Her sorunun kaç işleci var: 1 -> "12 + 7", 2 -> "12 + 7 x 3"
  operations: 1
  #solve: sonucu hesaplamak ("12 + 7 x 3").  missing-value: gizli sayıyı bulmak ("12 + ? x 3 = 33").
  #Her tur listelenen modlardan birini seçer.
  modes:
    - solve
    - missing-value
  #Kullanılacak işleçler; listelenen dördü kullanılabilir, istemediklerini kaldır. Her zaman en az 1 tane bırak
  #Bölmeler her zaman tam sayı verir.
  operators:
    - '+'
    - '-'
    - 'x'
    - '/'

  #__Kapatmak için sonraki 2 değeri boş bırak__
  titleMessage: '&b%selection%'
  subtitleMessage: '&aÇöz'

