#############################
######    CHATGAMES    ######
#############################
#Her oyunun kabul ettiği ayarlar (biri eksikse gösterilen varsayılan geçerlidir):
#  enable: true/false
#  weight: 1             Döngünün bu oyunu diğerlerine göre ne kadar seçeceği (0 = asla).
#                        Aynı oyun asla art arda iki kez oynanmaz.
#  winners: 1            Her turu kaç oyuncunun kazanabileceği.
#  points: 1             Galibiyet başına puan (/chatgames top).
#  case-sensitive: false Büyük/küçük harf dışında her şeyi doğru olan 'wrong_case' mesajını alır.
#  timeToGuess_seconds: 20
#  min-answer-ms: 400    Daha hızlı doğru cevaplar yok sayılır ve kaydedilir: kimse bu kadar hızlı okuyup
#                        yazamaz, botlar yazar. 0 kontrolü kapatır.
#  hints:                Tur sırasında ipuçları, messages.yml'deki 'hint_message' ile.
#    enable: false
#    after-percent: 50   İlk ipucu sürenin bu yüzdesi geçince çıkar; kalanlar kalan süreye yayılır.
#    max: 1              En fazla 3.
#  countdown:            Kalan süre, aksiyon çubuğunda. Her sürümde çalışır (1.8'den 26.x'e).
#    enable: false
#    last-seconds: 10    Yalnızca son N saniyede; 0 tüm tur boyunca gösterir.
#  titleMessage / subtitleMessage: başlık göndermemek için ikisini de boş bırak.
unscramble:
  enable: true
  winners: 1
  weight: 1
  points: 1
  hints:
    enable: true
    after-percent: 50
    max: 1
  countdown:
    enable: true
    last-seconds: 10

  case-sensitive: true
  #Oyuncuların tahmin etmek, çözmek, yazmak vb. için saniye cinsinden süresi.
  timeToGuess_seconds: 20
  #__Kapatmak için sonraki 2 değeri boş bırak__
  titleMessage: '&b%selection%'
  subtitleMessage: '&aÇöz'

