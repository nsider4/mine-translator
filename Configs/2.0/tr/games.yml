  subtitleMessage: '&aŞunun için &7`&b%symbol%&7`'

  #Rastgele sonuç sayısının aralığı
  result-min: 20
  result-max: 100

  toGet: '✗'
  #Ekleyebileceğin diğer semboller: ✪❃✿✠❂♫♪❦♡♤♢✦☾☽✹
  data:
    - '✯;10'
    - '♛;15'
    - '❅;20'
    - '♫;25'

sequence:
  enable: true
  winners: 1
  weight: 1
  points: 1
  hints:
    enable: true
    after-percent: 50
    max: 1
  countdown:
    enable: true
    last-seconds: 10

  #Bunu değiştirme
  case-sensitive: false

  #Oyuncuların tahmin etmek, çözmek, yazmak vb. için saniye cinsinden süresi.
  timeToGuess_seconds: 25

  #Oyuncular bir sayı dizisi görür ve sonraki sayıyı yazar, ör. "3, 6, 12, 24, ?" -> 48
  #Örüntüler: toplama (3, 7, 11), çarpma (2, 6, 18), kareler (4, 9, 16), dönüşümlü (5, 9, 7, 11), fibonacci (2, 3, 5, 8)
  patterns:
    - add
    - multiply
    - squares
    - alternating
    - fibonacci
  #1-3. Yüksek zorluk daha zor örüntülere (2'den itibaren kareler ve dönüşümlü, 3'te fibonacci) ve büyük sayılara izin verir.
  difficulty: 2
  #'?' işaretinden önce kaç sayı gösterilir (4-8)
  shown-terms: 5

  #__Kapatmak için sonraki 2 değeri boş bırak__
  titleMessage: '&b%selection%'
  subtitleMessage: '&aDiziyi tamamla'

