#Oyun sonuçlarını, yarışları, global oyunları, etkinlikleri ve daha fazlasını Discord'a gönderir.
#
#Mesajlar bir kanal webhook'u (kurulacak bir şey yok), DiscordSRV eklentisinin
#botu ya da ikisi üzerinden gönderilir. Her mesajı /chatgames discord test <message> ile deneyin.
enabled: true

#__KANALLAR__
#Mesajların gittiği yerler. İstediğiniz gibi adlandırın; aşağıdaki her bildirim kullandığı kanalları belirtir.
#  webhook: bir kanalın webhook URL'si. Discord'da: Kanalı Düzenle > Entegrasyonlar > Webhook'lar >
#           Yeni Webhook > Webhook URL'sini Kopyala. Gizli tutun: ona sahip olan herkes oraya yazabilir.
#  discordsrv: bunun yerine DiscordSRV botunuzla gönderir (DiscordSRV gerekir). DiscordSRV'nin config.yml
#              dosyasındaki Channels bölümünden bir kanal adı (ör. global) ya da bir kanal ID'si.
#  username / avatar: webhook gönderilerinde görünen ad ve resim (bot kendininkini korur).
channels:
  main:
    webhook: ''
    discordsrv: ''
    username: 'Chat Games'
    avatar: 'https://www.spigotmc.org/data/resource_icons/107/107781.jpg?1676494289'

#__GENEL__
#Alt bilgilerde %server% olarak gösterilir
server-name: 'Minecraft Server'
#%winner_head% / %player_head% için resim. %name% ve %uuid% doldurulur.
player-head-url: 'https://mc-heads.net/avatar/%name%/128'
#Mesajların etiketleyebileceği rol ID'leri (bir metne <@&ID> yazın). Başka hiçbir şey etiketlemez:
#ne @everyone ne de bir oyuncunun adındaki ya da cevabındaki herhangi bir şey.
#ID almak için Discord'da Geliştirici Modu'nu açın (Ayarlar > Gelişmiş), sonra role sağ tıklayın.
allowed-role-pings: []
#DiscordSRV ile %winner_mention% / %player_mention% oyuncunun bağlı Discord hesabını gösterir
#(yoksa adını). true onu ayrıca etiketler.
ping-linked-players: false
#Hiç gönderilmeyen oyunlar ve yarışlar
ignored-games: []

#Oyun başına renkler (%game_color%) ve emojiler (%game_emoji%). Renkler: '#RRGGBB' ya da bir ad.
#Emoji: :trophy: gibi adlar (liste bu dosyanın sonunda) ya da <:name:ID> şeklinde bir sunucu emojisi.
#Bu dosyaya emoji karakteri yapıştırmayın: 1.8 sunucuları emoji içeren bir dosyayı okuyamaz.
styles:
  default: {color: '#5865F2', emoji: ':video_game:'}
  unscramble: {color: '#F1C40F', emoji: ':abc:'}
  unreverse: {color: '#E67E22', emoji: ':repeat:'}
  reaction: {color: '#E74C3C', emoji: ':zap:'}
  random: {color: '#9B59B6', emoji: ':game_die:'}
  fillout: {color: '#3498DB', emoji: ':pencil2:'}
  variable: {color: '#1ABC9C', emoji: ':heavy_plus_sign:'}
  clickable: {color: '#2ECC71', emoji: ':point_up:'}
  hoverable: {color: '#16A085', emoji: ':eyes:'}
  math: {color: '#E91E63', emoji: ':heavy_division_sign:'}
  sequence: {color: '#00BCD4', emoji: ':1234:'}
  memorize: {color: '#8E44AD', emoji: ':brain:'}
  guess_the_number: {color: '#FF9800', emoji: ':question:'}
  trivia: {color: '#3F51B5', emoji: ':books:'}
  word_association: {color: '#009688', emoji: ':link:'}
  count: {color: '#607D8B', emoji: ':1234:'}
  hunt: {color: '#C0392B', emoji: ':crossed_swords:'}
  mine: {color: '#7F8C8D', emoji: ':pick:'}
  place: {color: '#A0522D', emoji: ':bricks:'}
  fish: {color: '#2980B9', emoji: ':fishing_pole_and_fish:'}
  eat: {color: '#D35400', emoji: ':poultry_leg:'}
  craft: {color: '#8D6E63', emoji: ':hammer_and_pick:'}
  furnace: {color: '#E25822', emoji: ':fire:'}
  tame: {color: '#C69C6D', emoji: ':bone:'}
  shear: {color: '#ECF0F1', emoji: ':scissors:'}

#Listelerin nasıl yazıldığı: kazananlar, katkıda bulunanlar, sıralamalar ve lider tabloları.
#%medal% 1-3. sıraların madalyasıdır, other-places ise geri kalanlar için.
lists:
  medals: [':first_place:', ':second_place:', ':third_place:']
  other-places: '`%place%.`'
  winner: '%medal% **%player%** `%time%s`'
  contributor: '%medal% **%player%** `%amount%`'
  standing: '%medal% **%player%** `%points% puan`'
  leaderboard: '%medal% **%player%** `%value%`'
  #Boş bir liste yerine gösterilir
  empty: '-# Henüz kimse yok'

#__MESAJLAR__
#Her mesajda 'content' (embed'in üstündeki düz metin) ve/veya bir 'embed' vardır:
#  color, author (name, icon, url), title, url, description, thumbnail, image,
#  fields (name, value, inline), footer (text, icon), timestamp (true gönderilme zamanını gösterir).
#Bir metin tek satır ya da satır listesi olabilir. Yalnızca boş yer tutucular içeren bir satır
#çıkarılır, boş bir alan da öyle. Oyuncu gerektirmeyen PlaceholderAPI yer tutucuları da çalışır.
#Discord biçimlendirmesi açıklamalarda ve alan değerlerinde çalışır: '### ' bir başlık başlatır, '-# ' küçük gri
#metin, '> ' bir alıntı, **kalın**, `kod`.
#<t:%ends_unix%:R> her okuyucunun kendi saatinde "20 saniye içinde" gösterir ve geri sayar.
#Her mesajda: %server%, oyunlarda ayrıca %game% %game_key% %game_emoji% %game_color%.

#Sohbet oyunları. %question% %time_limit% %ends_unix% %winners_needed% %points%
games:
  enabled: true
  channels: [main]
  #true: oyun başlayınca gönderir, sonra o gönderiyi sonuca çevirir. false: yalnızca sonucu gönderir.
  live: true
  #Memorize listesini burada asla göstermez: oyuncular onu Discord'da okuyabilirdi.
  hidden-question: 'Oyun sohbetine bak!'
  start:
    embed:
      color: '%game_color%'
      author: '%game_emoji%  %game%'
      title: 'Yeni tur'
      description:
        - '### %question%'
        - '-# Kazanmak için oyun sohbetinde cevap ver.'
      fields:
        - name: ':stopwatch: Bitiş'
          value: '<t:%ends_unix%:R>'
          inline: true
        - name: ':sparkles: Ödül'
          value: '`%points% puan`'
          inline: true
        - name: ':busts_in_silhouette: Kazanan sayısı'
          value: '`%winners_needed%`'
          inline: true
      footer: '%server%'
  #%winner% %winner_head% %winner_mention% %time% %answer% %points% %winner_count%
  #%winners% (tüm kazananlar, satır başına bir) %other_winners% (ilki hariç hepsi)
  win:
    embed:
      color: '%game_color%'
      author: '%game_emoji%  %game%'
      title: ':trophy:  %winner% bildi!'
      thumbnail: '%winner_head%'
      description:
        - '-# Cevap şuydu'
        - '### %answer%'
      fields:
        - name: ':stopwatch: Süre'
          value: '`%time%s`'
          inline: true
        - name: ':sparkles: Puan'
          value: '`+%points%`'
          inline: true
        - name: ':medal: Bilen diğerleri'
          value: '%other_winners%'
          inline: false
      footer: '%server%'
      timestamp: true
  #%answer% %question% %time_limit%
  expired:
    enabled: true
    embed:
      color: '#4E5058'
      author: '%game_emoji%  %game%'
      title: ':hourglass:  Süre doldu'
      description:
        - '-# Kimse bilemedi. Cevap şuydu'
        - '### %answer%'
      footer: '%server%'
      timestamp: true
  #Bir yetkili oyunu durdurduğunda (yalnızca canlı gönderiyi düzenler)
  stopped:
    embed:
      color: '#4E5058'
      author: '%game_emoji%  %game%'
      title: ':no_entry:  Tur durduruldu'
      description:
        - '-# Bir yetkili bu turu erken bitirdi.'
      footer: '%server%'
      timestamp: true

#Yarışlar. %target% %amount% %time_limit% %ends_unix% %points%
races:
  enabled: true
  channels: [main]
  live: true
  start:
    embed:
      color: '%game_color%'
      author: '%game_emoji%  %game% yarışı'
      title: 'Yarış başladı'
      description:
        - '### %amount%x %target%'
        - '-# İlk bitiren kazanır.'
      fields:
        - name: ':stopwatch: Bitiş'
          value: '<t:%ends_unix%:R>'
          inline: true
        - name: ':sparkles: Ödül'
          value: '`%points% puan`'
          inline: true
      footer: '%server%'
  #%winner% %winner_head% %winner_mention% %time% %points%
  win:
    embed:
      color: '%game_color%'
      author: '%game_emoji%  %game% yarışı'
      title: ':checkered_flag:  %winner% yarışı kazandı!'
      thumbnail: '%winner_head%'
      description:
        - '### %amount%x %target%'
      fields:
        - name: ':stopwatch: Süre'
          value: '`%time%s`'
          inline: true
        - name: ':sparkles: Puan'
          value: '`+%points%`'
          inline: true
      footer: '%server%'
      timestamp: true
  expired:
    enabled: true
    embed:
      color: '#4E5058'
      author: '%game_emoji%  %game% yarışı'
      title: ':hourglass:  Süre doldu'
      description:
        - '### %amount%x %target%'
        - '-# Kimse zamanında bitiremedi.'
      footer: '%server%'
      timestamp: true
  stopped:
    embed:
      color: '#4E5058'
      author: '%game_emoji%  %game% yarışı'
      title: ':no_entry:  Yarış durduruldu'
      description:
        - '-# Bir yetkili bu yarışı erken bitirdi.'
      footer: '%server%'
      timestamp: true

#Tüm sunucunun tek bir hedef için çalıştığı global oyunlar.
#%goal% (ör. "500 Stone") %progress% %goal_amount% %percent% %bar% %contributors% %time_limit% %ends_unix%
global:
  enabled: true
  channels: [main]
  #true: gönderi ilerleme çubuğunu gösterir ve oyun sürerken güncellenir
  live: true
  #Canlı gönderinin en fazla ne sıklıkla güncellendiği (yalnızca ilerleme değiştiyse)
  update-seconds: 15
  bar: {length: 16, full: '█', empty: '░'}
  progress:
    embed:
      color: '%game_color%'
      author: ':globe_with_meridians:  Küresel %game%'
      title: 'Tüm sunucu birlikte oynuyor'
      description:
        - '### %goal%'
        - '`%bar%` **%percent%%**'
        - '-# %progress% / %goal_amount%'
      fields:
        - name: ':busts_in_silhouette: Yardım edenler'
          value: '`%contributors%`'
          inline: true
        - name: ':stopwatch: Bitiş'
          value: '<t:%ends_unix%:R>'
          inline: true
      footer: '%server%'
  #%top_contributors% (en çok katkı verenler, satır başına bir)
  completed:
    embed:
      color: '#57F287'
      author: ':globe_with_meridians:  Küresel %game%'
      title: ':tada:  Hedefe ulaşıldı!'
      description:
        - '### %goal%'
        - '`%bar%` **%percent%%**'
      fields:
        - name: ':medal: En çok yardım edenler'
          value: '%top_contributors%'
          inline: true
        - name: ':busts_in_silhouette: Yardım eden'
          value: '`%contributors%`'
          inline: true
      footer: '%server%'
      timestamp: true
  failed:
    embed:
      color: '#ED4245'
      author: ':globe_with_meridians:  Küresel %game%'
      title: ':x:  Hedefe ulaşılamadı'
      description:
        - '### %goal%'
        - '`%bar%` **%percent%%**'
        - '-# %progress% / %goal_amount%'
      fields:
        - name: ':medal: En çok yardım edenler'
          value: '%top_contributors%'
          inline: true
      footer: '%server%'
      timestamp: true
  #%top_contributors% kaç katkıcı listeler
  top-size: 5

#Oyun etkinlikleri (events.yml). %event%
events:
  enabled: true
  channels: [main]
  #%games% (kaç oyun içerdiği)
  start:
    embed:
      color: '#FEE75C'
      author: ':calendar:  Oyun etkinliği'
      title: '%event% başladı!'
      description:
        - '-# Etkinlik puanı kazanmak için oyunları art arda kazan.'
      fields:
        - name: ':video_game: Oyunlar'
          value: '`%games%`'
          inline: true
      footer: '%server%'
      timestamp: true
  #%standings% %players% (kaç kişi puan aldı) %winner% %winner_head% %winner_mention%
  end:
    embed:
      color: '#FEE75C'
      author: ':calendar:  Oyun etkinliği'
      title: ':trophy:  %event% sonuçları'
      thumbnail: '%winner_head%'
      description:
        - '%standings%'
      fields:
        - name: ':crown: Kazanan'
          value: '%winner_mention%'
          inline: true
        - name: ':busts_in_silhouette: Oyuncular'
          value: '`%players%`'
          inline: true
      footer: '%server%'
      timestamp: true
  #%standings% kaç sıra listeler
  standings-size: 10

#Bir oyuncunun serisi art arda belli bir gün sayısına ulaşır (streaks.yml). %player% %player_head% %player_mention% %streak% %days%
streaks:
  enabled: false
  channels: [main]
  #Yalnızca bu gün sayıları gönderilir
  days: [7, 14, 30, 60, 100, 365]
  message:
    embed:
      color: '#E67E22'
      author: {name: '%player%', icon: '%player_head%'}
      title: ':fire:  Art arda %days% gün!'
      description:
        - '-# %streak%'
      footer: '%server%'
      timestamp: true

#Bir oyuncu günlük ya da haftalık bir görevi tamamlar. %player% %player_head% %player_mention% %challenge% %period%
challenges:
  enabled: false
  channels: [main]
  #%period% neyi gösterir
  periods:
    daily: 'Günlük'
    weekly: 'Haftalık'
  message:
    embed:
      color: '#57F287'
      author: {name: '%player%', icon: '%player_head%'}
      title: ':white_check_mark:  Görev tamamlandı'
      description:
        - '### %challenge%'
        - '-# %period% görev'
      footer: '%server%'
      timestamp: true

#Belirli saatlerde ve /chatgames discord leaderboard ile gönderilen bir sıralama.
#%leaderboard% %total_points% (tüm oyuncular birlikte)
leaderboard:
  enabled: false
  channels: [main]
  #Sunucu saati, 24 saat, ör. ['12:00', '20:00']
  times: ['20:00']
  #points ya da fastest (tüm oyunlardaki en hızlı cevaplar)
  type: points
  size: 10
  message:
    embed:
      color: '#5865F2'
      author: ':bar_chart:  Sıralama'
      title: 'En iyi oyuncular'
      description:
        - '%leaderboard%'
        - ''
        - '-# Toplam %total_points% puan kazanıldı'
      footer: '%server%'
      timestamp: true

