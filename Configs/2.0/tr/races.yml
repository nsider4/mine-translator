enable-races: true

creative-enabled: true
#VERİ eklemek için faydalı bağlantılar:
#
#https://hub.spigotmc.org/javadocs/spigot/org/bukkit/entity/EntityType.html
#https://helpch.at/docs/1.8/index.html?org/bukkit/entity/EntityType.html
#https://hub.spigotmc.org/javadocs/bukkit/org/bukkit/Material.html
#https://helpch.at/docs/1.8/org/bukkit/Material.html

#Adlar yeni veya eski olabilir (MOOSHROOM veya MUSHROOM_COW, COD veya RAW_FISH): sunucunun sürümüne
#eşlenirler. Sürümünde olmayan adlar (ör. 1.8'de 1.21'den bir blok) konsola bir not düşülerek atlanır.
#
#Her yarış ayrıca şunları kabul eder (isteğe bağlı):
#  points: 1     #kazananın aldığı puan (varsayılan 1)
#  weight: 1     #döngünün onu diğer oyunlara göre ne sıklıkla seçtiği (varsayılan 1, 0 = asla)
#
#Yöneticiler kendi değerleriyle bir yarış başlatabilir: /chatgames <race> <material/mob> [amount]
#Miktar verilmezse o malzeme/yaratık için aşağıda listelenenlerden biri kullanılır. Kazanan, tam olarak o
#malzeme ve miktar için listelenen ödülleri alır, burada yoksa hiçbirini almaz (puanlar yine verilir).

