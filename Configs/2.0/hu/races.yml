enable-races: true

creative-enabled: true
#Hasznos linkek ADATOK hozzáadásához:
#
#https://hub.spigotmc.org/javadocs/spigot/org/bukkit/entity/EntityType.html
#https://helpch.at/docs/1.8/index.html?org/bukkit/entity/EntityType.html
#https://hub.spigotmc.org/javadocs/bukkit/org/bukkit/Material.html
#https://helpch.at/docs/1.8/org/bukkit/Material.html

#A nevek lehetnek újak vagy régiek (MOOSHROOM vagy MUSHROOM_COW, COD vagy RAW_FISH): a szervered
#verziójához igazodnak. A verziódban nem létező nevek (pl. egy 1.21-es blokk 1.8-on) kimaradnak, konzolüzenettel.
#
#Minden verseny elfogadja még (opcionális):
#  points: 1     #a győztes pontjai (alapértelmezett 1)
#  weight: 1     #milyen gyakran választja a rotáció más játékokhoz képest (alapértelmezett 1, 0 = soha)
#
#Az adminok saját értékekkel indíthatnak versenyt: /chatgames <race> <material/mob> [amount]
#Mennyiség nélkül az adott anyaghoz/lényhez lent felsoroltak egyike használatos. A győztes azokat a jutalmakat kapja,
#amelyek pontosan ahhoz az anyaghoz és mennyiséghez vannak felsorolva, vagy semmit, ha itt nincsenek (pontot így is kap).

hunt:
  enable: true

  timeToComplete_seconds: 180
  #__Hagyd üresen a következő 2-t a kikapcsolásukhoz__
  titleMessage: '&bVADÁSZAT'
  subtitleMessage: '&aÖlj meg ennyit: %amount% %value%!'

  #Számítsanak-e az idézőkből vagy idézőtojásokból megjelent lények.
