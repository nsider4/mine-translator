        actions: ['[open] admin-presets']
      logs:
        slot: 24
        material: oak_sign
        name: '&f&lNaplók'
        lore:
          - '&7Az utolsó játékok kiírása a csetbe.'
        actions: ['[open] admin-logs']
      stop:
        slot: 25
        material: red_wool
        name: '&c&lJáték leállítása'
        lore:
          - '&7Győztes nélkül befejezi a futó játékot.'
        actions: ['[command] chatgames stop', '[wait] 2', '[refresh]']
      toggle:
        slot: 29
        material: lime_dye
        name: '&fCsetjátékaid: &aBE'
        lore:
          - '&7Kattints, hogy kikapcsold őket magadnak.'
        state: '%games_on%'
        actions: ['[command] chatgames toggle', '[refresh]']
        when-off:
          material: gray_dye
          name: '&fCsetjátékaid: &cKI'
          lore:
            - '&7Kattints, hogy bekapcsold őket magadnak.'
      toggle-all:
        slot: 30
        material: lime_dye
        name: '&fJátékrotáció: &aBE'
        lore:
          - '&7Kattints az automatikus játékok leállításához mindenkinek.'
        state: '%rotation_on%'
        #a toggleAll a globális szálon fejeződik be, Folián egy tickkel később
        actions: ['[command] chatgames toggleAll', '[wait] 2', '[refresh]']
        when-off:
          material: gray_dye
          name: '&fJátékrotáció: &cKI'
          lore:
            - '&7Kattints az automatikus játékok újraindításához.'
      reload:
        slot: 32
        material: hopper
        name: '&e&lÚjratöltés'
        lore:
