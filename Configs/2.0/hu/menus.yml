        actions: ['[close]', '[command] chatgames reload']
      debug:
        slot: 33
        material: command_block
        name: '&c&lHibakeresés'
        lore:
          - '&7Bármely játék privát tesztelése.'
        view-requirements: ['permission chatgames.debug']
        actions: ['[open] debug']
      back:
        slot: 36
        material: arrow
        name: '&7Vissza'
        actions: ['[back] main']
      close:
        slot: 44
        material: barrier
        name: '&cBezárás'
        actions: ['[close]']

  #Minden játék és verseny: %game% %key% (mint a parancsokban) %icon%
  admin-start:
    title: '&8Játék indítása'
    rows: 6
    open-requirements: ['permission chatgames.admin']
    open-deny-actions: ['[chatgames:no-permission]']
    filler:
