  #/chatgames debug: minden csetjáték (%game% %key% %icon%). [chatgames:debug] <game> elindít egy
  #privát fordulót és megnyitja a debug-session menüt.
  debug:
    title: '&4Hibakeresés: válassz játékot'
    rows: 4
    open-requirements: ['permission chatgames.debug']
    open-deny-actions: ['[chatgames:no-permission]']
    filler:
      material: gray_stained_glass_pane
      name: ' '
    list-slots: ['10-16', '19-25']
    items:
      previous:
        slot: 30
        material: arrow
        name: '&7Előző oldal'
        actions: ['[previous-page]']
      next:
        slot: 32
        material: arrow
        name: '&7Következő oldal &8(%page%/%pages%)'
        actions: ['[next-page]']
      back:
        slot: 27
        material: arrow
        name: '&7Vissza'
        actions: ['[back] admin']
      close:
        slot: 35
        material: barrier
        name: '&cBezárás'
        actions: ['[close]']
    templates:
      game:
        material: '%icon%'
        name: '&c%game%'
        lore:
          - '&7Privát fordulót készít.'
          - '&7Nincs jutalom, semmi sem mentődik.'
        actions: ['[chatgames:debug] %key%']

  #A privát forduló: %game% %key% %icon% %question% %answer% %time% %min_ms% %case_sensitive%
  #%winners% %points% %hints% %generated%; listák: %placeholders% és %answers%.
  #[chatgames:debug-answer] <correct|wrong|wrong-case> [ms] próbaválaszt küld (ms után);
  #[chatgames:debug-timeout] kivárja az időkorlátot; [chatgames:debug-reroll] új fordulót készít;
  #[chatgames:debug-end] befejezi a munkamenetet.
  debug-session:
    title: '&4Hibakeresés: %game%'
    rows: 5
    open-requirements: ['permission chatgames.debug']
    open-deny-actions: ['[chatgames:no-permission]']
    filler:
      material: gray_stained_glass_pane
      name: ' '
    #Késleltetésenként egy „helyes válasz X ms után” gomb, a 'delays' lista helyein
    delays: [100, 500, 1000, 5000]
    lists:
      delays: ['29-32']
    items:
      question:
        slot: 11
        material: '%icon%'
        name: '&e&lKérdés'
        lore:
          - '&f%question%'
          - ''
          - '%placeholders%'
      answer:
        slot: 13
        material: emerald
        name: '&a&lElfogadott válaszok'
        lore:
          - '%answers%'
      settings:
        slot: 15
        material: repeater
        name: '&f&lBeállítások'
        lore:
          - '&7Időkorlát: &f%time%mp'
          - '&7Min. válaszidő: &f%min_ms% ms'
          - '&7Kis- és nagybetű érzékeny: %case_sensitive%'
          - '&7Győztesek: &f%winners%  &7Pontok: &f%points%'
          - '&7Előkészített tippek: &f%hints%'
          - '&7Elkészült: &f%generated% ms'
      correct-now:
        slot: 28
        material: lime_wool
        name: '&aHelyes válasz most'
        lore:
          - '&7Gyorsabb bármely embernél: megmutatja'
          - '&7a makróellenőrzés működését.'
        actions: ['[chatgames:debug-answer] correct']
      wrong:
        slot: 33
        material: red_wool
        name: '&cHibás válasz'
        actions: ['[chatgames:debug-answer] wrong']
      wrong-case:
        slot: 34
        material: orange_wool
        name: '&6Válasz hibás kis- és nagybetűkkel'
        actions: ['[chatgames:debug-answer] wrong-case']
      timeout:
        slot: 39
        material: clock
        name: '&eHagyd lejárni az időt'
        lore:
          - '&7Kivárja az időkorlátot, aztán jelent.'
        actions: ['[chatgames:debug-timeout]']
      reroll:
        slot: 41
        material: ender_pearl
        name: '&dÚj forduló'
        actions: ['[chatgames:debug-reroll]']
      back:
        slot: 36
        material: arrow
        name: '&7Vissza'
        actions: ['[chatgames:debug-end]', '[back] debug']
      close:
        slot: 44
        material: barrier
        name: '&cBezárás'
        actions: ['[close]']
    templates:
      correct-after:
        material: yellow_wool
        name: '&eHelyes válasz %ms% ms után'
        actions: ['[chatgames:debug-answer] correct %ms%']
