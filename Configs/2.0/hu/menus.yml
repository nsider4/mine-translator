  #A global_games.yml által bekapcsolt játékok: %game% %key% %icon% %goal% %duration% %points%.
  #A futó: %global_running% %global_game% %global_goal% (pl. "500 Stone")
  #%global_progress% %global_goal_amount% %global_percent% %global_contributors% %global_time_left%
  admin-global:
    title: '&8Globális játékok'
    rows: 5
    update-interval: 20
    open-requirements: ['permission chatgames.admin']
    open-deny-actions: ['[chatgames:no-permission]']
    filler:
      material: gray_stained_glass_pane
      name: ' '
    list-slots: ['19-25', '28-34']
    items:
      status:
        slot: 4
        material: beacon
        name: '&3&lFut: &f%global_game%'
        lore:
          - '&7Cél: &f%global_goal%'
          - '&7Haladás: &e%global_progress%&7/&e%global_goal_amount% &8(%global_percent%%)'
          - '&7Segítő játékosok: &f%global_contributors%'
          - '&7Hátralévő idő: &f%global_time_left%mp'
          - ''
          - '&cKattints a leállításhoz (jutalom nélkül)'
        view-requirements: ['%global_running%']
        actions: ['[command] chatgames stop', '[wait] 2', '[refresh]']
      idle:
        slot: 4
        material: gray_dye
        name: '&7Nem fut globális játék'
        lore:
