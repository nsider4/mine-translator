          - '&7Következő játék: &f%next_game%'
          - '&7Rotáció: %rotation_state%'
          - '&7Esemény: &f%event%'
          - '&7Csomag: &f%preset%'
      start-game:
        slot: 19
        material: diamond_sword
        name: '&a&lJáték indítása'
        lore:
          - '&7Bármely játék vagy verseny, most.'
        actions: ['[open] admin-start']
      global:
        slot: 20
        material: beacon
        name: '&3&lGlobális játék indítása'
        lore:
          - '&7Mindenki nyer, aki időben teljesít.'
        actions: ['[open] admin-global']
      events:
        slot: 21
        material: nether_star
        name: '&6&lEsemények'
        lore:
          - '&7Játékesemény indítása vagy leállítása.'
        actions: ['[open] admin-events']
      presets:
        slot: 23
        material: chest
        name: '&d&lCsomagok'
        lore:
