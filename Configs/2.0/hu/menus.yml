        material: arrow
        name: '&7Következő oldal &8(%page%/%pages%)'
        actions: ['[next-page]']
      back:
        slot: 36
        material: arrow
        name: '&7Vissza'
        actions: ['[back] admin']
      close:
        slot: 44
        material: barrier
        name: '&cBezárás'
        actions: ['[close]']
    templates:
      game:
        material: '%icon%'
        name: '&3Globális %game%'
        lore:
          - '&7Cél: &f%goal% helyes válasz'
          - '&7Idő: &f%duration%mp'
          - '&7Pontok: &f%points%'
          - ''
          - '&eKattints az indításhoz'
        actions: ['[close]', '[command] chatgames global %key%']
      race:
        material: '%icon%'
        name: '&3Globális %game% verseny'
        lore:
          - '&7Cél: &f%goal% közösen'
          - '&7Idő: &f%duration%mp'
          - '&7Pontok: &f%points%'
          - ''
          - '&eKattints az indításhoz'
        actions: ['[close]', '[command] chatgames global %key%']
      count:
        material: '%icon%'
        name: '&3Globális %game%'
        lore:
          - '&7Számoljatok együtt a csetben'
          - '&7Idő: &f%duration%mp'
          - '&7Pontok: &f%points%'
          - ''
          - '&eKattints az indításhoz'
        actions: ['[close]', '[command] chatgames global %key%']

  #events.yml események: %event% %id% %steps% és %step% (az épp futó játék) a futóhoz
  admin-events:
    title: '&8Események'
    rows: 4
    open-requirements: ['permission chatgames.admin']
    open-deny-actions: ['[chatgames:no-permission]']
    filler:
      material: gray_stained_glass_pane
      name: ' '
    list-slots: ['10-16', '19-25']
    items:
      none:
        slot: 13
        material: barrier
        name: '&7Nincs esemény beállítva az events.yml-ben'
        view-requirements: ['%entries% == 0']
      previous:
        slot: 30
        material: arrow
        name: '&7Előző oldal'
        actions: ['[previous-page]']
      next:
        slot: 32
        material: arrow
        name: '&7Következő oldal &8(%page%/%pages%)'
        actions: ['[next-page]']
      back:
        slot: 27
        material: arrow
        name: '&7Vissza'
        actions: ['[back] admin']
      close:
        slot: 35
        material: barrier
        name: '&cBezárás'
