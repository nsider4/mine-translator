#Beállítások, amelyeket minden játék elfogad (ami hiányzik, a látható alapértéket kapja):
#  enable: true/false
#  weight: 1             Mennyire valószínű, hogy a rotáció ezt a játékot választja a többihez képest (0 = soha).
#                        Ugyanaz a játék soha nem jön kétszer egymás után.
#  winners: 1            Hány játékos nyerhet fordulónként.
#  points: 1             Pont győzelmenként (/chatgames top).
#  case-sensitive: false A csak kis- és nagybetűt eltévesztő játékosok a 'wrong_case' üzenetet kapják.
#  timeToGuess_seconds: 20
#  min-answer-ms: 400    Az ennél gyorsabb helyes válaszok figyelmen kívül maradnak és naplózódnak: senki sem olvas és gépel
#                        ilyen gyorsan, a csetbotok igen. 0 kikapcsolja az ellenőrzést.
#  hints:                A tippek a forduló közben jelennek meg, a messages.yml 'hint_message' üzenetével.
#    enable: false
#    after-percent: 50   Az első tipp ennyi idő eltelte után jelenik meg; a többi a maradékra oszlik el.
#    max: 1              Legfeljebb 3.
#  countdown:            A hátralévő idő az akciósávon. Minden verzión működik (1.8-tól 26.x-ig).
#    enable: false
#    last-seconds: 10    Csak az utolsó N másodpercben; 0 esetén az egész fordulóban látszik.
#  titleMessage / subtitleMessage: hagyd mindkettőt üresen, hogy ne küldjön címet.
