  timeToGuess_seconds: 25

  #A játékosok egy számsort látnak, és beírják a következőt, pl. "3, 6, 12, 24, ?" -> 48
  #Minták: összeadás (3, 7, 11), szorzás (2, 6, 18), négyzetek (4, 9, 16), váltakozó (5, 9, 7, 11), Fibonacci (2, 3, 5, 8)
  patterns:
    - add
    - multiply
    - squares
    - alternating
    - fibonacci
  #1-3. Nagyobb nehézség nehezebb mintákat (négyzetek és váltakozó 2-től, Fibonacci 3-on) és nagyobb számokat ad.
  difficulty: 2
  #Hány szám látszik a '?' előtt (4-8)
  shown-terms: 5

  #__Hagyd üresen a következő 2-t a kikapcsolásukhoz__
  titleMessage: '&b%selection%'
  subtitleMessage: '&aFolytasd a számsort'

