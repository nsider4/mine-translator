#Ez a játék adott hosszúságú, véletlen karakterekből álló szöveget készít
random:
  enable: true
  winners: 1
  weight: 1
  points: 1
  countdown:
    enable: true
    last-seconds: 10

  case-sensitive: true
  #Az idő másodpercben, amennyi a játékosoknak jut a kitalálásra, megoldásra, beírásra stb.
  timeToGuess_seconds: 20
  #A véletlen szöveg hossza ehhez a játékhoz. Tartomány formátuma: <lower>-<higher>. Egyetlen hosszhoz írd ugyanazt a számot mindkét oldalra
  lengthRange: 6-8
  #Elérhető típusok: ALPHA (betűk), ALPHANUMERIC (betűk és számok), NUMERIC (számok), SYMBOLIC (szimbólumok),
  #LOWERCASE_ALPHA (csupa kisbetű), UPPERCASE_ALPHA (csupa nagybetű), HEXADECIMAL (hexadecimális karakterek: 0123456789ABCDEF)
  #CUSTOM (a 'custom_characters' tartalmát használja)
  character_type: ALPHANUMERIC
  #Ez a szöveg csak akkor használatos, ha a type "CUSTOM"
  custom_characters: 'abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789'

  #__Hagyd üresen a következő 2-t a kikapcsolásukhoz__
  titleMessage: '&b%selection%'
  subtitleMessage: '&aÍrd be'

math:
  enable: true
  winners: 1
  weight: 1
  points: 1
  hints:
    enable: true
    after-percent: 50
    max: 1
  countdown:
    enable: true
    last-seconds: 10

  #Ezt ne változtasd meg
  case-sensitive: false
  #Az idő másodpercben, amennyi a játékosoknak jut a kitalálásra, megoldásra, beírásra stb.
  timeToGuess_seconds: 20
  #Véletlen számok tartománya nehézség szerint:
  #1 - (1-9)
  #2 - (1-99)
  #3 - (1-999)
  #4 - (1-9999)
  #5 - (1-99999)
  difficulty: 2
  #Hány műveleti jel van egy kérdésben: 1 -> "12 + 7", 2 -> "12 + 7 x 3"
  operations: 1
  #solve: számold ki az eredményt ("12 + 7 x 3").  missing-value: találd meg a rejtett számot ("12 + ? x 3 = 33").
  #Minden forduló a felsorolt módok egyikét választja.
  modes:
    - solve
    - missing-value
  #Használandó műveleti jelek; a felsorolt négy az összes elérhető, a nem kívántakat eltávolíthatod. Mindig hagyj legalább 1-et
  #Az osztás mindig egész számot ad.
  operators:
    - '+'
    - '-'
    - 'x'
    - '/'

  #__Hagyd üresen a következő 2-t a kikapcsolásukhoz__
  titleMessage: '&b%selection%'
  subtitleMessage: '&aSzámold ki'

