#Játékeredményeket, versenyeket, globális játékokat, eseményeket és még többet küld a Discordra.
#
#Az üzenetek egy csatorna webhookján (nincs mit telepíteni), a DiscordSRV plugin
#botján, vagy mindkettőn mennek. Tesztelj minden üzenetet: /chatgames discord test <message>.
enabled: true

#__CSATORNÁK__
#Hová mennek az üzenetek. Nevezd el őket tetszés szerint; minden alábbi értesítés felsorolja a használt csatornákat.
#  webhook: egy csatorna webhook URL-je. Discordban: Csatorna szerkesztése > Integrációk > Webhookok >
#           Új webhook > Webhook URL másolása. Tartsd titokban: akinél megvan, oda írhat.
#  discordsrv: helyette a DiscordSRV botoddal küld (DiscordSRV szükséges). Egy csatornanév a DiscordSRV
#              config.yml-jének Channels szakaszából (pl. global), vagy egy csatornaazonosító.
#  username / avatar: a webhook-bejegyzéseknél látható név és kép (egy bot megtartja a sajátját).
channels:
  main:
    webhook: ''
    discordsrv: ''
    username: 'Chat Games'
    avatar: 'https://www.spigotmc.org/data/resource_icons/107/107781.jpg?1676494289'

#__ÁLTALÁNOS__
#A láblécekben %server%-ként jelenik meg
server-name: 'Minecraft Server'
#A kép a %winner_head% / %player_head% számára. A %name% és %uuid% kitöltődik.
player-head-url: 'https://mc-heads.net/avatar/%name%/128'
#Szerepkör-azonosítók, amelyeket az üzenetek megpingelhetnek (írj <@&ID>-t a szövegbe). Semmi más nem pingel soha: sem
#@everyone, sem semmi egy játékos nevében vagy válaszában.
#Azonosítóhoz kapcsold be a Fejlesztői módot a Discordban (Beállítások > Speciális), majd kattints jobb gombbal a szerepkörre.
allowed-role-pings: []
#DiscordSRV-vel a %winner_mention% / %player_mention% a játékos összekapcsolt Discord-fiókját mutatja
#(különben a nevét). A true meg is pingeli.
ping-linked-players: false
#Játékok és versenyek, amelyek soha nem kerülnek ki
ignored-games: []

#Színek (%game_color%) és emojik (%game_emoji%) játékonként. Színek: '#RRGGBB' vagy egy név.
#Emojik: nevek, mint :trophy: (a lista a fájl végén), vagy szerveremoji <:name:ID> formában.
#Ne illessz emoji karaktereket ebbe a fájlba: az 1.8-as szerverek nem tudják olvasni az ilyen fájlt.
styles:
  default: {color: '#5865F2', emoji: ':video_game:'}
  unscramble: {color: '#F1C40F', emoji: ':abc:'}
  unreverse: {color: '#E67E22', emoji: ':repeat:'}
  reaction: {color: '#E74C3C', emoji: ':zap:'}
  random: {color: '#9B59B6', emoji: ':game_die:'}
  fillout: {color: '#3498DB', emoji: ':pencil2:'}
  variable: {color: '#1ABC9C', emoji: ':heavy_plus_sign:'}
  clickable: {color: '#2ECC71', emoji: ':point_up:'}
  hoverable: {color: '#16A085', emoji: ':eyes:'}
  math: {color: '#E91E63', emoji: ':heavy_division_sign:'}
  sequence: {color: '#00BCD4', emoji: ':1234:'}
  memorize: {color: '#8E44AD', emoji: ':brain:'}
  guess_the_number: {color: '#FF9800', emoji: ':question:'}
  trivia: {color: '#3F51B5', emoji: ':books:'}
  word_association: {color: '#009688', emoji: ':link:'}
  count: {color: '#607D8B', emoji: ':1234:'}
  hunt: {color: '#C0392B', emoji: ':crossed_swords:'}
  mine: {color: '#7F8C8D', emoji: ':pick:'}
  place: {color: '#A0522D', emoji: ':bricks:'}
  fish: {color: '#2980B9', emoji: ':fishing_pole_and_fish:'}
  eat: {color: '#D35400', emoji: ':poultry_leg:'}
  craft: {color: '#8D6E63', emoji: ':hammer_and_pick:'}
  furnace: {color: '#E25822', emoji: ':fire:'}
  tame: {color: '#C69C6D', emoji: ':bone:'}
  shear: {color: '#ECF0F1', emoji: ':scissors:'}

#Hogyan íródnak a listák: győztesek, hozzájárulók, állások és ranglisták.
#%medal% az 1-3. hely érme, az other-places a többieké.
lists:
  medals: [':first_place:', ':second_place:', ':third_place:']
  other-places: '`%place%.`'
  winner: '%medal% **%player%** `%time%s`'
  contributor: '%medal% **%player%** `%amount%`'
  standing: '%medal% **%player%** `%points% p`'
  leaderboard: '%medal% **%player%** `%value%`'
  #Üres lista helyett jelenik meg
  empty: '-# Még senki'

#__ÜZENETEK__
#Minden üzenetnek van 'content'-je (sima szöveg a beágyazás fölött) és/vagy 'embed'-je:
#  color, author (name, icon, url), title, url, description, thumbnail, image,
#  fields (name, value, inline), footer (text, icon), timestamp (a true a küldés idejét mutatja).
#Egy szöveg lehet egy sor vagy sorok listája. Az a sor, amelyben csak üres helyőrzők voltak,
#kimarad, és az üres mező is. A játékost nem igénylő PlaceholderAPI helyőrzők is működnek.
#A Discord-formázás működik a leírásokban és mezőértékekben: '### ' címsort kezd, '-# ' kis szürke
#szöveget, '> ' idézetet, **félkövér**, `kód`.
#A <t:%ends_unix%:R> „20 másodperc múlva” formában mutatja minden olvasó saját idejében, visszaszámlálva.
#Minden üzenetben: %server%, játékoknál pedig %game% %game_key% %game_emoji% %game_color%.

#Csetjátékok. %question% %time_limit% %ends_unix% %winners_needed% %points%
games:
  enabled: true
  channels: [main]
  #true: bejegyzés a játék indulásakor, majd annak átszerkesztése az eredményre. false: csak az eredmény.
  live: true
  #A Jegyezd meg soha nem mutatja itt a listáját: a játékosok elolvashatnák a Discordon.
  hidden-question: 'Nézd a játék csetjét!'
  start:
    embed:
      color: '%game_color%'
      author: '%game_emoji%  %game%'
      title: 'Új forduló'
      description:
        - '### %question%'
        - '-# Válaszolj a játék csetjében a győzelemért.'
      fields:
        - name: ':stopwatch: Vége'
          value: '<t:%ends_unix%:R>'
          inline: true
        - name: ':sparkles: Jutalom'
          value: '`%points% p`'
          inline: true
        - name: ':busts_in_silhouette: Győztesek'
          value: '`%winners_needed%`'
          inline: true
      footer: '%server%'
  #%winner% %winner_head% %winner_mention% %time% %answer% %points% %winner_count%
  #%winners% (minden győztes, soronként egy) %other_winners% (mind, kivéve az elsőt)
  win:
    embed:
      color: '%game_color%'
      author: '%game_emoji%  %game%'
      title: ':trophy:  %winner% eltalálta!'
      thumbnail: '%winner_head%'
      description:
        - '-# A válasz ez volt:'
        - '### %answer%'
      fields:
        - name: ':stopwatch: Idő'
          value: '`%time%s`'
          inline: true
        - name: ':sparkles: Pontok'
          value: '`+%points%`'
          inline: true
        - name: ':medal: Szintén válaszolt'
          value: '%other_winners%'
          inline: false
      footer: '%server%'
      timestamp: true
  #%answer% %question% %time_limit%
  expired:
    enabled: true
    embed:
      color: '#4E5058'
      author: '%game_emoji%  %game%'
      title: ':hourglass:  Lejárt az idő'
      description:
        - '-# Senki sem találta el. A válasz ez volt:'
        - '### %answer%'
      footer: '%server%'
      timestamp: true
  #Amikor egy stábtag leállítja a játékot (csak élő bejegyzést szerkeszt)
  stopped:
    embed:
      color: '#4E5058'
      author: '%game_emoji%  %game%'
      title: ':no_entry:  Forduló leállítva'
      description:
        - '-# Egy stábtag idő előtt befejezte ezt a fordulót.'
      footer: '%server%'
      timestamp: true

#Versenyek. %target% %amount% %time_limit% %ends_unix% %points%
races:
  enabled: true
  channels: [main]
  live: true
  start:
    embed:
      color: '%game_color%'
      author: '%game_emoji%  %game% verseny'
      title: 'A verseny elindult'
      description:
        - '### %amount%x %target%'
        - '-# Az nyer, aki elsőként végez.'
      fields:
        - name: ':stopwatch: Vége'
          value: '<t:%ends_unix%:R>'
          inline: true
        - name: ':sparkles: Jutalom'
          value: '`%points% p`'
          inline: true
      footer: '%server%'
  #%winner% %winner_head% %winner_mention% %time% %points%
  win:
    embed:
      color: '%game_color%'
      author: '%game_emoji%  %game% verseny'
      title: ':checkered_flag:  %winner% megnyerte a versenyt!'
      thumbnail: '%winner_head%'
      description:
        - '### %amount%x %target%'
      fields:
        - name: ':stopwatch: Idő'
          value: '`%time%s`'
          inline: true
        - name: ':sparkles: Pontok'
          value: '`+%points%`'
          inline: true
      footer: '%server%'
      timestamp: true
  expired:
    enabled: true
    embed:
      color: '#4E5058'
      author: '%game_emoji%  %game% verseny'
      title: ':hourglass:  Lejárt az idő'
      description:
        - '### %amount%x %target%'
        - '-# Senki sem végzett időben.'
      footer: '%server%'
      timestamp: true
  stopped:
    embed:
      color: '#4E5058'
      author: '%game_emoji%  %game% verseny'
      title: ':no_entry:  Verseny leállítva'
      description:
        - '-# Egy stábtag idő előtt befejezte ezt a versenyt.'
      footer: '%server%'
      timestamp: true

#Globális játékok, ahol az egész szerver egy célért dolgozik.
#%goal% (pl. "500 Stone") %progress% %goal_amount% %percent% %bar% %contributors% %time_limit% %ends_unix%
global:
  enabled: true
  channels: [main]
  #true: a bejegyzés mutatja a folyamatjelzőt, és frissül, amíg a játék fut
  live: true
  #Legfeljebb milyen gyakran frissül az élő bejegyzés (csak ha a haladás változott)
  update-seconds: 15
  bar: {length: 16, full: '█', empty: '░'}
  progress:
    embed:
      color: '%game_color%'
      author: ':globe_with_meridians:  Globális %game%'
      title: 'Az egész szerver együtt játszik'
      description:
        - '### %goal%'
        - '`%bar%` **%percent%%**'
        - '-# %progress% / %goal_amount%'
      fields:
        - name: ':busts_in_silhouette: Segítők'
          value: '`%contributors%`'
          inline: true
        - name: ':stopwatch: Vége'
          value: '<t:%ends_unix%:R>'
          inline: true
      footer: '%server%'
  #%top_contributors% (a legnagyobb hozzájárulók, soronként egy)
  completed:
    embed:
      color: '#57F287'
      author: ':globe_with_meridians:  Globális %game%'
      title: ':tada:  Cél elérve!'
      description:
        - '### %goal%'
        - '`%bar%` **%percent%%**'
      fields:
        - name: ':medal: Legjobb segítők'
          value: '%top_contributors%'
          inline: true
        - name: ':busts_in_silhouette: Segítettek'
          value: '`%contributors%`'
          inline: true
      footer: '%server%'
      timestamp: true
  failed:
    embed:
      color: '#ED4245'
      author: ':globe_with_meridians:  Globális %game%'
      title: ':x:  A cél nem teljesült'
      description:
        - '### %goal%'
        - '`%bar%` **%percent%%**'
        - '-# %progress% / %goal_amount%'
      fields:
        - name: ':medal: Legjobb segítők'
          value: '%top_contributors%'
          inline: true
      footer: '%server%'
      timestamp: true
  #Hány hozzájárulót sorol fel a %top_contributors%
  top-size: 5

#Játékesemények (events.yml). %event%
events:
  enabled: true
  channels: [main]
  #%games% (hány játéka van)
  start:
    embed:
      color: '#FEE75C'
      author: ':calendar:  Játékesemény'
      title: '%event% elindult!'
      description:
        - '-# Nyerd meg sorban a játékokat, hogy eseménypontokat szerezz.'
      fields:
        - name: ':video_game: Játékok'
          value: '`%games%`'
          inline: true
      footer: '%server%'
      timestamp: true
  #%standings% %players% (hányan szereztek pontot) %winner% %winner_head% %winner_mention%
  end:
    embed:
      color: '#FEE75C'
      author: ':calendar:  Játékesemény'
      title: ':trophy:  %event% eredményei'
      thumbnail: '%winner_head%'
      description:
        - '%standings%'
      fields:
        - name: ':crown: Győztes'
          value: '%winner_mention%'
          inline: true
        - name: ':busts_in_silhouette: Játékosok'
          value: '`%players%`'
          inline: true
      footer: '%server%'
      timestamp: true
  #Hány helyet sorol fel a %standings%
  standings-size: 10

#Egy játékos sorozata elér egy adott számú egymást követő napot (streaks.yml). %player% %player_head% %player_mention% %streak% %days%
streaks:
  enabled: false
  channels: [main]
  #Csak ezek a napszámok kerülnek ki
  days: [7, 14, 30, 60, 100, 365]
  message:
    embed:
      color: '#E67E22'
      author: {name: '%player%', icon: '%player_head%'}
      title: ':fire:  %days% nap egymás után!'
      description:
        - '-# %streak%'
      footer: '%server%'
      timestamp: true

#Egy játékos teljesít egy napi vagy heti kihívást. %player% %player_head% %player_mention% %challenge% %period%
challenges:
  enabled: false
  channels: [main]
  #Mit mutat a %period%
  periods:
    daily: 'Napi'
    weekly: 'Heti'
  message:
    embed:
      color: '#57F287'
      author: {name: '%player%', icon: '%player_head%'}
      title: ':white_check_mark:  Kihívás teljesítve'
      description:
        - '### %challenge%'
        - '-# %period% kihívás'
      footer: '%server%'
      timestamp: true

#Egy ranglista, beállított időpontokban és a /chatgames discord leaderboard paranccsal küldve.
#%leaderboard% %total_points% (az összes játékos együtt)
leaderboard:
  enabled: false
  channels: [main]
  #Szerveridő, 24 órás, pl. ['12:00', '20:00']
  times: ['20:00']
  #points, vagy fastest (az összes játék leggyorsabb válaszai)
  type: points
  size: 10
  message:
    embed:
      color: '#5865F2'
      author: ':bar_chart:  Ranglista'
      title: 'Legjobb játékosok'
      description:
        - '%leaderboard%'
        - ''
        - '-# Összesen %total_points% pontot nyertek'
      footer: '%server%'
      timestamp: true

